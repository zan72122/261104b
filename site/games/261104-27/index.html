<script>
(()=>{
'use strict';
/* =====================================================================
   するる、ふわぁ！ひかりのむすびめと夜の大きな木   (game 261104-27)
   fr-261029-3 / particles / no_animal_princess
   画風: 単色の藍(背景) + 発光2色(金・水色)。すべての形は粒の集合。
   核: 結び目を引く(向き・長さ) → 芽が並ぶ → 長押しで育つ
       近い芽 = 光のアーチ / 遠い芽 = 独立したランプと小さな庭
       ランプ→アーチ→橋 がつながると光が渡り、対岸の街灯が灯る
       灯った街灯の根元を長押し → 押した場所に次の結び目
       すべて灯ると庭が大きな光の木へ → 枝先の家・風車・風車まつり → 次の結び目で新しい庭
   文字・数字のUIなし。
   ===================================================================== */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, PI=Math.PI;
const BG='#0a0f3a';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const R=Math.random, rnd=(a,b)=>a+R()*(b-a);
const hyp=Math.hypot;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PENT=[0,2,4,7,9];
const pent=(b,i)=>b+12*Math.floor(i/5)+PENT[((i%5)+5)%5];
const qv=(a,c,b,t)=>{const u=1-t;return u*u*a+2*u*t*c+t*t*b;};
const angLerp=(a,b,t)=>{let d=b-a;while(d>PI)d-=TAU;while(d<-PI)d+=TAU;return a+d*t;};

/* ============================ AUDIO ============================ */
const AU={c:null,m:null,wet:null,nb:null,shG:null,ok:false,bedT:0};
function audioInit(){
  try{
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      const c=new AC(); AU.c=c;
      const comp=c.createDynamicsCompressor();
      comp.threshold.value=-16; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.25;
      comp.connect(c.destination);
      const m=c.createGain(); m.gain.value=0.6; m.connect(comp); AU.m=m;
      const dl=c.createDelay(1.0); dl.delayTime.value=0.27;
      const fb=c.createGain(); fb.gain.value=0.36;
      const lp=c.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
      dl.connect(lp); lp.connect(fb); fb.connect(dl);
      const wo=c.createGain(); wo.gain.value=0.5; lp.connect(wo); wo.connect(m);
      const wet=c.createGain(); wet.gain.value=1; wet.connect(dl); AU.wet=wet;
      const len=(c.sampleRate*1.5)|0, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      AU.nb=b;
      const ns=c.createBufferSource(); ns.buffer=b; ns.loop=true;
      const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=6800; bp.Q.value=0.9;
      const g=c.createGain(); g.gain.value=0.0001;
      ns.connect(bp); bp.connect(g); g.connect(m); ns.start();
      AU.shG=g;
      try{ const ub=c.createBuffer(1,1,c.sampleRate), us=c.createBufferSource(); us.buffer=ub; us.connect(c.destination); us.start(0); }catch(e){}
    }
    if(AU.c.state!=='running'){ const p=AU.c.resume(); if(p&&p.catch) p.catch(()=>{}); }
    AU.ok=true;
  }catch(err){ AU.ok=false; }
}
const BELL_STD=[1,1, 2.0,0.26, 3.01,0.09];
const BELL_LOW=[1,1, 2.76,0.22, 5.4,0.07, 0.5,0.3];
const BELL_GLASS=[1,1, 4.07,0.14];
function bell(f,vol,dur,when,kind){
  if(!AU.ok||!AU.c||AU.c.state==='closed') return;
  try{
    const c=AU.c, t=c.currentTime+(when||0);
    const P=kind===1?BELL_LOW:kind===2?BELL_GLASS:BELL_STD;
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    g.connect(AU.m);
    const ws=c.createGain(); ws.gain.value=0.32; g.connect(ws); ws.connect(AU.wet);
    for(let i=0;i<P.length;i+=2){
      const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(f*P[i],t);
      const og=c.createGain(); og.gain.value=P[i+1];
      o.connect(og); og.connect(g); o.start(t); o.stop(t+dur+0.05);
    }
  }catch(e){}
}
function glide(f0,f1,vol,dur,when,type){
  if(!AU.ok||!AU.c||AU.c.state==='closed') return;
  try{
    const c=AU.c, t=c.currentTime+(when||0);
    const o=c.createOscillator(); o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(AU.m); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function noise(vol,dur,f0,f1,q,when){
  if(!AU.ok||!AU.c||!AU.nb||AU.c.state==='closed') return;
  try{
    const c=AU.c, t=c.currentTime+(when||0);
    const s=c.createBufferSource(); s.buffer=AU.nb;
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q||1;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+Math.min(0.05,dur*0.3)); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bp); bp.connect(g); g.connect(AU.m); s.start(t,R()*0.8); s.stop(t+dur+0.05);
  }catch(e){}
}
const TONE={N:69,T:62,F:76,S:66};
const S={
  knot(){ bell(mtof(50),0.34,1.6,0,1); noise(0.07,0.12,900,300,0.8); },
  stretch(i){ bell(mtof(pent(62,i)),0.1,0.45,0,2); },
  unravel(n){ glide(220,880,0.12,0.32,0,'triangle'); for(let i=0;i<n;i++) bell(mtof(pent(67,i*2)),0.12,0.9,0.12+i*0.09); noise(0.05,0.3,2000,6000,1.2); },
  back(){ glide(480,300,0.08,0.18,0,'sine'); },
  grow(i){ bell(mtof(pent(64,i)),0.07,0.35,0,2); },
  lamp(type){ const b=TONE[type]||62; bell(mtof(b),0.15,1.4); bell(mtof(b+7),0.09,1.2,0.07); bell(mtof(b+12),0.07,1.2,0.14,2); },
  flower(){ bell(mtof(81),0.12,0.5,0,2); bell(mtof(86),0.08,0.5,0.06,2); },
  tickle(){ for(let i=0;i<4;i++) bell(mtof(pent(79,i%2?3:1)),0.05,0.18,i*0.045,2); },
  arch(){ bell(mtof(69),0.12,1.0); bell(mtof(73),0.12,1.0,0.12); bell(mtof(76),0.1,1.4,0.24); },
  step(i){ bell(mtof(pent(69,i)),0.09,0.6,0,2); },
  success(){ [0,2,4,5,7].forEach((k,i)=>bell(mtof(pent(62,k)),0.13,1.6,i*0.07)); bell(mtof(50),0.17,2.2,0,1); noise(0.06,0.8,5000,9000,0.7); },
  bridge(){ noise(0.09,0.5,400,3000,0.9); glide(300,700,0.09,0.4,0,'sine'); },
  wob(){ bell(mtof(45),0.035,0.25,0,2); },
  sleepy(){ glide(200,170,0.05,0.4,0,'sine'); },
  appear(){ bell(mtof(55),0.2,1.4,0,1); glide(330,660,0.06,0.3,0.05,'sine'); },
  transform(){ for(let i=0;i<12;i++) bell(mtof(pent(50,i)),0.09,2.0,i*0.22,i%3?0:1); noise(0.08,3,300,8000,0.6); },
  house(){ bell(mtof(64),0.12,1.6); bell(mtof(68),0.1,1.6,0.05); bell(mtof(71),0.1,1.6,0.1); bell(mtof(76),0.08,2,0.18,2); },
  road(){ bell(mtof(72),0.1,1.0); bell(mtof(79),0.1,1.2,0.1); bell(mtof(84),0.08,1.4,0.2,2); },
  wind(type,i,v){ const m=TONE[type]||69; bell(mtof(m+(i===2?12:i===1?7:0)),0.12*(v||1),0.9,0,type==='T'?1:0); },
  pick(){ bell(mtof(74),0.08,0.3,0,2); },
  drop(){ bell(mtof(67),0.1,0.5); },
  fountain(){ for(let i=0;i<8;i++) bell(mtof(pent(74,i)),0.08,1.2,i*0.08,2); noise(0.06,1.5,3000,9000,0.8); }
};
function grain(lvl){ if(R()<lvl*0.45) bell(mtof(pent(86,(R()*7)|0)),0.012+0.02*R(),0.22,0,2); }

/* ============================ SCREEN ============================ */
let W=1,H=1,DPR=1,CX=0,CY=0,VW=1,VH=1;
const SAFE={t:0,r:0,b:0,l:0};
const safeEl=document.getElementById('safe');
function readSafe(){
  try{ const cs=getComputedStyle(safeEl);
    SAFE.t=parseFloat(cs.paddingTop)||0; SAFE.r=parseFloat(cs.paddingRight)||0;
    SAFE.b=parseFloat(cs.paddingBottom)||0; SAFE.l=parseFloat(cs.paddingLeft)||0;
  }catch(e){}
}
let camSnap=true;
function resize(){
  W=Math.max(1,window.innerWidth|0); H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  readSafe();
  VW=Math.max(1,W-SAFE.l-SAFE.r); VH=Math.max(1,H-SAFE.t-SAFE.b);
  CX=SAFE.l+VW/2; CY=SAFE.t+VH/2;
  camSnap=true;
}

/* ============================ SPRITES ============================ */
const COL=['255,206,112','128,228,255'];
const SPR=COL.map(c=>{
  const s=document.createElement('canvas'); s.width=s.height=48;
  const g=s.getContext('2d'); const gr=g.createRadialGradient(24,24,0,24,24,24);
  gr.addColorStop(0,'rgba('+c+',1)'); gr.addColorStop(0.2,'rgba('+c+',0.95)');
  gr.addColorStop(0.42,'rgba('+c+',0.3)'); gr.addColorStop(1,'rgba('+c+',0)');
  g.fillStyle=gr; g.fillRect(0,0,48,48); return s;
});

/* ============================ PARTICLES ============================ */
const PMAX=3000, FXMAX=520;
let PN=0;
function mkP(x,y,c,r,a){ PN++; return {x,y,vx:0,vy:0,tx:x,ty:y,c,r,a,ph:R()*TAU,u:R(),v:R(),w:R(),gx:x,gy:y,dl:0}; }
function fitPs(ps,n,c,r,a,x,y,sp){
  while(ps.length>n){ ps.pop(); PN--; }
  const s=sp||2;
  while(ps.length<n && PN<PMAX){ ps.push(mkP(x+rnd(-s,s),y+rnd(-s,s),c,r*rnd(0.75,1.25),a)); }
}
function dropPs(ps,up){
  for(let i=0;i<ps.length;i++){ const p=ps[i]; PN--;
    fx(p.x,p.y,p.vx*0.3+rnd(-25,25),(up?-rnd(20,80):rnd(-30,10))+p.vy*0.3,rnd(0.4,0.9),p.c,p.r,p.a*0.8,up?-10:40); }
  ps.length=0;
}
function freePs(ps){ PN-=ps.length; ps.length=0; }
function stepPs(ps,dt,K,D){
  for(let i=0;i<ps.length;i++){ const p=ps[i];
    p.vx+=((p.tx-p.x)*K-p.vx*D)*dt; p.vy+=((p.ty-p.y)*K-p.vy*D)*dt;
    p.x+=p.vx*dt; p.y+=p.vy*dt; }
}
const FX=[];
function fx(x,y,vx,vy,life,c,r,a,g,drag){
  if(FX.length>=FXMAX||PN>=PMAX) return; PN++;
  FX.push({x,y,vx,vy,life,max:life,c,r,a,g:g||0,dr:drag==null?1.6:drag});
}
function updFX(dt){
  for(let i=FX.length-1;i>=0;i--){ const f=FX[i]; f.life-=dt;
    if(f.life<=0){ FX[i]=FX[FX.length-1]; FX.pop(); PN--; continue; }
    f.vy+=f.g*dt; const k=Math.exp(-f.dr*dt); f.vx*=k; f.vy*=k; f.x+=f.vx*dt; f.y+=f.vy*dt; }
}
function burst(x,y,n,c,spd,life,r){
  for(let i=0;i<n;i++){ const a=R()*TAU, s=spd*rnd(0.3,1);
    fx(x,y,Math.cos(a)*s,Math.sin(a)*s,life*rnd(0.6,1.2),c==null?(R()<0.5?0:1):c,r||2.4,0.9,0,2.2); }
}
function ring(x,y,rad,n,c){
  for(let i=0;i<n;i++){ const a=i/n*TAU; fx(x+Math.cos(a)*rad*0.3,y+Math.sin(a)*rad*0.3,Math.cos(a)*rad*2.2,Math.sin(a)*rad*2.2,0.45,c,2.2,0.8,0,4); }
}

/* ============================ LIGHT PACKETS ============================ */
const PK=[];
function packet(pts,spd,marks,done){
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+hyp(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));
  const p={pts,cum,total:cum[cum.length-1],s:0,spd,marks:(marks||[]).sort((a,b)=>a.d-b.d),mi:0,done,hx:pts[0].x,hy:pts[0].y};
  PK.push(p); return p;
}
function updPackets(dt){
  for(let i=PK.length-1;i>=0;i--){ const p=PK[i];
    p.s+=p.spd*dt;
    while(p.mi<p.marks.length && p.marks[p.mi].d<=p.s){ try{p.marks[p.mi].fn();}catch(e){} p.mi++; }
    const s=Math.min(p.s,p.total); let k=1; while(k<p.cum.length-1 && p.cum[k]<s) k++;
    const a=p.pts[k-1], b=p.pts[k], seg=(p.cum[k]-p.cum[k-1])||1, t=clamp((s-p.cum[k-1])/seg,0,1);
    p.hx=lerp(a.x,b.x,t); p.hy=lerp(a.y,b.y,t);
    if(p.lite) fx(p.hx,p.hy,rnd(-6,6),rnd(-6,6),0.35,0,2.4,0.85,0,3);
    else { for(let j=0;j<3;j++) fx(p.hx+rnd(-3,3),p.hy+rnd(-3,3),rnd(-18,18),rnd(-18,18),rnd(0.35,0.7),j?0:1,rnd(2,3.4),0.95,0,3);
      fx(p.hx,p.hy,0,0,0.05,0,7,1,0,0); }
    if(p.s>=p.total){ PK.splice(i,1); try{ p.done&&p.done(); }catch(e){} }
  }
}

/* ============================ CAMERA & DRAW ============================ */
const cam={x:0,y:-120,z:1};
const ZMAX=1.5;
let lastBox={x0:-400,x1:350,y0:-300,y1:110};
function camTarget(b){
  const bw=Math.max(200,b.x1-b.x0), bh=Math.max(200,b.y1-b.y0);
  let z=Math.min(VW/bw,VH/bh,ZMAX);
  const sh=bh*z;
  const bottom=Math.min(VH-4,Math.max(sh+0.05*VH,Math.min(0.9*VH,0.5*VH+sh*0.5+0.3*(VH-sh))));
  return {x:(b.x0+b.x1)/2,y:b.y1-(bottom-VH/2)/z,z};
}
function updCam(dt,freeze){
  const b=focusBox(); lastBox=b;
  const t=camTarget(b);
  if(camSnap){ cam.x=t.x; cam.y=t.y; cam.z=t.z; camSnap=false; return; }
  if(freeze) return;
  const k=1-Math.exp(-dt*1.8);
  cam.x+=(t.x-cam.x)*k; cam.y+=(t.y-cam.y)*k; cam.z+=(t.z-cam.z)*k;
}
function s2w(x,y){ return {x:(x-CX)/cam.z+cam.x,y:(y-CY)/cam.z+cam.y}; }
function w2s(x,y){ return {x:(x-cam.x)*cam.z+CX,y:(y-cam.y)*cam.z+CY}; }
const DL=[];
function emit(ps,glow){ if(ps.length) DL.push(ps,glow); }
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  const z=cam.z, cx=cam.x, cy=cam.y, tt=G.t, zr=Math.max(z,0.92);
  for(let k=0;k<DL.length;k+=2){
    const ps=DL[k], gl=DL[k+1]; if(gl<=0.004) continue;
    for(let i=0;i<ps.length;i++){ const p=ps[i];
      const sx=(p.x-cx)*z+CX, sy=(p.y-cy)*z+CY;
      let rp=p.r*zr; if(rp<0.8) rp=0.8; else if(rp>8) rp=8;
      const s=rp*4; if(sx<-s||sy<-s||sx>W+s||sy>H+s) continue;
      let a=p.a*gl*(0.8+0.2*Math.sin(tt*2.6+p.ph)); if(a<0.012) continue; if(a>1) a=1;
      ctx.globalAlpha=a; ctx.drawImage(SPR[p.c],sx-s*0.5,sy-s*0.5,s,s);
    }
  }
  for(let i=0;i<FX.length;i++){ const f=FX[i];
    const sx=(f.x-cx)*z+CX, sy=(f.y-cy)*z+CY;
    let rp=f.r*zr; if(rp<0.8) rp=0.8; else if(rp>10) rp=10;
    const s=rp*4; if(sx<-s||sy<-s||sx>W+s||sy>H+s) continue;
    const a=f.a*Math.min(1,f.life/f.max*1.6); if(a<0.012) continue;
    ctx.globalAlpha=a>1?1:a; ctx.drawImage(SPR[f.c],sx-s*0.5,sy-s*0.5,s,s);
  }
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  DL.length=0;
}

/* ============================ GARDEN STATE ============================ */
const MERGE=120, LMAX=420, VMAX=330, GROW_T=0.95, HOLD_T=0.25;
let UID=1;
let ACT=null;
const G={phase:'garden',t:0,cycle:0,stage:0,banks:[],bridges:[],streets:[],knots:[],sprouts:[],lamps:[],arches:[],seeds:[],
  lastPull:[null,null,null],transformAt:-1,T:null,rt:0,fall:null,tt:0,
  mem:{firstVert:null,lampSpots:[],houses:[],pulls:0,cycles:0},
  stars:[],preview:[],log:[],perf:0,perfMax:0,pnMax:0};
function note(s){ G.log.push([Math.round(G.t*10)/10,s]); if(G.log.length>3000) G.log.shift(); }

function initStars(){
  for(let i=0;i<230;i++){ const p=mkP(rnd(-800,1600),rnd(-1150,-140),R()<0.35?0:1,rnd(1.2,2.3),rnd(0.12,0.38)); p.gx=p.x; p.gy=p.y; p.a0=p.a; p.r0=p.r; G.stars.push(p); }
}
function updStars(dt){
  const T=G.T, fw=(T&&(G.phase==='tree'||G.phase==='transform'))?T.fw:null, t=G.t, fest=T&&T.fest;
  for(let i=0;i<G.stars.length;i++){ const p=G.stars[i]; const wi=(i/18)|0;
    if(fw&&wi<fw.length){ const w=fw[wi], j=i%18;

/* ============================ KNOT ============================ */

      if(k.drag){ const d=s*bl, wav=Math.sin(s*12-t*9+p.ph*0.3)*3.5*(0.3+s); p.tx=cx+bx*d-by*wav; p.ty=cy+by*d+bx*wav; p.c=s>0.9?0:(p.u<0.3?1:0); }
      else { const el=R0*0.75+s*(k.R*1.15+k.ex*16+sqm*12+inv*6), wg=Math.sin(t*5+s*6+k.id)*4*s; p.tx=cx+cs*el-sn*wg; p.ty=cy+sn*el+cs*wg; p.c=0; }

function archPreview(pts,x0,x1){ const sp=Math.abs(x1-x0); for(let j=1;j<6;j++){ const t=j/6; pts.push(lerp(x0,x1,t),-40-Math.sin(t*PI)*(sp*0.2+10)); } }
function updPreview(dt){

function sproutHead(s){ if(s.y<0) return {x:s.x,y:s.y+Math.sin(G.t*1.6+s.bob)*3}; return {x:s.x,y:-(8+s.g*48)}; }

    if(i<7){ const k=i%5, a=k*TAU/5-PI/2+Math.sin(t*1.5+k)*0.08+(i>=5?0.6:0), rr=r*(i>=5?0.55:1); p.tx=x+Math.cos(a)*rr; p.ty=y+Math.sin(a)*rr; p.c=1; p.a=0.9; }

    } else if(p.w<0.85){ const a=p.u*TAU+t*0.6, rr=rb*Math.sqrt(p.v)*(1+0.18*s.pulse*Math.sin(t*20+p.ph));

function archPt(n){ if(n.kind==='lamp') return {x:n.x,y:-Math.max(14,n.hd)*0.62}; if(n.kind==='street') return {x:n.x,y:-n.h*0.3}; return {x:n.x,y:-3}; }

function recomputeLight(){

function updTree(dt){
  const T=G.T; if(!T) return;
  G.tt+=dt; const tt=G.tt, tr=G.phase==='transform', t=G.t, J=T.J;
  if(tr&&tt>2.0) for(const b of T.branches) if(b.lenT===0) b.lenT=b.len0;
  if(tr&&tt>5.2){ G.phase='tree'; note('tree ready'); }
  for(const p of T.trunk){ let x,y;
    if(p.w<0.18){ x=T.Xc+(p.u-0.5)*720; y=Math.pow(p.v,2)*34; }
    else { const u=p.u, hw=lerp(62,20,Math.pow(u,0.7))+(u<0.08?(0.08-u)*520:0); y=lerp(0,J.y,u); x=T.Xc+(p.v-0.5)*2*hw+Math.sin(u*7+t*0.4)*4; }

function updBranch(b,dt,tr,tt){

    const dx=2*(1-u)*(c.x-J.x)+2*u*(e.x-c.x), dy=2*(1-u)*(c.y-J.y)+2*u*(e.y-c.y), dl=hyp(dx,dy)||1;
    const th=16*(1-0.65*u)*(p.v-0.5);
    p.tx=x-dy/dl*th; p.ty=y+dx/dl*th+Math.sin(t*1.2+u*5+b.i)*1.5*u; p.c=p.w<0.25?0:1; p.a=0.6+0.3*b.hl+0.3*b.flash; }

    const u=p.u, x=qv(J.x,c.x,e.x,u), y=qv(J.y,c.y,e.y,u), off=Math.sin(u*22+t*0.8+p.ph)*16*(1-0.65*u)*0.6;
    p.tx=x+off*0.5; p.ty=y+off; p.a=0.7; }

  const h=b.house; h.ap+=(((b.len>90)?1:0)-h.ap)*(1-Math.exp(-dt*3)); h.tk=Math.max(0,h.tk-dt*1.6);

    p.tx=hx+(sd*11+((j%3)-1)*3)*sc+Math.sin(t*20+i)*h.tk*2; p.ty=hy+(-19+(((j/3)|0)-1)*3)*sc; p.a=0.95; p.c=0; }

function updWm(b,dt){
  const w=b.wm, t=G.t;

function queuePattern(w,t0,v){ let t=t0; w.pattern.forEach((ty,i)=>{ w.q.push({t,ty,i,v}); t+=GAP[ty]; }); w.cyc=t+0.7; }

function runBranch(b){

function tapHouse(b){ const h=b.house; h.tk=1; if(h.lit){ S.tickle(); if(b.wm.spinning){ b.wm.spd+=2; b.wm.flash=1; } } else S.sleepy(); }

/* ---------- lanterns ---------- */
function updLantern(ln,dt,tr,tt){
  const T=G.T, t=G.t; ln.flash=Math.max(0,ln.flash-dt*1.5);
  let tx,ty;
  if(ln.drag){ tx=ln.drag.x; ty=ln.drag.y; }
  else if(ln.holder){ const b=ln.holder, k=b.lanterns.indexOf(ln), p=brPt(b,SLOT_T[k]||0.5); tx=p.x; ty=p.y+18; }
  else { const p=rootPos(T,Math.max(0,ln.root)); tx=p.x; ty=p.y; }
  if(tr&&tt<ln.dl){ tx=ln.x; ty=ln.y-5; }
  const K=ln.drag?260:42, D=ln.drag?22:8.5;
  ln.vx+=((tx-ln.x)*K-ln.vx*D)*dt; ln.vy+=((ty-ln.y)*K-ln.vy*D)*dt; ln.x+=ln.vx*dt; ln.y+=ln.vy*dt;
  const sw=ln.holder&&!ln.drag?Math.sin(t*1.8+ln.id)*0.12-ln.vx*0.002:0, cs=Math.cos(sw), sn=Math.sin(sw);
  fitPs(ln.ps,42,0,2.3,0.85,ln.x,ln.y,4);

  for(const p of ln.ps){ let ox,oy;
    if(p.w<0.14){ ox=0; oy=-r-2-p.u*10; p.c=1; p.a=ln.holder?0.55:0.0; }
    else {
      if(ty_==='F'){ if(p.v<0.65){ const k=(p.u*5)|0, a=k*TAU/5-PI/2, pa=(p.u*5%1)*TAU, pr=r*0.55*Math.sqrt(p.v/0.65); ox=Math.cos(a)*r*0.95+Math.cos(pa)*pr; oy=Math.sin(a)*r*0.95+Math.sin(pa)*pr; p.c=1; }
        else { const a=p.u*TAU, rr=r*0.5*Math.sqrt((p.v-0.65)/0.35); ox=Math.cos(a)*rr; oy=Math.sin(a)*rr; p.c=0; } }
      else if(ty_==='T'){ const a=p.u*TAU, rr=Math.sqrt(p.v); ox=Math.cos(a)*rr*r*0.65; oy=Math.sin(a)*rr*r*1.45; p.c=p.v>0.85?1:0; }
      else if(ty_==='S'){ if(p.v<0.4){ const s=p.u*4, sd=s|0, f=s-sd, hw=r*0.9, A=SQ[sd], B=SQ[(sd+1)%4];
          ox=lerp(A[0],B[0],f)*hw; oy=lerp(A[1],B[1],f)*hw; p.c=1; }
        else { const a=p.u*TAU, rr=r*0.6*Math.sqrt((p.v-0.4)/0.6); ox=Math.cos(a)*rr; oy=Math.sin(a)*rr; p.c=0; } }
      else { const a=p.u*TAU+t*0.3, rr=r*Math.sqrt(p.v); ox=Math.cos(a)*rr; oy=Math.sin(a)*rr; p.c=0; }
      p.a=0.85; }
    p.tx=cx+ox*cs-oy*sn; p.ty=cy+ox*sn+oy*cs; }
  stepPs(ln.ps,dt,ln.drag?200:(tr?30:100),ln.drag?18:10);
  emit(ln.ps,0.9+0.6*ln.flash+0.4*ln.inv);
}
function pickLantern(ln,w){
  ln.prev=ln.holder; ln.prevI=0;
  if(ln.holder){ const b=ln.holder; ln.prevI=b.lanterns.indexOf(ln); b.lanterns.splice(ln.prevI,1);
    if(b.lanterns.length<3&&b.wm.spinning){ b.wm.spinning=false; b.wm.q=[]; note('windmill '+b.i+' slows'); } }
  ln.holder=null; ln.drag={x:w.x,y:w.y}; ln.flash=1; assignRoots(); S.pick();
}
function dropLantern(ln,cancel){
  const T=G.T, d=ln.drag; ln.drag=null; T.hl=null;
  const tb=(!cancel&&d)?nearBranch(d.x,d.y):null;
  if(tb){
    if(tb.lanterns.length>=3){ const old=tb.lanterns.shift(); old.holder=null; old.flash=1; }
    tb.lanterns.push(ln); ln.holder=tb; S.drop(); burst(ln.x,ln.y,8,0,60,0.4);
    note('attach '+ln.type+' -> br'+tb.i+' ['+tb.lanterns.map(l=>l.type).join('')+']');
    if(tb.lanterns.length===3) runBranch(tb);
  } else if(ln.prev&&ln.prev.lanterns.length<3){ const b=ln.prev; b.lanterns.splice(Math.min(ln.prevI,b.lanterns.length),0,ln); ln.holder=b; if(b.lanterns.length===3) runBranch(b); }
  else ln.holder=null;

/* ---------- roads, festival, fountain ---------- */
function updRoads(dt){
  const T=G.T, br=T.branches;
  for(let i=0;i<3;i++) for(let j=i+1;j<3;j++){ const a=br[i], b=br[j], ea=brTip(a), eb=brTip(b), d=hyp(ea.x-eb.x,ea.y-eb.y);
    const r=T.roads.find(r=>r.a===a&&r.b===b);
    if(!r&&a.house.lit&&b.house.lit&&d<210){ const nr={a,b,f:0,ps:[],walk:0}; T.roads.push(nr); onRoad(nr); }
    else if(r&&d>250){ dropPs(r.ps); T.roads.splice(T.roads.indexOf(r),1); note('road break'); } }
  for(const r of T.roads){ r.f=Math.min(1,r.f+dt*1.4);
    const ea=brTip(r.a), eb=brTip(r.b), pa={x:ea.x,y:ea.y-6}, pb={x:eb.x,y:eb.y-6}, c={x:(pa.x+pb.x)/2,y:Math.min(pa.y,pb.y)-40};
    fitPs(r.ps,28,0,2.1,0.75,pa.x,pa.y,3);
    for(const p of r.ps){ let tt=p.u; if(r.f<1) tt=p.u<0.5?Math.min(p.u,r.f*0.5):Math.max(p.u,1-r.f*0.5);
      p.tx=qv(pa.x,c.x,pb.x,tt); p.ty=qv(pa.y,c.y,pb.y,tt)+(p.v-0.5)*4; p.c=p.w<0.35?1:0; p.a=0.75; }
    r.walk-=dt;
    if(r.walk<=0&&r.f>=1){ r.walk=0.8; const pts=[]; for(let k=0;k<=10;k++){ const tt=k/10; pts.push({x:qv(pa.x,c.x,pb.x,tt),y:qv(pa.y,c.y,pb.y,tt)}); } if(R()<0.5) pts.reverse(); packet(pts,150,[],null).lite=true; }
    stepPs(r.ps,dt,70,9); emit(r.ps,1); }
}
function onRoad(r){
  const T=G.T; S.road(); const ea=brTip(r.a), eb=brTip(r.b); burst((ea.x+eb.x)/2,(ea.y+eb.y)/2-30,18,null,100,0.8);
  note('road br'+r.a.i+'-br'+r.b.i);
  if(r.a.wm.spinning&&!r.b.wm.spinning) wmStart(r.b,r.a.wm.pattern,0.7);
  else if(r.b.wm.spinning&&!r.a.wm.spinning) wmStart(r.a,r.b.wm.pattern,0.7);
  if(!T.fountain&&((T.roads.length===3&&R()<0.45)||R()<0.06)){
    let x=0,y=0; for(const b of T.branches){ const e=brTip(b); x+=e.x/3; y+=e.y/3; }
    T.fountain={x,y:y-20,t0:G.t}; S.fountain(); note('fountain'); }
}
function updFountain(dt){
  const T=G.T, f=T.fountain; if(!f) return; const age=G.t-f.t0;
  if(age>6){ T.fountain=null; return; }
  for(let i=0;i<4;i++) fx(f.x+rnd(-6,6),f.y,rnd(-55,55),rnd(-300,-200),rnd(1.1,1.6),R()<0.5?0:1,rnd(2,3),0.9,260,0.5);
}
function startFest(){ const T=G.T; T.fest=true; T.festT=G.t; S.success(); layoutFest(T); note('festival '+T.fw.length); }
function layoutFest(T){
  const pos=[];

      pos.push({x:e.x+fxv*d-fyv*sd,y:Math.min(-150,e.y+fyv*d+fxv*sd),r:40-k*4,b:b.i}); } }

  for(let i=0;i<pos.length;i++){ let w=T.fw[i]; if(!w){ w={x:pos[i].x,y:pos[i].y,ang:R()*TAU,spd:0,ap:0}; T.fw.push(w); }
    w.tx=pos[i].x; w.ty=pos[i].y; w.r=pos[i].r; w.b=pos[i].b; }
}
function updFest(dt){
  const T=G.T, t=G.t;
  T.sigT-=dt;
  if(T.sigT<=0){ T.sigT=0.25; const sig=T.branches.map(b=>Math.round(b.lenT/30)+':'+Math.round(b.angT*5)).join('|');
    if(sig!==T.sig){ T.sig=sig; layoutFest(T); if(T.fest) note('fest layout n='+T.fw.length+' L='+Math.round(T.branches[0].lenT)+' U='+Math.round(T.branches[1].lenT)+' R='+Math.round(T.branches[2].lenT)); } }
  for(const w of T.fw){ const k=1-Math.exp(-dt*2); w.x+=(w.tx-w.x)*k; w.y+=(w.ty-w.y)*k;
