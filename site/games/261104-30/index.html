<script>
(()=>{
'use strict';
/* ===================================================================
   こつん、ころりん！素材を着ちゃう写真汽車  (game 261104-30)
   ride_rail / photo_collage / no_animal_princess
   車体タップ → 跳んで線路上の素材写真に「こつん」→ 玉車輪が素材を着る
   素材: ゴム(弾む) フェルト(受け止める) 鉄(鈴を引く) ガラス(透かす) 木(拍子) 氷(滑る)
   文字UIなし。画像・音はすべて手続き生成。
   =================================================================== */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const easeBack=t=>{t=clamp(t,0,1);const s=1.7,u=t-1;return 1+(s+1)*u*u*u+s*u*u;};
const QS=new URLSearchParams(location.search);
let SEED=(parseInt(QS.get('seed'),10)||((Date.now()%100000)+7))>>>0;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry(SEED);
const rnd=(a,b)=>a+R()*(b-a);
const TR_R=mulberry(12345); // texture rng (fixed look)
const trnd=(a,b)=>a+TR_R()*(b-a);
const GOLD_P=QS.has('gold')?clamp(parseFloat(QS.get('gold'))||0,0,1):0.08;
const TSCALE=clamp(parseFloat(QS.get('ts'))||1,0.25,8);

const MATS=['rubber','felt','iron','glass','wood','ice'];
/* tap: tap-jump apex, bump: spring-pad apex, e: restitution */
const MP={
  plain :{tap:150,bump:110,e:0.30,col:'#c9a45a'},
  rubber:{tap:270,bump:330,e:0.86,col:'#2c2c30'},
  felt  :{tap:150,bump:0,  e:0.00,col:'#c65d74'},
  iron  :{tap:115,bump:40, e:0.22,col:'#8a949e'},
  glass :{tap:165,bump:150,e:0.42,col:'#bfe6ee'},
  wood  :{tap:150,bump:180,e:0.38,col:'#b07a3e'},
  ice   :{tap:135,bump:60, e:0.25,col:'#d8f1fb'}
};
const GRAV=2000;

/* ---------------- canvas / view ---------------- */
let W=1,H=1,DPR=1,S=1,VW=560,VH=760,GY=430;
const SAFE={l:0,r:0,t:0,b:0};
function readSafe(){
  try{const cs=getComputedStyle(document.getElementById('safe'));
    SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;
    SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}
function resize(){
  const vv=window.visualViewport;
  W=Math.max(1,Math.round(vv?vv.width:innerWidth));H=Math.max(1,Math.round(vv?vv.height:innerHeight));
  W=Math.max(W,1);H=Math.max(H,1);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  S=Math.min(W/560,H/760);
  VW=W/S;VH=H/S;
  GY=Math.max(400,VH*(VW<VH?0.53:0.565));
  readSafe();
  if(typeof layoutCards==='function') layoutCards();
}

/* ---------------- audio (Web Audio synth) ---------------- */
const AU={c:null,m:null,send:null,nb:null};
function audioStart(){
  try{
    if(AU.c){if(AU.c.state!=='running'&&!document.hidden)AU.c.resume().catch(()=>{});return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=new AC();AU.c=c;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(c.destination);
    const m=c.createGain();m.gain.value=0.62;m.connect(comp);AU.m=m;
    // echo bus for 余韻 (iron, glass, bells)
    const dl=c.createDelay(1);dl.delayTime.value=0.19;const fb=c.createGain();fb.gain.value=0.34;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;
    const sg=c.createGain();sg.gain.value=0.5;
    sg.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(m);AU.send=sg;
    const len=Math.floor(c.sampleRate*1.0),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
    if(c.state!=='running')c.resume().catch(()=>{});
  }catch(e){AU.c=null;}
}
function aT(){return AU.c?AU.c.currentTime:0;}
function tone(f,dur,o){
  if(!AU.c)return;o=o||{};
  try{
    const c=AU.c,t=c.currentTime+(o.at||0);
    const os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(Math.max(20,f),t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.glide||dur));
    if(o.det)os.detune.value=o.det;
    const pk=(o.g==null?0.2:o.g),at=o.att||0.004;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk),t+at);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    os.connect(g);g.connect(AU.m);if(o.send)g.connect(AU.send);
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=f*0.06;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+0.05);}
    os.start(t);os.stop(t+dur+0.05);
  }catch(e){}
}
function noise(dur,o){
  if(!AU.c||!AU.nb)return;o=o||{};
  try{
    const c=AU.c,t=c.currentTime+(o.at||0);
    const s=c.createBufferSource();s.buffer=AU.nb;s.loop=true;
    const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);
    if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    f.Q.value=o.q||1;
    const g=c.createGain(),pk=(o.g==null?0.15:o.g),at=o.att||0.003;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk),t+at);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(AU.m);if(o.send)g.connect(AU.send);
    s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
  }catch(e){}
}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5];
const SFX={
  jump(m){tone(m==='rubber'?260:220,0.16,{to:m==='rubber'?520:380,g:0.13,type:'triangle'});noise(0.06,{f:1800,q:0.7,g:0.05});},
  land(m,p){p=clamp(p,0.15,1.3);
    if(m==='rubber'){tone(170+p*90,0.32,{to:85,g:0.24*p,vib:16});tone(340,0.12,{to:170,g:0.06*p,type:'triangle'});}
    else if(m==='felt'){noise(0.09,{type:'lowpass',f:380,g:0.11*p});}
    else if(m==='iron'){[1,2.41,3.93,5.6].forEach((k,i)=>tone(190*k,1.3-i*0.25,{g:0.07*p/(i+1),send:true}));}
    else if(m==='glass'){[1,2.72,5.2].forEach((k,i)=>tone(1250*k,0.9-i*0.2,{g:0.06*p/(i+1),send:true}));}
    else if(m==='wood'){noise(0.06,{f:1100,q:3,g:0.2*p});tone(480,0.09,{g:0.1*p,type:'triangle'});}
    else if(m==='ice'){noise(0.12,{type:'highpass',f:3200,g:0.09*p});tone(1900,0.25,{to:2500,g:0.05*p,send:true});}
    else{tone(300,0.1,{g:0.1*p,type:'triangle'});noise(0.05,{f:900,g:0.06*p});}
  },
  hit(m){SFX.land(m,1.1);noise(0.25,{f:2400,to:700,q:0.8,g:0.07});},
  wrap(m){noise(0.38,{f:600,to:3200,q:0.9,g:0.09});
    const base={rubber:330,felt:262,iron:392,glass:523,wood:294,ice:587}[m]||330;
    tone(base,0.35,{g:0.1,type:'triangle',at:0.12});tone(base*1.5,0.4,{g:0.08,type:'triangle',at:0.22});},
  bonk(){tone(210,0.18,{to:120,g:0.16,type:'triangle'});noise(0.05,{f:700,g:0.08});},
  clack(m,w){w=w||0;
    if(m==='wood'){noise(0.045,{f:1250,q:4,g:0.16});tone(560,0.06,{g:0.07,type:'triangle'});}
    else if(m==='iron'){tone(150-w*14,0.22,{g:0.09,type:'square',to:110-w*10});tone(620-w*40,0.5,{g:0.025,send:true});}
    else if(m==='rubber'){tone(150,0.06,{g:0.04});}
    else if(m==='felt'){noise(0.04,{type:'lowpass',f:250,g:0.012});}
    else if(m==='glass'){tone(2100,0.15,{g:0.018,send:true});}
    else if(m==='ice'){noise(0.12,{type:'highpass',f:4000,g:0.025});}
    else{noise(0.03,{f:900,q:2,g:0.05});}
  },
  bell(i,g,dl){const f=PENTA[((i%8)+8)%8];[1,2.76,5.4].forEach((k,j)=>tone(f*k,1.4-j*0.4,{g:(g==null?0.09:g)/(j+1.2),send:true,at:dl||0}));},
  magnet(){tone(300,0.5,{to:900,g:0.06,type:'sawtooth',vib:9});},
  couple(){noise(0.05,{f:1500,q:3,g:0.12});tone(700,0.08,{g:0.06,type:'square',at:0.04});},
  reveal(){[0,2,4,5,7].forEach((n,i)=>tone(PENTA[n]*1.5,0.6,{g:0.05,at:i*0.07,send:true}));},
  slide(){noise(0.9,{type:'highpass',f:2500,to:6000,g:0.07,att:0.05});tone(1500,0.8,{to:2400,g:0.03,send:true});},
  success(){[0,2,4,7].forEach((n,i)=>tone(PENTA[n],0.45,{g:0.11,type:'triangle',at:i*0.09}));tone(PENTA[7]*2,0.8,{g:0.05,at:0.36,send:true});},
  gold(){[4,5,6,7].forEach((n,i)=>tone(PENTA[n]*2,0.5,{g:0.05,at:i*0.06,send:true}));},
  pick(){noise(0.08,{f:2000,q:1,g:0.06});tone(660,0.14,{g:0.08,type:'triangle'});},
  card(m){noise(0.12,{f:1400,to:3000,q:0.8,g:0.06});tone(440,0.12,{to:660,g:0.07,type:'triangle'});},
  wiggle(){tone(900,0.05,{g:0.03,type:'triangle'});},
  chuff(){noise(0.18,{type:'lowpass',f:700,g:0.035,att:0.02});},
  open(){noise(1.1,{f:300,to:2400,q:0.6,g:0.12,att:0.1});[0,4,7].forEach((n,i)=>tone(PENTA[n]/2,1.2,{g:0.08,type:'triangle',at:0.3+i*0.12,send:true}));},
  fanfare(){[0,2,4,0,4,7,5,7].forEach((n,i)=>tone(PENTA[n],0.3,{g:0.1,type:i%2?'triangle':'square',at:i*0.14}));
    for(let i=0;i<6;i++)noise(0.05,{f:2500,q:1,g:0.04,at:1.2+i*0.07});},
  pop(){tone(520,0.08,{to:900,g:0.06,type:'triangle'});}
};

/* ---------------- procedural photo textures ---------------- */
const TX={mat:{},orn:{}};
function mk(w,h,rs){rs=rs||2;const c=document.createElement('canvas');c.width=Math.ceil(w*rs);c.height=Math.ceil(h*rs);
  const g=c.getContext('2d');g.scale(rs,rs);c.uw=w;c.uh=h;return [c,g];}
function grain(g,w,h,n,a,dark){for(let i=0;i<n;i++){const v=TR_R();g.fillStyle=(v<0.5||dark)?'rgba(40,25,10,'+(a*TR_R())+')':'rgba(255,250,235,'+(a*TR_R())+')';
  const s=trnd(0.4,1.6);g.fillRect(trnd(0,w),trnd(0,h),s,s);}}
function vignette(g,w,h,a){const r=g.createRadialGradient(w/2,h/2,Math.min(w,h)*0.25,w/2,h/2,Math.max(w,h)*0.72);
  r.addColorStop(0,'rgba(0,0,0,0)');r.addColorStop(1,'rgba(40,22,8,'+a+')');g.fillStyle=r;g.fillRect(0,0,w,h);}
function sepiaGrad(g,y0,y1,c0,c1){const l=g.createLinearGradient(0,y0,0,y1);l.addColorStop(0,c0);l.addColorStop(1,c1);return l;}
/* wrap an inner image into a white-bordered photo with jittered (torn) edge */
function framed(inner,b,torn){
  const w=inner.uw+b*2,h=inner.uh+b*2;const [c,g]=mk(w,h);
  g.fillStyle='#fbf7ee';g.beginPath();
  const j=torn?1.6:0.5;const pts=[];
  for(let x=0;x<=w;x+=6)pts.push([x,trnd(0,j)]);for(let y=0;y<=h;y+=6)pts.push([w-trnd(0,j),y]);
  for(let x=w;x>=0;x-=6)pts.push([x,h-trnd(0,j)]);for(let y=h;y>=0;y-=6)pts.push([trnd(0,j),y]);
  pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();
  g.drawImage(inner,b,b,inner.uw,inner.uh);
  g.strokeStyle='rgba(120,100,70,0.18)';g.lineWidth=0.6;g.strokeRect(b,b,inner.uw,inner.uh);
  return c;
}
function buildPaper(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#efe4cc';g.fillRect(0,0,256,256);
  for(let i=0;i<5000;i++){const v=TR_R();g.fillStyle=v<0.5?'rgba(150,120,80,'+trnd(0.02,0.09)+')':'rgba(255,252,240,'+trnd(0.05,0.2)+')';g.fillRect(trnd(0,256),trnd(0,256),trnd(0.5,2),trnd(0.5,2));}
  g.lineCap='round';
  for(let i=0;i<70;i++){g.strokeStyle='rgba(160,130,90,'+trnd(0.04,0.12)+')';g.lineWidth=trnd(0.4,0.9);const x=trnd(0,256),y=trnd(0,256),a=trnd(0,TAU),l=trnd(4,14);
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+0.6)*l/2,y+Math.sin(a+0.6)*l/2,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  TX.paper=c;
}
function matSwatch(m){
  const U=128;const [c,g]=mk(U,U);
  if(m==='rubber'){
    g.fillStyle='#29292d';g.fillRect(0,0,U,U);grain(g,U,U,1400,0.25);
    for(let y=-7;y<U+7;y+=14)for(let x=((y/14)&1)*7-7;x<U+7;x+=14){
      const r=g.createRadialGradient(x-1.8,y-1.8,0.5,x,y,5.6);r.addColorStop(0,'#77777f');r.addColorStop(0.45,'#3a3a40');r.addColorStop(1,'#141416');
      g.fillStyle=r;g.beginPath();g.arc(x,y,5.2,0,TAU);g.fill();
      g.fillStyle='rgba(0,0,0,0.35)';g.beginPath();g.arc(x+1.6,y+2,4.8,0,PI);g.fill();}
  }else if(m==='felt'){
    g.fillStyle='#c65d74';g.fillRect(0,0,U,U);g.lineCap='round';
    for(let i=0;i<3200;i++){const k=trnd(-40,40);g.strokeStyle='rgba('+(198+k|0)+','+(93+k*0.7|0)+','+(116+k*0.7|0)+','+trnd(0.3,0.7)+')';
      g.lineWidth=trnd(0.3,0.8);const x=trnd(-4,U+4),y=trnd(-4,U+4),a=trnd(0,TAU),l=trnd(2,7);
      g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+trnd(-2,2),y+trnd(-2,2),x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
    for(let i=0;i<40;i++){g.fillStyle='rgba(255,220,230,'+trnd(0.04,0.1)+')';g.beginPath();g.arc(trnd(0,U),trnd(0,U),trnd(6,16),0,TAU);g.fill();}
  }else if(m==='iron'){
    const l=g.createLinearGradient(0,0,U,U);l.addColorStop(0,'#5f6a74');l.addColorStop(0.42,'#c3ccd4');l.addColorStop(0.5,'#eef3f6');l.addColorStop(0.6,'#9aa5af');l.addColorStop(1,'#4d565f');
    g.fillStyle=l;g.fillRect(0,0,U,U);
    for(let i=0;i<260;i++){g.strokeStyle=TR_R()<0.5?'rgba(255,255,255,'+trnd(0.04,0.16)+')':'rgba(20,30,40,'+trnd(0.04,0.14)+')';g.lineWidth=trnd(0.3,0.9);
      const y=trnd(0,U);g.beginPath();g.moveTo(trnd(-20,U),y);g.lineTo(trnd(0,U+20),y+trnd(-0.6,0.6));g.stroke();}
    for(let i=0;i<9;i++){g.fillStyle='rgba(140,80,40,'+trnd(0.05,0.15)+')';g.beginPath();g.arc(trnd(0,U),trnd(0,U),trnd(1,4),0,TAU);g.fill();}
    [[16,16],[112,16],[16,112],[112,112]].forEach(p=>{const r=g.createRadialGradient(p[0]-1.5,p[1]-1.5,0.3,p[0],p[1],4.5);r.addColorStop(0,'#fff');r.addColorStop(0.4,'#9aa3ab');r.addColorStop(1,'#3b434a');g.fillStyle=r;g.beginPath();g.arc(p[0],p[1],4.2,0,TAU);g.fill();});
  }else if(m==='glass'){
    const l=g.createLinearGradient(0,0,U,U);l.addColorStop(0,'rgba(215,245,252,0.62)');l.addColorStop(0.5,'rgba(160,215,230,0.38)');l.addColorStop(1,'rgba(120,190,212,0.6)');
    g.fillStyle=l;g.fillRect(0,0,U,U);
    g.fillStyle='rgba(255,255,255,0.55)';g.beginPath();g.moveTo(10,0);g.lineTo(34,0);g.lineTo(0,34);g.lineTo(0,10);g.fill();
    g.fillStyle='rgba(255,255,255,0.3)';g.beginPath();g.moveTo(52,0);g.lineTo(60,0);g.lineTo(0,60);g.lineTo(0,52);g.fill();
    for(let i=0;i<26;i++){const x=trnd(0,U),y=trnd(0,U),r=trnd(0.8,3.2);g.strokeStyle='rgba(255,255,255,0.7)';g.lineWidth=0.6;g.beginPath();g.arc(x,y,r,0,TAU);g.stroke();
      g.fillStyle='rgba(255,255,255,0.8)';g.fillRect(x-r*0.4,y-r*0.5,0.8,0.8);}
    g.strokeStyle='rgba(60,130,150,0.35)';g.lineWidth=1.2;g.strokeRect(1,1,U-2,U-2);
    for(let i=0;i<6;i++){g.strokeStyle='rgba(255,255,255,0.25)';g.lineWidth=0.5;g.beginPath();g.moveTo(trnd(0,U),0);g.bezierCurveTo(trnd(0,U),40,trnd(0,U),80,trnd(0,U),U);g.stroke();}
  }else if(m==='wood'){
    g.fillStyle='#b5803f';g.fillRect(0,0,U,U);

/* ---------------- world space: depth lanes ---------------- */
const DK=d=>1-0.0022*d;          // scale by depth
const DYO=d=>-0.85*d;            // screen-y offset by depth
let camX=0,camY=0;
const SX=x=>x-camX;
const SY=(y,d)=>GY-camY+y*DK(d||0)+DYO(d||0);

/* ---------------- train path (polyline with arc length) ---------------- */
const PATH={p:[],end:0};
const NOCEIL=-1e9;
function pAdd(pts,trk){
  const P=PATH.p;
  for(const q of pts){
    const o={x:q.x,d:q.d,y:q.y,c:q.c==null?NOCEIL:q.c,trk:trk||q.trk||'',s:0};
    if(P.length){const l=P[P.length-1];const dx=o.x-l.x,dd=o.d-l.d,dy=o.y-l.y;const ds=Math.sqrt(dx*dx+dd*dd+dy*dy*0.25);
      if(ds<0.5)continue;o.s=l.s+ds;}
    P.push(o);
  }
  PATH.end=P.length?P[P.length-1].s:0;
}
function pIdx(s){const P=PATH.p;let lo=0,hi=P.length-1;if(hi<1)return 0;if(s<=P[0].s)return 0;if(s>=P[hi].s)return hi-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(P[m].s<=s)lo=m;else hi=m;}return lo;}
function pAt(s,out){
  const P=PATH.p;out=out||{};if(!P.length){out.x=0;out.d=0;out.y=0;out.c=NOCEIL;out.fx=1;out.fd=0;out.trk='';out.gy=0;return out;}
  const i=pIdx(s),a=P[i],b=P[Math.min(i+1,P.length-1)];const L=Math.max(1e-6,b.s-a.s),t=clamp((s-a.s)/L,0,1);
  out.x=lerp(a.x,b.x,t);out.d=lerp(a.d,b.d,t);out.y=lerp(a.y,b.y,t);out.c=t<0.5?a.c:b.c;out.trk=a.trk;
  const dx=b.x-a.x,dd=b.d-a.d,dl=Math.sqrt(dx*dx+dd*dd)||1;out.fx=dx/dl;out.fd=dd/dl;out.gy=(b.y-a.y)/(Math.abs(dx)>0.01?dx:1e9);
  return out;
}
function pTrim(minS){const P=PATH.p;let k=0;while(k<P.length-2&&P[k+1].s<minS)k++;if(k>40)P.splice(0,k);}

/* ---------------- track builders (plan x,d + height y) ---------------- */
function seg(x0,d0,y0,x1,d1,y1,o){o=o||{};const n=Math.max(2,Math.ceil(Math.abs(x1-x0)/(o.step||14))),out=[];

/* planner: which section follows which */
function planNext(prev){
  const x=prev?prev.x1:0;
  if(!prev)return mkPost(-700,'rubber',700);
  switch(prev.type){
    case 'post':return mkTwo(x,prev.first);
    case 'station':case 'terminal':return mkTwo(x,false);
    case 'two':return mkBells(x);
    case 'bells':return mkSign(x,hasAb('reveal'));
    case 'sign':return prev.hidden?mkIce(x):mkCurve(x);
    case 'ice':return mkCurve(x);
    case 'curve':RT.lapN++;prev.decide();return prev.golden?mkTerminal(x):mkStation(x,G.grand);
  }
  return mkTwo(x);
}

    if(typeof onSecCreated==='function')onSecCreated(n);

function updateTrain(dt){

      const zi=(a.d+b.d)/2;const ii=i,jj=j;list.push({z:zi+0.01,f:()=>drawTrackRun(P,ii,jj,t,vis)});}

}
function drawTrackRun(P,i0,i1,t,vis){
  if(vis<=0.01)return;
  ctx.save();ctx.translate(-camX,GY-camY);ctx.globalAlpha=vis;
  const xs=[],ys=[],ks=[];for(let i=i0;i<=i1;i++){const p=P[i];xs.push(p.x);ys.push(p.y*DK(p.d)+DYO(p.d));ks.push(DK(p.d));}
  const k=ks[0];
  const line=(off)=>{ctx.beginPath();for(let i=0;i<xs.length;i++){i?ctx.lineTo(xs[i],ys[i]+off*ks[i]):ctx.moveTo(xs[i],ys[i]+off*ks[i]);}};
  ctx.lineCap='butt';ctx.lineJoin='round';
  if(t.golden){ctx.strokeStyle='rgba(240,200,90,0.35)';ctx.lineWidth=40*k;line(2);ctx.stroke();}
  ctx.strokeStyle='rgba(50,30,15,0.16)';ctx.lineWidth=24*k;ctx.save();ctx.translate(3,5);line(2);ctx.stroke();ctx.restore();
  ctx.strokeStyle='#fbf7ee';ctx.lineWidth=27*k;line(2);ctx.stroke();
  if(!BAL)BAL=ctx.createPattern(TX.ballast,'repeat');
  ctx.strokeStyle=t.frost?'#cfe6ee':(t.hidden?'#dfe9ef':BAL);ctx.lineWidth=21*k;line(2);ctx.stroke();
  if(t.hidden){ctx.strokeStyle='rgba(70,120,170,0.8)';ctx.lineWidth=1.6*k;ctx.setLineDash([6,5]);line(-4);ctx.stroke();line(6);ctx.stroke();ctx.setLineDash([]);}
  // sleepers
  ctx.fillStyle=t.golden?'#a8761e':'rgba(70,45,22,0.85)';
  for(let i=0;i<xs.length;i++){if((i0+i)%2)continue;ctx.fillRect(xs[i]-3*ks[i],ys[i]-6*ks[i],6*ks[i],14*ks[i]);}
  // rails
  const rc=t.golden?'#d9a22e':(t.hidden?'#6a8fb4':'#3e2c19');
  ctx.strokeStyle=rc;ctx.lineWidth=2.6*k;line(-4);ctx.stroke();line(6);ctx.stroke();
  ctx.strokeStyle='rgba(255,245,220,0.7)';ctx.lineWidth=0.9*k;line(-5);ctx.stroke();line(5);ctx.stroke();
  ctx.restore();
}

function layoutCards(){for(const s of RT.secs)if(s.cards&&s.cards.length)layoutSec(s);}
function gridFit(n,w,h){let best={c:n,r:1,sz:0};for(let r=1;r<=3;r++){const c=Math.ceil(n/r);const sz=Math.min(w/c,h/r);if(sz>best.sz)best={c:c,r:r,sz:sz};}return best;}
function layoutSec(s){
  if(!s.cards||!s.cards.length)return;
  const cx=s.type==='station'?s.cx+40:s.type==='ice'?s.x0+450:s.cx;
  const top=GY+78,bot=VH-SAFE.b/S-10;const RH=Math.max(120,bot-top),RW=Math.min(VW-24-(SAFE.l+SAFE.r)/S,1100);
  const wheel=s.cards.filter(c=>c.kind!=='car'),car=s.cards.filter(c=>c.kind==='car');
  const place=(arr,x0,y0,w,h)=>{if(!arr.length)return;const g=gridFit(arr.length,w,h);const sz=Math.min(g.sz*0.86,190);
    arr.forEach((c,i)=>{const r=Math.floor(i/g.c),k=i%g.c;const inRow=Math.min(g.c,arr.length-r*g.c);
      c.x=x0+w/2+(k-(inRow-1)/2)*g.sz;c.y=y0+(r+0.5)*(h/g.r);c.w=sz;c.h=c.kind==='car'?sz*0.72:sz;c.vx=c.x;});};
  if(!car.length)place(wheel,cx-RW/2,top,RW,RH);
  else if(RW>RH*1.6){place(wheel,cx-RW/2,top,RW*0.55,RH);place(car,cx-RW/2+RW*0.58,top,RW*0.42,RH);}
  else{place(wheel,cx-RW/2,top,RW,RH*0.56);place(car,cx-RW/2,top+RH*0.58,RW,RH*0.42);}
}
function cardsActive(s){
  if(!s||!s.cards||!s.cards.length)return false;
  if(s.type==='station')return (RT.cur===s||(s.x0>TR.x&&s.x0-TR.x<260))&&s.phase<2&&!G.ceremony;
  if(s.type==='ice')return (RT.cur===s)&&s.slab.active&&TR.x<s.slabX-60;
  if(s.type==='terminal')return s.cer&&s.cer.cards&&!s.chosen;
  return false;}
function recFor(s){
  if(s.type==='ice')return G.wheel==='ice'?{mat:'felt',kind:'wheel'}:{mat:'ice',kind:'wheel'};
  if(s.type==='terminal')return {mat:s.cards[0].mat,kind:'restart'};
  const untried=G.order.filter(m=>G.tried.indexOf(m)<0&&m!==G.wheel);
  const pickW=m=>({mat:m,kind:'wheel'}),pickC=m=>({mat:m,kind:'car'});
  if(!s.grand){
    if(untried.length){let m=untried[0];if(m==='wood'&&G.bells===0&&untried.indexOf('iron')>=0)m='iron';return pickW(m);}
    if(!G.iceOwned)return pickW(G.wheel==='glass'?'iron':'glass');
    return pickW(G.bells?(G.wheel==='wood'?'felt':'wood'):'iron');
  }
  if(untried.length)return pickW(untried[0]);
  if(!G.iceOwned)return G.wheel!=='glass'?pickW('glass'):pickC('glass');
  if(!G.mechDone){if(G.bells===0)return (G.car!=='iron'&&G.tried.indexOf('iron')>=0&&G.wheel!=='iron')?pickC('iron'):pickW(G.wheel==='iron'?'wood':'iron');
    if(!hasAb('rhythm'))return pickW('wood');}
  if(G.car!=='glass'&&G.tried.indexOf('glass')>=0)return pickC('glass');
  return G.wheel!=='ice'?pickW('ice'):pickW('wood');
}

/* ---------------- staff / crowd poses ---------------- */
const STAFF={mode:'idle',pose:{},modeT:0};
function staffReact(){
  const tk=G.tickets>0,orn=G.orns.length>0;
  let m='wave';
  if(G.bells>0&&hasAb('rhythm')&&!hasAb('mute'))m='dance';
  else if(G.bells>0&&hasAb('mute'))m='sway';
  else if(tk)m='salute';
  else if(orn)m='flag';
  STAFF.mode=m;STAFF.modeT=T;logE('staff',m);
  if(m==='dance')logE('dance','wood');if(m==='sway')logE('dance','felt');
}
function poseFor(mode,t,ph){
  ph=ph||0;const b=Math.sin(t*6+ph);
  switch(mode){
    case 'dance':return {bob:-Math.abs(Math.sin(t*7.5+ph))*12,al:-2.4+Math.sin(t*7.5+ph)*0.6,ar:2.4-Math.sin(t*7.5+ph)*0.6,legL:Math.sin(t*7.5+ph)*0.4,legR:-Math.sin(t*7.5+ph)*0.4,mood:'laugh',lean:Math.sin(t*3.7+ph)*0.12};
    case 'sway':return {lean:Math.sin(t*1.6+ph)*0.14,al:0.3,ar:-1.6+Math.sin(t*3.2+ph)*0.5,mood:'joy'};
    case 'salute':return {ar:-2.5,al:0.1,bob:-Math.abs(Math.sin(t*5))*8,mood:'joy'};
    case 'flag':return {ar:-2.6+Math.sin(t*8)*0.4,al:0.1,mood:'joy',flag:'#d9443a'};
    case 'wave':return {ar:-2.3+Math.sin(t*9+ph)*0.45,al:0.1,mood:'joy',flag:'#4f9a5a'};
    case 'cheer':return {al:-2.7+b*0.2,ar:2.7-b*0.2,bob:-Math.abs(b)*8,mood:'laugh'};
    case 'clap':{const c=Math.abs(Math.sin(t*8+ph));return {al:-0.9-c*0.4,ar:0.9+c*0.4,mood:'joy'};}
    case 'point':return {ar:-1.1,al:0.1,mood:'idle',flag:'#4f9a5a'};
  }
  return {al:0.12,ar:-0.12,mood:'idle',flag:'#4f9a5a'};
}

/* ---------------- input ---------------- */
const PTR=new Map();let lastInputT=0;
function toView(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S};}
function tryAct(p,isDown){
  const c=cardHit(p.x,p.y);if(c){cardSelect(c);return true;}
  if(bodyHit(p.x,p.y)){if(T-(TR.lastJumpTry||-9)>0.12){TR.lastJumpTry=T;const ok=trainJump(true);if(!ok)SFX.wiggle();logE('tap','body');}return true;}
  if(isDown){for(const w of WIG){if(p.x>w.x&&p.x<w.x+w.w&&p.y>w.y&&p.y<w.y+w.h){wigT[w.id]=T;SFX.wiggle();return true;}}}
  return false;
}
function onDown(e){
  try{if(e.cancelable!==false)e.preventDefault();}catch(_){}
  audioStart();lastInputT=T;GD.demo=null;
  const p=toView(e);const done=tryAct(p,true);
  PTR.set(e.pointerId,{t:T,done:done});
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
}
function onMove(e){const q=PTR.get(e.pointerId);if(!q||q.done)return;if(T-q.t>0.7)return;const p=toView(e);
  const c=cardHit(p.x,p.y);if(c){cardSelect(c);q.done=true;lastInputT=T;}}

cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:true});
['pointerup','pointercancel','lostpointercapture','pointerleave'].forEach(n=>cv.addEventListener(n,onUp,{passive:true}));
['touchstart','touchmove','touchend','gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(n=>document.addEventListener(n,e=>{try{if(e.cancelable!==false)e.preventDefault();}catch(_){}},{passive:false}));
addEventListener('blur',()=>PTR.clear());

  const portrait=VW<VH;let tx=TR.x-VW*(portrait?0.38:0.40);
  const c=RT.cur;const sl=activeSlab();
  if(c&&c.type==='station'&&(c.phase<2||TR.x<c.slabX+40)){const left=c.A-110,right=c.slabX+90;const span=right-left;tx=span<=VW?(left+right)/2-VW/2:left+(span-VW)*0.6;}
  else if(c&&c.type==='terminal'&&(!c.chosen||TR.x<c.slabX)){tx=Math.min(c.cx-VW/2,TR.x-VW*0.2);if(c.chosen)tx=Math.max(tx,TR.x-VW*0.4);}
  else if(sl&&sl.active&&TR.d<8&&sl.x>TR.x){tx=Math.min(TR.x-VW*0.18,Math.max(tx,sl.x+100-VW));tx=Math.max(tx,TR.x-VW*0.55);}
  const ty=(TR.trk==='up'||TR.Y<-200)?(portrait?-40:-95):0;
  if(!camInit){camX=tx;camY=ty;camInit=true;}
  camX+=(tx-camX)*(1-Math.exp(-dt*2.4));camY+=(ty-camY)*(1-Math.exp(-dt*2));
}

/* ---------------- main loop ---------------- */
let T=0,lastNow=0,rafId=0,running=false;
const LATER=[];function later(d,f){LATER.push({t:T+d,f:f});}
const PERF=[];
function step(dt){
  T+=dt;
  for(let i=LATER.length-1;i>=0;i--){if(LATER[i].t<=T){const f=LATER[i].f;LATER.splice(i,1);try{f();}catch(e){}}}
  if(GR.t>=0){GR.t+=dt;if(GR.t>1.7)GR.t=-1;}
  routeTick();
  const cur=secAt(TR.x);if(cur!==RT.cur){RT.cur=cur;onEnterSec(cur);}
  updateTrain(dt);
  for(const s of RT.secs)if(s.x1>camX-400&&s.x0<camX+VW+400)updSec(s,dt);
  camUpdate(dt);ensureSecs();
  updParticles(dt);updFly(dt);updGuide(dt);
  const st=RT.cur;
  if(st&&st.type==='station'&&T-STAFF.modeT<9)STAFF.pose=poseFor(STAFF.mode,T,0);
  else if(st&&st.type==='station'&&st.phase<2){const pz=poseFor('point',T,0);const tg=GD.tgt;if(tg&&tg.card){const k=DK(70);const sx=SX(st.cx+70)+17*k,sy=SY(-16-104*0.95,70);const dx=tg.x-sx,dy=tg.y-sy;pz.ar=Math.atan2(-dx,dy)+Math.sin(T*5)*0.06;pz.lx=clamp(dx/150,-1,1);pz.ly=clamp(dy/150,-1,1);}STAFF.pose=pz;}
  else STAFF.pose=poseFor('idle',T,0);
  for(const s of RT.secs)if(s.type==='station'&&s.grand)s.porter=poseFor(T-STAFF.modeT<9?STAFF.mode:'idle',T,1.7);
}
function draw(){
  ctx.setTransform(S*DPR,0,0,S*DPR,0,0);
  ctx.fillStyle='#efe4cc';ctx.fillRect(0,0,VW,VH);
  drawBackdrop();drawGround();
  const L=[];WIG.length=0;LENS=null;
  for(const s of RT.secs)sectionItems(s,L);
  if(GD.tgt&&GD.tgt.body)L.push({z:(TR.d||0)+0.3,f:drawGuideBody});
  for(const v of TR.veh){const vv=v;L.push({z:v.d-0.5-(v.k==='loco'?0.01:0),f:()=>drawVehicle(vv)});}
  L.sort((a,b)=>b.z-a.z);
  for(const it of L)it.f();
  drawParticles();drawFly();drawCards();drawGuideHand();
  const tc=RT.cur&&RT.cur.cer;if(tc&&tc.flash>0){ctx.fillStyle='rgba(255,252,240,'+(tc.flash*0.7)+')';ctx.fillRect(0,0,VW,VH);}
}
function drawGuideBody(){const t=GD.tgt;GD.tgt=Object.assign({},t);const d=GD.demo;GD.demo=null;drawGuide();GD.demo=d;}
function drawGuideHand(){const t=GD.tgt;if(!t||!GD.demo)return;const b=t.body;t.body=false;drawGuide();t.body=b;}
function frame(now){
  if(!running)return;rafId=requestAnimationFrame(frame);
  let dt=(now-lastNow)/1000;lastNow=now;if(!(dt>0))return;if(dt>0.05)dt=0.05;
  const p0=performance.now();
  let total=dt*TSCALE;while(total>1e-6){const h=Math.min(total,1/60);step(h);total-=h;}
  draw();PERF.push(performance.now()-p0);if(PERF.length>240)PERF.shift();
}
function start(){if(running)return;running=true;lastNow=performance.now();rafId=requestAnimationFrame(frame);}
function stop(){running=false;cancelAnimationFrame(rafId);}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();PTR.clear();try{if(AU.c&&AU.c.state==='running')AU.c.suspend();}catch(e){}}
  else{try{if(AU.c)AU.c.resume().catch(()=>{});}catch(e){}start();}
});
addEventListener('resize',()=>{resize();});
addEventListener('orientationchange',()=>{setTimeout(resize,120);});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>resize());

function init(){
  resize();buildTextures();matPattern('wood');
  RT.secs=[];PATH.p=[];
  const first=planNext(null);RT.secs.push(first);onSecCreated(first);RT.route=first;
  pAdd(first.next());
  // place the loco where it waits for the first tap (beside the rubber)
  let s0=0;for(const p of PATH.p){if(p.x>=first.slab.x-165){s0=p.s;break;}}
  TR.s=s0;pAt(TR.s,tmpP);TR.x=tmpP.x;TR.v=0;TR.Y=0;
  rebuildVeh();
  for(let i=0;i<=40;i++)TR.hist.push({s:TR.s-TR.len-100+i*(TR.len+100)/40,y:0});
  updateTrain(0.001);camUpdate(0.016);ensureSecs();RT.cur=secAt(TR.x);
  draw();start();
}
window.__G={G:G,TR:TR,RT:RT,GD:GD,
  T:()=>T,
  target:()=>{const t=GD.tgt;if(!t)return null;const r=cv.getBoundingClientRect();return {id:t.id,x:r.left+t.x*S,y:r.top+t.y*S,body:!!t.body};},
  body:()=>{const v=TR.veh[0];const r=cv.getBoundingClientRect();return {x:r.left+SX(v.x)*S,y:r.top+SY(v.y-80,v.d)*S};},
  card:(mat,kind)=>{for(const s of RT.secs){if(!cardsActive(s))continue;const c=s.cards.find(q=>q.mat===mat&&(!kind||q.kind===kind));if(c){const r=cv.getBoundingClientRect();return {x:r.left+SX(c.x)*S,y:r.top+c.y*S};}}return null;},
  cards:()=>{const out=[];for(const s of RT.secs){if(!cardsActive(s))continue;s.cards.forEach(c=>out.push({mat:c.mat,kind:c.kind}));}return out;},
  sec:()=>RT.cur?RT.cur.type:null,
  pcount:()=>PA.length,
  perf:()=>{const a=PERF.slice().sort((x,y)=>x-y);return {n:a.length,avg:a.reduce((x,y)=>x+y,0)/Math.max(1,a.length),p95:a[Math.floor(a.length*0.95)]||0,max:a[a.length-1]||0};},
  ptrs:()=>PTR.size,
  view:()=>({W:W,H:H,S:S,VW:VW,VH:VH,DPR:DPR})
};
init();
})();
</script>
