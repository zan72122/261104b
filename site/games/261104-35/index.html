(()=>{
'use strict';
// =====================================================================
//  basics
// =====================================================================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eo=t=>1-(1-t)*(1-t);
const eio=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const rr=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rr(a,b+1));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash2(x,y){let h=(x|0)*374761393+(y|0)*668265263;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
let NOW=0;           // seconds (game clock, paused when hidden)
let hiddenNow=false;
const EV=[];          // event log (for engineering checks only; never shown)
function ev(name,data){EV.push({t:+NOW.toFixed(2),n:name,d:data||null});if(EV.length>600)EV.splice(0,100);}

// =====================================================================
//  audio (Web Audio synth, starts on first touch)
// =====================================================================
const AU={ctx:null,master:null,noise:null,ok:false,loops:null,last:{}};
function auInit(){
  if(AU.ctx)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=new AC();AU.ctx=c;
    const comp=c.createDynamicsCompressor();
    comp.threshold.value=-16;comp.knee.value=14;comp.ratio.value=4;comp.attack.value=0.004;comp.release.value=0.25;
    const m=c.createGain();m.gain.value=0.8;m.connect(comp);comp.connect(c.destination);AU.master=m;
    const len=(c.sampleRate*1.6)|0,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    AU.noise=b;
    AU.loops={pour:loopNoise('bandpass',1100,1.1),stream:loopNoise('lowpass',700,0.6),
      rumble:loopNoise('lowpass',170,1.3),wind:loopNoise('bandpass',600,0.8)};
  }catch(e){AU.ctx=null;}
}
function loopNoise(type,f,q){
  const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;s.loop=true;
  const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
  const g=c.createGain();g.gain.value=0;
  s.connect(fl);fl.connect(g);g.connect(AU.master);s.start();
  return {g,fl,s};
}
function auUnlock(){
  auInit();const c=AU.ctx;if(!c)return;
  if(c.state!=='running'&&!hiddenNow){try{const p=c.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  if(!AU.ok){try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0);}catch(e){}AU.ok=true;}
}
function canPlay(key,gap){
  const c=AU.ctx;if(!c||c.state!=='running'||hiddenNow)return false;
  const t=c.currentTime;if(AU.last[key]!==undefined&&t-AU.last[key]<gap)return false;AU.last[key]=t;return true;
}
function nz(t0,dur,type,f,q,gain,att,fEnd,rate){
  const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;s.playbackRate.value=rate||(0.8+Math.random()*0.4);
  const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t0);
  if(fEnd)fl.frequency.exponentialRampToValueAtTime(fEnd,t0+dur);fl.Q.value=q;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain),t0+(att||0.005));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(fl);fl.connect(g);g.connect(AU.master);s.start(t0,Math.random()*1.2);s.stop(t0+dur+0.05);
}
function tone(t0,f,dur,type,gain,fEnd,att){
  const c=AU.ctx,o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,t0+dur);
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,gain),t0+(att||0.004));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(AU.master);o.start(t0);o.stop(t0+dur+0.05);
}
function mar(t0,f,g,d){tone(t0,f,d||0.55,'sine',g);tone(t0,f*4.02,0.08,'sine',g*0.35);tone(t0,f*2,0.25,'triangle',g*0.18);}
function bell(t0,f,g,d){tone(t0,f,d||1.4,'sine',g);tone(t0,f*2.76,(d||1.4)*0.5,'sine',g*0.3);tone(t0,f*5.4,0.25,'sine',g*0.12);}
const SND={
  sand(v,p){if(!canPlay('sand',0.07))return;const t=AU.ctx.currentTime;v=clamp(v||1,0.15,1.3);p=p||1;
    nz(t,0.10+0.25*v,'bandpass',2400*p,0.7,0.2*v,0.008,800*p);nz(t+0.02,0.08+0.16*v,'highpass',4300*p,0.5,0.07*v,0.012);},
  tick(){if(!canPlay('tick',0.08))return;const t=AU.ctx.currentTime;nz(t,0.05,'highpass',5200,0.7,0.035,0.003);},
  stone(v,p){if(!canPlay('stone',0.035))return;const t=AU.ctx.currentTime;v=clamp(v||1,0.15,1.2);p=p||1;
    const f=(1250+380*Math.random())*p;tone(t,f,0.075,'sine',0.26*v,f*0.86);tone(t,f*1.71,0.05,'triangle',0.08*v);
    nz(t,0.03,'bandpass',3400*p,1.3,0.16*v,0.002);},
  thud(v){if(!canPlay('thud',0.06))return;const t=AU.ctx.currentTime;tone(t,180,0.12,'sine',0.22*v,90);nz(t,0.16,'lowpass',900,0.8,0.14*v,0.004);},
  plop(sz,p){if(!canPlay('plop',0.07))return;const t=AU.ctx.currentTime;sz=clamp(sz||1,0.3,2);p=p||1;
    const f0=900*p/Math.sqrt(sz),f1=240*p/Math.sqrt(sz);tone(t,f0,0.13+0.06*sz,'sine',0.3,f1,0.003);
    nz(t+0.015,0.18+0.12*sz,'bandpass',1500,0.8,0.1*sz,0.01,500);},
  leaf(){if(!canPlay('leaf',0.09))return;const t=AU.ctx.currentTime;
    for(let k=0;k<5;k++)nz(t+k*0.028+Math.random()*0.02,0.03,'highpass',5000+Math.random()*1800,0.8,0.055,0.003);},
  step(type,v){if(!canPlay('step',0.11))return;const t=AU.ctx.currentTime;v=v||1;
    if(type===1)tone(t,760+Math.random()*120,0.045,'triangle',0.05*v,600);
    else if(type===2){tone(t,210,0.09,'sine',0.06*v,120);nz(t,0.08,'lowpass',600,1,0.05*v,0.006);}
    else nz(t,0.06,'lowpass',1100,0.7,0.035*v,0.005);},
  hammer(){if(!canPlay('hammer',0.12))return;const t=AU.ctx.currentTime;tone(t,540,0.09,'triangle',0.17,420);nz(t,0.035,'bandpass',1900,1.1,0.1,0.002);},
  pat(){if(!canPlay('pat',0.09))return;const t=AU.ctx.currentTime;nz(t,0.09,'lowpass',520,0.8,0.2,0.005);tone(t,150,0.08,'sine',0.12,95);},
  splat(v){if(!canPlay('splat',0.08))return;const t=AU.ctx.currentTime;v=v||1;nz(t,0.2,'lowpass',800,0.9,0.22*v,0.004,300);tone(t,190,0.12,'sine',0.14*v,85);},
  slosh(){if(!canPlay('slosh',0.25))return;const t=AU.ctx.currentTime;nz(t,0.3,'lowpass',950,0.9,0.12,0.03);tone(t+0.05,330,0.12,'sine',0.08,460);tone(t+0.13,420,0.1,'sine',0.06,560);},
  rustle(){if(!canPlay('rustle',0.25))return;const t=AU.ctx.currentTime;for(let k=0;k<7;k++)nz(t+k*0.035,0.04,'highpass',4500+Math.random()*2000,0.8,0.04,0.003);},
  spoutOn(){if(!canPlay('spout',0.3))return;const t=AU.ctx.currentTime;tone(t,300,0.18,'sine',0.12,520);nz(t,0.4,'bandpass',900,0.7,0.12,0.04,1600);},
  bridge(){if(!canPlay('bridge',1.2))return;const t=AU.ctx.currentTime;const n=[523.25,659.25,783.99,1046.5,1318.5];
    n.forEach((f,i)=>mar(t+i*0.11,f,0.2));bell(t+0.62,2093,0.1,1.6);bell(t+0.62,1568,0.08,1.4);},
  dock(){if(!canPlay('dock',0.5))return;const t=AU.ctx.currentTime;bell(t,783.99,0.13,1.0);bell(t+0.16,1174.7,0.11,1.2);},
  castle(){if(!canPlay('castle',3))return;const t=AU.ctx.currentTime;const ch=[[261.6,329.6,392],[293.7,370,440],[329.6,415.3,493.9],[392,493.9,587.3]];
    ch.forEach((c,k)=>c.forEach((f,j)=>mar(t+k*0.32+j*0.035,f*2,0.13,0.9)));
    [1046.5,1318.5,1568,2093].forEach((f,i)=>bell(t+1.35+i*0.13,f,0.09,1.8));tone(t+1.3,130.8,2.2,'sine',0.14);},
  whoosh(){if(!canPlay('whoosh',0.8))return;const t=AU.ctx.currentTime;nz(t,1.3,'bandpass',260,0.9,0.14,0.35,1900);},
  rise(){if(!canPlay('rise',1))return;const t=AU.ctx.currentTime;[392,523.3,659.3].forEach((f,i)=>mar(t+i*0.09,f,0.12,0.5));},
  pop(){if(!canPlay('pop',0.12))return;const t=AU.ctx.currentTime;tone(t,640,0.09,'sine',0.13,980);},
  chirp(){if(!canPlay('chirp',0.5))return;const t=AU.ctx.currentTime;mar(t,880,0.06,0.3);},
};
const LOOPV={pour:0,pourF:1100,stream:0,rumble:0,wind:0};
function auLoops(){
  if(!AU.ctx||!AU.loops)return;const t=AU.ctx.currentTime,L=AU.loops;
  L.pour.g.gain.setTargetAtTime(LOOPV.pour*0.2,t,0.05);L.pour.fl.frequency.setTargetAtTime(LOOPV.pourF,t,0.1);
  L.stream.g.gain.setTargetAtTime(LOOPV.stream*0.11,t,0.35);
  L.rumble.g.gain.setTargetAtTime(LOOPV.rumble*0.32,t,0.06);
  L.wind.g.gain.setTargetAtTime(LOOPV.wind*0.05,t,0.3);
}

// =====================================================================
//  world grid (canonical: GW x GH, landscape orientation)
// =====================================================================
const GW=64,GH=44,GN=GW*GH;
const Hs=new Float32Array(GN),   // sand height
      Wd=new Float32Array(GN),   // water depth
      Mo=new Float32Array(GN),   // moisture 0..1
      Pk=new Float32Array(GN),   // packed (castle) 0..1
      Tr=new Float32Array(GN),   // trodden trail 0..1
      St=new Float32Array(GN),   // stone extra height (recomputed)
      Ds=new Float32Array(GN),   // disturbance (collapse)
      Dr=new Float32Array(GN),   // drain strength
      Base=new Float32Array(GN), // generated shape (groove reference)
      Fl=new Float32Array(GN),Fr=new Float32Array(GN),Fu=new Float32Array(GN),Fd=new Float32Array(GN),
      Vx=new Float32Array(GN),Vy=new Float32Array(GN);
const Brg=new Uint8Array(GN),Stair=new Uint8Array(GN);
const HMAX=17;   // max height used by renderer headroom
const RIMH=4.6;  // sandbox frame height

const world={seed:1,portrait:false,round:0,spout:null,docks:[],way:{},mt:null,pond:null,pools:[],probes:{main:[],side:[]},fork:null};
const inGrid=(x,y)=>x>=0&&y>=0&&x<GW&&y<GH;
function ci(x,y){x=x|0;y=y|0;if(x<0)x=0;else if(x>=GW)x=GW-1;if(y<0)y=0;else if(y>=GH)y=GH-1;return y*GW+x;}
// bilinear sample at continuous coords (cell centers at i+0.5)
function bil(A,x,y){
  x-=0.5;y-=0.5;let xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi;
  if(xi<0){xi=0;fx=0;}else if(xi>=GW-1){xi=GW-2;fx=1;}
  if(yi<0){yi=0;fy=0;}else if(yi>=GH-1){yi=GH-2;fy=1;}
  const i=yi*GW+xi;
  const a=A[i],b=A[i+1],c=A[i+GW],d=A[i+GW+1];
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;
}
function groundAt(x,y){return bil(Hs,x,y);}
function surfAt(x,y){return bil(Hs,x,y)+bil(Wd,x,y);}
function gradAt(A,x,y){return [(bil(A,x+0.6,y)-bil(A,x-0.6,y))/1.2,(bil(A,x,y+0.6)-bil(A,x,y-0.6))/1.2];}
function surfGrad(x,y){const e=0.6;return[(surfAt(x+e,y)-surfAt(x-e,y))/(2*e),(surfAt(x,y+e)-surfAt(x,y-e))/(2*e)];}

// ---------------- view mapping (current screen orientation) -------------
let VPORT=false,VA=GW,VB=GH;
function g2v(x,y){return VPORT?[GH-y,x]:[x,y];}
function v2g(a,b){return VPORT?[b,GH-a]:[a,b];}
let VIDX=new Int32Array(GN);  // view cell -> canonical cell
function rebuildViewIndex(){
  VA=VPORT?GH:GW;VB=VPORT?GW:GH;
  for(let bi=0;bi<VB;bi++)for(let ai=0;ai<VA;ai++){
    let x,y;if(VPORT){x=bi;y=GH-1-ai;}else{x=ai;y=bi;}
    VIDX[bi*VA+ai]=y*GW+x;
  }
}

// ---------------- sand helpers -------------------------------------------
function addSand(x,y,vol,rad,moist){ // gaussian deposit
  rad=rad||1.4;const r2=rad*rad,R=Math.ceil(rad*2.2);
  const cx=Math.floor(x),cy=Math.floor(y);let tot=0;const cells=[];
  for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const X=cx+i,Y=cy+j;if(!inGrid(X,Y))continue;
    const dx=X+0.5-x,dy=Y+0.5-y,w=Math.exp(-(dx*dx+dy*dy)/r2);if(w<0.03)continue;cells.push(Y*GW+X,w);tot+=w;}
  if(tot<=0)return;
  for(let k=0;k<cells.length;k+=2){const i=cells[k],a=vol*cells[k+1]/tot;
    const old=Hs[i];Hs[i]+=a;
    if(moist===undefined||moist<0){Mo[i]=Mo[i]*(1-Math.min(1,a/0.7));} // dry sand dries surface
    else Mo[i]=Math.max(Mo[i]*(1-Math.min(1,a/0.7))+moist*Math.min(1,a/0.7),Mo[i]*0.5+moist*0.5);
    Tr[i]*=Math.max(0,1-a*2);
    if(Pk[i]>0&&a>0.15)Pk[i]=Math.max(0,Pk[i]-a);
    Sa[i]+=a;if(old<0)Hs[i]=Math.max(0,Hs[i]);}
}
const Sa=new Float32Array(GN);   // sand added by player (centroid memory)
function digSand(x,y,vol,rad){ // returns removed volume
  rad=rad||1.2;const r2=rad*rad,R=Math.ceil(rad*2.2);const cx=Math.floor(x),cy=Math.floor(y);let tot=0;const cells=[];
  for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){const X=cx+i,Y=cy+j;if(!inGrid(X,Y))continue;
    const dx=X+0.5-x,dy=Y+0.5-y,w=Math.exp(-(dx*dx+dy*dy)/r2);if(w<0.03)continue;cells.push(Y*GW+X,w);tot+=w;}
  let rem=0;for(let k=0;k<cells.length;k+=2){const i=cells[k];let a=vol*cells[k+1]/tot;a=Math.min(a,Math.max(0,Hs[i]-0.25));Hs[i]-=a;rem+=a;}
  return rem;
}
function bump(cx,cy,r,h){for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const d=Math.hypot(x+0.5-cx,y+0.5-cy);if(d<r)Hs[y*GW+x]+=h*0.5*(1+Math.cos(Math.PI*d/r));}}
function segDist(px,py,ax,ay,bx,by){const vx=bx-ax,vy=by-ay,l2=vx*vx+vy*vy;let t=l2>0?((px-ax)*vx+(py-ay)*vy)/l2:0;t=clamp(t,0,1);
  const qx=ax+vx*t,qy=ay+vy*t;return [Math.hypot(px-qx,py-qy),t];}
function polyNear(pts,px,py){ // -> [dist, globalT]
  let L=0;const segL=[];for(let k=0;k<pts.length-1;k++){const l=Math.hypot(pts[k+1][0]-pts[k][0],pts[k+1][1]-pts[k][1]);segL.push(l);L+=l;}
  let best=1e9,bt=0,acc=0;for(let k=0;k<pts.length-1;k++){const r=segDist(px,py,pts[k][0],pts[k][1],pts[k+1][0],pts[k+1][1]);
    if(r[0]<best){best=r[0];bt=(acc+r[1]*segL[k])/L;}acc+=segL[k];}
  return [best,bt];
}
function carve(pts,z0,z1,hw,moist){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  const m=hw+2;for(let y=Math.max(0,Math.floor(y0-m));y<=Math.min(GH-1,Math.ceil(y1+m));y++)for(let x=Math.max(0,Math.floor(x0-m));x<=Math.min(GW-1,Math.ceil(x1+m));x++){
    const r=polyNear(pts,x+0.5,y+0.5),d=r[0];if(d>hw+1.5)continue;const i=y*GW+x;const bed=lerp(z0,z1,r[1]);
    let tg;if(d<hw)tg=bed+(d/hw)*(d/hw)*0.3;else tg=bed+0.3+(Hs[i]-bed-0.3)*smooth((d-hw)/1.5);
    if(tg<Hs[i]){Hs[i]=tg;if(moist!==undefined&&d<hw+0.6)Mo[i]=Math.max(Mo[i],moist);}
  }
}
function meander(p0,p1,n,amp,R){
  const pts=[p0];const dx=p1[0]-p0[0],dy=p1[1]-p0[1],L=Math.hypot(dx,dy),nx=-dy/L,ny=dx/L;
  for(let k=1;k<n;k++){const t=k/n,o=(R()*2-1)*amp*Math.sin(Math.PI*t);pts.push([p0[0]+dx*t+nx*o,p0[1]+dy*t+ny*o]);}
  pts.push(p1);return pts;
}
function bowl(cx,cy,r,bed,rimUp){
  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x,d=Math.hypot(x+0.5-cx,y+0.5-cy);
    if(d<r){const tg=bed+(d/r)*(d/r)*(Hs[i]-bed);if(tg<Hs[i])Hs[i]=tg;}
    else if(d<r+1.8&&rimUp)Hs[i]+=rimUp*(1-Math.abs(d-r-0.9)/0.9);}
}
function relax(n,full){for(let k=0;k<n;k++)slumpPass(full?0.5:0.22,true);}

// =====================================================================
//  generation
// =====================================================================
function genWorld(seed,portrait,dishPt){
  const R=mulberry32(seed*7919+13),J=s=>(R()*2-1)*s;
  world.seed=seed;world.portrait=portrait;
  const A=portrait?GH:GW,B=portrait?GW:GH;
  const V=(u,w)=>portrait?[w*B,GH-u*A]:[u*A,w*B];
  const wOf=(x,y)=>portrait?x/GW:y/GH;
  const ns=R()*500;
  Wd.fill(0);Pk.fill(0);Tr.fill(0);St.fill(0);Ds.fill(0);Dr.fill(0);Sa.fill(0);
  Fl.fill(0);Fr.fill(0);Fu.fill(0);Fd.fill(0);Vx.fill(0);Vy.fill(0);Brg.fill(0);Stair.fill(0);

const WG=26,WDT=1/120,WDAMP=0.996;

    if(y>0){j=i-GW;d=h-Hs[j]-St[j]-Wd[j];fu=Fu[i]*(d>0?WDAMP:0.8)+g*d;if(fu<0)fu=0;}
    if(y<GH-1){j=i+GW;d=h-Hs[j]-St[j]-Wd[j];fd=Fd[i]*(d>0?WDAMP:0.8)+g*d;if(fd<0)fd=0;}

const muds=[];

  for(let k=muds.length-1;k>=0;k--){const m=muds[k];m.life+=dt;
    if(m.st==='held')continue;

      if(m.z-m.r<=g){const gr=gradAt(Hs,m.x,m.y),gm=Math.hypot(gr[0],gr[1]);const i=ci(m.x,m.y);notifyImpact(m.x,m.y,'mud');

        const elev=g-world.baseAvg;
        if(gm>0.28||elev>1.6){m.st='roll';m.vx=-gr[0]*3;m.vy=-gr[1]*3;m.z=g+m.r;SND.splat(0.6);burstMud(m.x,m.y,g,5,1.3);m.startElev=elev;m.x0=m.x;m.y0=m.y;ev('mud_roll_start',{elev:+elev.toFixed(1),x:+m.x.toFixed(1),y:+m.y.toFixed(1)});}
        else{depositMud(m);muds.splice(k,1);ev('mud_mound');}}
      continue;}
    // rolling: carve a valley

    const i=ci(m.x,m.y);

      if(amt>0){Hs[i]-=amt;Mo[i]=Math.max(Mo[i],0.64);Ds[i]=0;const px=-m.vy/sp,py=m.vx/sp;

      if(Math.random()<dt*10)burstMud(m.x,m.y,groundAt(m.x,m.y)+0.2,1,1.2);}
    m.r=0.7+Math.min(0.5,m.vol*0.1);
    m.z=groundAt(m.x,m.y)+m.r*0.9;
    for(const s of stones){if(s.st!=='rest'&&s.st!=='roll'&&!s.stair)continue;const dx=m.x-s.x,dy=m.y-s.y,d=Math.hypot(dx,dy),rs=m.r+s.r;
      if(d<rs&&d>1e-4){const nx=dx/d,ny=dy/d,vn=m.vx*nx+m.vy*ny;if(vn<0){m.vx-=2*vn*nx*0.8;m.vy-=2*vn*ny*0.8;
        const tx=-ny,ty=nx,vt=m.vx*tx+m.vy*ty;m.vx+=tx*Math.sign(vt||1)*1.2;m.vy+=ty*Math.sign(vt||1)*1.2;}
        m.x=s.x+nx*rs;m.y=s.y+ny*rs;if(!m.hitT||m.life-m.hitT>0.4){SND.stone(0.7,0.75);SND.splat(0.4);m.hitT=m.life;burstMud(m.x,m.y,m.z,5,1.5);}
        if(!m.hit){m.hit=true;m.hitDist=m.dist;ev('mud_deflect');}}}
    if(Wd[i]>0.35){SND.plop(1.2,0.8);burstDrops(m.x,m.y,surfAt(m.x,m.y),8,2);addSand(m.x,m.y,m.vol,1,1);muds.splice(k,1);finishMud(m);continue;}
    if(sp>0.6)notifyRoll(m);

  }
  let rum=0;for(const m of muds)if(m.st==='roll')rum=Math.max(rum,Math.min(1,Math.hypot(m.vx,m.vy)/5));LOOPV.rumble=rum;
}

// =====================================================================
//  path finding (A*, 8-neighbour) on the shared terrain

  if(St[j]>0.5&&!stair){if(!(mode&M_STONE))return -1;c+=2.5;}

const bridges=[],stairs=[];

  if(!inGrid(x,y))continue;const r=segDist(x+0.5,y+0.5,x0,y0,x1,y1);if(r[0]<0.72&&r[1]*L>0.25&&r[1]*L<L-0.25)out.push(y*GW+x);}return out;}

const WOODS=[[222,184,128],[196,146,92],[176,112,74],[210,160,106],[188,136,96]];

    if(w>0.006){const a=w<0.02?0.18+w*8:Math.min(0.86,0.32+w*0.8);const dd=w>1.1?1:w/1.1;
      let wr=118-78*dd,wg=160-76*dd,wb=162-60*dd;

function renderTerrain(){

function dollHit(x,y){for(const d of dolls){const p=proj(d.x,d.y,d.z);const H=Math.max(CS*3.1,30);if(Math.abs(x-p[0])<Math.max(24,H*0.3)&&y<p[1]+8&&y>p[1]-H)return d;}return null;}
function heldScreen(h){return[h.x,h.y-20];}
function holdTarget(h){const s=heldScreen(h);if(s[1]>L.trayTop+2)return null;return pickWorld(s[0],s[1]);}
function onDown(e){
  e.preventDefault();auUnlock();lastInput=NOW;cancelDemo();

  if(holds.size>=2||roundTrans){SND.tick();return;}
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const x=e.clientX,y=e.clientY;const h={id:e.pointerId,x,y,x0:x,y0:y,t0:NOW,moved:false,kind:null,obj:null,pourT:0};
  const I=UI.items;
  if(hitItem(I.dish,x,y)){h.kind='sand';h.wet=I.dish.wet>0.45;dishTap(x,y);}
  else if(hitItem(I.bucket,x,y)){h.kind='water';I.bucket.slosh=1;SND.slosh();}
  else if(hitItem(I.stones,x,y)){h.kind='stone';I.stones.clack=1;SND.stone(0.5,1.25);h.obj=null;}
  else if(hitItem(I.leaves,x,y)){h.kind='leaf';I.leaves.rustle=1;SND.rustle();}
  else if(UI.newTray.on&&UI.newTray.show>0.8&&Math.hypot(x-UI.newTray.x,y-UI.newTray.y)<Math.max(UI.newTray.r*1.1,46)){h.kind='newTray';SND.sand(0.4,1.2);}
  else{const f=UI.figs.find(f=>Math.hypot(x-f.x,y-f.y)<Math.max(f.r*1.1,30));
    if(f){h.kind='fig';h.obj=f;f.hop=8;f.sel=1;SND.chirp();}
    else if(spoutHit(x,y)){h.kind='spout';}
    else if(y<L.trayTop){
      const s=stoneAtScreen(x,y,26),l=leafAtScreen(x,y,26);
      if(l&&(!s||Math.hypot(proj(l.x,l.y,l.z)[0]-x,proj(l.x,l.y,l.z)[1]-y)<Math.hypot(proj(s.x,s.y,s.z)[0]-x,proj(s.x,s.y,s.z)[1]-y))){h.kind='leaf';h.obj=l;h.from=[l.x,l.y,l.st];
        if(l.dock){const d=l.dock,j=d.leaves.indexOf(l);if(j>=0)d.leaves.splice(j,1);l.dock=null;}l.st='held';l.claimed=null;kickLeaf(l,8);SND.leaf();}
      else if(s){h.kind='stone';h.obj=s;h.from=[s.x,s.y,s.z];if(s.stair)breakStairOf(s);s.st='held';SND.stone(0.4,1.3);stampStones();}
      else{const d=dollHit(x,y);
        if(d){h.kind='doll';d.hopV=7;d.lookAt(d.x,d.y+3,0.8);d.setAnim('cheer',0.5);SND.pop();}
        else{const p=pickWorld(x,y);
          if(p){const i=ci(p.x,p.y);
            if(Mo[i]>0.45&&Wd[i]<0.2&&Pk[i]<0.5){h.kind='wet';h.pt=p;burstMud(p.x,p.y,p.h+0.1,3,0.8);SND.splat(0.3);}
            else{h.kind='bg';const c=sandRGB(i);for(let k=0;k<4;k++)addP(P_GRAIN,p.x+rr(-0.4,0.4),p.y+rr(-0.4,0.4),p.h+0.05,rr(-0.6,0.6),rr(-0.6,0.6),rr(1.2,2.2),0.4,0.8,c[0],c[1],c[2]);
              if(Wd[i]>0.05){ripple(p.x,p.y,0.8);SND.plop(0.3,1.8);}else SND.tick();}}
          else{h.kind='bg';SND.tick();}}}}
    else{h.kind='bg';SND.tick();UI.trayWob=1;}}
  holds.set(e.pointerId,h);
}
function onMove(e){const h=holds.get(e.pointerId);if(!h)return;e.preventDefault();h.x=e.clientX;h.y=e.clientY;lastInput=NOW;
  if(!h.moved&&Math.hypot(h.x-h.x0,h.y-h.y0)>9){h.moved=true;

function releaseHold(h,cancel){
  holds.delete(h.id);if(castle.st===2&&!cancel&&(h.moved||h.kind==='spout'))prog.postCastle++;
  const t=holdTarget(h);const over=!!t&&!cancel;
  const zH=t?Math.max(t.h+2.6,7.2):7;
  switch(h.kind){

        else{addSand(t.x,t.y,1.1,1.25);burstGrains(t.x,t.y,t.h+0.3,10,1.8);SND.sand(0.9,1-Math.min(0.3,(zH-t.h)*0.03));useMat('sand',1.1);notifyImpact(t.x,t.y,'sand');}}break;}
    case 'water':break;
    case 'stone':{if(over){let s=h.obj;if(!s){s=newStone(t.x,t.y,zH);}else{s.x=t.x;s.y=t.y;s.z=zH;}s.st='air';s.vx=s.vy=s.vz=0;s.sunk=0;s.fall0=zH;s.inWater=false;useMat('stone');}
        else if(h.obj){const s=h.obj;s.x=h.from[0];s.y=h.from[1];s.z=h.from[2];s.st='rest';}break;}
    case 'leaf':{if(over){let l=h.obj;if(!l)l=newLeaf(t.x,t.y,zH);else{l.x=t.x;l.y=t.y;l.z=zH;}l.st='air';l.vz=0;l.vx=rr(-0.3,0.3);l.vy=rr(-0.3,0.3);l.boat=false;l.dist=0;l.stuck=0;l.dry=0;l.slide=0;l.inCastle=false;l.castleRun=false;l.ub={};useMat('leaf');SND.leaf();}
        else if(h.obj){const l=h.obj;l.x=h.from[0];l.y=h.from[1];l.st=h.from[2]==='docked'?'ground':h.from[2];if(l.st==='held')l.st='ground';}break;}
    case 'clump':{if(over){const m=newMud(t.x,t.y,zH,h.vol);m.fall0=zH;useMat('sand',0.5);ev('clump_drop',{elev:+(t.h-world.baseAvg).toFixed(1)});}
        else{const p=h.pt;addSand(p.x,p.y,h.vol,1.1,0.8);}break;}
    case 'wet':{const p=h.pt;if(p){addSand(p.x,p.y,0.05,0.8,0.7);SND.splat(0.4);}break;}
    case 'spout':{if(!h.moved&&!cancel){const sp=world.spout;sp.timer=40;SND.spoutOn();prog.spout=true;ev('spout_on',{s:+sp.s.toFixed(1)});useMat('water',0.5);}
        else if(h.moved){ev('spout_moved',{s:+world.spout.s.toFixed(1)});}break;}
    case 'fig':{const f=h.obj;f.held=false;if(h.moved&&over){stampFig(f,t);}break;}
    case 'newTray':{UI.newTray.held=false;if(h.moved&&over&&!cancel){startNextRound();}break;}
  }
}

function dishTap(x,y){
  const o=UI.items.dish;o.dent=1;o.dentX=clamp(x-o.x,-o.r*0.45,o.r*0.45);o.dentY=clamp(y-o.y,-o.r*0.3,o.r*0.15);
  // grains spill from the lip down the slope below the dish
  const lp=dishLip();const p=pickWorld(lp[0],lp[1])||pickWorld(o.x,L.trayTop-CS*2);
  if(p){const wet=o.wet>0.45;
    if(wet){const m=newMud(p.x,p.y,p.h+1.5,0.7);m.fall0=p.h+1.5;}
    else{addSand(p.x,p.y,0.95,1.0);const R=3.4;for(let yy=Math.floor(p.y-R);yy<=p.y+R;yy++)for(let xx=Math.floor(p.x-R);xx<=p.x+R;xx++){if(!inGrid(xx,yy))continue;const dd=Math.hypot(xx+0.5-p.x,yy+0.5-p.y);if(dd<R){const j=yy*GW+xx;Ds[j]=Math.max(Ds[j],0.75*(1-dd/R));}}
      burstGrains(p.x,p.y,p.h+1.6,16,1.6);}
    useMat('sand',0.6);ev('dish_tap',{x:+p.x.toFixed(1),y:+p.y.toFixed(1)});}
  SND.sand(0.8,1.1);
}

function updateHolds(dt){
  let pc=0,pf=1100;

      const zH=Math.max(t.h+2.6,7.2);if(Math.random()<0.9){const c=sandRGB(ci(t.x,t.y));for(let k=0;k<2;k++)addP(P_GRAIN,t.x+rr(-0.25,0.25),t.y+rr(-0.25,0.25),zH-0.6,rr(-0.3,0.3),rr(-0.3,0.3),rr(-2,0),1.2,rr(0.7,1.2),c[0]+20,c[1]+20,c[2]+16);}
      if(Math.random()<dt*7)SND.sand(0.35,1.2);if(Math.random()<dt*2)notifyImpact(t.x,t.y,'sand');}
    if(h.kind==='water'){
      const s=heldScreen(h);const dsh=UI.items.dish;
      if(Math.hypot(s[0]-dsh.x,(s[1]+30-dsh.y)*1.2)<dsh.r){dsh.wet=Math.min(1,dsh.wet+dt*0.9);pc++;if(dsh.wet>0.45&&!dsh.wetEv){dsh.wetEv=true;ev('dish_wet');}continue;}
      if(t){h.pourT+=dt;pc++;const rate=11;const R=1.1,cx=Math.floor(t.x),cy=Math.floor(t.y);let tot=0;const cells=[];
        for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){const X=cx+i,Y=cy+j;if(!inGrid(X,Y))continue;const dx=X+0.5-t.x,dy=Y+0.5-t.y,w=Math.exp(-(dx*dx+dy*dy)/(R*R));cells.push(Y*GW+X,w);tot+=w;}
        for(let k=0;k<cells.length;k+=2)Wd[cells[k]]+=rate*dt*cells[k+1]/tot;
        useMat('water',rate*dt);const zH=Math.max(t.h+2.6,7.2);pf=650+(zH-t.h)*70-Math.min(300,bil(Wd,t.x,t.y)*260);

        if(Math.random()<dt*4)ripple(t.x,t.y,rr(1,2));

        if(world.pond&&Math.hypot(t.x-world.pond[0],t.y-world.pond[1])<world.pond.r+0.5&&!h.pondEv){h.pondEv=true;ev('pour_into_hollow');}}}
  }

  // spout
  const sp=world.spout;if(sp){if(sp.timer>0){sp.timer-=dt;sp.flow=Math.min(1,sp.flow+dt*2);}else sp.flow=Math.max(0,sp.flow-dt*0.5);

      Wd[ci(tx,ty)]+=q*0.4;Wd[ci(tx+ox,ty+oy)]+=q*0.2;Wd[ci(tx-ox,ty-oy)]+=q*0.2;Wd[ci(tx-oy*0.9,ty-ox*0.9)]+=q*0.2;
      if(Math.random()<dt*6)ripple(tx,ty,1.2);if(Math.random()<0.5)addP(P_DROP,tx+rr(-0.3,0.3),ty+rr(-0.3,0.3),surfAt(tx,ty)+0.2,rr(-1,1),rr(-1,1),rr(1,3),0.4,0.8,180,210,218,0.8);}}
}

function wetSpot(){let best=null,bs=-1;for(let k=0;k<160;k++){const i=(Math.random()*GN)|0;if(Mo[i]>0.5&&Wd[i]<0.05&&Pk[i]<0.5){const x=i%GW+0.5,y=(i/GW|0)+0.5;const s=-Math.hypot(x-world.mt[0],y-world.mt[1]);if(s>bs){bs=s;best=[x,y];}}}return best;}
let wetCache=null,wetT=0;
function guideTarget(){
  if(roundTrans||castle.st===1)return null;
  if(castle.st===2){if(!prog.topPour)return 'bucket';if(UI.newTray.on)return 'newTray';return 'leaves';}
  if(!prog.used.sand)return 'dish';
  if(!prog.used.water)return 'bucket';
  if(!prog.used.stone)return 'stones';
  if(!prog.spout&&world.spout.flow<0.05)return 'spout';
  if(!prog.used.leaf)return 'leaves';
  if(!prog.bridges)return world.spout.flow>0.1?'stones':'spout';
  if(!prog.stoneInWater)return 'stones';
  if(!prog.leafBoat)return world.spout.flow>0.1?'leaves':'spout';
  if(!prog.mudball){if(NOW-wetT>2){wetT=NOW;wetCache=wetSpot();}if(wetCache)return 'wet';}
  return 'dish';
}
function guideScreenPos(g){
  const I=UI.items;if(I[g])return[I[g].x,I[g].y];
  if(g==='spout'){const G=spoutGeom();return G.p1;}
  if(g==='newTray')return[UI.newTray.x,UI.newTray.y];
  if(g==='wet'&&wetCache)return proj(wetCache[0],wetCache[1],groundAt(wetCache[0],wetCache[1]));
  return null;
}
let pointT=0;

  UI.guide=guideTarget();
  const idle=NOW-lastInput;
  if(!UI.demoShown&&idle>4&&holds.size===0&&!roundTrans&&castle.st!==1&&NOW>2){startDemo();}
  if(UI.demoShown&&idle>4.5&&UI.guide){pointT-=dt;if(pointT<=0){pointT=5;const sp=guideScreenPos(UI.guide);if(sp){let best=null,bd=1e9;
      for(const d of dolls){if(d.st==='build'||d.st==='work'||d.carry)continue;const p=proj(d.x,d.y,d.z);const dd=Math.hypot(p[0]-sp[0],p[1]-sp[1]);if(dd<bd){bd=dd;best=d;}}
      if(best){const p=proj(best.x,best.y,best.z);const vx=sp[0]-p[0],vy=sp[1]-(p[1]-30),l=Math.hypot(vx,vy)||1;best.pointDir=[vx/l,vy/l];best.setAnim('point',2.4);
        const w=pickWorld(clamp(sp[0],cam.X0+2,cam.X0+VA*CS-2),Math.min(sp[1],L.trayTop-6));if(w)best.lookAt(w.x,w.y,2.4);

  capsule(s*0.24,s*0.02,s*0.24+s*0.22*(1-grip*0.6),-s*0.16+grip*s*0.1,s*0.12,rgb(D[0],D[1],D[2]),rgb(W[0],W[1],W[2]));

  ctx.restore();
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const heavy=frameAvg>22;let t0=performance.now();
  if(!heavy||(simFrame&1))renderTerrain();
  let t1=performance.now();TIM.terr=TIM.terr*0.9+(t1-t0)*0.1;
  ctx.drawImage(TX.bg,0,0,SW,SH);
  drawWorld();let t2=performance.now();TIM.world=TIM.world*0.9+(t2-t1)*0.1;
  drawTray();drawHeld();drawDemo();TIM.tray=TIM.tray*0.9+(performance.now()-t2)*0.1;
}
function frame(t){
  requestAnimationFrame(frame);
  if(paused){lastT=t;return;}
  if(!lastT)lastT=t;let dt=(t-lastT)/1000;lastT=t;if(dt<=0)return;if(dt>0.05)dt=0.05;
  NOW+=dt;frameAvg=frameAvg*0.95+dt*1000*0.05;
  fpsN++;fpsT+=dt;if(fpsT>1){fps=fpsN/fpsT;fpsN=0;fpsT=0;}
  simAcc+=dt;let n=0;const tu=performance.now();while(simAcc>=1/60&&n<3){update(1/60);simAcc-=1/60;n++;}if(n>=3)simAcc=0;TIM.upd=TIM.upd*0.9+(performance.now()-tu)*0.1;
  try{auLoops();}catch(e){}
  render();
  // adapt terrain resolution on slow devices
  if(TR.avg>7.5&&(TR.drop||0)<3&&NOW>3){TR.drop=(TR.drop||0)+1;TR.avg=4;setupTerrainBuffer(true);ev('perf_drop',{ppc:TR.ppc});}
}
function setHidden(h){
  hiddenNow=h;paused=h;
  if(h){releaseAll();if(AU.ctx&&AU.ctx.state==='running'){try{AU.ctx.suspend();}catch(e){}}}
  else{lastT=0;if(AU.ctx&&AU.ok){try{const p=AU.ctx.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}}
}
document.addEventListener('visibilitychange',()=>setHidden(document.visibilityState==='hidden'));
window.addEventListener('pagehide',()=>setHidden(true));
window.addEventListener('pageshow',()=>{if(document.visibilityState!=='hidden')setHidden(false);});
let rzT=0;function onResize(){releaseAll();const oldPort=VPORT;layout();if(oldPort!==VPORT){ev('rotate',{portrait:VPORT});}rebuildFigs();}
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,60);});
window.addEventListener('orientationchange',()=>{clearTimeout(rzT);rzT=setTimeout(onResize,200);});

// =====================================================================
//  boot
// =====================================================================
function boot(){
  layout();
  let seed=((Date.now()%100000)+1)|0;try{const m=/[?&]seed=(\d+)/.exec(location.search);if(m)seed=(+m[1])||seed;}catch(e){}
  genWorld(seed,VPORT,computeDishPt());world.baseAvg=avgBase();
  spawnDolls();
  savedList=loadSaves();rebuildFigs();
  renderTerrain();render();
  requestAnimationFrame(frame);
}
// engineering hooks for automated checks (not part of the play UI)
window.__sb={get NOW(){return NOW;},EV,world,prog,castle,stones,leaves,dolls,bridges,muds,parts,UI,cam,L,TR,Hs,Wd,Mo,Pk,St,GW,GH,
  proj,pickWorld,findPath,groundAt,surfAt,get fps(){return fps;},get frameAvg(){return frameAvg;},holds,
  advance(sec){const n=Math.round(sec*60);for(let k=0;k<n;k++){NOW+=1/60;update(1/60);}render();},
  startCastle(){startCastle();},genWorld,spawnDolls,computeDishPt,
  TIM,Dr,get audio(){return AU.ctx?AU.ctx.state:'none';},get paused(){return paused;},flowAt(x,y){const i=ci(x,y);return Math.hypot(Vx[i],Vy[i])*Math.min(Wd[i],0.5);},get VPORT(){return VPORT;},get roundTrans(){return roundTrans;},loadSaves,savedList:()=>savedList};
boot();
})();
