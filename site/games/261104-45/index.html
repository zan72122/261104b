/* ---------------- ingredients ---------------- */
const ING={
  T:{c:'#d63b25',d:'#8f1f12',l:'#ff7a5c',p:[214,59,37]},
  C:{c:'#f4c33a',d:'#b9831a',l:'#fff0a0',p:[244,195,58]},
  G:{c:'#5aa83a',d:'#2f6a1f',l:'#a6e07a',p:[90,168,58]}
};
const INGS=['T','C','G'];

/* ---------------- dish rules ---------------- */
// layers: [[ing,amt],...] in pour order (consecutive same merged)
function normLayers(L){const o=[];for(const e of L){if(!e||e[1]<0.04)continue;if(o.length&&o[o.length-1][0]===e[0])o[o.length-1][1]+=e[1];else o.push([e[0],e[1]]);}return o;}
function methodOf(L){
  const s=normLayers(L);if(!s.length)return null;
  const seq=s.map(e=>e[0]);
  const uniq=[...new Set(seq)];
  if(uniq.length===1)return 'plain';
  if(seq[seq.length-1]==='C')return 'bake';
  if(seq[0]==='C')return 'swirl';
  return 'toss';
}
let dishSeed=1;
function makeDish(L){
  const s=normLayers(L);const m=methodOf(s);if(!m)return null;
  return {m,L:s.map(e=>[e[0],Math.round(e[1]*1000)/1000]),key:m+':'+s.map(e=>e[0]).join(''),seed:(dishSeed++*9973+Math.floor(Math.random()*1e5))>>>0,spr:null};
}
function splitDish(a,b){
  const A=a.m==='split'?a.parts[0]:a, B=b.m==='split'?b.parts[0]:b;
  if(A.key===B.key)return A;
  return {m:'split',parts:[A,B],key:'split:'+[A.key,B.key].sort().join('|'),seed:(dishSeed++*7919)>>>0,spr:null};
}
function dishHas(d,i){if(!d)return false;if(d.m==='split')return dishHas(d.parts[0],i)||dishHas(d.parts[1],i);return d.L.some(e=>e[0]===i);}
function dishMain(d){if(!d)return 'T';if(d.m==='split')d=d.parts[0];let best=d.L[0][0],ba=-1;for(const e of d.L){if(e[1]>=ba){ba=e[1];best=e[0];}}return best;}
function heatOf(d){if(!d)return 0;if(d.m==='split')return (heatOf(d.parts[0])+heatOf(d.parts[1]))/2;return d.m==='bake'?1:d.m==='toss'?0.65:d.m==='plain'?0.45:-0.7;}

/* ---------------- memory (device-local) ---------------- */
const SKEY='gf-261104-45-dish-v1';
let storeNote='';
function validDish(o){
  try{
    if(!o||typeof o!=='object'||o.v!==1)return null;
    const d=o.d;if(!d||typeof d!=='object'||typeof d.m!=='string')return null;
    if(!Array.isArray(d.L)||d.L.length<1||d.L.length>6)return null;
    const L=[];
    for(const e of d.L){
      if(!Array.isArray(e)||e.length!==2)return null;
      const i=e[0],a=e[1];
      if(INGS.indexOf(i)<0)return null;
      if(typeof a!=='number'||!isFinite(a)||a<=0||a>2)return null;
      L.push([i,a]);
    }
    const dish=makeDish(L);
    if(!dish||dish.m!==d.m)return null;
    return dish;
  }catch(e){return null;}
}
function loadSaved(){
  try{
    const s=window.localStorage.getItem(SKEY);
    if(s==null){storeNote='empty';return null;}
    let o=null;try{o=JSON.parse(s);}catch(e){o=null;}
    const d=validDish(o);
    if(!d){storeNote='invalid';try{window.localStorage.removeItem(SKEY);}catch(e){}return null;}
    storeNote='restored';return d;
  }catch(e){storeNote='blocked';return null;}
}
function saveDish(d){
  if(!d||d.m==='split')return;
  try{window.localStorage.setItem(SKEY,JSON.stringify({v:1,d:{m:d.m,L:d.L},t:Date.now()}));storeNote='saved';}
  catch(e){storeNote='save-failed';}
}

/* ---------------- audio (Web Audio synth) ---------------- */
const AU={ctx:null,out:null,nb:null,ok:false,muted:false,cont:{}};
function audioUnlock(){
  try{
    if(!AU.ctx){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const c=new AC();AU.ctx=c;

/* slot keys -> screen positions */
function slotPos(key){
  const K=LY.K,B=LY.B;

  const c=key.charCodeAt(key.length-1)-48;
  switch(key.slice(0,key.length-1)){
    case 'st':return K.st[c];
    case 'kside':return K.side[c];
    case 'kplate':return K.kplate[c];
    case 'kseat':return K.kseat[c];
    case 'wait':return K.wait[c];
    case 'kb':return K.bottle[c];
    case 'bplate':return B.bplate[c];
    case 'bseat':return B.bseat[c];
    case 'bside':return B.side[c];
    case 'bb':return B.bottle[c];
  }
  if(key==='bcenter')return B.center;
  if(key==='entry')return K.entry;
  if(key==='krob')return K.rob;
  if(key==='brob')return B.rob;
  if(key==='kgirl')return K.girl;
  if(key==='bgirl')return B.girl;
  if(key==='hold')return girlHold();
  if(key==='show')return {x:K.show.x,y:K.show.y+K.show.h*0.22};
  if(key.startsWith('gh:')){const g=guestById(+key.slice(3));if(g)return {x:g.x+(LY.O*16),y:g.y-LY.O*30};}
  if(key.startsWith('pos:')){const a=key.slice(4).split(',');return {x:+a[0],y:+a[1]};}

}

function walkTo(g,key,spd){const p=slotPos(key);const d=hyp(p.x-g.x,p.y-g.y);mvTo(g,key,clamp(d/((spd||170)*LY.O),0.5,3.5),0);}
function startCycle(first){

    const ing=leftoverFor(G.sample);const s=smallAtKey('kside2')||G.smalls[1];

/* ---------------- particles ---------------- */
function addPart(o){if(G.parts.length>=PMAX)return null;G.parts.push(o);return o;}
function burst(x,y,n,kind,col,spd){const O=LY.O;for(let i=0;i<n;i++){const a=rr(0,TAU),v=rr(0.3,1)*(spd||90)*O;addPart({k:kind||'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(kind==='heart'?40*O:0),life:rr(0.5,0.9),max:0.9,s:rr(0.6,1.2),c:col||'#fff6c0'});}}

/* =====================================================================
   robot: knot / steer / pour
   ===================================================================== */
function headFor(key){
  const O=LY.O,p=slotPos(key),b=R.base;
  const small=key.startsWith('bplate');
  const a=-clamp((p.x-b.x)/(220*O),-1,1)*0.28;
  return {x:p.x+Math.sin(a)*6*O,y:p.y-(small?62:72)*O,a};
}
function restHead(){const O=LY.O,b=R.base;return {x:b.x+34*O,y:b.y-(104+20*R.untie)*O,a:lerp(-0.62,-0.18,Math.max(R.untie*0.8,R.lookCam*0.8))};}
function robotGrabStart(end,x,y){
  R.grab={end,sx:x,sy:y,lx:x,ly:y,drag:false,t0:G.t,moved:0};R.dOwn=end;
  R.squashV+=7;R.lookCam=1;R.wob=1;
  if(end==='up'||end==='low'){SFX.squish();}
}
function robotGrabMove(x,y){
  const g=R.grab;if(!g)return;const O=LY.O;
  const idx=x-g.lx,idy=y-g.ly;g.lx=x;g.ly=y;g.moved+=hyp(idx,idy);
  const dx=x-g.sx,dy=y-g.sy;
  if(g.end==='up'||g.end==='low'){
    const U=(g.end==='up'?150:105)*O;
    const gain=(Math.max(0,-idy)+Math.abs(idx)*0.22)/U;
    if(gain>0&&R.st==='rest'){
      R.untie=clamp(R.untie+gain,0,1);
      const ms=Math.floor(R.untie*4);
      if(ms>R.milestone&&ms<4){R.milestone=ms;SFX.popSmall(ms/4);const k=R.geo&&R.geo.knot;if(k)ring(k.x,k.y,'#c8fbff',0.6);}
      if(R.untie>=1){fullUntie(g.end);return;}
    }
    let vx=dx*0.55,vy=dy*0.62;const l=hyp(vx,vy),mx=70*O;if(l>mx){const k=(mx+(l-mx)*0.15)/l;vx*=k;vy*=k;}
    R.dT.x=vx;R.dT.y=vy;
  }else if(g.end==='head'){
    if(!g.drag&&hyp(dx,dy)>40*O){g.drag=true;R.pour=false;}
    if(g.drag){let vx=dx*0.8,vy=dy*0.8;const l=hyp(vx,vy),mx=110*O;if(l>mx){vx*=mx/l;vy*=mx/l;}R.dT.x=vx;R.dT.y=vy;}
  }else if(g.end==='steer'){
    R.steerP=clamp(R.steerP+hyp(idx,idy)/(75*O),0,1);
    let vx=dx*0.6,vy=dy*0.6;const l=hyp(vx,vy),mx=44*O;if(l>mx){vx*=mx/l;vy*=mx/l;}R.dT.x=vx;R.dT.y=vy;
    if(R.steerP>=1){const k=steerChoice(dx,dy);if(k)turnTo(k);R.grab=null;R.dT.x=R.dT.y=0;}
  }
}
function robotGrabEnd(x,y,cancel){
  const g=R.grab;R.grab=null;R.dT.x=0;R.dT.y=0;R.pour=false;
  if(!g||cancel)return;
  const tap=g.moved<10*LY.sc&&G.t-g.t0<0.45;
  if((g.end==='up'||g.end==='low')&&R.st==='rest'){
    if(tap){R.untie=clamp(R.untie+0.12,0,1);SFX.popSmall(R.untie);const k=R.geo&&R.geo.knot;if(k)ring(k.x,k.y,'#c8fbff',0.5);if(R.untie>=1)fullUntie(g.end);}
  }else if(g.end==='steer'&&R.st==='at'){
    if(tap){R.steerP=clamp(R.steerP+0.34,0,1);SFX.tick(R.steerP);if(R.steerP>=1){const k=steerChoice(0,0);if(k)turnTo(k);}}
  }else if(g.end==='head'&&g.drag&&R.st==='at'){
    let best=null,bd=1e9;
    for(const k of robotTargets()){if(k===R.tgt)continue;const h=headFor(k);const d=hyp(h.x-x,h.y-y);const p=slotPos(k);const d2=hyp(p.x-x,p.y-y);const dd=Math.min(d,d2);if(dd<bd){bd=dd;best=k;}}
    if(best&&bd<110*LY.O)turnTo(best);
  }
}
function fullUntie(end){
  const k=R.geo&&R.geo.knot;
  SFX.pop();setTimeout(()=>SFX.wake(),120);
  if(k){burst(k.x,k.y,10,'spark','#d8fdff',120);ring(k.x,k.y,'#ffffff',1.2);}
  R.fromH=R.geo?{x:R.geo.hx,y:R.geo.hy,a:R.geo.ha}:restHead();
  R.st='rise';R.t=0;R.dur=0.75;R.tgt=end==='up'?farKey():nearKey();R.grab=null;R.dT.x=R.dT.y=0;R.steerP=0;R.steerLoop=1;R.idleT=0;R.rings=Math.min(6,R.rings+1);
  G.endUse[end==='up'?'up':'low']++;G.stats[end==='up'?'untieUp':'untieLow']++;
  logEv('untie '+end+' -> '+R.tgt);
  if(G.it&&(G.it.type==='up'||G.it.type==='low'))G.it.type='none';
}
function steerChoice(dx,dy){
  const cur=R.tgt;if(!cur)return null;const ns=neighbors(cur);const cp=slotPos(cur);
  if(hyp(dx,dy)<8*LY.O){
    // tap: prefer neighbor that needs filling, else ring order
    const want=ns.filter(k=>needsFill(plateAtKey(k)));
    if(want.length)return want[0];
    return ns[0];
  }
  let best=null,bs=-9;
  for(const k of ns){const p=slotPos(k);const vx=p.x-cp.x,vy=p.y-cp.y;const l=hyp(vx,vy)||1;const s=(vx*dx+vy*dy)/(l*hyp(dx,dy));if(s>bs){bs=s;best=k;}}
  return best;
}
function turnTo(k){
  R.fromH=R.geo?{x:R.geo.hx,y:R.geo.hy,a:R.geo.ha}:headFor(R.tgt||k);
  R.prevTgt=R.tgt;R.tgt=k;R.st='turn';R.t=0;R.dur=0.6;R.steerP=0;R.steerLoop=0;R.idleT=0;R.pour=false;
  SFX.popSmall(0.9);SFX.whoosh();G.stats.steer++;logEv('steer -> '+k);
  const s=R.geo&&R.geo.steer;if(s)ring(s.x,s.y,'#c8fbff',0.7);
}
function retie(){
  R.fromH=R.geo?{x:R.geo.hx,y:R.geo.hy,a:R.geo.ha}:restHead();
  R.st='retie';R.t=0;R.dur=1.0;R.pour=false;R.grab=null;R.dT.x=R.dT.y=0;SFX.retie();
}
function selectBottle(b){
  if(G.sel===b.i){b.hop=1;SFX.glass(b.i);return;}
  G.sel=b.i;b.hop=1;SFX.glass(b.i);setTimeout(()=>SFX.gulp(),140);
  logEv('bottle '+b.ing);
}
function updateRobot(dt){
  const O=LY.O;
  mvUpd(R.base,dt);
  // springs
  R.squashV+=(-R.squash*160-R.squashV*9)*dt;R.squash+=R.squashV*dt;
  R.dv.x+=((R.dT.x-R.disp.x)*150-R.dv.x*11)*dt;R.dv.y+=((R.dT.y-R.disp.y)*150-R.dv.y*11)*dt;
  R.disp.x+=R.dv.x*dt;R.disp.y+=R.dv.y*dt;
  R.lookCam=Math.max(0,R.lookCam-dt*0.6);R.wob=Math.max(0,R.wob-dt*2);
  if(R.st==='rise'||R.st==='turn'||R.st==='retie'){
    R.t+=dt;
    if(R.t>=R.dur){
      if(R.st==='retie'){R.st='rest';R.tgt=null;R.untie=0;R.milestone=0;R.steerP=0;}
      else {R.st='at';R.idleT=0;if(R.steerLoop<1)R.steerLoop=0.01;}
    }
  }
  if(R.st==='at'){
    if(R.steerLoop<1)R.steerLoop=Math.min(1,R.steerLoop+dt*1.4);
    const p=plateAtKey(R.tgt);
    const ok=p&&pourable(p);
    if(!ok&&!R.grab){R.idleT+=dt;if(R.idleT>2.6&&G.phase!=='tf')retie();}else R.idleT=0;
  }
  R.pour=!!(R.grab&&R.grab.end==='head'&&!R.grab.drag&&R.st==='at');
  // face
  if(R.st==='rest')R.face=R.grab&&hyp(R.disp.x,R.disp.y)>18*O?'strain':'sad';
  else if(R.st==='rise'||R.st==='turn')R.face='spark';
  else if(R.st==='retie')R.face='calm';
  else{const p=plateAtKey(R.tgt);R.face=R.pour&&p&&pourable(p)?(R.emptyT>0.15?'puzzle':'focus'):(p&&pourable(p)?'happy':'puzzle');}
  computeRobotGeo();
}
function computeRobotGeo(){
  const O=LY.O,b=R.base;
  let h;
  if(R.st==='rest'){const r=restHead();h={x:r.x,y:r.y,a:r.a};if(R.dOwn==='up'||R.dOwn==='head'){h.x+=R.disp.x;h.y+=R.disp.y;}}
  else if(R.st==='rise'){const t=R.t/R.dur,to=headFor(R.tgt);const e=eob(t);h={x:lerp(R.fromH.x,to.x,e),y:lerp(R.fromH.y,to.y,e),a:lerp(R.fromH.a,to.a,clamp(t*1.3,0,1))};}
  else if(R.st==='turn'){const t=R.t/R.dur,to=headFor(R.tgt);const e=eio(t);h={x:lerp(R.fromH.x,to.x,e),y:lerp(R.fromH.y,to.y,e)-Math.sin(t*Math.PI)*36*O,a:lerp(R.fromH.a,to.a,e)};}
  else if(R.st==='retie'){const t=R.t/R.dur,to=restHead();const e=eio(t);h={x:lerp(R.fromH.x,to.x,e),y:lerp(R.fromH.y,to.y,e)-Math.sin(t*Math.PI)*24*O,a:lerp(R.fromH.a,to.a,e)};}
  else{const to=headFor(R.tgt);h={x:to.x,y:to.y+Math.sin(G.t*2.2)*2*O+R.sag*O,a:to.a+Math.sin(G.t*1.7)*0.03};
    if(R.dOwn==='head'||R.dOwn==='up'){h.x+=R.disp.x;h.y+=R.disp.y;}}
  h.x+=R.ghost.x;h.y+=R.ghost.y;
  if(G.hint&&(G.hint.k==='up'||G.hint.k==='press')&&!R.grab){h.y-=Math.abs(Math.sin(G.t*4.2))*5*O;}
  // knot radii
  const r0=27*O,rs0=11*O;let kr=0,sr=0;
  if(R.st==='rest')kr=r0*(1-0.72*R.untie);
  else if(R.st==='rise'){const t=R.t/R.dur;kr=r0*(1-0.72*R.untie)*(1-eo(clamp(t*1.6,0,1)));sr=rs0*sm(t);}
  else if(R.st==='at')sr=rs0*R.steerLoop*(1-0.6*R.steerP);
  else if(R.st==='turn')sr=rs0*R.steerLoop;
  else if(R.st==='retie'){const t=R.t/R.dur;kr=r0*eo(t);sr=rs0*(1-t);}
  kr*=1+Math.sin(G.t*3)*0.03;
  // squash about base
  const sq=clamp(R.squash,-0.4,0.6),sx=1+0.1*sq,sy=1-0.18*sq;
  const T=(x,y)=>({x:b.x+(x-b.x)*sx,y:b.y+(y-b.y)*sy});
  const hp=T(h.x,h.y);
  const ux=Math.sin(h.a),uy=-Math.cos(h.a);
  const P0={x:b.x,y:b.y-16*O};
  const P3={x:hp.x+ux*25*O,y:hp.y+uy*25*O};
  const d=hyp(P3.x-P0.x,P3.y-P0.y);
  const k1=0.42*d+24*O,k2=Math.min(0.32*d,52*O)+12*O;
  const P1={x:P0.x+(P3.x-P0.x)*0.12,y:P0.y-k1};
  const P2={x:P3.x+ux*k2,y:P3.y+uy*k2};
  // sample bezier
  const N=36,sp=[],ls=[0];
  for(let i=0;i<=N;i++){const t=i/N,mt=1-t;const x=mt*mt*mt*P0.x+3*mt*mt*t*P1.x+3*mt*t*t*P2.x+t*t*t*P3.x;const y=mt*mt*mt*P0.y+3*mt*mt*t*P1.y+3*mt*t*t*P2.y+t*t*t*P3.y;sp.push({x,y});if(i)ls.push(ls[i-1]+hyp(x-sp[i-1].x,y-sp[i-1].y));}
  const Lt=ls[N];
  const loops=[];
  const lowDisp=(R.dOwn==='low'&&R.st==='rest')?R.disp:{x:0,y:0};
  if(kr>0.6)loops.push({s:Math.min(34*O,Lt*0.32),r:kr,d:kr*0.9,side:1,disp:lowDisp,main:true});
  const stDisp=(R.dOwn==='steer')?R.disp:{x:0,y:0};
  if(sr>0.6)loops.push({s:Lt*0.6,r:sr,d:sr*0.9,side:-1,disp:stDisp,main:false});
  const pts=[],overs=[];let li=0,i=0;let lobe=null,knot=null,steer=null;
  while(i<=N){
    const L0=loops[li];
    if(L0&&ls[i]>=L0.s){
      // interpolate entry point
      const j=Math.max(1,i);const f=clamp((L0.s-ls[j-1])/((ls[j]-ls[j-1])||1),0,1);
      const qa={x:lerp(sp[j-1].x,sp[j].x,f),y:lerp(sp[j-1].y,sp[j].y,f)};
      const tx0=sp[j].x-sp[j-1].x,ty0=sp[j].y-sp[j-1].y,tl=hyp(tx0,ty0)||1;const tx=tx0/tl,ty=ty0/tl;
      const nx=-ty*L0.side,ny=tx*L0.side;
      const M=22,st=pts.length;
      for(let m=0;m<=M;m++){
        const th=m/M*TAU;const fw=L0.d*th/TAU+L0.r*Math.sin(th);const nn=L0.r*(1-Math.cos(th));
        const w=Math.pow(Math.sin(th/2),2);
        pts.push({x:qa.x+tx*fw+nx*nn+L0.disp.x*w,y:qa.y+ty*fw+ny*nn+L0.disp.y*w});
      }
      overs.push([st,st+Math.round(M*0.3)]);
      const top=pts[st+M/2];
      if(L0.main){lobe={x:top.x,y:top.y};knot={x:qa.x+nx*L0.r*0.9,y:qa.y+ny*L0.r*0.9};}
      else steer={x:qa.x+nx*L0.r,y:qa.y+ny*L0.r};
      // skip spine points within drift
      const endS=L0.s+L0.d;while(i<=N&&ls[i]<endS)i++;
      li++;continue;
    }
    pts.push(sp[i]);i++;
  }
  if(!steer){const j=Math.round(N*0.6);steer={x:sp[j].x,y:sp[j].y};}
  if(!lobe){const j=Math.round(N*0.2);lobe={x:sp[j].x+20*O,y:sp[j].y};knot={x:sp[j].x,y:sp[j].y};}
  // arc top (for grabbing the upper strand)
  let arc=sp[Math.round(N*0.75)];
  R.geo={pts,overs,hx:hp.x,hy:hp.y,ha:h.a,head:{x:hp.x,y:hp.y},lobe,knot,steer,arc,P0,
    nozzle:{x:hp.x-Math.sin(h.a)*35*O,y:hp.y+Math.cos(h.a)*35*O},sx,sy};
}
function updatePour(dt){
  const O=LY.O;
  const p=R.st==='at'?plateAtKey(R.tgt):null;
  const b=G.sel>=0?G.bottles[G.sel]:null;
  let flowing=false;
  for(const bb of G.bottles){if(!(R.pour&&bb===b))bb.lvl=Math.min(CAPB,bb.lvl+REFILL*dt);}
  if(R.pour){
    R.pressT=(R.pressT||0)+dt;
    if(p&&pourable(p)&&b&&b.lvl>0.004){
      const f=Math.min(FLOW*dt,b.lvl);b.lvl-=f;b.flowT=G.t;flowing=true;R.emptyT=0;
      if(rawTotal(p)<0.01&&!p.counted){p.counted=true;G.platesStarted++;for(const sm of G.smalls)sm.hintable=false;if(G.phase==='kitchen')G.cyclePlates=(G.cyclePlates||0)+1;else G.bPlates=(G.bPlates||0)+1;}
      const cap=capOf(p),tot=rawTotal(p);
      const into=Math.max(0,Math.min(f,cap-tot)),over=f-into;
      addRaw(p,b.ing,into);p.pourT=G.t;
      if(over>0)doOverflow(p,b.ing,over);
      // stream particles
      const nz=R.geo.nozzle;
      if(Math.random()<0.9)for(let k=0;k<2;k++)addPart({k:'drop',x:nz.x+rr(-3,3)*O,y:nz.y,vx:rr(-8,8)*O,vy:rr(40,90)*O,life:2,max:2,ty:p.y-(10+pileH(p))*O*0.9,c:ING[b.ing].c,cd:ING[b.ing].d,s:rr(0.7,1.2),ing:b.ing});
      R.sag=lerp(R.sag,4,dt*4);
      if(!R.pourSnd){R.pourSnd=true;G.stats.pours++;}
      const fill=clamp((tot+f)/cap,0,1.3);
      setCont('pour','noise',true,380+fill*900,0.16);
      setCont('pourT','osc',true,180+fill*320+(b.lvl/CAPB)*60,0.05);
      if(Math.random()<dt*7)SFX.plop(fill);
      if(b.lvl<=0.004){SFX.sputter();burst(nz.x,nz.y,4,'puff','#ffffff',40);}
    }else{
      R.emptyT+=dt;
      if(G.t-R.puffT>0.45){R.puffT=G.t;const nz=R.geo.nozzle;addPart({k:'puff',x:nz.x,y:nz.y+4*O,vx:0,vy:20*O,life:0.5,max:0.5,s:0.6,c:'#ffffff'});SFX.puff();}
    }
  }else{R.pressT=0;R.emptyT=0;R.pourSnd=false;}
  if(!flowing){setCont('pour','noise',false);setCont('pourT','osc',false);R.sag=lerp(R.sag,0,dt*5);}
}
function pileH(p){return clamp(rawTotal(p)/capOf(p),0,1.3)*20;}
function sideSlotFor(p){
  if(p.key.startsWith('st')){const s=smallAtKey('kside'+p.key.slice(-1));return s;}
  let best=null,bd=170*LY.O;for(const s of G.smalls){if(s.state!=='idle')continue;const d=hyp(s.x-p.x,s.y-p.y);if(d<bd){bd=d;best=s;}}return best;
}
function doOverflow(p,ing,a){
  const O=LY.O;const s=sideSlotFor(p);
  G.overT=G.t;
  if(s&&rawTotal(s)<capOf(s)&&!s.dish){
    const take=Math.min(a,capOf(s)-rawTotal(s));addRaw(s,ing,take);s.hintable=true;s.pourT=G.t;
    if(Math.random()<0.7)addPart({k:'roll',x:p.x+(s.x>p.x?1:-1)*30*O,y:p.y-8*O,tx:s.x,ty:s.y-6*O,t:0,life:0.6,max:0.6,c:ING[ing].c,s:rr(0.7,1)});
    if(!G.ovSnd||G.t-G.ovSnd>0.8){G.ovSnd=G.t;SFX.overflow();G.stats.overflow++;logEv('overflow -> small '+s.key);}
  }else{
    const dir=s?(s.x>p.x?1:-1):(p.x<W/2?-1:1);
    const gy=p.key.startsWith('st')&&slotPos(p.key).foot?slotPos(p.key).foot:p.y+30*O;
    if(Math.random()<0.6)addPart({k:'roll',x:p.x+dir*30*O,y:p.y-6*O,tx:p.x+dir*rr(40,70)*O,ty:gy,t:0,life:0.7,max:0.7,c:ING[ing].c,s:rr(0.7,1),spill:1});
    if(!G.spSnd||G.t-G.spSnd>0.9){G.spSnd=G.t;SFX.spill();G.stats.spill++;logEv('overflow -> spill');}
  }
}

/* =====================================================================
   plates: cooking trigger, steam, sinking
   ===================================================================== */
function updatePlates(dt){
  const O=LY.O;
  for(const p of G.plates.concat(G.smalls)){
    if(p.state!=='drag')mvUpd(p,dt);
    if(p.state==='toHomeE'&&mvDone(p))p.state='idle';
    const tgt=(rawTotal(p)/capOf(p))*5+(p.dish?p.portion*4:0);
    p.sinkV+=((tgt-p.sink)*90-p.sinkV*8)*dt;p.sink+=p.sinkV*dt;
    p.wob=Math.max(0,p.wob-dt*2.2);p.pop=Math.max(0,p.pop-dt*2.5);
    if(p.fresh>0)p.fresh=Math.max(0,p.fresh-dt/40);
    if(p.kind!=='small'&&p.state==='idle'&&!p.dish&&mvDone(p)&&rawTotal(p)>=capOf(p)-0.005&&G.t-p.pourT>0.5&&!(R.pour&&R.tgt===p.key)&&(G.phase==='kitchen'||G.phase==='banquet')){
      p.state='queued';GL.queue.push(p);logEv('queue cook '+p.key+' '+p.raw.map(e=>e[0]).join(''));
    }
    // steam
    if(p.dish&&p.portion>0.02&&p.state!=='drag'){
      const ht=heatOf(p.dish);const rate=Math.abs(ht)*Math.min(1,p.portion)*(0.25+0.75*p.fresh)*8;
      p.steamAcc+=rate*dt;
      while(p.steamAcc>1){p.steamAcc-=1;
        if(ht>0)addPart({k:'steam',x:p.x+rr(-18,18)*O,y:p.y-18*O-p.portion*8*O,vx:rr(-6,6)*O,vy:-rr(22,38)*O,life:rr(1.2,2),max:2,s:rr(0.6,1)*(0.6+0.5*p.portion),c:'#fff'});
        else addPart({k:'mist',x:p.x+rr(-22,22)*O,y:p.y-10*O,vx:rr(-14,14)*O,vy:rr(6,16)*O,life:rr(1,1.6),max:1.6,s:rr(0.5,0.9),c:'#dff4ff'});
      }
    }
    if(p.alpha<1&&!p.dying)p.alpha=Math.min(1,p.alpha+dt*2);
    if(p.dying){p.alpha-=dt*1.6;}
  }
  G.plates=G.plates.filter(p=>!(p.dying&&p.alpha<=0));
}

/* =====================================================================
   girl: cooking & reactions
   ===================================================================== */
function girlHold(){return {x:GL.x+36*LY.O,y:GL.y-46*LY.O};}
function updateGirl(dt){
  const O=LY.O;
  mvUpd(GL,dt);GL.wob=Math.max(0,GL.wob-dt*2);GL.cheer=Math.max(0,GL.cheer-dt);
  if(!GL.task&&GL.queue.length&&(G.phase==='kitchen'||G.phase==='banquet')){
    const p=GL.queue.shift();
    if(p&&p.state==='queued'&&!p.dish){
      p.home=p.key;p.state='toGirl';mvTo(p,'hold',0.55,34);
      GL.task={type:'cook',p,t:0,ph:0,m:methodOf(p.raw)};SFX.whoosh();
    }else if(p&&p.state==='queued')p.state='idle';
  }
  const tk=GL.task;
  if(tk){
    tk.t+=dt;
    if(tk.type==='cook'){
      const p=tk.p;
      if(tk.ph===0){if(mvDone(p)){tk.ph=1;tk.t=0;cookSound(tk.m);}}
      else if(tk.ph===1){
        cookFx(tk,p,dt);
        if(tk.t>=2.5){
          const tot=rawTotal(p);const d=makeDish(p.raw);
          p.dish=d;p.portion=clamp(tot,0.3,1.2);p.raw=[];p.fresh=1;p.exchanged=false;p.counted=false;p.pop=1;
          G.lastDish=d;saveDish(d);G.stats.dishes++;
          SFX.success();burst(p.x,p.y-20*O,14,'spark','#fff3b0',130);ring(p.x,p.y-10*O,'#fff6cc',1.6);
          logEv('dish '+d.key+' at '+p.home);
          tk.ph=2;tk.t=0;p.state='toHome';mvTo(p,p.home,0.55,30);GL.cheer=1;
        }
      }else if(tk.ph===2){
        if(mvDone(p)){p.state='idle';GL.task=null;onDishDone(p);}
      }
    }else if(tk.type==='wave'){
      if(tk.t>1.4)GL.task=null;
    }
  }
  // expression & gaze
  if(tk&&tk.type==='cook'){const hp=girlHold();GL.gaze={x:hp.x,y:hp.y};GL.expr=tk.ph===1?(tk.m==='swirl'&&tk.t>1.6?'cold':'focus'):'wow';GL.peek=lerp(GL.peek,0,dt*5);}
  else if(tk&&tk.type==='wave'){GL.expr='happy';}
  else{
    GL.expr=GL.cheer>0?'happy':'smile';
    let tp=null;
    if(G.hint)tp={x:G.hint.x,y:G.hint.y};
    if(R.st==='at'){const p=plateAtKey(R.tgt);if(p&&pourable(p))tp={x:p.x,y:p.y-10*O};}
    if(tp){GL.gaze=tp;const dx=tp.x-GL.x;GL.peek=lerp(GL.peek,clamp(dx/(260*O),-1,1),dt*3);}
    else GL.peek=lerp(GL.peek,0,dt*3);
    if(R.st==='at'){const p=plateAtKey(R.tgt);if(p&&pourable(p)&&rawTotal(p)<0.02)GL.expr='peek';}
  }
}
function cookSound(m){
  if(m==='bake'){SFX.sizzle();SFX.flame();}
  else if(m==='swirl'){SFX.stir();setTimeout(()=>SFX.cold(),1700);}
  else if(m==='toss'){setTimeout(()=>SFX.flip(),350);setTimeout(()=>SFX.flip(),1250);}
  else SFX.twirl();
}
function cookFx(tk,p,dt){

  }else if(tk.m==='swirl'){

  }else if(tk.m==='toss'){
    const ph=(tk.t%0.9)/0.9;if(ph<0.06&&Math.random()<0.5)for(let i=0;i<3;i++){const L=p.raw[Math.floor(Math.random()*p.raw.length)];if(L)addPart({k:'crumb',x:hp.x+rr(-12,12)*O,y:hp.y-16*O,vx:rr(-40,40)*O,vy:-rr(90,140)*O,life:0.8,max:0.8,s:rr(0.8,1.2),c:ING[L[0]].c});}
  }else{
    if(Math.random()<dt*6)addPart({k:'spark',x:hp.x+rr(-24,24)*O,y:hp.y-rr(6,26)*O,vx:0,vy:-10*O,life:0.5,max:0.5,s:0.6,c:'#fff6c0'});
  }
}
function onDishDone(p){
  G.lastPlateKey=p.key;
  if(G.phase==='kitchen'){
    G.cycleDishes++;const i=G.cycleDishes-1;if(i<3)G.lampFlash[i]=1;
    GL.task={type:'wave',t:0};SFX.bell();
    if(G.cycleDishes>=3){G.pendingTF=true;}
    callGuest();
  }
}
function callGuest(){
  if(G.phase!=='kitchen')return;
  const active=G.guests.filter(g=>g.state!=='leave');
  const waiting=active.filter(g=>(g.state==='enter'||g.state==='wait')&&!g.plate);
  if(waiting.length||active.length>=3)return;
  const used=active.map(g=>g.key);const spot=used.indexOf('wait0')<0?'wait0':'wait1';
  const g=newGuest('entry');walkTo(g,spot);g.state='enter';SFX.door();logEv('guest enters');

/* =====================================================================
   guests: seating, eating, exchange, toast
   ===================================================================== */
function chooseKSeat(){
  const occ=[0,1,2].map(i=>G.guests.some(g=>g.seat===i&&g.sp==='K'&&g.state!=='leave'));
  const free=[0,1,2].filter(i=>!occ[i]);if(!free.length)return -1;
  const adj=free.filter(i=>occ[i-1]||occ[i+1]);
  const a=adj.length?adj:free;return a[Math.floor(Math.random()*a.length)];
}
function emptyAdjSeat(g){if(g.sp!=='K')return false;const s=g.seat;return [s-1,s+1].some(i=>i>=0&&i<3&&!G.guests.some(o=>o!==g&&o.seat===i&&o.sp==='K'&&o.state!=='leave'));}
function serveTo(g,p){
  const seat=chooseKSeat();
  p.owner=g.id;g.plate=p.id;p.state='carried';mvTo(p,'gh:'+g.id,0.25);
  g.seat=seat<0?0:seat;g.sp='K';g.state='toSeat';walkTo(g,'kseat'+g.seat,150);
  SFX.serve();G.stats.serve++;
  if(g.want&&dishHas(p.dish,g.want)){g.delight=1.6;SFX.delight();burst(g.x,g.y-60*LY.O,8,'heart','#ff7d8f',70);G.stats.delight++;logEv('order matched '+g.want);}
  else{g.delight=0.6;SFX.yum();}
  g.want=null;logEv('serve '+p.dish.key+' -> seat '+g.seat);
}
function mergeInto(tp,p){
  const O=LY.O;
  if(tp.dish&&tp.portion>0){tp.dish=splitDish(tp.dish,p.dish);tp.portion=Math.min(1.3,tp.portion+p.portion*0.6);}
  else{tp.dish=p.dish;tp.portion=p.portion;tp.exchanged=false;}
  tp.pop=1;tp.fresh=Math.max(tp.fresh,p.fresh);
  p.dish=null;p.portion=0;p.raw=[];
  ring(tp.x,tp.y-10*O,'#fff6cc',1.1);SFX.serve();SFX.yum();
  logEv('merge into '+tp.key);
}
function updateGuests(dt){
  const O=LY.O;
  for(const g of G.guests){
    const arrived=mvUpd(g,dt);
    g.wob=Math.max(0,g.wob-dt*2);g.raise=Math.max(0,g.raise-dt*1.2);g.delight=Math.max(0,g.delight-dt*0.8);g.chew=Math.max(0,g.chew-dt);
    g.walk=g.md>0&&g.mt<g.md?g.walk+dt*9:0;g.waveT=Math.max(0,g.waveT-dt);
    if(g.state==='enter'&&arrived){g.state='wait';SFX.door();}
    else if(g.state==='toSeat'&&arrived){g.state='sit';g.sitT=0;const p=plateById(g.plate);if(p){p.state='idle';p.home='kplate'+g.seat;mvTo(p,'kplate'+g.seat,0.3,10);SFX.plop(0.3);}}
    else if(g.state==='toB'&&arrived){g.state='sit';g.sitT=0;}
    else if(g.state==='leave'&&arrived){g.gone=true;}
    if(g.state==='sit'){
      g.sitT+=dt;
      const p=plateById(g.plate);
      if(p&&p.dish&&p.portion>0&&p.state==='idle'&&!p.busy&&mvDone(p)&&g.sitT>0.6){
        const pause=G.phase==='kitchen'&&!p.exchanged&&p.portion<=0.5&&emptyAdjSeat(g)&&G.cycleDishes<3;
        if(!pause){
          g.bite-=dt;
          if(g.bite<=0){
            g.bite=rr(0.85,1.3);const a=Math.min(p.portion,0.075);p.portion-=a;g.ate+=a;if(G.phase==='banquet')g.ateB+=a;g.chew=0.5;SFX.munch();
            const c=p.dish.m==='split'?p.dish.parts[Math.random()<0.5?0:1]:p.dish;const ing=c.L[Math.floor(Math.random()*c.L.length)][0];
            for(let k=0;k<2;k++)addPart({k:'crumb',x:p.x+rr(-10,10)*O,y:p.y-10*O,vx:rr(-30,30)*O,vy:-rr(30,70)*O,life:0.5,max:0.5,s:rr(0.5,0.9),c:ING[ing].c});
            if(p.portion<=0.0005)plateEaten(g,p);
          }
        }
      }
    }
    if(g.state==='wait'&&g.want)g.point=Math.min(1,g.point+dt*2);else g.point=Math.max(0,g.point-dt*2);
    if(G.phase==='banquet'&&g.ateB>=0.5)g.full=Math.min(1,g.full+dt);
  }
  G.guests=G.guests.filter(g=>!g.gone);
}
function plateEaten(g,p){
  const O=LY.O;
  p.portion=0;p.dish=null;p.exchanged=false;g.delight=0.8;SFX.plop(0.5);
  logEv('eaten seat '+g.seat+' ('+g.sp+')');
  if(G.phase==='kitchen'&&p.kind==='main'){
    g.plate=null;p.owner=null;p.state='toHomeE';p.home=p.homeSt;mvTo(p,p.homeSt,0.8,50);
  }
}
function pairList(){return G.phase==='kitchen'?[[0,1],[1,2]]:G.phase==='banquet'?[[0,1],[1,2],[2,3],[3,4]]:[];}
function checkPairs(){
  for(const [a,b] of pairList()){
    const ga=seatGuest(a),gb=seatGuest(b);if(!ga||!gb||ga.sitT<0.9||gb.sitT<0.9)continue;
    const pa=plateById(ga.plate),pb=plateById(gb.plate);
    if(!pa||!pb||!pa.dish||!pb.dish||pa.busy||pb.busy||pa.state!=='idle'||pb.state!=='idle'||!mvDone(pa)||!mvDone(pb))continue;
    if(pa.portion<0.2||pb.portion<0.2)continue;
    if(pa.dish.key!==pb.dish.key){
      if(!pa.exchanged&&!pb.exchanged){pa.busy=pb.busy=true;G.fx.push({k:'exch',a:pa,b:pb,ga,gb,t:0,dur:1.15,da:pa.dish,db:pb.dish});ga.raise=1;gb.raise=1;SFX.swap();logEv('exchange '+pa.dish.key+' <-> '+pb.dish.key);}
    }else{
      if(pa.exchanged&&pb.exchanged)continue;
      const tk=[pa.dish.seed,pb.dish.seed].sort().join('-');
      if(!G.toasted[tk]){G.toasted[tk]=1;G.fx.push({k:'toast',ga,gb,t:0,dur:1.0});ga.raise=1.2;gb.raise=1.2;G.stats.toast++;logEv('toast same '+pa.dish.key);}
    }
  }
}
function updateFx(dt){
  const O=LY.O;
  for(const f of G.fx){
    f.t+=dt;
    if(f.k==='exch'&&f.t>=f.dur&&!f.done){
      f.done=true;const A=f.a,B=f.b;
      A.dish=splitDish(f.da,f.db);B.dish=splitDish(f.db,f.da);A.exchanged=B.exchanged=true;A.busy=B.busy=false;A.pop=B.pop=1;
      f.ga.delight=1;f.gb.delight=1;SFX.yum();burst((A.x+B.x)/2,(A.y+B.y)/2-30*O,6,'heart','#ff8fa0',60);G.stats.exch++;
    }
    if(f.k==='toast'&&f.t>=f.dur*0.45&&!f.clinked){f.clinked=true;SFX.clink();const x=(f.ga.x+f.gb.x)/2,y=Math.min(f.ga.y,f.gb.y)-70*O;burst(x,y,8,'spark','#fff8d0',70);ring(x,y,'#ffffff',0.9);f.ga.delight=0.8;f.gb.delight=0.8;}
    if(f.k==='share'&&f.t>=f.dur&&!f.done){f.done=true;finishShare(f);}

  }

}
/* banquet: share the center dish with everyone */
function startShare(p){
  if(!p.dish||p.portion<0.05||p.busy)return;
  p.busy=true;const each=p.portion/5;
  G.fx.push({k:'share',p,t:0,dur:1.0,each,dish:p.dish});SFX.whoosh();G.stats.share++;logEv('share center '+p.dish.key);
}
function finishShare(f){
  const O=LY.O,p=f.p;
  for(let i=0;i<5;i++){
    const sp=plateAtKey('bplate'+i);const g=seatGuest(i);
    if(sp&&sp.dish&&sp.portion>0){sp.dish=splitDish(sp.dish,f.dish);sp.portion+=f.each;sp.pop=1;}
    else if(sp&&!sp.dish&&rawTotal(sp)<0.01){sp.dish=f.dish;sp.portion=f.each;sp.pop=1;sp.fresh=p.fresh;sp.exchanged=true;}
    else if(g){g.ateB+=f.each;g.ate+=f.each;g.chew=0.8;}
  }

/* =====================================================================
   phases: transform -> banquet -> finale -> fold -> next cycle
   ===================================================================== */
function cancelInteraction(){if(G.it)endInteraction(G.it.x,G.it.y,true);}
function startTransform(){
  cancelInteraction();
  G.phase='tf';G.phT=0;G.stats.tf++;SFX.fanfare();SFX.rumble();logEv('transform start');
  for(let i=0;i<3;i++)G.lampFlash[i]=1;
  const seats=shuffle([0,1,2,3,4]);
  const active=G.guests.filter(g=>g.state!=='leave');
  const third=G.plates.find(p=>p.key===G.lastPlateKey&&p.dish)||G.plates.filter(p=>p.dish&&p.key.startsWith('st'))[0];
  const freePlates=G.plates.filter(p=>p!==third&&!p.owner);
  for(const g of active){
    g.seat=seats.shift();g.sp='B';g.state='toB';mvTo(g,'bseat'+g.seat,2.6,30);g.want=null;
    let p=plateById(g.plate);
    if(!p){p=freePlates.shift()||null;if(p){p.owner=g.id;g.plate=p.id;}}
    if(p){p.state=p.state==='queued'?'queued':'idle';p.home='bplate'+g.seat;mvTo(p,'bplate'+g.seat,2.6,40);}
  }
  for(const s of seats){
    const g=newGuest('entry');g.seat=s;g.sp='B';g.state='toB';mvTo(g,'bseat'+s,3.2,20);
    let p=freePlates.shift();
    if(!p){p=newPlate('bplate'+s,'seat');p.alpha=0;G.plates.push(p);}
    else{p.home='bplate'+s;mvTo(p,'bplate'+s,2.6,40);}
    p.owner=g.id;g.plate=p.id;
  }
  if(third){third.owner=null;third.home='bcenter';mvTo(third,'bcenter',2.4,60);}
  else{let c=freePlates.shift();if(!c){c=newPlate('bcenter','seat');c.alpha=0;G.plates.push(c);}c.owner=null;c.home='bcenter';mvTo(c,'bcenter',2.4,60);}
  for(const p of freePlates){if(p.kind!=='main')p.dying=true;else{p.home='bcenter';p.dying=true;}}
  G.smalls.forEach((s,i)=>mvTo(s,'bside'+(i===0?0:2),2.4,40));
  G.bottles.forEach((b,i)=>mvTo(b,'bb'+i,2.4,50));
  if(R.st!=='rest')retie();
  mvTo(R.base,'brob',2.4,70);mvTo(GL,'bgirl',2.4,60);
  G.sel=G.sel;
}
function checkFinale(){
  if(G.phase!=='banquet'||GL.task||GL.queue.length||G.fx.length)return;
  const gs=G.guests.filter(g=>g.state==='sit'&&g.sp==='B');
  if(gs.length<5)return;
  if(gs.every(g=>g.ateB>=0.5)){
    cancelInteraction();
    G.phase='finale';G.phT=0;G.finale={st:0};G.stats.finale++;logEv('finale (sample='+(G.lastDish&&G.lastDish.key)+')');
    G.fx.push({k:'toastAll',t:0,dur:1.3});for(const g of G.guests)g.raise=1.4;SFX.fanfare();
    if(R.st!=='rest'&&R.st!=='retie')retie();
  }
}
function updatePhase(dt){
  G.phT+=dt;const O=LY.O;
  if(G.phase==='kitchen'){
    if(G.pendingTF&&!GL.task&&!GL.queue.length&&!G.fx.length&&!(G.it&&G.it.drag)){if((G.tfDelay=(G.tfDelay||0)+dt)>1.1){G.tfDelay=0;startTransform();}}
  }else if(G.phase==='tf'){
    G.tf=eio(clamp(G.phT/3.0,0,1));
    if(G.phT>=3.4){G.phase='banquet';G.phT=0;G.tf=1;logEv('banquet');for(const p of G.plates)if(p.state==='carried')p.state='idle';}
  }else if(G.phase==='banquet'){
    G.tf=1;checkFinale();
  }else if(G.phase==='finale'){
    const f=G.finale;
    if(f.st===0&&G.phT>1.3){f.st=1;GL.carry=G.lastDish;const sh=LY.K.show;mvTo(GL,'pos:'+(sh.x+sh.w*0.75)+','+(sh.y+sh.h*0.95),1.4,80);SFX.whoosh();}
    else if(f.st===1&&G.phT>2.9){f.st=2;G.sample=G.lastDish;GL.carry=null;const sh=LY.K.show;burst(sh.x,sh.y,12,'spark','#fff3b0',90);ring(sh.x,sh.y,'#ffffff',1.4);SFX.bell();SFX.delight();logEv('sample placed '+(G.sample&&G.sample.key));}
    else if(f.st===2&&G.phT>3.3){f.st=3;mvTo(GL,'bgirl',1.0,40);for(const g of G.guests){g.state='leave';g.waveT=2;walkTo(g,'entry',190);}const pl=G.plates.find(p=>p.key==='bcenter');}
    else if(f.st===3&&G.phT>5.0){startFold();}
  }else if(G.phase==='fold'){
    G.tf=1-eio(clamp(G.phT/2.8,0,1));
    if(G.phT>=3.1){G.phase='kitchen';G.phT=0;G.tf=0;G.cycle++;G.stats.cycles++;G.guests=[];startCycle(false);}
  }
}
function startFold(){
  G.phase='fold';G.phT=0;SFX.rumble();SFX.retie();logEv('fold');
  for(let i=0;i<3;i++){if(!G.plates.some(p=>p.kind==='main'&&p.homeSt==='st'+i&&!p.dying)){const np=newPlate('st'+i,'main');np.homeSt='st'+i;np.alpha=0;G.plates.push(np);}}
  const mains=G.plates.filter(p=>p.kind==='main'&&!p.dying);
  for(const p of G.plates){if(p.kind!=='main')p.dying=true;}
  mains.forEach((p,i)=>{p.raw=[];p.dish=null;p.portion=0;p.owner=null;p.state='idle';p.exchanged=false;p.busy=false;p.counted=false;p.home=p.homeSt;mvTo(p,p.homeSt,2.4,50);p.pop=1;});
  G.smalls.forEach((s,i)=>{s.raw=[];s.dish=null;s.portion=0;s.state='idle';mvTo(s,i===0?'kside0':'kside2',2.4,40);});
  G.bottles.forEach((b,i)=>{b.lvl=CAPB;mvTo(b,'kb'+i,2.4,50);});

/* =====================================================================
   hint: exactly one lure at a time
   ===================================================================== */
function recommendIng(p){
  const last=lastIng(p);
  if(!last){
    const og=G.guests.find(g=>g.want&&(g.state==='wait'||g.state==='enter'));
    if(og)return og.want;
    if(G.phase==='banquet')return ['C','G','T'][(G.bPlates||0)%3];
    return ['T','C','G'][((G.cyclePlates||0)+G.cycle)%3];
  }
  const first=p.raw[0][0];
  if(first==='T')return 'C';
  return 'T';
}
function fillTargets(){
  const out=[];
  for(const k of robotTargets()){
    const p=plateAtKey(k);if(!needsFill(p))continue;
    if(G.phase==='banquet'&&k!=='bcenter'){const g=seatGuest(+k.slice(-1));if(g&&g.ateB>=0.5)continue;}
    out.push(k);
  }
  return out;
}
function computeHint(){
  const O=LY.O;

  if(G.phase==='kitchen'){
    const wg=G.guests.find(g=>g.state==='wait'&&!g.plate&&mvDone(g));
    const dp=G.plates.find(p=>p.dish&&p.portion>0&&p.state==='idle'&&p.key.startsWith('st')&&mvDone(p));
    if(wg&&dp&&!G.pendingTF)return {k:'serve',x:dp.x,y:dp.y-14*O,ref:dp,to:{x:wg.x,y:wg.y-40*O}};
  }else{
    const c=plateAtKey('bcenter');
    if(c&&c.dish&&c.portion>0.05&&c.state==='idle'&&!c.busy)return {k:'share',x:c.x,y:c.y-14*O,ref:c};
  }
  const fill=fillTargets();
  if(R.st==='at'&&R.geo){
    const p=plateAtKey(R.tgt);
    if(p&&needsFill(p)){
      if(rawTotal(p)<0.01){const s=G.smalls.find(s=>s.state==='idle'&&rawTotal(s)>=0.15&&s.hintable);if(s)return {k:'small',x:s.x,y:s.y-6*O,ref:s,to:{x:p.x,y:p.y-8*O}};}
      const rec=recommendIng(p);const sb=G.sel>=0?G.bottles[G.sel]:null;
      const want=G.bottles.find(b=>b.ing===rec);
      if(!sb||sb.lvl<0.06||(sb.ing!==rec&&rawTotal(p)<0.01)||(sb.ing!==rec&&rawTotal(p)>=0.3&&lastIng(p)===sb.ing)){
        let b=want;if(b.lvl<0.1){const alt=G.bottles.filter(x=>x!==sb&&x!==want&&x.lvl>0.1);b=alt.find(x=>x.ing==='G')||alt[0]||want;}
        return {k:'bottle',x:b.x,y:b.y-34*O,ref:b};
      }
      return {k:'press',x:R.geo.nozzle.x,y:R.geo.nozzle.y-4*O,ref:null};
    }
    if(p&&pourable(p))return null;
    if(fill.length&&R.st==='at'){
      const cp=slotPos(R.tgt);let best=null,bd=1e9;
      for(const k of neighbors(R.tgt)){const q=slotPos(k);let d=1e9;for(const f of fill){const fp=slotPos(f);d=Math.min(d,hyp(fp.x-q.x,fp.y-q.y)+(f===k?-1e5:0));}if(d<bd){bd=d;best=k;}}
      if(best){const q=slotPos(best);const vx=q.x-cp.x,vy=q.y-cp.y,l=hyp(vx,vy)||1;const s=R.geo.steer;return {k:'steer',x:s.x,y:s.y,ref:best,to:{x:s.x+vx/l*70*O,y:s.y+vy/l*70*O}};}
    }

  }

    if(hf&&hn)end=G.endUse.up<=G.endUse.low?'up':'low';else if(hf)end='up';else if(hn)end='low';else end=G.endUse.up<=G.endUse.low?'up':'low';
    if(end==='up'){const h=R.geo.head;return {k:'up',x:h.x,y:h.y,ref:null,to:{x:h.x,y:h.y-110*O}};}
    const l=R.geo.lobe;return {k:'low',x:l.x,y:l.y,ref:null,to:{x:l.x+6*O,y:l.y-90*O}};
  }
  return null;
}
function updateHint(dt){
  const h=computeHint();
  const same=h&&G.hint&&h.k===G.hint.k&&h.ref===G.hint.ref;
  G.hint=h;
  if(!same&&G.demo){G.demo=null;}
  if(!G.demo&&!G.demoDone&&h&&G.idle>4&&(G.phase==='kitchen'||G.phase==='banquet')&&!G.it){
    G.demo={h:{...h},t:0,dur:h.k==='bottle'||h.k==='share'?1.3:h.k==='press'?1.6:1.9};G.demoDone=true;logEv('demo '+h.k);
  }
  if(G.demo){
    G.demo.t+=dt;
    const d=G.demo,t=d.t/d.dur,O=LY.O;
    R.ghost.x=0;R.ghost.y=0;
    if(d.h.k==='up'&&t>0.25&&t<0.85){const e=Math.sin((t-0.25)/0.6*Math.PI);R.ghost.y=-26*O*e;}
    if(d.t>=d.dur){G.demo=null;R.ghost.x=R.ghost.y=0;}
  }else{R.ghost.x=R.ghost.y=0;}

/* =====================================================================
   input: one active finger; other fingers ignored; cancel-safe
   ===================================================================== */
function ellD(x,y,cx,cy,rx,ry){const dx=(x-cx)/rx,dy=(y-cy)/ry;return Math.sqrt(dx*dx+dy*dy);}
function draggablePlate(p){
  if(p.state!=='idle'||p.busy||!mvDone(p)||!p.dish||p.portion<=0.01)return false;
  if(G.phase==='kitchen')return p.key.startsWith('st')&&!G.pendingTF;
  if(G.phase==='banquet')return p.key.startsWith('bplate')||p.key==='bcenter';
  return false;
}
function hitTest(x,y){
  const O=LY.O,C=[];
  const add=(type,ref,d,bias)=>{if(d<1)C.push({type,ref,d:d+(bias||0)});};
  if((G.phase==='kitchen'||G.phase==='banquet')&&R.geo){
    const g=R.geo;
    if(R.st==='at'){
      add('head',null,hyp(x-g.head.x,y-g.head.y)/(46*O),-0.05);
      if(R.steerLoop>0.5)add('steer',null,hyp(x-g.steer.x,y-g.steer.y)/(32*O),-0.1);
    }else if(R.st==='rest'){
      add('up',null,Math.min(hyp(x-g.head.x,y-g.head.y)/(50*O),hyp(x-g.arc.x,y-g.arc.y)/(34*O)));
      add('low',null,hyp(x-g.lobe.x,y-g.lobe.y)/(40*O),-0.02);
      add(y<g.knot.y-6*O?'up':'low',null,hyp(x-g.knot.x,y-g.knot.y)/(30*O),0.15);
    }
    for(const s of G.smalls)if(s.state==='idle'&&mvDone(s))add('small',s,ellD(x,y,s.x,s.y-6*O,34*O,26*O));
    for(const p of G.plates)if(draggablePlate(p))add('plate',p,ellD(x,y,p.x,p.y-14*O,50*O,36*O));
    for(const b of G.bottles)if(mvDone(b))add('bottle',b,ellD(x,y,b.x,b.y-34*O,28*O,44*O));
  }
  if(C.length){C.sort((a,b)=>a.d-b.d);return C[0];}
  // pokes (local wobble only)
  if(R.geo&&hyp(x-R.geo.head.x,y-R.geo.head.y)<46*O)return {type:'poke',ref:R,what:'robot'};
  if(hyp(x-R.base.x,y-R.base.y)<40*O)return {type:'poke',ref:R,what:'robot'};
  for(const g of G.guests){if(ellD(x,y,g.x,g.y-44*O,28*O,46*O)<1)return {type:'poke',ref:g,what:'guest'};}
  if(ellD(x,y,GL.x,GL.y-80*O,32*O,80*O)<1)return {type:'poke',ref:GL,what:'girl'};
  for(const p of G.plates.concat(G.smalls)){if(ellD(x,y,p.x,p.y-8*O,46*O,26*O)<1)return {type:'poke',ref:p,what:'plate'};}
  const K=LY.K;for(let i=0;i<3;i++){const l=K.lamps[i];if(hyp(x-l.x,y-l.y)<26*LY.sc)return {type:'poke',ref:i,what:'lamp'};}
  if(Math.abs(x-K.show.x)<K.show.w/2&&Math.abs(y-K.show.y)<K.show.h/2)return {type:'poke',ref:null,what:'show'};
  return {type:'poke',ref:null,what:'bg'};
}
function pokeAt(h,x,y){
  const O=LY.O;
  addPart({k:'puff',x,y,vx:0,vy:-6*O,life:0.45,max:0.45,s:0.7,c:'#fff8ea'});
  if(h.what==='robot'){R.wob=1;R.squashV+=3;SFX.squish();}
  else if(h.what==='guest'){h.ref.wob=1;SFX.giggle();}
  else if(h.what==='girl'){GL.wob=1;SFX.giggle();}
  else if(h.what==='plate'){h.ref.wob=1;SFX.tock();}
  else if(h.what==='lamp'){G.lampSwing=G.lampSwing||[0,0,0];G.lampSwing[h.ref]=1;SFX.tock();}
  else if(h.what==='show'){G.showGlint=1;SFX.tock();}
  else SFX.tock();
}
function toLocal(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function onDown(e){
  e.preventDefault();

  if(G.it){/* another finger already active: ignore except a tiny local puff */const p=toLocal(e);addPart({k:'puff',x:p.x,y:p.y,vx:0,vy:0,life:0.3,max:0.3,s:0.4,c:'#ffffff'});return;}
  const p=toLocal(e);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const h=hitTest(p.x,p.y);
  const it={type:h.type,ref:h.ref,what:h.what,pid:e.pointerId,sx:p.x,sy:p.y,x:p.x,y:p.y,t0:G.t,moved:0,drag:false,ox:0,oy:0};
  G.it=it;
  switch(h.type){
    case 'up':case 'low':case 'head':case 'steer':robotGrabStart(h.type,p.x,p.y);if(h.type==='head'){R.squashV+=2;SFX.tick(0.3);}if(h.type==='steer'){SFX.squish();}break;
    case 'bottle':selectBottle(h.ref);break;
    case 'small':case 'plate':{const o=h.ref;o.wob=0.6;it.ox=o.x-p.x;it.oy=o.y-p.y;SFX.tick(0.5);break;}

}
function onMove(e){
  const it=G.it;if(!it||e.pointerId!==it.pid)return;
  e.preventDefault();
  const p=toLocal(e);it.moved+=hyp(p.x-it.x,p.y-it.y);it.x=p.x;it.y=p.y;G.idle=0;
  switch(it.type){
    case 'up':case 'low':case 'head':case 'steer':robotGrabMove(p.x,p.y);break;
    case 'small':case 'plate':{
      const o=it.ref;
      if(!it.drag&&hyp(p.x-it.sx,p.y-it.sy)>10*LY.sc){it.drag=true;o.lastKey=o.key;o.state='drag';o.md=0;SFX.tick(0.7);}
      if(it.drag){const x=clamp(p.x+it.ox,8,W-8),y=clamp(p.y+it.oy,8,H-8);o.x=x;o.y=y;o.key='pos:'+x.toFixed(1)+','+y.toFixed(1);}

}
function onUp(e){audioUnlock();const it=G.it;if(!it||e.pointerId!==it.pid)return;e.preventDefault();const p=toLocal(e);endInteraction(p.x,p.y,e.type==='pointercancel');}
function onLost(e){const it=G.it;if(!it||e.pointerId!==it.pid)return;endInteraction(it.x,it.y,true);}
function endInteraction(x,y,cancel){
  const it=G.it;if(!it)return;G.it=null;
  try{cv.releasePointerCapture(it.pid);}catch(_){}
  switch(it.type){
    case 'up':case 'low':case 'head':case 'steer':robotGrabEnd(x,y,cancel);break;
    case 'small':case 'plate':{
      const o=it.ref;
      if(it.drag){
        o.state='idle';
        if(cancel){snapBack(o);break;}
        if(it.type==='plate')dropPlate(o,x+it.ox*0.5,y+it.oy*0.5);else dropSmall(o,x+it.ox*0.5,y+it.oy*0.5);
      }else if(!cancel){
        if(it.type==='plate'&&o.key==='bcenter'&&G.phase==='banquet')startShare(o);
        else {o.wob=1;SFX.tock();}

function snapBack(o){
  o.state='idle';
  if(o.kind==='small'){const k=nearestFreeSide(o.x,o.y,o);mvTo(o,k,0.28,8);}
  else mvTo(o,o.home||o.homeSt,0.32,10);
  SFX.tock();
}
function sideKeys(){return G.phase==='banquet'?['bside0','bside1','bside2']:['kside0','kside1','kside2'];}
function nearestFreeSide(x,y,self){
  let best=null,bd=1e9;
  for(const k of sideKeys()){const occ=G.smalls.some(s=>s!==self&&s.key===k);if(occ)continue;const p=slotPos(k);const d=hyp(p.x-x,p.y-y);if(d<bd){bd=d;best=k;}}
  return best||self.key;
}
function guestAt(x,y){
  const O=LY.O;let best=null,bd=1;
  for(const g of G.guests){if(g.state==='leave')continue;const d=ellD(x,y,g.x,g.y-40*O,46*O,62*O);if(d<bd){bd=d;best=g;}}
  return best;
}
function plateNear(x,y,self,filter){
  const O=LY.O;let best=null,bd=1.25;
  for(const p of G.plates){if(p===self||p.state!=='idle'||!mvDone(p))continue;if(filter&&!filter(p))continue;const d=ellD(x,y,p.x,p.y-10*O,52*O,38*O);if(d<bd){bd=d;best=p;}}
  return best;
}
function dropPlate(p,x,y){
  const O=LY.O;
  if(G.phase==='kitchen'){
    const g=guestAt(x,y);
    if(g&&(g.state==='wait'||g.state==='enter')&&!g.plate){serveTo(g,p);return;}
    if(g&&g.state==='sit'){
      if(!g.plate){p.owner=g.id;g.plate=p.id;p.home='kplate'+g.seat;mvTo(p,'kplate'+g.seat,0.3,10);SFX.serve();G.stats.serve++;g.delight=0.6;logEv('serve seated '+g.seat);return;}
      const tp=plateById(g.plate);if(tp){mergeInto(tp,p);mvTo(p,p.homeSt,0.4,20);return;}
    }
    const tp=plateNear(x,y,p,q=>q.key.startsWith('kplate'));
    if(tp){mergeInto(tp,p);mvTo(p,p.homeSt,0.4,20);return;}
    snapBack(p);return;
  }
  if(G.phase==='banquet'){
    let tp=null;const g=guestAt(x,y);
    if(g&&g.plate!==p.id)tp=plateById(g.plate);
    if(!tp)tp=plateNear(x,y,p,q=>q.key.startsWith('bplate')||q.key==='bcenter');
    if(tp&&tp!==p){giveOrSwap(p,tp);snapBack(p);return;}
    snapBack(p);return;
  }

}
function giveOrSwap(p,tp){
  const O=LY.O;
  if(!tp.dish&&rawTotal(tp)<0.01){
    tp.dish=p.dish;tp.portion=p.portion;tp.fresh=p.fresh;tp.exchanged=p.exchanged;tp.pop=1;p.dish=null;p.portion=0;
    SFX.serve();ring(tp.x,tp.y-10*O,'#fff6cc',1);logEv('give -> '+tp.key);
  }else if(tp.dish){
    if(tp.dish.key!==p.dish.key){
      const a=p.dish,b=tp.dish;p.dish=splitDish(a,b);tp.dish=splitDish(b,a);p.exchanged=tp.exchanged=true;p.pop=tp.pop=1;
      SFX.swap();setTimeout(()=>SFX.yum(),300);burst((p.x+tp.x)/2,(p.y+tp.y)/2-20*O,6,'heart','#ff8fa0',60);G.stats.exch++;logEv('manual exchange');
    }else{SFX.clink();burst(tp.x,tp.y-30*O,6,'spark','#fff8d0',60);G.stats.toast++;}
  }else{p.wob=1;SFX.tock();}
}
function dropSmall(s,x,y){
  const O=LY.O;
  const tp=plateNear(x,y,null,q=>q.kind!=='small');
  if(tp){
    const sr=rawTotal(s);
    if(sr>0.01&&pourable(tp)){
      const cap=capOf(tp);let room=Math.max(0,cap-rawTotal(tp));
      const keep=[];
      for(const L of s.raw){const take=Math.min(room,L[1]);if(take>0){addRaw(tp,L[0],take);room-=take;}if(L[1]-take>0.01)keep.push([L[0],L[1]-take]);}
      if(!tp.counted&&rawTotal(tp)>0){tp.counted=true;}
      s.raw=keep;s.hintable=false;tp.pourT=G.t;tp.pop=1;SFX.plop(0.6);SFX.overflow();
      for(let i=0;i<6;i++)addPart({k:'crumb',x:tp.x+rr(-14,14)*O,y:tp.y-14*O,vx:rr(-30,30)*O,vy:-rr(40,80)*O,life:0.5,max:0.5,s:0.8,c:ING[tp.raw[tp.raw.length-1][0]].c});
      logEv('small material -> '+tp.key+' '+tp.raw.map(e=>e[0]).join(''));
      const k=nearestFreeSide(s.x,s.y,s);mvTo(s,k,0.35,14);return;
    }
    if(s.dish&&s.portion>0.01){
      if(tp.dish&&tp.portion>0){tp.dish=splitDish(tp.dish,s.dish);tp.portion+=s.portion;}
      else if(!tp.dish&&rawTotal(tp)<0.01){tp.dish=s.dish;tp.portion=s.portion;tp.exchanged=true;}
      else{snapBack(s);return;}
      tp.pop=1;s.dish=null;s.portion=0;SFX.serve();SFX.yum();ring(tp.x,tp.y-10*O,'#fff6cc',1);logEv('small portion -> '+tp.key);
      const k=nearestFreeSide(s.x,s.y,s);mvTo(s,k,0.35,14);return;
    }
    if(!s.dish&&sr<0.01&&tp.dish&&tp.portion>=0.2&&!tp.busy){
      const take=Math.min(0.35,tp.portion*0.5);s.dish=tp.dish;s.portion=take;tp.portion-=take;tp.pop=1;s.pop=1;SFX.plop(0.4);SFX.tick(0.8);
      logEv('scoop from '+tp.key);
      const k=nearestFreeSide(s.x,s.y,s);mvTo(s,k,0.35,14);return;
    }
  }
  const k=nearestFreeSide(x,y,s);const was=s.lastKey;mvTo(s,k,0.25,8);SFX.plop(0.2);
  if(k!==was)logEv('small moved -> '+k);s.lastKey=k;
}

  ctx.fillStyle='#6b3d1e';ctx.fillRect(x-2*sc,y-3*sc,w+4*sc,4*sc);
}
function drawBench(alpha){
  if(alpha<=0.01)return;const B=LY.K.bench,sc=LY.sc,O=LY.O;
  ctx.globalAlpha=alpha;
  // stools behind
  for(const s of LY.K.kseat){ctx.fillStyle='#4a2a16';ctx.fillRect(s.x-12*O,s.y-4*O,24*O,6*O);ctx.fillRect(s.x-9*O,s.y,4*O,16*O);ctx.fillRect(s.x+5*O,s.y,4*O,16*O);}
  ctx.globalAlpha=1;
}
function drawBenchFront(alpha){
  if(alpha<=0.01)return;const B=LY.K.bench,O=LY.O;
  ctx.globalAlpha=alpha;
  shadowAt((B.x0+B.x1)/2,B.y+18*O,(B.x1-B.x0)*0.55,10*O,0.35);
  ctx.fillStyle='#3e2010';rrect(B.x0,B.y+2*O,B.x1-B.x0,14*O,4*O);ctx.fill();
  const g=ctx.createLinearGradient(0,B.y-4*O,0,B.y+6*O);g.addColorStop(0,'#b07a4a');g.addColorStop(1,'#6a3a1c');
  ctx.fillStyle=g;rrect(B.x0-4*O,B.y-2*O,B.x1-B.x0+8*O,9*O,4*O);ctx.fill();
  ctx.fillStyle='rgba(255,230,190,0.35)';ctx.fillRect(B.x0,B.y-1.5*O,B.x1-B.x0,1.2*O);
  ctx.globalAlpha=1;
}
function drawTable(tf){
  if(tf<=0.01)return;const T=LY.B.table,B=LY.K.bench,O=LY.O;
  const e=sm(clamp(tf*1.25,0,1));
  const cx=lerp((B.x0+B.x1)/2,T.x,e),cy=lerp(B.y,T.y,e),rx=lerp((B.x1-B.x0)/2,T.rx,e),ry=lerp(8*O,T.ry,e);
  ctx.globalAlpha=sm(clamp(tf*2,0,1));
  shadowAt(cx+10*O,cy+ry*0.8,rx*1.05,ry*0.7,0.45);
  ctx.fillStyle='#3a1c0c';ell(cx,cy+12*O*e,rx,ry,null);ctx.fill();
  ctx.save();ell(cx,cy,rx,ry,null);ctx.clip();
  if(IMG.wood){const n=5;for(let k=0;k<n;k++){const S=WOODSTRIP[k%2];ctx.drawImage(IMG.wood,S[0],S[1],S[2],S[3],cx-rx,cy-ry+k*ry*2/n,rx*2,ry*2/n+1);ctx.fillStyle='rgba(15,6,1,0.4)';ctx.fillRect(cx-rx,cy-ry+k*ry*2/n,rx*2,Math.max(1,O*0.8));}}else{ctx.fillStyle='#7a4422';ctx.fillRect(cx-rx,cy-ry,rx*2,ry*2);}
  const g=ctx.createRadialGradient(cx-rx*0.3,cy-ry*0.4,4,cx,cy,rx);g.addColorStop(0,'rgba(255,225,180,0.22)');g.addColorStop(0.7,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(20,8,2,0.45)');
  ctx.fillStyle=g;ctx.fillRect(cx-rx,cy-ry,rx*2,ry*2);
  // lace runner
  ctx.fillStyle='rgba(255,250,240,0.55)';ell(cx,cy+ry*0.15,rx*0.36,ry*0.42,null);ctx.fill();
  ctx.restore();
  ctx.strokeStyle='rgba(255,230,190,0.45)';ctx.lineWidth=1.5*O;ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,Math.PI*1.05,Math.PI*1.95);ctx.stroke();
  // turntable for the center plate
  if(e>0.6){const c=LY.B.center;ctx.globalAlpha=sm((e-0.6)/0.4);ell(c.x,c.y+4*O,44*O,15*O,'#8c96a0');const g2=ctx.createLinearGradient(c.x-44*O,c.y-12*O,c.x+44*O,c.y+12*O);g2.addColorStop(0,'#f4f7fa');g2.addColorStop(1,'#9aa5b0');ctx.fillStyle=g2;ell(c.x,c.y+1*O,44*O,14*O,null);ctx.fill();}
  ctx.globalAlpha=1;
}
function drawCounter(tf){
  const K=LY.K,B=LY.B,O=LY.O;
  if(tf<=0.001){ctx.drawImage(ctrC,0,0,W,H);return;}
  const dyT=Math.max(B.table.y+B.table.ry+90*LY.sc,B.girl.y-90*O)-K.cBack;
  const e=sm(tf);const dx=W*0.22*e,dy=dyT*e;
  const sw=ctrC.width/2,sh=ctrC.height;
  ctx.drawImage(ctrC,0,0,sw,sh,-dx,dy,W/2,H);
  ctx.drawImage(ctrC,sw,0,sw,sh,W/2+dx,dy,W/2,H);
  ctx.fillStyle='rgba(20,8,2,0.5)';ctx.fillRect(W/2-dx-2*O,dy+K.cBack,2*O,H);ctx.fillRect(W/2+dx,dy+K.cBack,2*O,H);
}
/* ---------------- particles ---------------- */
function updateParts(dt){
  const O=LY.O;
  for(const p of G.parts){
    p.life-=dt;
    if(p.k==='drop'){p.vy+=900*O*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>=p.ty){p.life=0;if(Math.random()<0.3)addPart({k:'crumb',x:p.x,y:p.ty,vx:rr(-30,30)*O,vy:-rr(20,50)*O,life:0.25,max:0.25,s:0.6,c:p.c});}}
    else if(p.k==='roll'){p.t+=dt/p.max;}
    else if(p.k==='crumb'){p.vy+=500*O*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    else if(p.k==='heart'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.98;}
    else{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='spark'){p.vx*=0.92;p.vy*=0.92;}if(p.k==='mist'){p.vx*=0.985;}}
  }
  G.parts=G.parts.filter(p=>p.life>0);
}
function drawParts(){
  const O=LY.O;
  for(const p of G.parts){
    const a=clamp(p.life/p.max,0,1);
    switch(p.k){
      case 'drop':ell(p.x,p.y,3.2*p.s*O,3.6*p.s*O,p.c);ell(p.x-1*O,p.y-1.2*O,1*O,1*O,'rgba(255,255,255,0.6)');break;
      case 'steam':{const r=(10+28*(1-a))*p.s*O;ctx.globalAlpha=0.32*a*Math.min(1,(1-a)*5);ctx.drawImage(SPR.soft,p.x-r,p.y-r,r*2,r*2);ctx.globalAlpha=1;break;}
      case 'mist':{const r=(10+18*(1-a))*p.s*O;ctx.globalAlpha=0.3*a;ctx.drawImage(SPR.soft,p.x-r,p.y-r*0.6,r*2,r*1.2);ctx.globalAlpha=1;break;}
      case 'spark':ctx.globalAlpha=a;star(p.x,p.y,5*p.s*O*(0.5+a*0.5),p.c,G.t*3);ctx.globalAlpha=1;break;
      case 'puff':{ctx.globalAlpha=a*0.6;ctx.strokeStyle=p.c;ctx.lineWidth=2*O;ctx.beginPath();ctx.arc(p.x,p.y,(4+14*(1-a))*p.s*O,0,TAU);ctx.stroke();ctx.globalAlpha=1;break;}
      case 'crumb':ctx.globalAlpha=a;ell(p.x,p.y,2.4*p.s*O,2.2*p.s*O,p.c);ctx.globalAlpha=1;break;
      case 'flame':{ctx.globalAlpha=a*0.9;const r=7*p.s*O*(0.5+a);ctx.fillStyle=a>0.5?'#ffd25a':'#ff8a2a';ctx.beginPath();ctx.moveTo(p.x,p.y-r*1.6);ctx.quadraticCurveTo(p.x+r,p.y,p.x,p.y+r*0.6);ctx.quadraticCurveTo(p.x-r,p.y,p.x,p.y-r*1.6);ctx.fill();ctx.globalAlpha=1;break;}
      case 'heart':ctx.globalAlpha=a;heart(p.x,p.y,5*p.s*O,p.c);ctx.globalAlpha=1;break;
      case 'ring':ctx.globalAlpha=a*0.8;ctx.strokeStyle=p.c;ctx.lineWidth=2.4*O;ctx.beginPath();ctx.arc(p.x,p.y,(8+30*(1-a))*p.s*O,0,TAU);ctx.stroke();ctx.globalAlpha=1;break;
      case 'roll':{const t=clamp(p.t,0,1);const mx=(p.x+p.tx)/2,my=Math.min(p.y,p.ty)-16*O;const x=(1-t)*(1-t)*p.x+2*(1-t)*t*mx+t*t*p.tx,y=(1-t)*(1-t)*p.y+2*(1-t)*t*my+t*t*p.ty;
        if(p.spill&&t>0.95){ctx.globalAlpha=a;ell(p.tx,p.ty,6*O,2.2*O,p.c);ctx.globalAlpha=1;}else{ell(x,y,3.4*p.s*O,3.2*p.s*O,p.c);}break;}
    }
  }
}
/* ---------------- fx overlays (exchange, share) ---------------- */
function drawFx(){
  const O=LY.O;
  for(const f of G.fx){
    if(f.k==='exch'&&!f.done){
      const t=eio(clamp(f.t/f.dur,0,1));
      const ax=f.a.x,ay=f.a.y,bx=f.b.x,by=f.b.y;const lift=Math.sin(t*Math.PI)*40*O;
      drawDish(f.da,lerp(ax,bx,t),lerp(ay,by,t)-lift,0.55,0.5);
      drawDish(f.db,lerp(bx,ax,t),lerp(by,ay,t)-lift*0.7,0.55,0.5);
    }else if(f.k==='share'&&!f.done){
      const t=eio(clamp(f.t/f.dur,0,1));
      for(let i=0;i<5;i++){const q=slotPos('bplate'+i);const lift=Math.sin(t*Math.PI)*50*O;drawDish(f.dish,lerp(f.p.x,q.x,t),lerp(f.p.y,q.y,t)-lift,0.45,0.4);}
    }
  }
}
/* ---------------- hint & demo hand ---------------- */
function drawHint(){
  const h=G.hint;if(!h)return;const O=LY.O;
  const pul=0.5+0.5*Math.sin(G.t*4.2);
  ctx.globalCompositeOperation='lighter';
  glowAt(h.x,h.y,(34+10*pul)*O,0.32+0.18*pul);
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='rgba(255,246,200,'+(0.35+0.4*pul)+')';ctx.lineWidth=2.4*O;ctx.beginPath();ctx.arc(h.x,h.y,(26+8*pul)*O,0,TAU);ctx.stroke();
}
function drawHand(x,y,press){
  const O=LY.O,s=O*(press?0.9:1);
  ctx.save();ctx.translate(x,y);ctx.globalAlpha=0.92;
  shadowAt(6*s,26*s,16*s,6*s,0.25);
  ctx.fillStyle='#fff7ee';ctx.strokeStyle='rgba(120,90,70,0.6)';ctx.lineWidth=1.4*s;
  ctx.beginPath();ctx.moveTo(-4*s,0);ctx.lineTo(-4*s,18*s);ctx.quadraticCurveTo(-14*s,16*s,-14*s,26*s);ctx.quadraticCurveTo(-10*s,40*s,4*s,42*s);ctx.quadraticCurveTo(18*s,42*s,19*s,28*s);ctx.lineTo(19*s,18*s);ctx.quadraticCurveTo(19*s,13*s,14*s,13*s);ctx.quadraticCurveTo(12*s,9*s,8*s,10*s);ctx.quadraticCurveTo(6*s,6*s,4*s,8*s);ctx.lineTo(4*s,0);ctx.quadraticCurveTo(0,-5*s,-4*s,0);ctx.closePath();ctx.fill();ctx.stroke();
  ell(-1*s,1*s,2*s,1.4*s,'rgba(255,200,190,0.7)');
  ctx.restore();ctx.globalAlpha=1;
}
function drawDemo(){
  const d=G.demo;if(!d)return;const h=d.h,t=clamp(d.t/d.dur,0,1),O=LY.O;
  let x=h.x,y=h.y,press=false;
  if(h.to){const k=t<0.2?0:t>0.85?1:eio((t-0.2)/0.65);x=lerp(h.x,h.to.x,k);y=lerp(h.y,h.to.y,k);press=t>0.15&&t<0.88;}
  else if(h.k==='press'){press=t>0.2&&t<0.85;}
  else{press=(t>0.35&&t<0.55);}
  if(press){ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=2*O;ctx.beginPath();ctx.arc(x,y,(10+6*Math.sin(G.t*10))*O,0,TAU);ctx.stroke();}
  drawHand(x,y+(press?2*O:-6*O),press);
}
/* =====================================================================
   main draw
   ===================================================================== */
function draw(){
  const O=LY.O;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(bgDirty)buildBg();
  ctx.drawImage(bgC,0,0,W,H);
  drawLamps();drawShowcase();
  const tf=G.tf;
  drawBench(1-sm(clamp(tf*2,0,1)));
  // guests behind furniture
  const gs=G.guests.slice().sort((a,b)=>a.y-b.y);
  if(tf>0.5){drawCounter(tf);}
  for(const g of gs)drawGuest(g);
  drawBenchFront(1-sm(clamp(tf*2,0,1)));
  drawTable(tf);
  // plates on ledge / table (back layer)
  const back=[],front=[];
  for(const p of G.plates.concat(G.smalls)){
    if(p.key&&p.key.startsWith('gh:'))continue;
    const k=p.key||'';
    if(p.state==='drag')continue;
    if(k.startsWith('kplate')||k.startsWith('bplate')||k==='bcenter'||k.startsWith('bside')||(tf>0.5&&(G.phase==='tf'||G.phase==='banquet'||G.phase==='fold')&&!k.startsWith('st')&&k!=='hold'&&!k.startsWith('kside')))back.push(p);else front.push(p);
  }
  back.sort((a,b)=>a.y-b.y);
  for(const p of back)drawPlateAt(p);
  if(tf<=0.5)drawCounter(tf);
  // stands + front items sorted by depth
  const items=[];
  const sa=1-sm(clamp(tf*2.2,0,1)),sink=sm(tf)*40*O;
  LY.K.st.forEach((st,i)=>{if(st.foot){const pp=plateAtKey('st'+i);const ps=pp?pp.sink*O*0.9:0;items.push({d:st.foot,f:()=>drawStand(st,sa,sink,ps)});}});
  for(const p of front){let d=p.y+1;const k=p.key||'';
    if(k==='st0'||k==='kside0')d=LY.K.st[0].foot+0.5+(k==='kside0'?0.2:0);
    else if(k==='st1'||k==='kside1')d=LY.K.st[1].foot+0.5+(k==='kside1'?0.2:0);
    else if(k==='hold')d=GL.y+1;
    else if(!mvDone(p))d=p.y+120*O;
    items.push({d,f:()=>drawPlateAt(p)});}
  items.push({d:GL.y,f:drawGirl});
  for(const b of G.bottles)items.push({d:b.y,f:()=>drawBottle(b)});
  items.sort((a,b)=>a.d-b.d);
  for(const it of items)it.f();
  drawRobot();
  drawFx();
  drawParts();
  // dragged
  for(const p of G.plates.concat(G.smalls))if(p.state==='drag')drawPlateAt(p,true);
  drawHint();
  drawDemo();
}
function drawPlateAt(p,lifted){
  const O=LY.O;const spr=p.kind==='small'?SPR.small:(p.key&&(p.key.startsWith('bplate')||p.key.startsWith('kplate'))?SPR.seat:SPR.plate);
  const hint=G.hint&&G.hint.ref===p;
  const hop=hint?Math.abs(Math.sin(G.t*4.2))*6*O:0;
  const y=p.y+p.sink*O*0.9-hop-(lifted?8*O:0);
  ctx.globalAlpha=clamp(p.alpha,0,1);
  shadowAt(p.x+5*O,p.y+(lifted?10:4)*O,spr.width/DPR*0.55,spr.height/DPR*0.45,lifted?0.25:0.38);
  drawPlateObj(p,p.x,y,spr,p.key&&p.key.startsWith('kplate')?0.84:1);
  ctx.globalAlpha=1;
}


/* =====================================================================
   loop / resize / visibility
   ===================================================================== */
let running=true,rafId=0,lastT=0;
function update(dt){
  G.t+=dt;G.idle+=dt;
  updateRobot(dt);
  updatePour(dt);
  updatePlates(dt);
  for(const b of G.bottles)mvUpd(b,dt);
  updateGirl(dt);
  updateGuests(dt);
  if(G.phase==='kitchen'||G.phase==='banquet')checkPairs();
  updateFx(dt);
  updatePhase(dt);
  updateParts(dt);
  updateHint(dt);
  // pull tension tone
  const pulling=R.grab&&(R.grab.end==='up'||R.grab.end==='low'||R.grab.end==='steer');
  if(pulling){const amt=clamp(hyp(R.disp.x,R.disp.y)/(70*LY.O),0,1);setCont('pull','osc',true,150+amt*420+R.untie*260+R.steerP*200,0.035+amt*0.05);}else setCont('pull','osc',false);
}
function frame(now){
  if(!running){rafId=0;return;}
  rafId=requestAnimationFrame(frame);
  let dt=(now-lastT)/1000;lastT=now;
  if(!(dt>0))dt=0.016;
  dt=Math.min(dt,0.05);
  G.frames++;G.ftAcc+=dt;if(G.ftAcc>=1){G.fps=G.frames/G.ftAcc;G.frames=0;G.ftAcc=0;}
  try{update(dt);draw();}catch(e){if(!G.err){G.err=String(e&&e.stack||e);}G.errN=(G.errN||0)+1;try{cv.width=cv.width;}catch(_){}}
}
function resize(){
  const nw=Math.max(1,window.innerWidth),nh=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);W=nw;H=nh;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  readSafe();buildLayout();buildSprites();
  for(const p of G.plates.concat(G.smalls)){p.state=p.state==='drag'?'idle':p.state;}
  for(const p of G.plates.concat(G.smalls))if(p.dish)p.dish.spr=null;
  if(G.sample)G.sample.spr=null;if(G.lastDish)G.lastDish.spr=null;
  cancelInteraction();
  if(R.st==='rise'||R.st==='turn'||R.st==='retie')R.t=R.dur;
  snapAll();
  if(G.parts)G.parts.length=0;
  bgDirty=true;
}
let rzT=0;
window.addEventListener('resize',()=>{resize();clearTimeout(rzT);rzT=setTimeout(resize,250);});
window.addEventListener('orientationchange',()=>{setTimeout(resize,120);setTimeout(resize,500);});
function setVisible(v){
  if(v){
    if(!running){running=true;lastT=performance.now();if(AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume().catch(()=>{});rafId=requestAnimationFrame(frame);}
  }else{
    running=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;
    cancelInteraction();silenceAll();
    if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend().catch(()=>{});
  }
}
document.addEventListener('visibilitychange',()=>setVisible(document.visibilityState==='visible'));
window.addEventListener('pagehide',()=>setVisible(false));
window.addEventListener('pageshow',()=>setVisible(document.visibilityState!=='hidden'));

/* test/inspection hook (read-only snapshot + screen positions; no game control) */
window.__gf45={
  snap(){
    return {phase:G.phase,t:Math.round(G.t*10)/10,cycle:G.cycle,cycleDishes:G.cycleDishes,sel:G.sel,fps:Math.round(G.fps),parts:G.parts.length,err:G.err||null,store:storeNote,
      robot:{st:R.st,tgt:R.tgt,untie:+R.untie.toFixed(2),steerP:+R.steerP.toFixed(2),squash:+R.squash.toFixed(3),lookCam:+R.lookCam.toFixed(2),face:R.face,pour:R.pour},
      hint:G.hint?{k:G.hint.k,x:Math.round(G.hint.x),y:Math.round(G.hint.y),to:G.hint.to?{x:Math.round(G.hint.to.x),y:Math.round(G.hint.to.y)}:null}:null,demo:!!G.demo,
      plates:G.plates.map(p=>({id:p.id,kind:p.kind,key:p.key,state:p.state,raw:p.raw.map(e=>e[0]+e[1].toFixed(2)).join(','),dish:p.dish?p.dish.key:null,portion:+p.portion.toFixed(2),x:Math.round(p.x),y:Math.round(p.y),exch:p.exchanged})),
      smalls:G.smalls.map(s=>({key:s.key,raw:s.raw.map(e=>e[0]+e[1].toFixed(2)).join(','),dish:s.dish?s.dish.key:null,x:Math.round(s.x),y:Math.round(s.y)})),
      bottles:G.bottles.map(b=>({ing:b.ing,lvl:+b.lvl.toFixed(2),x:Math.round(b.x),y:Math.round(b.y-34*LY.O)})),
      guests:G.guests.map(g=>({id:g.id,state:g.state,seat:g.seat,sp:g.sp,plate:g.plate,want:g.want,ate:+g.ate.toFixed(2),ateB:+g.ateB.toFixed(2),x:Math.round(g.x),y:Math.round(g.y)})),
      sample:G.sample?G.sample.key:null,last:G.lastDish?G.lastDish.key:null,stats:G.stats,mode:LY.mode,O:LY.O};
  },
  geo(){const g=R.geo;if(!g)return null;const r=p=>({x:Math.round(p.x),y:Math.round(p.y)});return {head:r(g.head),lobe:r(g.lobe),knot:r(g.knot),steer:r(g.steer),arc:r(g.arc),nozzle:r(g.nozzle)};},
  slot(k){const p=slotPos(k);return {x:Math.round(p.x),y:Math.round(p.y)};},
  log(){return G.log.slice();}
};

resize();
initGame();
lastT=performance.now();
rafId=requestAnimationFrame(frame);
})();
