<script>
(()=>{
'use strict';
// ================= basics =================
const cv=document.getElementById('c');
const MAINCTX=cv.getContext('2d',{alpha:false});
let ctx=MAINCTX;
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-(1-t)*(1-t);
const eio=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const eob=t=>{const c=1.9;t=t-1;return 1+(c+1)*t*t*t+c*t*t;};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
// fixed 4 real colors (background & shadow included). other hues = juxtaposed pieces only.
const C={nv:'#1d2747',cr:'#f6eacb',rd:'#dd4a2d',yl:'#f2ad2a'};
const Q=new URLSearchParams(location.search);
let seed=(Q.get('seed')|0)||((Math.random()*1e9)|0);
function rng(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
const rr=(a,b)=>a+rng()*(b-a);
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
const nt=(b,i)=>b*Math.pow(2,PENTA[clamp(i|0,0,PENTA.length-1)]/12);

// ================= audio (Web Audio synthesis only) =================
let AC=null,MG=null,NB=null,unlocked=false,audioStarted=false;
function audioStart(){
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
      AC=new A();
      const comp=AC.createDynamicsCompressor();
      comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=4;
      MG=AC.createGain();MG.gain.value=0.8;MG.connect(comp);comp.connect(AC.destination);
      const n=Math.floor(AC.sampleRate*0.5);NB=AC.createBuffer(1,n,AC.sampleRate);
      const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state!=='running'&&AC.resume){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}
    if(!unlocked){const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(MG);s.start(0);unlocked=true;}
    audioStarted=true;
  }catch(e){}
}
const live=()=>!!(AC&&AC.state==='running');
function tone(f,dur,type,vol,when,slide,att){
  if(!live())return;
  try{
    const t0=AC.currentTime+(when||0);
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t0+dur);
    const a=att||0.006;
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.2),t0+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+dur+0.02);
  }catch(e){}
}
function noise(dur,vol,ft,freq,q,when,sweep){
  if(!live()||!NB)return;
  try{
    const t0=AC.currentTime+(when||0);
    const s=AC.createBufferSource();s.buffer=NB;
    const f=AC.createBiquadFilter();f.type=ft||'bandpass';f.frequency.setValueAtTime(freq||1500,t0);f.Q.value=q||1;
    if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t0+dur);
    const g=AC.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.2),t0+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(f);f.connect(g);g.connect(MG);s.start(t0,Math.random()*0.3);s.stop(t0+dur+0.02);
  }catch(e){}
}
const SFX={
  press(){noise(.03,.18,'highpass',3000,.7);},
  snap(){noise(.05,.55,'bandpass',2600,1.4);tone(1500,.035,'square',.06);tone(320,.09,'triangle',.18,0,160);},
  gate(){noise(.04,.25,'bandpass',1800,2);tone(700,.05,'triangle',.08);},
  koro(i,side){tone(nt(side?560:480,9-i),.07,'sine',.16);tone(nt(side?560:480,9-i)*2.01,.04,'sine',.05);},
  roll(){for(let i=0;i<3;i++)tone(900+i*60,.03,'sine',.04,i*.035);},
  flap(){noise(.07,.4,'bandpass',1200,1.1,0,600);tone(240,.08,'triangle',.12,0,420);},
  land(n,side){const b=side?392:330;tone(nt(b,n*2),.16,'triangle',.24);tone(nt(b,n*2+2),.12,'sine',.1,.04);noise(.03,.15,'lowpass',900,.7);},
  hop(){for(let i=0;i<3;i++)tone(nt(660,i+3),.06,'sine',.08,i*.05);},
  tier(){noise(.06,.35,'bandpass',1400,1.4);noise(.06,.35,'bandpass',1900,1.4,.09);tone(nt(330,4),.12,'triangle',.18,.05);tone(nt(330,7),.18,'triangle',.18,.14);},
  done(side){const b=side?523:440;[0,2,4,7].forEach((k,i)=>tone(nt(b,k),.22,'triangle',.2,i*.07));tone(nt(b,9),.4,'sine',.12,.3);},
  fanfare(){const m=[0,2,4,5,7,9,12];m.forEach((k,i)=>{tone(nt(392,k),.25,'square',.06,i*.09);tone(nt(196,k),.3,'triangle',.18,i*.09);});
    for(let i=0;i<6;i++)noise(.05,.25,'bandpass',1500+i*300,1.5,.2+i*.08);tone(nt(784,4),.6,'sine',.12,.7);},
  wiggle(){tone(220,.12,'sine',.12,0,180);tone(240,.1,'sine',.08,.08,200);},
  select(type){const f=type==='T'?620:type==='B'?520:type==='S'?880:700;tone(f,.08,'triangle',.18,0,f*1.5);noise(.03,.12,'highpass',2500,.7);},
  pop(){tone(900,.05,'sine',.12,0,1400);},
  clap(){noise(.03,.35,'bandpass',1800,.9);noise(.03,.3,'bandpass',1600,.9,.12);},
  plate(){tone(1200,.05,'sine',.07);noise(.025,.1,'highpass',3500,.6);},
  tick(){tone(1700,.025,'sine',.05);},
  whoosh(){noise(.3,.25,'bandpass',600,1.2,0,2200);},
  eat(){for(let i=0;i<3;i++)noise(.05,.3,'lowpass',700-i*120,1,i*.11);tone(300,.08,'sine',.08,.33,420);},
  star(){[0,4,7,12,16].forEach((k,i)=>tone(nt(880,k),.18,'sine',.11,i*.06));},
  fold(){for(let i=0;i<5;i++)noise(.05,.3,'bandpass',900+i*200,1.3,i*.12);},
  hello(){tone(nt(523,0),.12,'triangle',.14);tone(nt(523,2),.16,'triangle',.14,.12);},
};

// ================= layout =================
let W=0,H=0,DPR=1,S=1,VW=400,VH=860,OX=0,OY=0,PORT=true;
const SA={t:0,r:0,b:0,l:0};
const L={};
function readSA(){
  try{const cs=getComputedStyle(document.getElementById('sa'));
    SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}
function layout(){
  const cx=VW/2;L.cx=cx;
  if(PORT){
    const k=clamp((VW-400)/320,0,1),ex=Math.max(0,VH-860);
    L.u=40+8*k;L.awH=46;
    L.clerk={x:cx,y:96+ex*.05,r:36};
    L.win={x:cx,y:94+ex*.05,w:206+40*k,h:124};
    L.trayY=200+ex*.12;L.trayDx=120+46*k;
    L.loadY=292+ex*.16;L.jY=L.loadY+16;
    L.slideX=46+20*k;L.tw=28+14*k;L.rise=46;L.steps=3;
    L.boxY=652+ex*.45;L.boxDx=106+62*k;L.bw=150+34*k;L.bh=104+10*k;
    L.lever={x:cx,py:L.boxY-40,len:150,kr:36};
    L.kr=32;L.kidY=Math.max(L.boxY+112,VH-100);L.kidX=[cx-L.boxDx,cx+L.boxDx];
  }else{
    const k=clamp((VW-1180)/500,0,1),ex=Math.max(0,VH-800);
    L.u=46;L.awH=50;
    L.clerk={x:cx,y:100+ex*.05,r:40};
    L.win={x:cx,y:98+ex*.05,w:236,h:136};
    L.trayY=206+ex*.1;L.trayDx=158;
    L.loadY=290+ex*.15;L.jY=L.loadY+16;
    L.slideX=92+30*k;L.tw=44+10*k;L.rise=36;L.steps=4;
    L.boxY=640+ex*.4;L.boxDx=250+40*k;L.bw=190;L.bh=118;
    L.lever={x:cx,py:L.boxY-44,len:156,kr:40};
    L.kr=40;L.kidY=L.boxY-62;L.kidX=[cx-L.boxDx-L.bw/2-100,cx+L.boxDx+L.bw/2+100];
  }
  L.tray=[{x:cx-L.trayDx,y:L.trayY,t:'O'},{x:cx,y:L.trayY,t:'T'},{x:cx+L.trayDx,y:L.trayY,t:'B'}];
  L.starSlot={x:cx-L.trayDx*1.72,y:L.trayY+6};
  if(PORT) L.starSlot={x:cx-L.trayDx*.5,y:L.trayY+44};
  L.counterY=L.boxY-L.bh/2-6;
  L.box=[{x:cx-L.boxDx,y:L.boxY},{x:cx+L.boxDx,y:L.boxY}];
  L.path=[buildPath(0),buildPath(1)];
}
function buildPath(side){
  const d=side?1:-1,cx=L.cx,segs=[];
  let x=cx,y=L.loadY;
  segs.push({k:'s',x0:x,y0:y,x1:cx+d*L.slideX,y1:L.jY+18,dur:.2,st:-1});
  x=cx+d*L.slideX;y=L.jY+18;
  const steps=[];
  for(let i=0;i<L.steps;i++){
    steps.push({x:x,y:y,x2:x+d*(L.tw+6)});
    segs.push({k:'s',x0:x,y0:y,x1:x+d*L.tw,y1:y,dur:.1,st:i});x+=d*L.tw;
    segs.push({k:'d',x0:x,y0:y,x1:x+d*6,y1:y+L.rise,dur:.16,st:i});x+=d*6;y+=L.rise;
  }
  const plateX=x+d*18;
  steps.push({x:x,y:y,x2:plateX+d*8});
  segs.push({k:'s',x0:x,y0:y,x1:plateX-d*10,y1:y,dur:.1,st:L.steps});
  let tot=0;for(const s of segs){s.t0=tot;tot+=s.dur;}
  return {segs,tot,steps,plateX,plateY:y,d};
}
function samplePath(p,t){
  const segs=p.segs;
  if(t<=0)return [segs[0].x0,segs[0].y0,-1,0];
  for(const s of segs){
    if(t<s.t0+s.dur){
      const f=(t-s.t0)/s.dur;
      if(s.k==='s'){const e=s.st<0?f*f:f;return [lerp(s.x0,s.x1,e),lerp(s.y0,s.y1,e),s.st,0];}
      return [lerp(s.x0,s.x1,f),lerp(s.y0,s.y1,f*f),s.st,1];
    }
  }
  const s=segs[segs.length-1];return [s.x1,s.y1,5,0];
}

// ================= transform stack + paper pieces =================
const TS=[];let TR=0,TSC=1;
function push(x,y,r,s){ctx.save();ctx.translate(x,y);if(r)ctx.rotate(r);if(s!=null&&s!==1)ctx.scale(s,s);TS.push(TR,TSC);TR+=r||0;TSC*=(s==null?1:s);}
function pushS(x,y,r,sx,sy){ctx.save();ctx.translate(x,y);if(r)ctx.rotate(r);ctx.scale(sx,sy);TS.push(TR,TSC);TR+=r||0;TSC*=Math.max(.2,(Math.abs(sx)+Math.abs(sy))/2);}
function pop(){ctx.restore();TSC=TS.pop();TR=TS.pop();}
function offL(wx,wy){const c=Math.cos(-TR),s=Math.sin(-TR),k=1/TSC;return [(wx*c-wy*s)*k,(wx*s+wy*c)*k];}
// paper(build,col,sh,edge): navy drop shadow (offset), white cut edge (cream, slight offset), then face
function paper(build,col,sh,edge){
  if(sh==null)sh=1;if(edge==null)edge=1;
  if(sh>0){const o=offL(2.6*sh,3.6*sh);ctx.translate(o[0],o[1]);ctx.beginPath();build();ctx.fillStyle=C.nv;ctx.fill();ctx.translate(-o[0],-o[1]);}
  if(edge>0&&col!==C.cr){const o=offL(.5*edge,1.5*edge);ctx.translate(o[0],o[1]);ctx.beginPath();build();ctx.fillStyle=C.cr;ctx.fill();ctx.translate(-o[0],-o[1]);}
  ctx.beginPath();build();ctx.fillStyle=col;ctx.fill();
}
function strip(build,col,lw,sh){
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=lw;
  if(sh==null)sh=.7;
  if(sh>0){const o=offL(2.2*sh,3*sh);ctx.translate(o[0],o[1]);ctx.beginPath();build();ctx.strokeStyle=C.nv;ctx.stroke();ctx.translate(-o[0],-o[1]);}
  ctx.beginPath();build();ctx.strokeStyle=col;ctx.stroke();
}
const rrect=(x,y,w,h,r)=>{r=Math.min(r,w/2,h/2);ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
const circ=(x,y,r)=>{ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,TAU);};
const poly=p=>{ctx.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);ctx.closePath();};
const ell=(x,y,rx,ry,r)=>{ctx.moveTo(x+rx*Math.cos(r||0),y+rx*Math.sin(r||0));ctx.ellipse(x,y,rx,ry,r||0,0,TAU);};
function rtri(u){const a=[0,-.54*u],b=[.58*u,.42*u],c=[-.58*u,.42*u],r=.18*u;
  ctx.moveTo((a[0]+c[0])/2,(a[1]+c[1])/2);ctx.arcTo(a[0],a[1],b[0],b[1],r);ctx.arcTo(b[0],b[1],c[0],c[1],r);ctx.arcTo(c[0],c[1],a[0],a[1],r);ctx.closePath();}
function starP(R,r,n){n=n||5;for(let i=0;i<n*2;i++){const a=-PI/2+i*PI/n,rad=i%2?r:R;i?ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad):ctx.moveTo(Math.cos(a)*rad,Math.sin(a)*rad);}ctx.closePath();}
// "green" feel: navy paper with yamabuki chips side by side. "pink" feel: cream with vermilion dots.
const GDOT=[[-.45,-.3],[.1,-.5],[.45,-.1],[-.1,.05],[.35,.4],[-.4,.35],[.0,.55],[-.6,.0],[.6,.25]];
function greenBlob(x,y,r,sh){
  paper(()=>circ(x,y,r),C.nv,sh==null?.8:sh,1);
  ctx.fillStyle=C.yl;ctx.beginPath();
  for(const g of GDOT){const px=x+g[0]*r,py=y+g[1]*r,s=r*.17;ctx.moveTo(px,py-s);ctx.lineTo(px+s,py+s*.7);ctx.lineTo(px-s,py+s*.7);ctx.closePath();}
  ctx.fill();
}
function creamDots(x,y,r){ctx.fillStyle=C.cr;ctx.beginPath();circ(x-r*.5,y,r*.3);circ(x+r*.5,y,r*.3);circ(x,y-r*.45,r*.26);circ(x,y+r*.42,r*.24);ctx.fill();}
function pinkDots(x,y,r){ctx.fillStyle=C.rd;ctx.beginPath();circ(x-r*.5,y,r*.32);circ(x+r*.5,y,r*.32);circ(x,y-r*.45,r*.28);circ(x,y+r*.42,r*.26);ctx.fill();}

// ================= food items =================
// types: O onigiri, S star onigiri (rare), T tamagoyaki, B broccoli
function drawItem(type,x,y,u,rot,o){
  o=o||{};
  const sq=o.sq||0;
  pushS(x,y,rot||0,u*(1+sq*.5),u*(1-sq*.6));
  const pose=o.pose||'';
  if(type==='O'){
    paper(()=>rtri(1),C.cr,1);
    paper(()=>rrect(-.24,.1,.48,.34,.04),C.nv,.3,1);
    if(pose==='eye'){const lx=(o.lx||0)*.1,ly=(o.ly||0)*.07;
      paper(()=>circ(lx,-.08+ly,.15),C.nv,.25,0);ctx.fillStyle=C.cr;ctx.beginPath();circ(lx-.05,-.13+ly,.045);ctx.fill();
      if(o.lid>0)paper(()=>{ctx.moveTo(-.4,-.3);ctx.lineTo(.4,-.3);ctx.lineTo(.36,-.3+.36*o.lid);ctx.lineTo(-.36,-.3+.36*o.lid);ctx.closePath();},C.yl,.3,1);}
  }else if(type==='S'){
    paper(()=>starP(.62,.3),C.cr,1);
    paper(()=>starP(.2,.1),C.yl,.3,1);
    paper(()=>rrect(-.13,.2,.26,.15,.03),C.nv,.2,1);
    if(pose==='eye'){const lx=(o.lx||0)*.06;paper(()=>circ(lx,-.02,.1),C.nv,.2,0);}
  }else if(type==='T'){
    if(pose==='arc'){
      paper(()=>{ctx.arc(0,-.42,.64,.18*PI,.82*PI);ctx.arc(0,-.42,.3,.82*PI,.18*PI,true);ctx.closePath();},C.yl,1);
      ctx.fillStyle=C.cr;ctx.beginPath();ctx.arc(0,-.42,.49,.24*PI,.76*PI);ctx.arc(0,-.42,.43,.76*PI,.24*PI,true);ctx.closePath();ctx.fill();
    }else{
      paper(()=>rrect(-.58,-.36,1.16,.72,.2),C.yl,1);
      ctx.fillStyle=C.cr;ctx.beginPath();rrect(-.46,-.13,.92,.06,.03);rrect(-.42,.11,.84,.06,.03);ctx.fill();
      ctx.fillStyle=C.rd;ctx.beginPath();rrect(-.5,-.3,.1,.08,.03);ctx.fill();
    }
  }else if(type==='B'){
    paper(()=>poly([-.13,.0,.13,.0,.1,.52,-.1,.52]),C.cr,.8);
    paper(()=>poly([-.05,.12,.03,.12,.02,.46,-.04,.46]),C.yl,0,0);
    greenBlob(-.27,-.1,.27,.7);greenBlob(.27,-.1,.27,.7);greenBlob(0,-.3,.31,.7);greenBlob(0,-.02,.24,.5);
  }
  pop();
}
function drawMarble(x,y,r,spin){
  push(x,y,spin||0,1);
  paper(()=>circ(0,0,r),C.rd,.6,1);
  ctx.fillStyle=C.yl;ctx.beginPath();ctx.moveTo(-r*.8,r*.1);ctx.quadraticCurveTo(0,-r*.5,r*.8,r*.2);ctx.quadraticCurveTo(0,-r*.1,-r*.8,r*.1);ctx.fill();
  ctx.fillStyle=C.cr;ctx.beginPath();circ(-r*.35,-r*.4,r*.22);ctx.fill();
  pop();
}
function drawHand(x,y,s,press){
  // simple paper hand with a pointing finger, fingertip at (x,y)
  push(x,y,-.35,s);
  const pr=press||0;
  paper(()=>rrect(-.11,-.02+pr*.06,.22,.5,.11),C.cr,1.2);
  paper(()=>{ctx.moveTo(-.34,.34);ctx.quadraticCurveTo(-.4,.95,.02,1.02);ctx.quadraticCurveTo(.42,.98,.36,.38);ctx.quadraticCurveTo(.2,.24,-.34,.34);},C.cr,1.2);
  paper(()=>rrect(-.42,.92,.86,.34,.08),C.rd,1,1);
  pop();
}

// ================= bento face rules =================
// order of onigiri(O/S) and tamago(T) decides the expression; broccoli(B) becomes hair shaped by that expression.
const isO=t=>t==='O'||t==='S';
function exprOf(lt){
  const N=lt.filter(t=>t!=='B');
  if(!N.length)return lt.length?'mori':'none';
  if(N.length===1)return isO(N[0])?'kyoton':'suya';
  const a=isO(N[0]),b=isO(N[1]);
  return a&&!b?'warai':!a&&b?'wink':a?'bikkuri':'nikkori';
}
const MOOD=e=>e==='warai'?'W':e==='wink'?'K':'X';
const HAIR={
  curly:[[0,-.6,0,.8],[-.32,-.54,-.35,.64],[.32,-.54,.35,.64]],
  side:[[.47,-.44,.6,.68],[-.47,-.44,-.6,.68],[0,-.6,0,.55]],
  sprout:[[0,-.62,.12,.56],[.2,-.62,.38,.5],[-.2,-.62,-.38,.5]],
  ears:[[-.55,-.06,-.55,.6],[.55,-.06,.55,.6],[0,.32,0,.5]],
  mori:[[-.24,-.12,-.2,.76],[.24,-.12,.2,.76],[0,.22,0,.7]],
};
function layoutFor(types,tiered){
  const lowerCap=tiered?2:3,res=[],lower=[],upper=[];
  types.forEach((t,i)=>{(lower.length<lowerCap?lower:upper).push(i);});
  const lt=lower.map(i=>types[i]);
  const expr=exprOf(lt);
  const N=lower.filter(i=>types[i]!=='B'),Bs=lower.filter(i=>types[i]==='B');
  const set=(i,role,x,y,rot,sc,pose)=>{res[i]={tier:0,role,x,y,rot,sc,pose};};
  if(expr==='warai'){set(N[0],'nose',0,.0,0,.6,'');set(N[1],'mouth',0,.24,0,.92,'arc');}
  else if(expr==='wink'){set(N[0],'eyeR',.22,-.12,PI+.14,.6,'arc');set(N[1],'mouth',0,.25,types[N[1]]==='S'?0:PI,.68,'');}
  else if(expr==='bikkuri'){set(N[0],'eyeL',-.22,-.1,0,.6,'eye');set(N[1],'eyeR',.22,-.1,0,.6,'eye');}
  else if(expr==='nikkori'){set(N[0],'eyeL',-.23,-.06,PI,.5,'arc');set(N[1],'eyeR',.23,-.06,PI,.5,'arc');}
  else if(expr==='kyoton'){set(N[0],'nose',0,.06,0,.7,'');}
  else if(expr==='suya'){set(N[0],'mouth',0,.2,0,.78,'');}
  if(N.length>=3){set(N[2],'cheek',expr==='wink'?-.36:.36,.2,.3,.44,types[N[2]]==='T'?'':'');}
  const hs=tiered?'ears':expr==='warai'?'curly':expr==='wink'?'side':expr==='mori'?'mori':'sprout';
  Bs.forEach((i,j)=>{const h=HAIR[hs][j%3];set(i,'hair',h[0],h[1],h[2],h[3],'');});
  upper.forEach((i,j)=>{const t=types[i];const x=j?.25:-.25;
    if(t==='B')res[i]={tier:1,role:'tree',x,y:-.08,rot:j?.2:-.2,sc:.66,pose:''};
    else if(t==='T')res[i]={tier:1,role:'crown',x,y:.05,rot:j?.25:-.25,sc:.6,pose:''};
    else res[i]={tier:1,role:'bun',x,y:.02,rot:0,sc:.6,pose:''};});
  return {res,expr,hair:hs};
}
const EYES={
  warai:{e:[['hap',-.22,-.16],['hap',.22,-.16]],m:null,ck:1},
  wink:{e:[['dot',-.22,-.14]],m:null,ck:1,spark:1},
  bikkuri:{e:[],m:['o',0,.27],ck:0},
  nikkori:{e:[],m:['smile',0,.25],ck:1},
  kyoton:{e:[['dot',-.2,-.16],['dot',.2,-.16]],m:['line',0,.3],ck:0},
  suya:{e:[['sleep',-.2,-.12],['sleep',.2,-.12]],m:null,ck:1},
  mori:{e:[['dot',-.1,.02],['dot',.1,.02]],m:null,ck:0},
  none:{e:[],m:null,ck:0},
};

// ================= drawing: bento box =================
function itemU(){return L.bw*.46;}
function drawBox(b,x,y,s){
  const bw=L.bw,bh=L.bh,t=G.t;
  let wig=0;if(t-b.wigT<.45){const f=(t-b.wigT)/.45;wig=Math.sin(f*PI*5)*(1-f)*.07;}
  let bob=0;if(t-b.landT<.3){bob=Math.sin((t-b.landT)/.3*PI)*3;}
  push(x,y+bob,wig,s);
  // focus halo (only one thing is ever focused)
  if(G.focus===b){const p=.5+.5*Math.sin(t*6);halo(0,0,bw*.62+p*8,t);}
  // lower tier
  paper(()=>rrect(-bw/2,-bh/2,bw,bh,bw*.12),C.nv,1.3,1.6);
  paper(()=>rrect(-bw/2+bw*.055,-bh/2+bw*.055,bw-bw*.11,bh-bw*.11,bw*.08),C.rd,0,0);
  ctx.fillStyle=C.yl;ctx.beginPath();rrect(-bw*.34,bh/2-bw*.04,bw*.68,bw*.025,2);ctx.fill();
  drawFaceBits(b,0,0,bw,bh);
  // items
  const u=itemU();
  for(const it of b.items)if(it.tier===0&&!it.gone)drawBoxItem(b,it,0,0,bw,bh,u);
  // upper tier: folds up from the partition
  if(b.tiered&&b.riseT>=0){
    const p=clamp((t-b.riseT)/.5,0,1),e=eob(p);
    const ubw=bw*.86,uh=bh*.72,base=-bh/2+2;
    pushS(0,base,0,1,Math.max(.02,e));
    paper(()=>rrect(-ubw/2,-uh,ubw,uh,ubw*.12),C.nv,1,1.6);
    paper(()=>rrect(-ubw/2+ubw*.06,-uh+ubw*.06,ubw-ubw*.12,uh-ubw*.12,ubw*.07),C.rd,0,0);
    ctx.fillStyle=C.yl;ctx.beginPath();rrect(-ubw*.5,-uh*.06,ubw,uh*.09,2);ctx.fill();
    pop();
    if(p>.5)for(const it of b.items)if(it.tier===1&&!it.gone)drawBoxItem(b,it,0,base-uh/2,ubw,uh,u);
  }
  // completion ribbon
  if(b.complete){const p=clamp((t-b.doneT)/.4,0,1);
    push(bw*.42,-bh*.44,.4,eob(p));
    paper(()=>{ctx.moveTo(0,0);ctx.lineTo(-14,-10);ctx.lineTo(-14,10);ctx.closePath();ctx.moveTo(0,0);ctx.lineTo(14,-10);ctx.lineTo(14,10);ctx.closePath();},C.yl,.8);
    paper(()=>circ(0,0,5),C.rd,.4);pop();}
  pop();
}
function itemPos(b,it,ox,oy,w,h){return [ox+it.x*w,oy+it.y*h];}
function drawBoxItem(b,it,ox,oy,w,h,u){
  const t=G.t;let x=ox+it.x*w,y=oy+it.y*h,rot=it.rot,sc=it.sc,sq=0;
  if(it.hop){const f=clamp((t-it.hop.t0)/it.hop.dur,0,1),e=eio(f);
    x=ox+lerp(it.hop.fx,it.x,e)*w;y=oy+lerp(it.hop.fy,it.y,e)*h-Math.sin(f*PI)*it.hop.h;rot=lerp(it.hop.fr,rot,e)+it.hop.spin*(1-e);sc=lerp(it.hop.fs,sc,e);
    if(f>=1)it.hop=null;}
  if(t-it.landT<.25){const f=(t-it.landT)/.25;sq=Math.sin(f*PI)*.35;}
  let glow=G.focus===it;
  if(glow){const p=.5+.5*Math.sin(t*7);halo(x,y,u*sc*.75+p*5,t);y-=Math.abs(Math.sin(t*5))*4;}
  const look=b.look||[0,0];
  drawItem(it.type,x,y,u*sc,rot,{pose:it.pose,sq,lx:look[0],ly:look[1],lid:b.lid||0});
}
function drawFaceBits(b,ox,oy,w,h){
  const f=b.face;if(!f)return;
  const def=EYES[f.expr]||EYES.none,t=G.t;
  const ap=clamp((t-f.t0)/.4,0,1),sp=(1-eo(ap))*PI*2,sc=eob(ap);
  const look=b.look||[0,0],lid=b.lid||0;
  for(const e of def.e){
    const x=ox+e[1]*w,y=oy+e[2]*h,r=w*.055;
    push(x,y,sp,sc);
    if(e[0]==='hap'){
      if(lid<0){ // watching: the paper arc lifts like a lid and a pupil peeks out
        const k=-lid;paper(()=>circ(look[0]*r*.5,0,r*.9),C.nv,.4,0);
        pushS(0,-r*.2,0,1,Math.max(-.7,1-k*1.7)||.01);
        strip(()=>{ctx.arc(0,r*.5,r*1.2,-PI*.85,-PI*.15);},C.nv,r*.7,.3);pop();
      }else strip(()=>{ctx.arc(0,r*.6,r*1.2,-PI*.85,-PI*.15);},C.nv,r*.7,.3);
    }else if(e[0]==='dot'){
      paper(()=>circ(look[0]*r*.5,look[1]*r*.4,r),C.nv,.4,0);
      ctx.fillStyle=C.cr;ctx.beginPath();circ(look[0]*r*.5-r*.35,look[1]*r*.4-r*.35,r*.3);ctx.fill();
      if(lid>0)paper(()=>rrect(-r*1.3,-r*1.4,r*2.6,r*2.6*lid,r*.4),C.yl,.3,1);
    }else if(e[0]==='sleep'){
      strip(()=>{ctx.moveTo(-r,0);ctx.lineTo(r,0);},C.nv,r*.6,.3);
    }
    pop();
  }
  if(def.spark){const x=ox+.4*w,y=oy-.32*h;push(x,y,t*2,sc*(.8+.2*Math.sin(t*6)));paper(()=>starP(w*.05,w*.022,4),C.yl,.4);pop();}
  if(def.m){const m=def.m,x=ox+m[1]*w,y=oy+m[2]*h,r=w*.06;
    push(x,y,0,sc);
    if(m[0]==='o')paper(()=>ell(0,0,r*.8,r,0),C.cr,.4,0);
    else if(m[0]==='smile')paper(()=>{ctx.arc(0,-r*.4,r*1.4,.15*PI,.85*PI);ctx.arc(0,-r*.4,r*.7,.85*PI,.15*PI,true);ctx.closePath();},C.yl,.4);
    else strip(()=>{ctx.moveTo(-r*.8,0);ctx.lineTo(r*.8,0);},C.nv,r*.45,.3);
    pop();}
  if(def.ck){creamDots(ox-.36*w,oy+.1*h,w*.04);creamDots(ox+.36*w,oy+.1*h,w*.04);}
}
function halo(x,y,r,t,col){
  // "glow" without gradients: a slowly turning yamabuki starburst cut behind the target
  push(x,y,t*.8,1);
  paper(()=>starP(r*1.12,r*.86,12),col||(G.phase==='shop'?C.cr:C.yl),0,0);
  pop();
}

// ================= drawing: people =================
function faceMini(expr,x,y,r,look,blink,o){
  // eyes & mouth for clerk / kids. expr: smile|warai|wink|bikkuri|nikkori|kyoton|suya|mori|chew|open|happy
  o=o||{};
  const lx=(look?look[0]:0)*r*.1,ly=(look?look[1]:0)*r*.08;
  const er=r*.11,ey=y-r*.06,ex=r*.34;
  const dot=(px)=>{if(blink>.5)strip(()=>{ctx.moveTo(px-er,ey);ctx.lineTo(px+er,ey);},C.nv,er*.6,0);
    else{ctx.fillStyle=C.nv;ctx.beginPath();circ(px+lx,ey+ly,er);ctx.fill();ctx.fillStyle=C.cr;ctx.beginPath();circ(px+lx-er*.35,ey+ly-er*.35,er*.32);ctx.fill();}};
  const hap=(px)=>strip(()=>{ctx.arc(px,ey+er*.7,er*1.3,-PI*.85,-PI*.15);},C.nv,er*.6,0);
  const e=expr;
  if(e==='warai'||e==='happy'||e==='nikkori'){hap(x-ex);hap(x+ex);}
  else if(e==='wink'){dot(x-ex);hap(x+ex);}
  else if(e==='suya'){strip(()=>{ctx.moveTo(x-ex-er,ey);ctx.lineTo(x-ex+er,ey);ctx.moveTo(x+ex-er,ey);ctx.lineTo(x+ex+er,ey);},C.nv,er*.6,0);}
  else if(e==='bikkuri'){ctx.fillStyle=C.nv;ctx.beginPath();circ(x-ex+lx,ey+ly,er*1.35);circ(x+ex+lx,ey+ly,er*1.35);ctx.fill();ctx.fillStyle=C.cr;ctx.beginPath();circ(x-ex+lx-er*.4,ey+ly-er*.4,er*.4);circ(x+ex+lx-er*.4,ey+ly-er*.4,er*.4);ctx.fill();}
  else {dot(x-ex);dot(x+ex);}
  const my=y+r*.36;
  ctx.fillStyle=C.rd;
  if(e==='open'||e==='bikkuri'||o.open){ctx.beginPath();ell(x,my,r*.14,r*.17*(o.open||1),0);ctx.fill();}
  else if(e==='chew'){const k=.5+.5*Math.sin(G.t*20);ctx.beginPath();ell(x,my,r*.16,r*(.05+.08*k),0);ctx.fill();}
  else if(e==='warai'||e==='happy'){ctx.beginPath();ctx.arc(x,my-r*.06,r*.2,0,PI);ctx.closePath();ctx.fill();}
  else if(e==='suya'||e==='kyoton'){strip(()=>{ctx.moveTo(x-r*.08,my);ctx.lineTo(x+r*.08,my);},C.nv,r*.05,0);}
  else strip(()=>{ctx.arc(x,my-r*.1,r*.16,.2*PI,.8*PI);},C.nv,r*.06,0);
  if(e!=='mori'){pinkDots(x-r*.56,y+r*.2,r*.07);pinkDots(x+r*.56,y+r*.2,r*.07);}
}
function arm(sx,sy,ang,len,w,col){
  push(sx,sy,ang,1);
  paper(()=>rrect(-w/2,-w/2,w,len,w/2),col,.8);
  paper(()=>circ(0,len-w*.2,w*.62),C.cr,.6);
  pop();
}
const KIDSTY=[
  {hair:'pig',shirt:C.yl,acc:C.rd},{hair:'cap',shirt:C.cr,acc:C.rd},{hair:'bob',shirt:C.cr,acc:C.yl},
  {hair:'bun',shirt:C.yl,acc:C.rd},{hair:'band',shirt:C.cr,acc:C.yl},{hair:'spike',shirt:C.yl,acc:C.rd},
];
function drawKid(k){
  const t=G.t,r=k.r,sty=KIDSTY[k.sty%KIDSTY.length];
  let x=k.x,y=k.y;
  let wig=0;if(t-k.wigT<.4){const f=(t-k.wigT)/.4;wig=Math.sin(f*PI*4)*(1-f)*.12;}
  let bounce=0;if(k.pose==='clap'||k.pose==='cheer')bounce=-Math.abs(Math.sin(t*9))*r*.12;
  if(k.walk>0)bounce=-Math.abs(Math.sin(t*12))*r*.18;
  y+=bounce+Math.sin(t*2+k.sty)*r*.03;
  push(x,y,wig,1);
  const seated=k.seated;
  // body
  const bt=r*.82,bb=seated?r*2.0:r*2.55;
  if(seated){paper(()=>rrect(-r*.62,bb-r*.25,r*1.24,r*.5,r*.2),C.nv,.9,1);}
  else{paper(()=>rrect(-r*.5,bb-r*.2,r*.38,r*.55,r*.12),C.nv,.9,1);paper(()=>rrect(r*.12,bb-r*.2,r*.38,r*.55,r*.12),C.nv,.9,1);}
  paper(()=>poly([-r*.52,bt,r*.52,bt,r*.78,bb,-r*.78,bb]),sty.shirt,1);
  if(sty.shirt===C.cr){pinkDots(-r*.3,bt+r*.6,r*.09);pinkDots(r*.3,bt+r*.9,r*.09);}
  else{ctx.fillStyle=sty.acc;ctx.beginPath();rrect(-r*.6,bt+r*.5,r*1.2,r*.14,2);ctx.fill();}
  // arms
  const A=kidArms(k);
  const len=r*1.05,aw=r*.34;
  arm(-r*.55,bt+r*.15,A[0],len,aw,sty.shirt);
  arm(r*.55,bt+r*.15,A[1],len,aw,sty.shirt);
  // head
  hairBack(sty,r);
  paper(()=>circ(0,0,r),C.cr,1.2);
  hairFront(sty,r,t);
  let ex=k.expr||'smile';
  faceMini(ex,0,0,r,k.look,k.blink,{open:k.mouthOpen});
  pop();
}
function hairBack(s,r){
  if(s.hair==='pig'){paper(()=>{circ(-r*1.02,r*.1,r*.36);circ(r*1.02,r*.1,r*.36);},C.nv,1);
    ctx.fillStyle=C.yl;ctx.beginPath();circ(-r*.86,-r*.08,r*.13);circ(r*.86,-r*.08,r*.13);ctx.fill();}
  else if(s.hair==='bob')paper(()=>rrect(-r*1.08,-r*.95,r*2.16,r*1.85,r*.7),C.nv,1);
  else if(s.hair==='bun')paper(()=>circ(0,-r*1.05,r*.42),C.nv,1);
}
function hairFront(s,r,t){
  if(s.hair==='cap'){paper(()=>{ctx.arc(0,-r*.18,r*.98,PI*1.03,PI*1.97);ctx.closePath();},s.acc,.8);
    paper(()=>rrect(-r*.2,-r*.4,r*1.25,r*.2,r*.1),s.acc,.6);paper(()=>circ(0,-r*1.08,r*.12),C.yl,.3);}
  else if(s.hair==='spike')paper(()=>{ctx.moveTo(-r*.95,-r*.1);for(let i=0;i<=6;i++){const a=PI+i*PI/6;const rr2=i%2?r*1.25:r*.98;ctx.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2-r*.05);}ctx.lineTo(r*.95,-r*.1);ctx.quadraticCurveTo(0,-r*.45,-r*.95,-r*.1);},C.nv,.8);
  else{paper(()=>{ctx.arc(0,-r*.05,r*1.0,PI*1.02,PI*1.98);ctx.quadraticCurveTo(r*.3,-r*.5,0,-r*.42);ctx.quadraticCurveTo(-r*.4,-r*.55,-r*.99,-r*.1);},C.nv,.8);
    if(s.hair==='band'){strip(()=>{ctx.arc(0,-r*.05,r*.92,PI*1.12,PI*1.88);},C.yl,r*.16,.3);}
    if(s.hair==='bun'){ctx.fillStyle=s.acc;ctx.beginPath();rrect(-r*.22,-r*.86,r*.44,r*.1,2);ctx.fill();}}
}
function kidArms(k){
  const t=G.t,p=k.pose;
  if(p==='clap'){const s=Math.sin(t*18)*.25;return [-.9-s,.9+s];}
  if(p==='cheer')return [PI-.5+Math.sin(t*8)*.15,-PI+.5-Math.sin(t*8)*.15];
  if(p==='point'||p==='reach'){
    const tx=k.ptx,ty=k.pty;
    const a=Math.atan2(ty-(k.y+k.r),tx-k.x)-PI/2;
    if(p==='reach')return [a+.15,a-.15];
    return tx<k.x?[a,.15]:[-.15,a];
  }
  if(p==='hold')return [-.55,.55];
  if(p==='eat')return [-.3,PI*.82+Math.sin(t*16)*.1];
  if(p==='give'){const a=k.giveDir>0?-1.3:1.3;return k.giveDir>0?[.2,a]:[a,-.2];}
  if(p==='plate')return [-.7+Math.sin(t*6)*.2,.7-Math.sin(t*6)*.2];
  return [.18+Math.sin(t*2)*.04,-.18-Math.sin(t*2)*.04];
}
function drawClerk(){
  const c=G.clerk,t=G.t,x=L.clerk.x,r=L.clerk.r;
  let y=L.clerk.y+Math.sin(t*2.2)*1.2-(t-c.jumpT<.5?Math.sin((t-c.jumpT)/.5*PI)*14:0);
  let lean=Math.sin(t*1.3)*.03+(t-c.pushT<.35?Math.sin((t-c.pushT)/.35*PI)*c.pushDir*.12:0);
  push(x,y,lean,1);
  paper(()=>poly([-r*.7,r*.85,r*.7,r*.85,r*1.15,r*2.3,-r*1.15,r*2.3]),C.nv,1,1.4);
  paper(()=>poly([-r*.3,r*.85,r*.3,r*.85,0,r*1.6]),C.cr,.4);
  paper(()=>poly([-r*.42,r*.85,-r*.22,r*.85,r*.15,r*2.3,-r*.1,r*2.3]),C.rd,.4);
  paper(()=>circ(0,0,r),C.cr,1.2);
  paper(()=>{ctx.arc(0,-r*.05,r*1.0,PI*1.05,PI*1.95);ctx.quadraticCurveTo(0,-r*.55,-r*.97,-r*.2);},C.nv,.8);
  // hachimaki + knot tails
  strip(()=>{ctx.arc(0,r*.2,r*1.0,PI*1.16,PI*1.84);},C.cr,r*.26,.5);strip(()=>{ctx.arc(0,r*.2,r*1.0,PI*1.3,PI*1.7);},C.rd,r*.08,0);
  const fl=Math.sin(t*5)*.25;
  push(r*.92,-r*.42,0,1);
  paper(()=>{ctx.moveTo(0,0);ctx.lineTo(r*.6,-r*.25+fl*r*.3);ctx.lineTo(r*.62,-r*.02+fl*r*.3);ctx.closePath();ctx.moveTo(0,0);ctx.lineTo(r*.55,r*.32-fl*r*.3);ctx.lineTo(r*.42,r*.48-fl*r*.3);ctx.closePath();},C.cr,.6);
  paper(()=>circ(0,0,r*.14),C.cr,.4);ctx.fillStyle=C.rd;ctx.beginPath();circ(0,0,r*.06);ctx.fill();pop();
  faceMini(c.expr,0,0,r,c.look,c.blink);
  pop();
}

const MEM={cycles:[],faces:[],lastEaten:null,starFlags:0,starSlot:false};

  lever:{ang:0,vel:0,target:0,press:0,bend:0,lastSide:-1,pid:null,sent:false,x0:0,y0:0,demo:0},

  parts:[],demo:{lever:false,drag:false,eat:false,t0:-1,kind:''},forceStar:Q.get('star')==='1',
  pk:null,plates:[[],[]]};
function newBox(side){return {side,items:[],assigned:[],tiered:false,riseT:-1,complete:false,doneT:-9,wigT:-9,landT:-9,
  face:{expr:'none',t0:-9},look:[0,0],lid:0,lidT:0,x:0,y:0,s:1,held:-1,drag:null,eatenAll:false};}
function capOf(b){return b.tiered?4:3;}
function newKid(side,sty,fav){return {side,sty,fav,r:L.kr,x:L.kidX[side],y:L.kidY,hx:L.kidX[side],hy:L.kidY,
  pose:'idle',poseUntil:0,look:[0,0],blink:0,blinkNext:1+rng()*3,wigT:-9,expr:'smile',walk:0,seated:false,ptx:0,pty:0,mouthOpen:0,box:-1,plateNext:3+rng()*2,giveDir:0};}
function setPose(k,p,dur,expr){k.pose=p;k.poseUntil=G.t+(dur||.8);if(expr)k.expr=expr;}
function resetShop(first){
  G.boxes=[newBox(0),newBox(1)];
  G.deliveries.length=0;G.lastDir=-1;G.streak=[0,0];G.plates=[[],[]];
  G.lever.target=0;G.lever.lastSide=-1;
  const prevFav=MEM.lastEaten;
  const s0=(G.cycle*2)%KIDSTY.length,s1=(G.cycle*2+1)%KIDSTY.length;
  const favs=['O','T','B'];
  const f0=prevFav?(prevFav==='S'?'O':prevFav):favs[(rng()*3)|0];
  let f1=favs[(rng()*3)|0];if(f1===f0)f1=favs[(favs.indexOf(f0)+1)%3];
  G.kids=[newKid(0,s0,f0),newKid(1,s1,f1)];
  if(!first){
    // new customers walk in from the sides

  }

    k.seated=true;
    if(pk.step==='deliver'&&k.box<0){

  if(pk.step==='swapwait'&&t-pk.stepT>.7)startSwap();
  if(pk.step==='swap')updSwap();

    const s=r.slot==='S'?L.starSlot:L.tray.find(q=>q.t===r.slot);burst(s.x,s.y,5,[C.yl,C.cr],120,5,true);}}
  if(pk.step==='eat'&&G.boxes.every(b=>b.items.every(it=>it.gone))&&!pk.returns.length){pk.step='done';pk.stepT=t;
    G.kids.forEach(k=>setPose(k,'cheer',1,'happy'));SFX.done(1);}

function computeFocus(){
  G.focus=null;G.focusPt=null;
  if(G.phase==='shop'){G.focus='lever';return;}
  if(G.phase!=='picnic'||!G.pk)return;
  const pk=G.pk;
  if(pk.step==='deliver'){const b=G.boxes.find(b=>b.held<0&&!b.drag);if(b){G.focus=b;G.focusPt=[b.x,b.y];}}
  else if(pk.step==='eat'){
    const order=pk.eats%2?[1,0]:[0,1];
    for(const i of order){const b=G.boxes.find(b=>b.held===i);if(!b)continue;const it=b.items.find(it=>!it.gone);if(it){G.focus=it;G.focusPt=boxAbs(b,it);break;}}
  }
}
function update(dt){
  updTimers();updLever(dt);

    G.kids.forEach(k=>{k.hx=L.kidX[k.side];k.hy=L.kidY;if(!k.walk){k.x=k.hx;k.y=k.hy;}k.seated=false;});}

  if(G.demo.t0<0){
    const idle=G.t-G.lastInput;
    const st=(k)=>{G.demo.kind=k;G.demo.t0=G.t;};
    if(G.phase==='shop'&&!G.demo.lever&&G.sends===0&&idle>4&&G.t>4)st('lever');
    else if(G.phase==='picnic'&&G.pk&&G.pk.step==='deliver'&&!G.demo.drag&&idle>4&&G.t-G.pk.stepT>4&&G.focus)st('drag');
    else if(G.phase==='picnic'&&G.pk&&G.pk.step==='eat'&&!G.demo.eat&&idle>4&&G.t-G.pk.stepT>4&&G.focus)st('eat');

  const hw=L.bw*b.s/2+(pad||12),hh=L.bh*b.s/2+(pad||12);
  const top=b.tiered&&b.riseT>=0?L.bh*.72*b.s+8:0;

function onDown(p){
  G.lastInput=G.t;
  if(G.demo.t0>=0){G.demo[G.demo.kind]=true;G.demo.t0=-1;G.lever.demo=0;}
  const ph=G.phase;
  if(G.lever.pid!=null&&!PTR.has(G.lever.pid))G.lever.pid=null;
  if(ph==='shop'){
    if(G.lever.pid==null&&leverHit(p.x,p.y)){leverDown(p);p.role='lever';return;}
    for(const s of L.tray){if(dist(p.x,p.y,s.x,s.y)<L.u*.95){selectType(s.t);p.role='tray';return;}}
    if(MEM.starSlot&&dist(p.x,p.y,L.starSlot.x,L.starSlot.y)<L.u*.9){selectType('S');p.role='tray';return;}
    if(dist(p.x,p.y,L.cx,L.loadY-L.u*.45)<L.u*.75){G.wigLoadT=G.t;SFX.tick();return;}
  }
  if(ph==='picnic'&&G.pk){
    const pk=G.pk;
    if(pk.step==='eat'){
      for(const b of G.boxes){if(b.held<0)continue;
        let best=null,bd=1e9;
        for(const it of b.items){if(it.gone)continue;const q=boxAbs(b,it),d=dist(p.x,p.y,q[0],q[1]);const lim=itemU()*it.sc*b.s*.62+16;if(d<lim&&d<bd){bd=d;best=it;}}

        if(best){eatItem(b,best);return;}
      }

    if(pk.step==='deliver'){
      for(const b of G.boxes){if(b.held<0&&!b.drag&&boxHit(b,p.x,p.y,18)){b.drag={x:b.x,y:b.y,ox:b.x-p.x,oy:b.y-p.y,pid:p.id,sx:p.x,sy:p.y};p.role='drag';p.box=b;SFX.press();b.wigT=G.t-.3;return;}}
    }
  }
  // unrelated things: only a small local wobble
  for(const b of G.boxes){if(b.s>.2&&boxHit(b,p.x,p.y,4)){b.wigT=G.t;SFX.tick();return;}}
  for(const k of G.kids){if(kidHit(k,p.x,p.y)){k.wigT=G.t;tone(nt(660,3+k.side),.08,'sine',.08);return;}}
  if(dist(p.x,p.y,L.clerk.x,L.clerk.y)<L.clerk.r*1.4){G.clerk.jumpT=G.t-.3;SFX.tick();return;}
  flutter(p.x,p.y);

function onUp(p,src,cancel){
  if(src.role==='lever')leverUp(p,cancel);

  forceStar(){G.forceStar=true;},
  geom(){const c=(x,y)=>[OX+x*S,OY+y*S];return {knob:c(...knobPos()),tray:L.tray.map(s=>c(s.x,s.y)),star:c(L.starSlot.x,L.starSlot.y),
    boxes:G.boxes.map(b=>c(b.x,b.y)),laps:G.pk?G.kids.map((k,i)=>c(...G.pk.lap(i))):[],
    items:G.boxes.map(b=>b.items.map(it=>it.gone?null:c(...boxAbs(b,it)))),kids:G.kids.map(k=>c(k.x,k.y)),clerk:c(L.clerk.x,L.clerk.y)};},
};
resize();
resetShop(true);
G.lastInput=0;
start();
})();
</script>
