<script>
(()=>{
'use strict';
/* =====================================================================
   ぽこじゅっぴー！おなべ三重奏とごちそうタワー   (game 261104-26)
   music_rhythm / material / no_animal_princess
   - 陶器の鍋: たたくとスープが隆起し泡の層が積もる (低音+泡)
   - 鉄のフライパン: たたくと卵が折り重なる (油の弾ける音+焼き目)
   - 銅のやかん: たたくと湯が増え湯気が出る (金属の震え+湯滴)
   - 順序で料理が変わる: 鍋→フライパン=具入りオムレツ / フライパン→鍋=卵スープ
     やかん(湯気)→フライパン=厚焼き卵 / やかん(湯気)→鍋=蒸しスープ
   - 三器が満ちるとごちそうタワー → 食卓が広がりお客さんに配膳 → 食べた分だけ器が空く
   文字・数字のUIなし。
   ===================================================================== */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeBack=t=>{t=clamp(t,0,1);const s=1.7,u=t-1;return 1+(s+1)*u*u*u+s*u*u;};
const R=Math.random, rnd=(a,b)=>a+R()*(b-a);
const mtof=m=>440*Math.pow(2,(m-69)/12);
const PENT=[0,2,4,7,9];
const pent=(b,i)=>b+12*Math.floor(i/5)+PENT[((i%5)+5)%5];
const TEST=/[?&]test/.test(location.search);
function spring(o,k,v,target,K,D,dt){
  const n=dt>0.017?2:1, h=dt/n;
  for(let i=0;i<n;i++){ o[v]+=((target-o[k])*K-o[v]*D)*h; o[k]+=o[v]*h; }
}

/* ============================ AUDIO ============================ */
const AU={c:null,m:null,nb:null,hissG:null,ok:false,hissT:0};
function audioInit(){
  try{
    if(!AU.c){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      const c=new AC(); AU.c=c;
      const comp=c.createDynamicsCompressor();
      comp.threshold.value=-14; comp.knee.value=12; comp.ratio.value=4; comp.attack.value=0.004; comp.release.value=0.2;
      comp.connect(c.destination);
      const m=c.createGain(); m.gain.value=0.75; m.connect(comp); AU.m=m;
      const len=Math.floor(c.sampleRate*1.5), b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=R()*2-1;
      AU.nb=b;
      const src=c.createBufferSource(); src.buffer=b; src.loop=true;
      const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=4300; bp.Q.value=0.6;
      const g=c.createGain(); g.gain.value=0;
      src.connect(bp); bp.connect(g); g.connect(m); src.start();
      AU.hissG=g; AU.ok=true;
      const o=c.createOscillator(), og=c.createGain(); og.gain.value=0.0001; o.connect(og); og.connect(m); o.start(); o.stop(c.currentTime+0.02);
    }
    if(AU.c.state==='suspended'&&!document.hidden) AU.c.resume().catch(()=>{});
  }catch(e){ AU.ok=false; }
}
const can=()=>AU.ok&&AU.c&&AU.c.state!=='closed'&&!document.hidden;
const at=()=>AU.c.currentTime+0.004;
function tone(type,f,t,a,dec,peak,f2,glide){
  const c=AU.c, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+(glide||dec));
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);
  o.connect(g); g.connect(AU.m); o.start(t); o.stop(t+a+dec+0.05);
  return o;
}
function noise(t,dur,peak,type,freq,Q,a,f2){
  const c=AU.c, s=c.createBufferSource(); s.buffer=AU.nb;
  const f=c.createBiquadFilter(); f.type=type; f.frequency.setValueAtTime(freq,t);
  if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dur); f.Q.value=Q;
  const g=c.createGain(); a=a||0.004;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);
  s.connect(f); f.connect(g); g.connect(AU.m);
  s.start(t,R()*(AU.nb.duration-dur-0.2),dur+a+0.05);
}
function bell(m,t,peak,dec){ const f=mtof(m); tone('sine',f,t,0.003,dec,peak); tone('sine',f*2,t,0.003,dec*0.5,peak*0.3); tone('sine',f*3.01,t,0.002,dec*0.22,peak*0.12); }
/* 陶器の鍋: 低い「ぽこん」+泡 */
function sPot(i){ if(!can())return; const t=at(), f=mtof(pent(48,i));
  tone('sine',f*1.55,t,0.004,0.5,0.42,f,0.05);
  tone('sine',f*2.01,t,0.004,0.22,0.1);
  tone('triangle',f*3,t,0.002,0.05,0.07);
  const nb=2+((R()*2)|0);
  for(let k=0;k<nb;k++){ const tt=t+0.06+k*rnd(0.05,0.09), b=rnd(260,430); tone('sine',b,tt,0.004,0.07,0.09,b*rnd(2,2.8),0.06); }
}
/* 鉄のフライパン: 「じゅっ」金属+油のはぜる音 */
function sPan(i){ if(!can())return; const t=at(), f=mtof(pent(60,i));
  tone('triangle',f,t,0.002,0.3,0.2);
  tone('sine',f*2.71,t,0.002,0.17,0.08);
  tone('sine',f*4.13,t,0.002,0.09,0.05);
  noise(t,0.42,0.11,'highpass',2600,0.7,0.02);
  for(let k=0;k<5;k++) noise(t+rnd(0.02,0.4),0.012,rnd(0.08,0.17),'bandpass',rnd(2500,6000),2);
}
/* 銅のやかん: 「ぴー」震える金属+湯滴 */
function sKet(i){ if(!can())return; const t=at(), f=mtof(pent(72,i)), c=AU.c;
  const lfo=c.createOscillator(), lg=c.createGain(); lfo.frequency.value=7.5; lg.gain.value=f*0.012; lfo.connect(lg);
  [tone('sine',f,t,0.003,0.95,0.15),tone('sine',f*2.76,t,0.003,0.5,0.055),tone('sine',f*5.4,t,0.002,0.25,0.03)].forEach(o=>lg.connect(o.frequency));
  lfo.start(t); lfo.stop(t+1.05);
  tone('sine',1700,t+0.07,0.003,0.07,0.09,600,0.07);
  tone('sine',1350,t+0.2,0.003,0.06,0.06,520,0.06);
}
function sWhistle(){ if(!can())return; const t=at(), c=AU.c;
  const o=c.createOscillator(), g=c.createGain(), l=c.createOscillator(), lg=c.createGain();
  o.type='sine'; o.frequency.setValueAtTime(1400,t); o.frequency.exponentialRampToValueAtTime(1900,t+0.3);
  l.frequency.value=6; lg.gain.value=28; l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.06,t+0.15); g.gain.setValueAtTime(0.06,t+0.45); g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
  o.connect(g); g.connect(AU.m); o.start(t); o.stop(t+0.95); l.start(t); l.stop(t+0.95);
  noise(t,0.8,0.05,'bandpass',3600,1,0.1);
}
function sCombo(){ if(!can())return; const t=at(); [72,76,79,84].forEach((m,j)=>bell(m,t+j*0.075,0.13,0.55)); }
function sFull(i){ if(!can())return; const t=at(), base=[60,62,65][i]||60;
  [0,4,7,12].forEach((d,j)=>tone('triangle',mtof(base+12+d),t+j*0.025,0.03,1.0,0.055));
  bell(91,t+0.18,0.06,0.5); bell(96,t+0.32,0.05,0.5);
}
function sFanfare(){ if(!can())return; const t=at();
  [60,64,67,72,76,79,84].forEach((m,j)=>{ tone('triangle',mtof(m),t+j*0.07,0.005,0.3,0.09); bell(m+12,t+j*0.07,0.04,0.3); });
  [72,76,79,84].forEach(m=>tone('triangle',mtof(m),t+0.55,0.05,1.3,0.06));
  tone('sine',110,t+0.5,0.004,0.35,0.35,48,0.3);
}
function sSteam(){ if(!can())return; const t=at(); noise(t,0.55,0.12,'bandpass',4200,0.8,0.03,1500); }
function sFluff(){ if(!can())return; const t=at(); noise(t,0.2,0.06,'lowpass',1300,0.7,0.02); tone('sine',320,t,0.01,0.16,0.05,560,0.14); }
function sSplash(){ if(!can())return; const t=at(); tone('sine',380,t,0.003,0.16,0.14,140,0.14); noise(t,0.12,0.08,'lowpass',900,0.8); }
function sPlop(){ if(!can())return; const t=at(); tone('sine',520,t,0.003,0.06,0.08,900,0.05); }
function sServe(){ if(!can())return; const t=at(); noise(t,0.32,0.14,'bandpass',700,1.2,0.05,2600); tone('sine',500,t,0.02,0.28,0.08,1000,0.28); }
function sChink(){ if(!can())return; const t=at(); tone('sine',2637,t,0.002,0.18,0.07); tone('sine',3951,t,0.002,0.12,0.04); }
function sMunch(){ if(!can())return; const t=at(); noise(t,0.07,0.5,'bandpass',600,1.5); noise(t+0.1,0.06,0.38,'bandpass',760,1.5); tone('sine',180,t,0.005,0.08,0.08,120,0.08); }
function sClap(){ if(!can())return; const t=at(); noise(t,0.05,0.3,'bandpass',1500,0.9,0.002); noise(t,0.03,0.1,'highpass',3000,0.7,0.002); }
function sJoy(lv){ if(!can())return; const t=at();
  const seq=lv>=3?[79,83,86,91,95,98]:[76,79,84,88];
  seq.forEach((m,j)=>bell(m,t+j*0.06,lv>=3?0.1:0.08,0.45));
}
function sTick(){ if(!can())return; const t=at(); tone('sine',620,t,0.003,0.07,0.04,720,0.06); }
function updateAudio(dt){
  if(!AU.ok||!AU.hissG) return;
  AU.hissT-=dt; if(AU.hissT>0) return; AU.hissT=0.12;
  let g=0; if(ket.steamT>0) g=0.02+0.03*ket.water; if(pot.lidT>0||pan.lidT>0) g+=0.012;
  try{ AU.hissG.gain.setTargetAtTime(document.hidden?0:g,AU.c.currentTime,0.15); }catch(e){}
}

/* ============================ TEXTURES ============================ */
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const TEX={}, PAT={};
function buildTex(){
  let c,x,g;
  c=mk(64,64);x=c.getContext('2d');g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.5,'rgba(255,255,255,0.55)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);TEX.puff=c;
  c=mk(128,128);x=c.getContext('2d');g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,246,205,0.95)');g.addColorStop(0.45,'rgba(255,228,155,0.45)');g.addColorStop(1,'rgba(255,215,140,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);TEX.glow=c;
  c=mk(32,32);x=c.getContext('2d');g=x.createRadialGradient(16,16,0,16,16,15);
  g.addColorStop(0,'rgba(255,255,255,0.14)');g.addColorStop(0.72,'rgba(255,255,255,0.24)');g.addColorStop(0.9,'rgba(255,255,255,0.85)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,32,32);x.fillStyle='rgba(255,255,255,0.95)';x.beginPath();x.ellipse(11,10,3.2,2.2,-0.6,0,TAU);x.fill();TEX.bub=c;
  c=mk(32,32);x=c.getContext('2d');g=x.createRadialGradient(13,12,0,16,16,15);
  g.addColorStop(0,'rgba(255,255,255,0.85)');g.addColorStop(0.6,'rgba(250,244,232,0.7)');g.addColorStop(0.88,'rgba(236,224,200,0.9)');g.addColorStop(1,'rgba(220,205,175,0)');
  x.fillStyle=g;x.fillRect(0,0,32,32);x.fillStyle='rgba(255,255,255,1)';x.beginPath();x.ellipse(11,10,3.4,2.4,-0.6,0,TAU);x.fill();TEX.foam=c;
  c=mk(48,48);x=c.getContext('2d');g=x.createRadialGradient(24,24,0,24,24,24);
  g.addColorStop(0,'rgba(255,255,240,1)');g.addColorStop(0.22,'rgba(255,245,200,0.55)');g.addColorStop(1,'rgba(255,240,180,0)');
  x.fillStyle=g;x.fillRect(0,0,48,48);x.fillStyle='rgba(255,255,245,0.9)';
  x.beginPath();x.ellipse(24,24,22,2.2,0,0,TAU);x.fill();x.beginPath();x.ellipse(24,24,2.2,22,0,0,TAU);x.fill();TEX.glint=c;
  c=mk(16,16);x=c.getContext('2d');g=x.createRadialGradient(6,6,0,8,8,8);
  g.addColorStop(0,'rgba(250,254,255,1)');g.addColorStop(0.5,'rgba(190,225,240,0.9)');g.addColorStop(1,'rgba(150,200,225,0)');x.fillStyle=g;x.fillRect(0,0,16,16);TEX.drop=c;
  c=mk(16,16);x=c.getContext('2d');g=x.createRadialGradient(8,8,0,8,8,8);
  g.addColorStop(0,'rgba(255,252,220,1)');g.addColorStop(0.5,'rgba(255,214,110,0.8)');g.addColorStop(1,'rgba(255,190,80,0)');x.fillStyle=g;x.fillRect(0,0,16,16);TEX.oil=c;
  c=mk(128,128);x=c.getContext('2d');
  for(let i=0;i<1100;i++){const v=R();x.fillStyle=v<0.5?`rgba(40,36,32,${rnd(0.05,0.2)})`:v<0.86?`rgba(255,252,245,${rnd(0.06,0.24)})`:`rgba(130,95,70,${rnd(0.08,0.2)})`;x.beginPath();x.arc(R()*128,R()*128,rnd(0.6,2.3),0,TAU);x.fill();}
  TEX.stone=c;
  c=mk(256,256);x=c.getContext('2d');
  for(let i=0;i<70;i++){const r=rnd(10,46),px=R()*256,py=R()*256,l=R()<0.5;
    for(const ox of [-256,0,256])for(const oy of [-256,0,256]){const cx=px+ox,cy=py+oy;if(cx+r<0||cx-r>256||cy+r<0||cy-r>256)continue;
      g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,l?'rgba(255,250,240,0.24)':'rgba(170,140,100,0.12)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(cx-r,cy-r,r*2,r*2);}}
  TEX.plaster=c;
  c=mk(256,64);x=c.getContext('2d');
  for(let i=0;i<24;i++){const y0=R()*64,amp=rnd(0.6,2.6),k=1+((R()*3)|0),ph=R()*TAU;
    x.strokeStyle=`rgba(90,48,18,${rnd(0.08,0.22)})`;x.lineWidth=rnd(0.6,1.9);x.beginPath();
    for(let px=0;px<=256;px+=8){const y=y0+Math.sin(px/256*TAU*k+ph)*amp;px?x.lineTo(px,y):x.moveTo(px,y);}x.stroke();}
  TEX.wood=c;
  c=mk(6,6);x=c.getContext('2d');x.fillStyle='rgba(150,125,95,0.12)';x.fillRect(0,0,6,1);x.fillRect(0,0,1,6);x.fillStyle='rgba(255,255,255,0.12)';x.fillRect(3,3,3,1);TEX.linen=c;
  PAT.stone=ctx.createPattern(TEX.stone,'repeat');
  PAT.wood=ctx.createPattern(TEX.wood,'repeat');
  PAT.linen=ctx.createPattern(TEX.linen,'repeat');
}

/* ============================ GRADIENTS (local coords, cached) ============================ */
const GR={};
function lg(x0,y0,x1,y1,st){const g=ctx.createLinearGradient(x0,y0,x1,y1);for(const s of st)g.addColorStop(s[0],s[1]);return g;}
function rg(x0,y0,r0,x1,y1,r1,st){const g=ctx.createRadialGradient(x0,y0,r0,x1,y1,r1);for(const s of st)g.addColorStop(s[0],s[1]);return g;}
const GIRL={skin:'#f8d9c3',skinL:'#fff0e4',skinD:'#e4ae8e',hair:'#7a4a2c',hairL:'#9a6440',hairD:'#4a2a18',style:'girl'};
const GDEF=[
  {skin:'#f2cfb3',skinL:'#fde8d8',skinD:'#d6a585',hair:'#d4cec8',hairL:'#f0ece8',hairD:'#9d958e',style:'bun',shirt:'#a690cc',shirtL:'#c7b6e4',shirtD:'#7a63a3',glasses:true,
    fav:v=>v.src==='pot'&&v.steam},
  {skin:'#dea47c',skinL:'#f3c6a4',skinD:'#b97f5a',hair:'#2e2420',hairL:'#55463e',hairD:'#141010',style:'short',shirt:'#5eae69',shirtL:'#8fd096',shirtD:'#3c8549',stripe:true,
    fav:v=>v.src==='pan'&&v.fill},
  {skin:'#f0c4a0',skinL:'#fde0c8',skinD:'#cf9c78',hair:'#6b4a33',hairL:'#8e6a4e',hairD:'#45301f',style:'dad',shirt:'#5a83c2',shirtL:'#89aedf',shirtD:'#3c5f97',collar:true,
    fav:v=>v.src==='pan'&&v.thick},
  {skin:'#c98d68',skinL:'#e4ad8a',skinD:'#a56d4b',hair:'#231a17',hairL:'#47372f',hairD:'#0f0b0a',style:'pony',shirt:'#d9485f',shirtL:'#f07b8c',shirtD:'#a92f43',
    fav:v=>v.src==='pot'&&v.egg},
];
function defGrads(d){
  d.skinG=rg(-12,-14,3,0,0,44,[[0,d.skinL],[0.62,d.skin],[1,d.skinD]]);
  d.hairG=lg(0,-48,0,40,[[0,d.hairL],[0.5,d.hair],[1,d.hairD]]);
  if(d.shirt) d.shirtG=lg(-36,-60,36,40,[[0,d.shirtL],[0.5,d.shirt],[1,d.shirtD]]);
}
function buildGrads(){
  GR.potBody=lg(-138,0,138,0,[[0,'#132a42'],[0.22,'#2b5884'],[0.4,'#5089ba'],[0.52,'#3a6c9a'],[0.78,'#21456b'],[1,'#10233a']]);
  GR.potShade=lg(0,-150,0,0,[[0,'rgba(255,255,255,0.1)'],[0.6,'rgba(0,0,0,0)'],[1,'rgba(0,0,25,0.38)']]);
  GR.potInner=rg(0,-150,10,0,-118,110,[[0,'#3b302a'],[1,'#120e0c']]);
  GR.potRim=lg(-110,0,110,0,[[0,'#c7b08a'],[0.3,'#fff3da'],[0.55,'#efe0c2'],[1,'#b0986f']]);
  GR.drip=lg(0,-130,0,-60,[[0,'#f3e7cd'],[1,'#d6c19c']]);
  GR.soup=rg(-28,-10,4,0,0,105,[[0,'#fffbf2'],[0.5,'#f7e9cd'],[1,'#e4cca0']]);

function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.01,rx),Math.max(0.01,ry),rot||0,0,TAU);}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0.01,r),0,TAU);}
function starPath(x,y,R1,R2,n){ctx.beginPath();for(let i=0;i<n*2;i++){const r=i%2?R2:R1,a=-PI/2+i*PI/n;const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
function dripPath(rx,ry,cy,band){ // cream glaze dripping below the rim front
  ctx.beginPath(); const N=16;
  for(let i=0;i<=N;i++){const a=PI*i/N, x=Math.cos(a)*rx, y=cy+Math.sin(a)*ry; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  for(let i=N;i>=0;i--){const a=PI*i/N, x=Math.cos(a)*rx*0.99, w=band*(0.55+0.45*Math.abs(Math.sin(i*1.9))+(i%5===2?0.5:0)); ctx.lineTo(x,cy+Math.sin(a)*ry+w*Math.sin(a)+2);}
  ctx.closePath();
}

const L={W:1,H:1,dpr:1,st:0,sb:0,sl:0,sr:0,sp:200,KK:{x:0,y:0,s:1},KF:{x:0,y:0,s:1},TK:{x:0,y:0,s:1},TF:{x:0,y:0,s:1}};

function layout(){
  const W=Math.max(200,window.innerWidth|0), H=Math.max(200,window.innerHeight|0);
  const dpr=Math.min(2,window.devicePixelRatio||1);
  L.W=W;L.H=H;L.dpr=dpr;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px';
  try{const cs=getComputedStyle(safeEl);L.st=parseFloat(cs.paddingTop)||0;L.sb=parseFloat(cs.paddingBottom)||0;L.sl=parseFloat(cs.paddingLeft)||0;L.sr=parseFloat(cs.paddingRight)||0;}catch(e){}
  const aw=W-L.sl-L.sr, ah=H-L.st-L.sb, cx=L.sl+aw/2, bot=L.st+ah;
  const k=Math.min(aw/660,ah/840);
  L.sp=clamp(aw/k*0.29,200,300);
  L.KK={x:cx,y:bot-252*k,s:k};
  const head=L.KK.y-338*k, av=head-L.st;
  const ts=Math.max(0.12,Math.min(k*0.78,(av-10)/300));
  let ty=head-76*ts+26*k; if(ty-178*ts<L.st+4) ty=L.st+4+178*ts;
  L.TK={x:cx,y:ty,s:ts};
  const kf=Math.min(aw/660,ah*0.42/590);
  L.KF={x:cx,y:bot-252*kf,s:kf};
  const headF=L.KF.y-338*kf, avF=headF-L.st;
  const tf=Math.max(0.12,Math.min(aw/720,(avF-6)/500));
  let tyF=headF-84*tf+22*kf; if(tyF-400*tf<L.st+3) tyF=L.st+3+400*tf;
  L.TF={x:cx,y:tyF,s:tf};
  L.side=aw/ah>1.6;
  if(L.side){ // とても横長の画面: ごちそうの時は台所と食卓を左右に並べる
    const k2=Math.min(aw*0.47/(2*(L.sp+138)),ah*0.97/600);
    L.KF={x:L.sl+aw*0.25,y:bot-252*k2,s:k2};
    const t2=Math.min(aw*0.5/720,(ah-8)/500);
    L.TF={x:L.sl+aw*0.73,y:L.st+4+400*t2+Math.max(0,(ah-8-500*t2)*0.5),s:t2};

function camera(){

const k2s=(x,y)=>({x:KX.x+x*KX.s,y:KX.y+y*KX.s});

function buildBackground(){
  const W=L.W,H=L.H,d=L.dpr; bg.width=Math.round(W*d); bg.height=Math.round(H*d);
  const c=bgx; c.setTransform(d,0,0,d,0,0);

  g.addColorStop(0,'rgba(255,250,232,0.6)'); g.addColorStop(1,'rgba(255,250,232,0)'); c.fillStyle=g; c.fillRect(0,0,W,H);
  const f=ww*0.05;
  archP(c,wx-f,wy-f,ww+2*f,wh+2*f); g=c.createLinearGradient(wx-f,0,wx+ww+f,0);
  g.addColorStop(0,'#8f6038'); g.addColorStop(0.5,'#c48e5c'); g.addColorStop(1,'#875a33'); c.fillStyle=g; c.fill();

  c.save(); archP(c,wx,wy,ww,wh); c.clip();
  c.fillStyle='rgba(255,255,255,0.8)';
  for(const cl of [[0.25,0.28,0.12],[0.36,0.25,0.09],[0.72,0.36,0.1],[0.8,0.33,0.07]]){c.beginPath();c.ellipse(wx+ww*cl[0],wy+wh*cl[1],ww*cl[2],ww*cl[2]*0.45,0,0,TAU);c.fill();}
  c.fillStyle='#b2cf93'; c.beginPath(); c.moveTo(wx,wy+wh); c.quadraticCurveTo(wx+ww*0.3,wy+wh*0.6,wx+ww*0.6,wy+wh*0.78); c.quadraticCurveTo(wx+ww*0.85,wy+wh*0.64,wx+ww,wy+wh*0.72); c.lineTo(wx+ww,wy+wh); c.fill();
  c.fillStyle='#93bb79'; c.beginPath(); c.moveTo(wx,wy+wh*0.85); c.quadraticCurveTo(wx+ww*0.45,wy+wh*0.72,wx+ww,wy+wh*0.9); c.lineTo(wx+ww,wy+wh); c.lineTo(wx,wy+wh); c.fill();
  g=c.createLinearGradient(wx,wy,wx+ww,wy+wh); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.45,'rgba(255,255,255,0.22)'); g.addColorStop(0.55,'rgba(255,255,255,0)'); c.fillStyle=g; c.fillRect(wx,wy,ww,wh);
  c.restore();
  g=c.createLinearGradient(W/2-f*0.4,0,W/2+f*0.4,0); g.addColorStop(0,'#946640'); g.addColorStop(0.5,'#c79461'); g.addColorStop(1,'#8a5c36');
  c.fillStyle=g; c.fillRect(W/2-f*0.38,wy+ww*0.15,f*0.76,wh-ww*0.15); c.fillRect(wx,wy+wh*0.55,ww,f*0.6);
  g=c.createLinearGradient(0,wy+wh+f*0.4,0,wy+wh+f*1.8); g.addColorStop(0,'#d7a875'); g.addColorStop(1,'#8f6038');
  c.fillStyle=g; c.fillRect(wx-f*1.7,wy+wh+f*0.5,ww+f*3.4,f*1.2);
}
function drawFloor(){

const P=[], MAXP=150;
function emit(kind,x,y,o){ o=o||{}; if(P.length>=MAXP) P.shift();
  P.push({kind,x,y,vx:o.vx||0,vy:o.vy||0,g:o.g||0,drag:o.drag||0,life:0,max:o.max||1,size:o.size||8,grow:o.grow||0,col:o.col||'#fff',a:o.a==null?1:o.a}); }
function updateParticles(dt){
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.life+=dt; if(p.life>=p.max){P.splice(i,1);continue;}
    p.vy+=p.g*dt; if(p.drag){const d=Math.max(0,1-p.drag*dt);p.vx*=d;p.vy*=d;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.size=Math.max(0.2,p.size+p.grow*dt); }
}
function drawParticles(){
  useS();
  for(const p of P){ const t=p.life/p.max; let a=p.a*(1-t); if(p.kind==='puff') a=p.a*Math.min(1,t*6)*(1-t); if(a<=0.01) continue;
    ctx.globalAlpha=a; const s=p.size;
    if(p.kind==='puff') ctx.drawImage(TEX.puff,p.x-s,p.y-s,s*2,s*2);
    else if(p.kind==='bub') ctx.drawImage(TEX.bub,p.x-s,p.y-s,s*2,s*2);
    else if(p.kind==='glint'){ const z=s*(0.6+0.6*Math.sin(t*PI)); ctx.drawImage(TEX.glint,p.x-z,p.y-z,z*2,z*2); }
    else if(p.kind==='drop') ctx.drawImage(TEX.drop,p.x-s,p.y-s,s*2,s*2);
    else if(p.kind==='oil') ctx.drawImage(TEX.oil,p.x-s,p.y-s,s*2,s*2);
    else { ctx.fillStyle=p.col; circ(p.x,p.y,s); ctx.fill(); }
  }
  ctx.globalAlpha=1;
}
function glints(x,y,n,r,s){ for(let i=0;i<n;i++){ const a=rnd(0,TAU), d=rnd(0.3,1)*r; emit('glint',x+Math.cos(a)*d,y+Math.sin(a)*d*0.6,{vy:-rnd(10,40),max:rnd(0.5,0.9),size:s*rnd(0.7,1.2)}); } }
const FL=[];
function addFlyer(o){ o.t=-(o.delay||0); FL.push(o); }
const busy=()=>FL.some(o=>o.land); // 中身を運ぶ飛行物だけ (湯気の飾りは除く)
function updateFlyers(dt){ for(let i=FL.length-1;i>=0;i--){ const o=FL[i]; o.t+=dt; if(o.t>=o.dur){ FL.splice(i,1); if(o.land) o.land(o); } } }
function drawFlyers(){
  for(const o of FL){ if(o.t<0) continue; const p=clamp(o.t/o.dur,0,1), a=o.from(), b=o.to(), e=o.lin?p:ease(p);
    const x=lerp(a.x,b.x,e), y=lerp(a.y,b.y,e)-o.arc*KX.s*4*p*(1-p);
    o.draw(x,y,p,o); }
  useS();
}

}
function callGuests(){ const n=S.round===0?3:4; let d=0;
  for(let i=0;i<n;i++){ const g=guests[i]; if(!g.present){ g.present=true; g.state='walk'; g.walk=0; g.walkDelay=d; d+=0.35; g.x=g.seat+Math.sign(g.seat)*520; } } }
function chooseWants(){
  const Ls=tower.layers, pres=guests.filter(g=>g.present);
  pres.forEach((g,i)=>{ const order=Ls.map((_,j)=>(j+i+S.round)%Ls.length);
    let w=order.find(j=>Ls[j].amount>0.1&&!g.eaten.has(Ls[j].v.key)); if(w==null) w=order.find(j=>Ls[j].amount>0.1); g.want=w==null?-1:w; });
}
function startFeast(){ S.phase='feast'; S.phaseT=0; S.doneWait=0; S.feastIdle=0;
  for(const g of guests) if(g.present){ g.state='wait'; g.t=0; }
  chooseWants(); logE('feast',{guests:guests.filter(g=>g.present).length,wants:guests.filter(g=>g.present).map(g=>tower.layers[g.want]?tower.layers[g.want].v.key:'-')}); }
function serve(g){
  if(g.state!=='wait'){ g.wigV+=8; sTick(); return; }
  const Ls=tower.layers; let li=g.want;
  if(li<0||!Ls[li]||Ls[li].amount<=0.05){ li=-1; let best=0.05; Ls.forEach((Ly,j)=>{ if(Ly.amount>best){ best=Ly.amount; li=j; } }); }
  if(li<0){ g.wigV+=8; return; }
  const Ly=Ls[li]; g.want=li;
  const food={src:Ly.src,v:Ly.v,snap:Ly.snap,left:1};
  if(Ly.src==='pan'){ const ls=Ly.snap.layers, n=Math.min(ls.length,eggN(Ly.snap,Ly.amount)); food.layer=ls[n-1]||newLayer(false); food.layer2=ls[n-2]||null;
    food.v=eggVariant([food.layer,food.layer2].filter(Boolean)); }
  const cx=Ly.cx, cy=Ly.cy;
  Ly.amount=Math.max(0,Ly.amount-0.36); Ly.bv-=6; tower.swV+=3;
  if(Ly.src==='pot'){ const ng=Math.round(Ly.snap.gu.length*0.36); Ly.snap.gu.splice(0,ng); const ne=Math.round(Ly.snap.eggs.length*0.36); Ly.snap.eggs.splice(0,ne); }
  g.state='incoming'; g.food=food; S.serves++; S.feastIdle=0;
  girl.serve=0.7; girl.mode='joy'; girl.modeT=0.7; girl.jv=-120; sServe();
  addFlyer({kind:'portion',dur:0.6,arc:60,from:()=>t2s(cx,cy),to:()=>t2s(g.seat*0.93,10),
    draw:(x,y,p)=>{ useAt(x,y,TX.s*(1.1-0.1*p)); drawPortion(food); },
    land:()=>{ g.state='eat'; g.t=0; g.bites=0; sChink(); const c=t2s(g.seat*0.93,6); glints(c.x,c.y,3,40*TX.s,16*TX.s); } });
  logE('serve',{guest:g.i,dish:food.v.key,layer:li,left:+Ly.amount.toFixed(2)});
}
function guestReact(g){
  const v=g.food.v, fav=g.def.fav(v), isNew=!g.eaten.has(v.key);
  g.level=fav?3:isNew?2:1; g.eaten.add(v.key);
  sJoy(g.level); girlJoy(0.8);
  const c=t2s(g.seat,-130); if(g.level>=2) glints(c.x,c.y,g.level===3?8:4,70*TX.s,20*TX.s);
  if(!S.disc.d5ate){ S.disc.d5ate=1; }
  logE('ate',{guest:g.i,dish:v.key,level:g.level});
}
function startReturn(){
  S.phase='toKitchen'; S.phaseT=0;
  for(const g of guests) if(g.present){ g.state='rest'; g.t=0; }
  const back=[];
  if(tower){ tower.layers.forEach((Ly,i)=>{ if(!Ly.landed||Ly.amount<=0.02){ Ly.gone=true; return; } const key=Ly.src, cx=Ly.cx, cy=Ly.cy; Ly.gone=true;
    back.push(key+':'+Ly.amount.toFixed(2));
    addFlyer({kind:'return',delay:i*0.14,dur:0.8,arc:110,from:()=>t2s(cx,cy),to:()=>CENTER[key](),
      draw:(x,y,p)=>{ const s=lerp(TX.s*Ly.sc,KX.s*0.8,p); useAt(x,y,s); ctx.translate(0,unitH(Ly.src,Ly.snap,Ly.amount)*0.5); drawUnit(Ly.src,Ly.snap,Ly.amount); },
      land:()=>{ mergeBack(key,Ly.snap,Ly.amount); V[key].q=1; V[key].hv=-120; sPlop(); checkFull(); } }); }); }
  S.returned=true; logE('return',{back});
}
function mergeBack(key,snap,amt){
  if(key==='pot'){ pot.soup=Math.min(1.25,pot.soup+snap.soup*amt);
    for(const g of snap.gu){ if(pot.gu.length<10) pot.gu.push(g); }
    for(const e of snap.eggs){ if(pot.eggs.length<12) pot.eggs.push(e); }
    pot.steamed=Math.max(pot.steamed,snap.steamed*0.35); pot.foam=Math.max(pot.foam,0.3); pot.surge=1; }
  else if(key==='pan'){ const n=Math.round(snap.layers.length*amt); const back=snap.layers.slice(0,n).map(l=>Object.assign(l,{born:S.time-1,fd:0})); pan.layers=back.concat(pan.layers).slice(0,9); }
  else { ket.water=Math.min(1,ket.water+snap.water*amt); }
}
function updatePhase(dt){
  S.phaseT+=dt; const t=S.phaseT;
  if(S.phase==='kitchen'){
    if(isFull.pot()&&isFull.pan()&&isFull.ket()&&!busy()&&S.roundTaps>0){ S.towerWait+=dt; if(S.towerWait>0.75) startTower(); } else S.towerWait=0;
  }else if(S.phase==='toTower'){
    S.stretch=t<0.85?ease(t/0.8):0;
    if(!S.cleared&&t>=0.85){ S.cleared=true; snapshotToTower(); }
    if(t>=0.95) S.viewTarget=1;
    if(t>=2.4) S.riseTarget=0;
    if(t>=1.9&&!S.guestCalled){ S.guestCalled=true; callGuests(); }
    if(t>=3.0&&tower&&tower.layers.every(l=>l.landed)&&guests.every(g=>!g.present||g.state!=='walk')) startFeast();
  }else if(S.phase==='feast'){
    if(guests.filter(g=>g.present).every(g=>g.state==='done')){ S.doneWait+=dt; if(S.doneWait>1.0) startReturn(); } else S.doneWait=0;
  }else if(S.phase==='toKitchen'){
    if(t>=0.5) S.viewTarget=0;
    if(t>=1.9&&!busy()){ tower=null; S.phase='kitchen'; S.phaseT=0; S.roundTaps=0; S.round++; logE('round',{round:S.round}); }
  }
}
function updateTower(dt){ if(!tower) return; spring(tower,'sw','swV',0,60,4.5,dt); for(const Ly of tower.layers) spring(Ly,'b','bv',0,260,12,dt); towerLayout(); }
function updateGuests(dt){
  for(const g of guests){
    if(!g.present) continue;
    g.t+=dt;
    g.blinkT-=dt; if(g.blinkT<0){ g.blinkT=rnd(2,5); g.blinkD=0.12; } g.blinkD=Math.max(0,g.blinkD-dt);
    g.cheek=Math.max(0,g.cheek-dt*1.4);
    spring(g,'wig','wigV',0,240,9,dt); spring(g,'jy','jv',0,200,12,dt); spring(g,'hop','hopV',0,260,14,dt);
    const f=g.face; f.blink=g.blinkD>0?1:0; f.eyes='n'; f.mouth='smile'; f.cheek=g.cheek*0.8+Math.min(0.5,g.stack.length*0.08); f.lx=0; f.ly=0.4;
    let pt=0;
    switch(g.state){
      case 'walk': { g.walkDelay-=dt; if(g.walkDelay>0) break; g.walk=Math.min(1,g.walk+dt/1.2); const e=ease(g.walk);
        g.x=g.seat+Math.sign(g.seat)*520*(1-e); g.yOff=-Math.abs(Math.sin(g.walk*PI*5))*7*(1-e)-10*(1-e); f.lx=-Math.sign(g.seat)*0.8; f.mouth='open';
        if(g.walk>=1){ g.state='sit'; g.x=g.seat; g.yOff=0; g.jv=80; } break; }
      case 'sit': f.ly=0.5; f.lx=-Math.sign(g.seat)*0.6; break;
      case 'wait': pt=1; f.lx=-Math.sign(g.seat)*0.9; f.ly=-0.3; if(S.hint&&S.hint.g===g){ f.mouth='open'; } break;
      case 'incoming': f.eyes='wow'; f.mouth='O'; f.ly=0.8; f.lx=-Math.sign(g.seat)*0.3; break;
      case 'eat': { const bt=[0.3,0.95,1.6]; if(g.bites<3&&g.t>=bt[g.bites]){ g.bites++; sMunch(); g.cheek=1; if(g.food) g.food.left=Math.max(0,1-g.bites/3);
          const c=t2s(g.seat*0.93,4); for(let k=0;k<3;k++) emit('food',c.x+rnd(-14,14)*TX.s,c.y-6*TX.s,{vy:-rnd(40,90)*TX.s,vx:rnd(-40,40)*TX.s,g:500*TX.s,max:0.4,size:rnd(1.6,2.6)*TX.s,col:RES[g.food.src]}); }
        f.mouth=(g.t%0.65<0.38)?'chew':'smile'; f.chew=g.t*14; f.eyes=g.cheek>0.4?'happy':'n'; f.ly=0.8; f.cheek=Math.max(f.cheek,g.cheek);
        if(g.t>=2.15){ guestReact(g); g.state='clap'; g.t=0; g.claps=0; } break; }
      case 'clap': { const n=g.level===3?6:g.level===2?4:3, iv=0.22;
        if(g.claps<n&&g.t>=g.claps*iv+0.05){ g.claps++; sClap(); if(g.level===3&&g.claps%2===1) g.jv=-170; if(g.level===2&&g.claps===1) g.jv=-110; }
        f.eyes=g.level>=2&&g.t<0.6?'wow':'happy'; f.mouth=g.level===3?'big':'open'; f.cheek=g.level===3?1:0.6;
        if(g.t>=n*iv+0.55){ g.state='done'; g.t=0; g.stack.push(g.food.src); g.food=null; } break; }
      case 'done': case 'rest': f.ly=0.7; f.eyes=g.t<0.9?'happy':'n'; if(S.phase==='kitchen'){ f.lx=-Math.sign(g.seat)*0.4; f.ly=0.9; } break;
    }
    g.pointA+=(pt-g.pointA)*Math.min(1,dt*6);
  }
}
/* ---------- guidance ---------- */
function planHint(){
  if(S.phase==='feast'){ const g=guests.find(g=>g.present&&g.state==='wait'); return g?{g}:null; }
  if(S.phase!=='kitchen') return null;
  const d=S.disc;
  if(!d.d3a){ if(pot.soup<0.42||pot.gu.length===0) return 'pot'; return S.last==='pot'?'pan':'pot'; }
  if(!d.d3b){ if(pan.layers.length===0) return 'pan'; return S.last==='pan'?'pot':'pan'; }
  if(!d.d4a||!d.d4b){ if(ket.steamT<=0.8) return 'ket'; return !d.d4a?'pan':'pot'; }
  const need=[['pot',pot.soup],['pan',pan.layers.length/6],['ket',ket.water/0.965]].filter(a=>a[1]<1).sort((a,b)=>a[1]-b[1]);
  return need.length?need[0][0]:null;
}
function updateHint(dt){
  const h=planHint(); S.hint=h;
  if(typeof h==='string'){ const v=V[h]; v.hintT+=dt; if(v.hintT>1.7&&S.idle>0.9&&S.time-v.last>1.2){ v.hintT=0; v.hv=-110; v.q=-0.3; } }
  else if(h&&h.g){ const g=h.g; g.hintT+=dt; if(g.hintT>1.6&&S.feastIdle>0.9){ g.hintT=0; g.hopV=-9; } }
}
/* ---------- お手本の手 (最初の1回だけ) ---------- */
const demo={k:0,f:0,run:null,t:0,pressed:false};
function updateDemo(dt){
  if(!demo.run){
    if(demo.k===0&&S.phase==='kitchen'&&S.taps===0&&S.idle>4){ demo.k=1; demo.run='k'; demo.t=0; demo.pressed=false; logE('demo',{kind:'k'}); }
    else if(demo.f===0&&S.phase==='feast'&&S.serves===0&&S.feastIdle>4){ demo.f=1; demo.run='f'; demo.t=0; demo.pressed=false; logE('demo',{kind:'f'}); }
    return; }
  demo.t+=dt;
  if(!demo.pressed&&demo.t>=1.0){ demo.pressed=true;
    if(demo.run==='k'){ pot.q=0.7; pot.hv=-80; } else { const g=S.hint&&S.hint.g; if(g) g.hopV=-12; } }
  if(demo.t>2.2) endDemo();
}
function endDemo(){ if(demo.run==='k') demo.k=2; if(demo.run==='f') demo.f=2; demo.run=null; }
function demoTarget(){ if(demo.run==='k') return k2s(VP.pot.x+10,VP.pot.y-100); const g=S.hint&&S.hint.g; return g?t2s(g.seat*0.93,8):t2s(0,0); }
function drawDemo(){
  if(!demo.run) return; const t=demo.t, tg=demoTarget();
  const sc=(demo.run==='k'?KX.s:TX.s*1.2)*1.25;
  const sx=tg.x+150*sc, sy=tg.y+230*sc;
  let p=t<1.0?ease(t/1.0):1, x=lerp(sx,tg.x,p), y=lerp(sy,tg.y,p), press=0, a=Math.min(1,t*3);
  if(t>=0.92&&t<1.3) press=Math.sin((t-0.92)/0.38*PI);
  if(t>1.4){ const q=ease((t-1.4)/0.8); x=lerp(tg.x,sx,q); y=lerp(tg.y,sy,q); a=1-q; }
  if(press>0){ useS(); ctx.globalAlpha=0.5*press; const r=40*sc*(0.6+press); ctx.drawImage(TEX.glow,tg.x-r,tg.y-r,r*2,r*2); }
  ctx.globalAlpha=a; useAt(x,y+press*6*sc,sc*(1-0.08*press)); ctx.rotate(-0.35);
  ctx.fillStyle='#8ec3e0'; rr(-22,74,50,40,12); ctx.fill();
  ctx.fillStyle=GIRL.skinG; ctx.save(); ctx.translate(0,40); ctx.scale(0.9,0.9); circ(0,6,32); ctx.fill(); ctx.restore();
  ctx.fillStyle=GIRL.skin; rr(-8,-2,16,46,8); ctx.fill();
  ctx.fillStyle=GIRL.skinD; circ(16,34,9); ctx.fill(); circ(19,48,8); ctx.fill(); ell(-22,44,8,14,0.3); ctx.fill();
  ctx.fillStyle='rgba(255,236,226,0.95)'; rr(-5,1,10,9,4); ctx.fill();
  ctx.globalAlpha=1;
}

/* ============================ INPUT ============================ */
const ptrs=new Map();
function handleTap(px,py){
  const kx=(px-KX.x)/KX.s, ky=(py-KX.y)/KX.s;
  const HV={pot:[VP.pot.x,98,142,120],pan:[VP.pan.x-12,128,130,94],ket:[VP.ket.x+16,104,118,124]};
  let best=null,bd=1;
  for(const key of KEYS){ const h=HV[key], dx=(kx-h[0])/h[2], dy=(ky-h[1])/h[3], d=dx*dx+dy*dy; if(d<bd){ bd=d; best=key; } }
  if(best){ tapVessel(best); return; }
  if(Math.abs(kx)<72&&ky>-340&&ky<-30){ girl.wigV+=10; sTick(); return; }
  const tx=(px-TX.x)/TX.s, ty=(py-TX.y)/TX.s;
  for(const g of guests){ if(!g.present||g.state==='walk') continue; const dx=(tx-g.seat)/86, dy=(ty+40)/118;
    if(dx*dx+dy*dy<1){ if(S.phase==='feast') serve(g); else { g.wigV+=8; sTick(); } return; } }
  if(tower&&Math.abs(tx)<110&&ty<20&&ty>tower.top-20){ tower.swV+=6; sTick(); return; }
  if(Math.abs(tx)<340&&ty>-50&&ty<60){ for(const g of guests) if(Math.abs(tx-g.seat*0.93)<55) g.hopV-=5; sTick(); return; }
}
function onDown(e){
  if(e.cancelable) e.preventDefault();
  audioInit();
  ptrs.set(e.pointerId,1);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  S.idle=0; S.feastIdle=0;
  if(demo.run) endDemo();
  handleTap(e.clientX,e.clientY);
  if(S.taps>0&&demo.k===0) demo.k=2;
}
function onUp(e){ ptrs.delete(e.pointerId); audioInit(); }
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointerup',onUp);
cv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
cv.addEventListener('lostpointercapture',e=>ptrs.delete(e.pointerId));
const stopEv=e=>{ if(e.cancelable) e.preventDefault(); };
document.addEventListener('touchstart',stopEv,{passive:false});
document.addEventListener('touchmove',stopEv,{passive:false});
document.addEventListener('touchend',e=>{ audioInit(); stopEv(e); },{passive:false});
for(const ev of ['gesturestart','gesturechange','gestureend','contextmenu','selectstart','dblclick']) document.addEventListener(ev,stopEv,{passive:false});
document.addEventListener('wheel',stopEv,{passive:false});

/* ============================ LOOP ============================ */
let raf=0,lastT=0,running=false;
const FPS={n:0,t:0,fps:0,worst:0,hist:[]};
function step(dt){
  S.time+=dt; S.idle+=dt; if(S.phase==='feast') S.feastIdle+=dt;
  while(PEND.length) PEND.shift()();
  updatePhase(dt);
  S.view+=clamp(S.viewTarget-S.view,-dt/1.25,dt/1.25);
  spring(S,'rise','riseV',S.riseTarget,140,13,dt);
  camera();
  updateVessels(dt); checkFull();
  updateFlyers(dt); updateTower(dt); updateGuests(dt); updateGirl(dt);
  updateParticles(dt); updateHint(dt); updateDemo(dt); updateAudio(dt);
}
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  ctx.drawImage(bg,0,0);
  useS(); drawFloor();
  useT(); drawTableGroup();
  useK(); drawKitchen();
  drawFlyers(); drawParticles(); drawDemo();
  ctx.globalAlpha=1;
}
function frame(ts){
  raf=0; if(!running) return;
  let dt=(ts-lastT)/1000; lastT=ts; if(!(dt>0)) dt=1/60;
  if(TEST){ FPS.n++; FPS.t+=dt; FPS.worst=Math.max(FPS.worst,dt); if(FPS.t>=1){ FPS.fps=FPS.n/FPS.t; FPS.hist.push(+FPS.fps.toFixed(1)); if(FPS.hist.length>120) FPS.hist.shift(); FPS.n=0; FPS.t=0; } }
  dt=Math.min(dt,1/30);
  step(dt); draw();
  raf=requestAnimationFrame(frame);
}
function start(){ if(running) return; running=true; lastT=performance.now(); raf=requestAnimationFrame(frame); }
function stop(){ running=false; if(raf) cancelAnimationFrame(raf); raf=0; }
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ stop(); ptrs.clear(); try{ if(AU.hissG) AU.hissG.gain.setValueAtTime(0,AU.c.currentTime); if(AU.c&&AU.c.state==='running') AU.c.suspend().catch(()=>{}); }catch(e){} logE('hidden'); }
  else { start(); try{ if(AU.c) AU.c.resume().catch(()=>{}); }catch(e){} logE('visible'); }
});
window.addEventListener('pagehide',()=>{ stop(); ptrs.clear(); });
window.addEventListener('pageshow',()=>{ if(!document.hidden) start(); });
let rzT=0;
window.addEventListener('resize',()=>{ layout(); clearTimeout(rzT); rzT=setTimeout(layout,150); });
window.addEventListener('orientationchange',()=>{ setTimeout(layout,200); });

buildTex(); buildGrads(); layout();
if(TEST){
  window.__pj={
    st:()=>({phase:S.phase,round:S.round,view:+S.view.toFixed(2),taps:S.taps,hint:typeof S.hint==='string'?S.hint:(S.hint&&S.hint.g?'g'+S.hint.g.i:null),
      pot:{soup:+pot.soup.toFixed(2),foam:+pot.foam.toFixed(2),gu:pot.gu.length,eggs:pot.eggs.length,steamed:+pot.steamed.toFixed(2),lid:+pot.lidT.toFixed(1)},
      pan:{layers:pan.layers.length,thick:pan.layers.filter(l=>l.thick>0.5).length,fill:pan.layers.reduce((a,l)=>a+l.fill.length,0),lid:+pan.lidT.toFixed(1)},
      ket:{water:+ket.water.toFixed(2),steamT:+ket.steamT.toFixed(1)},
      tower:tower?tower.layers.map(l=>l.v.key+':'+l.amount.toFixed(2)):null,
      guests:guests.filter(g=>g.present).map(g=>({i:g.i,state:g.state,stack:g.stack.length,eaten:[...g.eaten]})),
      disc:Object.assign({},S.disc),particles:P.length,flyers:FL.length,ptrs:ptrs.size,demo:{k:demo.k,f:demo.f,run:demo.run},
      fps:+FPS.fps.toFixed(1),worst:+(FPS.worst*1000).toFixed(1),audio:AU.c?AU.c.state:'none'}),
    log:()=>S.log.slice(),
    AU, snd:{sPot,sPan,sKet,sWhistle,sCombo,sFull,sFanfare,sServe,sChink,sMunch,sClap,sJoy,sSteam,sSplash,sPlop,sFluff,sTick},
    fpsHist:()=>FPS.hist.slice(),
    resetWorst:()=>{FPS.worst=0;},
    pts:()=>{ const o={pot:k2s(VP.pot.x,VP.pot.y-90),pan:k2s(VP.pan.x,VP.pan.y-10),ket:k2s(VP.ket.x,VP.ket.y-60),girl:k2s(0,-250),
      plates:guests.map(g=>t2s(g.seat*0.93,12)),present:guests.map(g=>g.present),tower:tower?t2s(0,(tower.top+10)/2):null,
      wall:{x:L.W*0.06,y:L.st+20},L:{W:L.W,H:L.H,k:KX.s,t:TX.s,st:L.st,sb:L.sb}}; return o; }
  };
}
start();
})();
