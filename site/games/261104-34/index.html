const damp=(a,b,k,dt)=>a+(b-a)*(1-Math.exp(-k*dt));

// ============ audio (Web Audio synth) ============
const AU={ctx:null,master:null,noise:null,last:{}};
function audioInit(){
  if(AU.ctx){ if(AU.ctx.state!=='running'&&!document.hidden){AU.ctx.resume().catch(()=>{});} return; }
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=new AC(); AU.ctx=c;
    const comp=c.createDynamicsCompressor(); comp.threshold.value=-16; comp.knee.value=10; comp.ratio.value=4;
    const m=c.createGain(); m.gain.value=.6; m.connect(comp); comp.connect(c.destination); AU.master=m;
    const len=c.sampleRate|0, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    AU.noise=b;
    const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,22050); s.connect(c.destination); s.start(0);
    if(c.state!=='running') c.resume().catch(()=>{});
  }catch(e){AU.ctx=null;}
}
function aok(){return !!(AU.ctx&&AU.ctx.state==='running'&&!document.hidden);}
function gate(key,gap){const t=NOW;if(AU.last[key]!==undefined&&t-AU.last[key]<gap)return false;AU.last[key]=t;return true;}
function tone(f,dur,o){
  if(!aok())return; o=o||{};
  try{
    const c=AU.ctx,t0=c.currentTime+(o.delay||0),vol=o.vol===undefined?.15:o.vol,att=o.att||.005;
    const osc=c.createOscillator(); osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t0);
    if(o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t0+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+att);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    let node=osc;
    if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;node.connect(fl);node=fl;}
    node.connect(g); g.connect(AU.master);
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vibR||6;lg.gain.value=o.vib;l.connect(lg);lg.connect(osc.frequency);l.start(t0);l.stop(t0+dur+.05);}
    osc.start(t0); osc.stop(t0+dur+.05);
  }catch(e){}
}
function noise(dur,o){
  if(!aok()||!AU.noise)return; o=o||{};
  try{
    const c=AU.ctx,t0=c.currentTime+(o.delay||0);
    const s=c.createBufferSource(); s.buffer=AU.noise; s.loop=true;
    const fl=c.createBiquadFilter(); fl.type=o.type||'bandpass'; fl.frequency.setValueAtTime(o.f||1000,t0); fl.Q.value=o.q||1;
    if(o.slideF) fl.frequency.exponentialRampToValueAtTime(o.slideF,t0+dur);
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(o.vol||.1,t0+(o.att||.004));
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    s.connect(fl); fl.connect(g); g.connect(AU.master); s.start(t0,Math.random()*.5); s.stop(t0+dur+.05);
  }catch(e){}
}
const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1568,1760];
const S={
  clink(p){p=p||1;tone(1650*p,.12,{type:'triangle',vol:.2});tone(1650*p*2.76,.07,{vol:.06});noise(.025,{vol:.12,f:6500,type:'highpass'});},
  attach(){tone(1320,.2,{type:'triangle',vol:.26});tone(2640,.12,{vol:.09});tone(660,.25,{type:'square',vol:.05,lp:1800});noise(.03,{vol:.2,f:5000,type:'highpass'});
    tone(1760,.18,{type:'triangle',vol:.12,delay:.09});},
  lift(){tone(480,.09,{slide:820,vol:.1,type:'triangle'});},
  drop(){tone(600,.12,{slide:300,vol:.08,type:'triangle'});},
  tonk(sp,load){if(!gate('tonk',.035))return;const v=Math.min(.2,sp/1600+.03);const f=clamp(480+sp*.35-(load||0)*28,180,1400);
    tone(f,.09,{type:'triangle',vol:v});tone(f*1.5,.06,{vol:v*.35});},
  cartIn(load){const f=Math.max(180,760-load*48);tone(f,.12,{type:'square',vol:.05,lp:1600});tone(f*2,.09,{type:'triangle',vol:.08});noise(.03,{vol:.06,f:3000});},
  pull(){if(!gate('pull',.25))return;noise(.32,{vol:.06,f:380,slideF:1500,q:2});tone(300,.28,{slide:620,vol:.04});},
  push(){if(!gate('push',.2))return;noise(.26,{vol:.08,f:1500,slideF:300,q:1.5});tone(620,.22,{slide:240,vol:.05,type:'triangle'});},
  sw(mode,combo){noise(.02,{vol:.15,f:4000,type:'highpass'});const i=clamp(combo-1,0,8);
    const a=PENTA[mode==='pull'?i:Math.min(9,i+1)];tone(a,.14,{type:'square',vol:.07,lp:2400});
    tone(a*(mode==='pull'?1.5:0.75),.16,{type:'triangle',vol:.1,delay:.13});},
  boing(){tone(220,.36,{slide:560,vol:.15,vib:28,vibR:13});},
  fan(short){const n=short?[784,1047]:[523,659,784,1047];n.forEach((f,i)=>{const last=i===n.length-1;
    tone(f,last?.38:.13,{type:'sawtooth',vol:.07,lp:2600,vib:last?9:0,vibR:6,delay:i*.12});tone(f*2,last?.3:.1,{type:'square',vol:.02,lp:3000,delay:i*.12});});},
  clap(){for(let i=0;i<3;i++)noise(.07,{vol:.12,f:1800,q:.9,delay:i*.13});},
  hum(){const n=[392,440,392,330,392];n.forEach((f,i)=>{tone(f,.26,{type:'sine',vol:.045,vib:5,vibR:5,delay:i*.24,att:.06});tone(f*2,.24,{type:'triangle',vol:.01,delay:i*.24,att:.06});});},
  slot(i){const f=[880,1108.7,1318.5][i%3];tone(f,.45,{type:'sine',vol:.18});tone(f*2,.3,{vol:.06});tone(f*1.5,.35,{type:'triangle',vol:.06,delay:.06});},
  success(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,{type:'triangle',vol:.13,delay:i*.07}));tone(2093,1.1,{vol:.07,delay:.35});noise(.6,{vol:.05,f:7000,type:'highpass',delay:.3});},
  big(){S.success();setTimeout(()=>S.fan(false),380);},
  wob(){if(!gate('wob',.08))return;tone(900,.05,{vol:.04,type:'triangle'});},
  brake(){noise(.16,{vol:.08,f:700,type:'lowpass'});tone(220,.18,{slide:110,vol:.06,type:'square',lp:600});},
  go(){tone(160,.25,{slide:330,vol:.06,type:'square',lp:700});},
  motor(){if(!gate('motor',.2))return;tone(85,.06,{type:'square',vol:.02,lp:380});},
  drum(){tone(120,.16,{slide:55,vol:.22});noise(.07,{vol:.06,f:700,type:'lowpass'});},
  snare(){noise(.09,{vol:.07,f:2200,q:.7});},
  don(){tone(150,.22,{slide:70,vol:.2});noise(.12,{vol:.07,f:500,type:'lowpass'});},
  open(){noise(1.4,{vol:.09,f:300,slideF:3000,q:.8});tone(220,1.2,{slide:880,type:'triangle',vol:.06});},
  splash(){noise(.2,{vol:.06,f:1200,q:.6});},
  giggle(){[880,988,880,1047].forEach((f,i)=>tone(f,.07,{type:'square',vol:.035,lp:2000,delay:i*.07}));},
  hmm(){tone(330,.3,{slide:260,type:'triangle',vol:.06});tone(392,.25,{slide:440,type:'triangle',vol:.05,delay:.32});},
  note(i){tone(PENTA[i%10],.18,{type:'triangle',vol:.08});}
};

// robot track height at x
function trackY(x){
  if(x<=DESK.x1) return x>=DESK.x0-60?0:GY;
  if(!G.open) return 0;
  if(x<RAMP.x1) return GY*(x-RAMP.x0)/(RAMP.x1-RAMP.x0);
  return GY;
}

// ============ save / load (validated, safe fallback) ============
const SKEY='gf261104-34-robo-v1';
const STORE={ok:false,state:'first',saved:false};
const fin=v=>typeof v==='number'&&isFinite(v);
function serialize(){
  const o={v:1,open:G.open,mode:G.mode,complete:G.complete,parades:G.parades|0,order:G.order.slice(),
    parts:{},robot:{x:Math.round(robot.x),dir:robot.dir,stopped:robot.stopped,cart:robot.cart.slice()},
    bridge:G.bridge.map(v=>v>=0?v:-1),cans:[]};
  PART_IDS.forEach(id=>{const p=parts[id];o.parts[id]={on:p.on,lx:Math.round(p.lx),ly:Math.round(p.ly)};});
  cans.forEach(c=>{let st=c.st==='cart'?1:(c.st==='slot'?2:0);
    let x=c.x,y=c.y; if(st===0&&c.st!=='free'){ // in-flight: store where it is now
      x=clamp(x,TOWN.x0+20,TOWN.x1-20); y=clamp(y,-440,GY-CHH);}
    o.cans.push([Math.round(x),Math.round(y),st,c.stacked?1:0]);});
  return JSON.stringify(o);
}
function saveGame(){
  G.dirty=false;

}
function validPartPos(id,lx,ly){
  if(!fin(lx)||!fin(ly))return false;
  if(id==='wheels') return Math.abs(lx)<=1&&Math.abs(ly-BHH)<=1;
  const onSide=Math.abs(Math.abs(lx)-BWH)<=1&&ly>=-BHH-1&&ly<=BHH*0.84+1;
  const onTop=Math.abs(ly+BHH)<=1&&Math.abs(lx)>=23&&Math.abs(lx)<=BWH+1;
  return onSide||onTop;
}
function applySave(o){
  if(!o||typeof o!=='object'||o.v!==1) throw 0;
  if(typeof o.open!=='boolean'||(o.mode!=='pull'&&o.mode!=='push')) throw 0;
  if(!Array.isArray(o.cans)||o.cans.length!==cans.length) throw 0;
  if(!o.parts||!o.robot||!Array.isArray(o.order)||!Array.isArray(o.bridge)||o.bridge.length!==3) throw 0;
  const np={};
  for(const id of PART_IDS){const q=o.parts[id];if(!q||typeof q.on!=='boolean')throw 0;
    if(q.on&&!validPartPos(id,q.lx,q.ly))throw 0; np[id]=q;}
  const order=o.order.filter(id=>PART_IDS.includes(id)&&np[id].on);
  if(new Set(order).size!==order.length) throw 0;
  PART_IDS.forEach(id=>{if(np[id].on&&!order.includes(id))order.push(id);});
  const cs=o.cans.map(a=>{if(!Array.isArray(a)||a.length<3||!fin(a[0])||!fin(a[1])||![0,1,2].includes(a[2]))throw 0;
    if(a[0]<TOWN.x0||a[0]>TOWN.x1||a[1]<-700||a[1]>320)throw 0;return a;});
  const cart=o.robot.cart; if(!Array.isArray(cart)||cart.length>CARTMAX)throw 0;
  cart.forEach(i=>{if(!Number.isInteger(i)||i<0||i>=cans.length||cs[i][2]!==1)throw 0;});
  if(cs.filter(a=>a[2]===1).length!==cart.length||new Set(cart).size!==cart.length)throw 0;
  const br=o.bridge; br.forEach(i=>{if(i!==-1&&(!Number.isInteger(i)||i<0||i>=cans.length||cs[i][2]!==2))throw 0;});
  if(cs.filter(a=>a[2]===2).length!==br.filter(i=>i>=0).length)throw 0;
  if(!fin(o.robot.x))throw 0;
  // ---- passed: apply
  G.open=o.open; G.mode=o.mode; G.parades=clamp(o.parades|0,0,9999); G.order=order;
  G.bridge=br.slice(); G.complete=br.every(i=>i>=0);
  PART_IDS.forEach(id=>{const p=parts[id],q=np[id];p.on=q.on;p.lx=q.lx;p.ly=q.ly;
    if(!p.on){p.home=G.open?'box':'tray';}});
  const lim=robotLimits();
  robot.x=clamp(o.robot.x,lim[0],lim[1]); robot.dir=o.robot.dir===-1?-1:1; robot.stopped=!!o.robot.stopped&&parts.wheels.on;
  robot.cart=cart.slice();
  cs.forEach((a,i)=>{const c=cans[i];c.x=a[0];c.y=a[1];c.hx=[c.x,c.x];c.hy=[c.y,c.y];c.vx=c.vy=0;c.sleep=1;
    c.stacked=a[3]===1;c.st=a[2]===1?'cart':(a[2]===2?'slot':'free');c.slot=-1;});

const GRAV=1400;
function supportTop(x,level){ // static surface top at x at or below level
  let best=1e9;for(const s of STATICS){if(s.k==='wall')continue;if(x>=s.x0+4&&x<=s.x1-4&&s.y0>=level-2&&s.y0<best)best=s.y0;}return best;}

    const ox=Math.min(c.x+CWH,s.x1)-Math.max(c.x-CWH,s.x0); if(ox<=0)continue;
    const oy=Math.min(c.y+CHH,s.y1)-Math.max(c.y-CHH,s.y0); if(oy<=0)continue;

}
function impact(c,sp){

function wake(c){c.sleep=0;c.rest=0;}
function canPhysics(dt){
  const fr=cans;
  for(const c of fr){
    c.hx[1]=c.hx[0];c.hy[1]=c.hy[0];c.hx[0]=c.x;c.hy[0]=c.y;
    if(c.imm>0)c.imm-=dt; if(c.sq>0)c.sq=Math.max(0,c.sq-dt*4); if(c.wob>0)c.wob=Math.max(0,c.wob-dt*2);

      collideStatic(c,dt);

      else c.rest=0;

    }
  }
  // can-can
  for(let i=0;i<fr.length;i++){const a=fr[i];if(a.st!=='free'&&a.st!=='slot')continue;
    for(let j=i+1;j<fr.length;j++){const b=fr[j];if(b.st!=='free'&&b.st!=='slot')continue;
      if((a.sleep||a.st==='slot')&&(b.sleep||b.st==='slot'))continue;
      const ox=2*CWH-Math.abs(a.x-b.x); if(ox<=0)continue; const oy=2*CHH-Math.abs(a.y-b.y); if(oy<=0)continue;
      const fa=a.st==='slot'||(a.sleep&&!hardHit(b,a)), fb=b.st==='slot'||(b.sleep&&!hardHit(a,b));
      if(!fa&&a.sleep)wake(a); if(!fb&&b.sleep)wake(b);

      if(oy<ox){const up=a.y<b.y?a:b,dn=up===a?b:a,ku=up===a?ka:kb,kd=up===a?kb:ka;
        up.y-=oy*ku;dn.y+=oy*kd;

}

// scripted flights
function flyTo(c,to,dur,h,extra){c.st='fly';c.sleep=0;c.fly=Object.assign({sx:c.x,sy:c.y,t:0,dur,h,to},extra||{});}

  for(const c of cans){if(c.st!=='fly')continue;const f=c.fly;f.t+=dt;const k=clamp(f.t/f.dur,0,1),e=eio(k),T=flyTarget(c);

// ============ robot behaviour ============

function robotPose(dt){

function snapFor(p,wx,wy){

  const segs=[[-BWH,-BHH,-BWH,42],[BWH,-BHH,BWH,42],[-BWH,-BHH,-23,-BHH],[23,-BHH,BWH,-BHH]];
  const other=parts[p.id==='hand'?'trumpet':'hand'];
  const cands=[];
  for(const s of segs){const dx=s[2]-s[0],dy=s[3]-s[1],L=dx*dx+dy*dy;let t=clamp(((l.x-s[0])*dx+(l.y-s[1])*dy)/L,0,1);
    for(const off of [0,1,-1,2,-2]){const tt=clamp(t+off*36/Math.sqrt(L),0,1);
      const cx=Math.round(s[0]+dx*tt),cy=Math.round(s[1]+dy*tt);

  cands.sort((a,b)=>a.d-b.d);
  const inBody=Math.abs(l.x)<BWH+10&&Math.abs(l.y)<BHH+10;
  if(cands.length&&(cands[0].d<125||inBody))return cands[0];
  return null;

    const dh=clamp((DESK_REG.y1-DESK_REG.y0)*s+30,Hh*.45,Hh*.62),th=Hh-dh-g;

// ============ cue & demo ============
const CUE={id:null,pos:null};
function computeCue(){
  if(G.openT>=0||IN.drag)return null;
  const Pp=parts,missing=PART_IDS.filter(id=>!Pp[id].on);
  if(!G.open){
    if(!Pp.hand.on)return 'hand';
    if(!G.everSwitch&&(G.everPulled||NOW-Pp.hand.attT>5))return 'switch';
    if(G.cueHandHint>0)return 'hand';
    if(!Pp.wheels.on)return 'wheels';
    if(!Pp.trumpet.on)return 'trumpet';
    return 'switch';
  }
  if(parade.active)return Pp.trumpet.on?'trumpet':(missing[0]||'switch');
  if(G.afterParade&&G.order.length)return G.order[0];
  if(missing.length)return missing[0];
  if(robot.stopped&&robot.cart.length===0&&!cans.some(c=>c.st==='fly'))return 'wheels';
  if(!G.complete){
    if(G.mode==='push')return 'switch';
    if(G.cueHandHint>0||Pp.hand.lx<0)return 'hand';
    return 'wheels';
  }
  if(G.cueHandHint>0)return 'hand';
  if(robot.x>1150&&G.mode==='pull'&&robot.cart.length>0)return 'switch';
  if(G.mode==='push'&&robot.cart.length===0&&robot.x<1250)return 'switch';
  return 'trumpet';
}
function cuePos(id){
  if(!id)return null;

  if(!p.on)return {x:p.x,y:p.y};
  if(id==='hand'&&HG.ok)return {x:(HG.base.x+HG.tip.x)/2,y:(HG.base.y+HG.tip.y)/2};

  if(p&&!p.on){const to=p.id==='wheels'?l2w(0,BHH+20):l2w(BWH,-4);DEMO.a={kind:'drag',t:0,id:p.id,from:{x:p.x,y:p.y},to};}

const IN={id:null,sx:0,sy:0,t0:0,tgt:null,drag:false,part:null,snap:null,moved:0,wx:0,wy:0};
function hitTest(x,y){
  const roboOK=true;
  if(roboOK){const sw=l2w(0,-BHH-14);if(dist(x,y,sw.x,sw.y)<40)return {type:'switch'};}
  let best=null,bd=1e9;
  for(const id of ['trumpet','hand','wheels']){const p=parts[id];if(!p.on)continue;let d=1e9;
    if(id==='hand'&&HG.ok){d=Math.min(dist(x,y,HG.tip.x,HG.tip.y)-46,segDist(x,y,HG.base.x,HG.base.y,HG.tip.x,HG.tip.y)-26);}
    else if(id==='trumpet'){const a=l2w(p.lx,p.ly),dd=rotV(armDirLocal(p.lx,p.ly));d=dist(x,y,a.x+dd.x*26,a.y+dd.y*26)-44;}
    else if(id==='wheels'){const l=w2l(x,y);if(Math.abs(l.x)<BWH+12&&l.y>BHH-8&&l.y<BHH+50)d=-1;}
    if(d<0&&d<bd){bd=d;best={type:'part',obj:p};}}
  if(best)return best;
  for(const id of PART_IDS){const p=parts[id];if(p.on)continue;const d=dist(x,y,p.x,p.y);if(d<58&&d<bd){bd=d;best={type:'part',obj:p};}}
  if(best)return best;
  const l=w2l(x,y);if(Math.abs(l.x)<BWH+8&&Math.abs(l.y)<BHH+8)return {type:'body'};
  for(const c of cans){if(c.st==='cart'||c.st==='fly')continue;if(dist(x,y,c.x,c.y)<28)return {type:'can',obj:c};}
  const gh={x:girl.x,y:GY-150};
  if(dist(x,y,gh.x,gh.y)<44||(Math.abs(x-gh.x)<34&&y>gh.y&&y<GY))return {type:'girl'};
  for(const p of people){if(Math.abs(x-p.x)<34&&y>GY-190&&y<GY)return {type:'person',obj:p};}
  if(Math.abs(x-flt.x)<90&&y>GY-230&&y<GY)return {type:'float'};

}
function onDown(e){

  G.idle=0;G.touched=true;DEMO.a=null;
  if(e.clientX<r.x||e.clientX>r.x+r.w||e.clientY<r.y||e.clientY>r.y+r.h){sideTap(e.clientX,e.clientY);return;}
  IN.id=e.pointerId;try{cv.setPointerCapture(e.pointerId);}catch(_){}

  const w=s2w(v,e.clientX,e.clientY);IN.wx=w.x;IN.wy=w.y;

}
function sideTap(sx,sy){
  if(G.open)return;
  for(let i=0;i<3;i++){const r=LY.side[i];if(sx<r.x||sx>r.x+r.w||sy<r.y||sy>r.y+r.h)continue;

    if(i===2&&Math.abs(w.x-flt.x)<90&&w.y>GY-230&&w.y<GY){flt.rock+=.25;S.wob();return;}

  IN.id=null;IN.tgt=null;IN.drag=false;IN.part=null;IN.snap=null;

function tapAction(h){
  if(h.type==='switch'){toggleMode();return;}
  if(h.type==='part'){const p=h.obj;
    if(!p.on){p.hop=NOW;S.wob();return;}
    if(p.id==='hand'){robot.waveT=NOW;S.boing();robot.face='happy';robot.faceT=.6;}
    else if(p.id==='wheels')toggleStop();

    return;}
  if(h.type==='body'){robot.giggleT=NOW;robot.face='happy';robot.faceT=.6;S.giggle();return;}
  if(h.type==='can'){const c=h.obj;c.wob=1;S.wob();if(c.st==='free'&&c.sleep&&!c.stacked){c.vy=-140;wake(c);}return;}
  if(h.type==='girl'){girl.waveT=NOW;S.wob();return;}
  if(h.type==='person'){h.obj.wob=1;S.wob();return;}
  if(h.type==='float'){flt.rock+=.25;S.wob();}
}

    ctx.restore();}
  for(const q of FX.bursts){const k=q.t/q.life,r=q.s*(.6+k*.9);ctx.save();ctx.globalAlpha=1-k;ctx.beginPath();
    for(let i=0;i<16;i++){const an=i/16*TAU+.2,rr2=i%2?r*.45:r;ctx.lineTo(q.x+Math.cos(an)*rr2,q.y+Math.sin(an)*rr2);}ctx.closePath();ink(q.big?P.yel:P.white,3);ctx.restore();}
  for(const q of FX.notes){if(q.t<0)continue;const k=q.t/q.life;ctx.save();ctx.globalAlpha=1-k;drawNote(q.x,q.y,1+k*.3,q.col);ctx.restore();}
}
// ============ views ============
function drawWorld(main){
  drawSky();drawBuildings();drawStreet();drawBridge();
  drawFloat();drawPeople();
  if(girl.mode==='desk')drawGirl('body');
  drawDesk();drawBarrierRamp();
  drawCans();if(main)drawBeam();drawRobot();
  if(girl.mode==='walk')drawGirl('all');else drawGirl('head');
  drawLooseParts();drawFX();
  if(main){drawCue();drawDragged();}
}
function drawView(v,main){
  const d=LY.dpr,r=v.rect,c=v.cam;
  ctx.save();ctx.setTransform(d,0,0,d,0,0);ctx.beginPath();ctx.rect(r.x,r.y,r.w,r.h);ctx.clip();
  ctx.setTransform(d*c.s,0,0,d*c.s,d*(r.x+r.w/2-c.cx*c.s),d*(r.y+r.h/2-c.cy*c.s));
  VB={x0:c.cx-r.w/2/c.s,x1:c.cx+r.w/2/c.s,y0:c.cy-r.h/2/c.s,y1:c.cy+r.h/2/c.s,s:c.s};
  ctx.lineJoin='round';ctx.lineCap='round';
  drawWorld(main);
  ctx.restore();
}
const SIDEC=[null,null,null];let FRAMEN=0;
function sideImg(i,r,force){
  const d=LY.dpr,w=Math.max(1,Math.ceil(r.w*d)),h=Math.max(1,Math.ceil(r.h*d));let o=SIDEC[i];
  if(!o||o.width!==w||o.height!==h){o=SIDEC[i]=document.createElement('canvas');o.width=w;o.height=h;force=true;}
  if(force||FRAMEN%3===i){const keep=ctx;ctx=o.getContext('2d');
    try{drawView({rect:{x:0,y:0,w:r.w,h:r.h},cam:sideCam(i,r)},false);}finally{ctx=keep;}}
  return o;
}
function blitSide(i,r,x,y){const o=sideImg(i,r,false),d=LY.dpr;ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(o,Math.round(x*d),Math.round(y*d));}
function border(r,lw){const d=LY.dpr;ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=lw;ctx.strokeStyle=P.ink;ctx.lineJoin='miter';ctx.strokeRect(r.x,r.y,r.w,r.h);}
function drawFinger(x,y,press){
  const d=LY.dpr;ctx.setTransform(d,0,0,d,0,0);ctx.save();ctx.translate(x,y);const s=press?.88:1;ctx.scale(s,s);ctx.rotate(-.35);
  ctx.lineJoin='round';rr(-7,-2,14,34,7);ink(P.white,3.5);
  ctx.beginPath();ctx.ellipse(4,40,19,17,0,0,TAU);ink(P.white,3.5);rr(-7,-2,14,26,7);fillOnly(P.white);
  line(-6,28,-6,36,2.5);line(8,30,8,38,2.5);
  if(press){ctx.beginPath();ctx.arc(0,-6,16,0,TAU);ctx.lineWidth=3;ctx.strokeStyle='rgba(22,22,22,.5)';ctx.stroke();}
  ctx.restore();
}
function drawDemo(){
  const a=DEMO.a;if(!a)return;const v=mainView();const t=a.t,fade=1-sm(2.2,2.6,t);
  ctx.save();ctx.globalAlpha=fade;
  if(a.kind==='drag'){const k=eio(sm(.6,1.8,t)),wx=lerp(a.from.x,a.to.x,k),wy=lerp(a.from.y,a.to.y,k)-Math.sin(k*Math.PI)*30;
    if(t>.5&&t<1.95){const d=LY.dpr;ctx.setTransform(d*v.cam.s,0,0,d*v.cam.s,d*(v.rect.x+v.rect.w/2-v.cam.cx*v.cam.s),d*(v.rect.y+v.rect.h/2-v.cam.cy*v.cam.s));
      drawPartAt(parts[a.id],wx,wy-14,1,.45*fade);}
    const sp=w2s(v,t<.5?a.from.x:wx,t<.5?a.from.y:wy);const ap=sm(0,.4,t);
    drawFinger(sp.x+6,sp.y+8+(1-ap)*60,t>.45&&t<1.9);}
  else{const sp=w2s(v,a.at.x,a.at.y),ap=sm(0,.4,t),pr=(t>.6&&t<.8)||(t>1.1&&t<1.3);drawFinger(sp.x+6,sp.y+8+(1-ap)*60,pr);}
  ctx.restore();
}
function render(){
  const d=LY.dpr;ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle=P.paper;ctx.fillRect(0,0,LY.W,LY.H);
  if(G.open&&G.openT<0){drawView({rect:LY.full,cam:TC},true);}
  else if(G.openT<0){
    for(let i=0;i<3;i++){const r=LY.side[i];blitSide(i,r,r.x,r.y);border(r,4);}
    const v=mainView();drawView(v,true);border(v.rect,5);
  }else{
    const t=G.openT,sh=t<.1?Math.sin(t*260)*5*(1-t/.1):0,v=mainView();
    const rv={rect:{x:v.rect.x+sh,y:v.rect.y,w:v.rect.w,h:v.rect.h},cam:v.cam};
    drawView(rv,true);const bw=5*(1-sm(.3,.44,t));if(bw>.3)border(rv.rect,bw);
    const k=eio(sm(.06,.4,t));
    for(let i=0;i<3;i++){const r=LY.side[i],dir=LY.portrait?(i===1?1:-1):1,off=dir*k*(LY.W*.75+r.w);
      const r2={x:r.x+off+sh,y:r.y,w:r.w,h:r.h};if(r2.x>LY.W||r2.x+r2.w<0)continue;
      ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle=P.white;ctx.fillRect(r2.x-6,r2.y-6,r2.w+12,r2.h+12);
      blitSide(i,r,r2.x,r2.y);border(r2,4);}
  }
  drawDemo();
}
// ============ main loop ============
function update(dt){
  NOW+=dt;G.idle+=dt;if(G.cueHandHint>0)G.cueHandHint-=dt;
  openUpdate(dt);
  robotPose(dt);
  if(robot.show)showUpdate(dt);
  else if(robot.pendingShow>0){robot.pendingShow-=dt;if(robot.pendingShow<=0)startShow(robot.pendingKind||'tap');}
  if(robot.chainT>0){robot.chainT-=dt;if(robot.chainT<=0){robot.chainT=-1;if(!startShow('chain',['trumpet'])&&hasWheels())robot.stopped=false;}}
  robot.moving=false;
  if(hasWheels()&&!robot.show&&!parade.active&&(G.openT<0||G.openT>.5))drive(dt);
  if(robot.moving){robot.wheelRot+=robot.dir*speed()*dt/21;S.motor();}
  if(robot.showAct==='wheels')robot.wheelRot+=dt*9;
  robotPose(0);
  if(robot.popT>0){robot.popT-=dt;if(robot.popT<=0)popFirst();}
  robotBeam(dt);robotStack(dt);floatMissCheck(dt);
  flights(dt);canPhysics(dt*.5);canPhysics(dt*.5);bridgeCapture();floatContact();
  paradeUpdate(dt);girlUpdate(dt);peopleUpdate(dt);robotEyes(dt);
  for(const id of PART_IDS){const p=parts[id];p.px=p.x;p.py=p.y;}
  if(IN.drag)dragPos(mainView());
  partsUpdate(dt);fxUpdate(dt);
  CUE.id=computeCue();CUE.pos=cuePos(CUE.id);
  demoUpdate(dt);
  camUpdate(dt);
  G.saveT+=dt;if(G.dirty&&G.saveT>2.5){G.saveT=0;saveGame();}
}
let rafId=0,lastTs=0;const PERF={n:0,sum:0};
function frame(ts){
  rafId=requestAnimationFrame(frame);
  let dt=lastTs?(ts-lastTs)/1000:1/60;lastTs=ts;
  if(!(dt>0))return;
  // adaptive resolution: if frames are consistently slow, lower the backing-store scale a little
  PERF.n++;PERF.sum+=Math.min(dt,.1);
  if(PERF.n>=120){const avg=PERF.sum/PERF.n;PERF.n=0;PERF.sum=0;
    if(avg>1/42&&LY.cap>1.25&&LY.dpr>1.25){LY.cap=LY.dpr>1.6?1.5:1.25;layout();}}
  dt=Math.min(dt,1/30);
  try{update(dt);FRAMEN++;render();}catch(e){if(!frame.err){frame.err=1;console.warn(e);}}
}
function start(){if(rafId)return;lastTs=0;PERF.n=0;PERF.sum=0;rafId=requestAnimationFrame(frame);}
function stop(){if(rafId)cancelAnimationFrame(rafId);rafId=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();cancelInput();try{if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend();}catch(e){}saveGame();}
  else{try{if(AU.ctx)AU.ctx.resume().catch(()=>{});}catch(e){}start();}
});
window.addEventListener('pagehide',()=>saveGame());
window.addEventListener('resize',()=>{layout();});
window.addEventListener('orientationchange',()=>{setTimeout(layout,120);});
// ============ boot ============
initCans();
loadGame();
buildStatics();
robotPose(0);
layout();
window.__G34={AU,G,robot,parts,cans,girl,flt,parade,IN,CUE,DEMO,STORE,LY,TC,
  view:()=>mainView(),w2s:(x,y)=>w2s(mainView(),x,y),hg:()=>HG,cue:()=>CUE.id,
  fast:sec=>{for(let i=0;i<sec*60;i++)update(1/60);},
  bench:n=>{const t0=performance.now();for(let i=0;i<n;i++){update(1/60);FRAMEN++;render();}return (performance.now()-t0)/n;}};
if(!document.hidden)start();
})();
</script>
