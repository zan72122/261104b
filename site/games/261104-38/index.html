function computeLayout(){

  const o={W,H,mn,x0,x1,y0,y1,UW,UH};
  o.port=H>W*1.08;
  o.lw=clamp(mn*0.0034,1.25,2.6);
  if(o.port){
    let hh=Math.min(UW/1.5,UH*0.285);
    let hw=Math.min(UW,hh*1.85);
    o.house={x:x0+(UW-hw)/2,y:y0+UH*0.004,w:hw,h:hh};
    const by=o.house.y+hh+UH*0.018,bh=UH*0.235;
    o.band={x:x0,y:by,w:UW,h:bh};
    const ay=by+bh,ah=y1-ay;
    o.area={x:x0,y:ay,w:UW,h:ah};
    const rMax=Math.min(UW*0.285,ah*0.39);
    o.dough={x:x0+UW*0.39,y:ay+ah*0.47,rMax,rMin:rMax*0.5};
    const ow=Math.min(UW*0.27,ah*0.42,rMax*1.1);
    o.oven={x:x0+UW*0.855,y:ay+ah*0.27,w:ow,h:ow*0.92};
    const bw=Math.min(UW*0.15,ah*0.21);
    o.bins=[{x:x0+UW*0.735,y:y1-bw*0.55,w:bw,h:bw*0.8},{x:x0+UW*0.915,y:y1-bw*0.55,w:bw,h:bw*0.8}];
    const ms=Math.min(UW*0.115,ah*0.15);
    o.ms=ms;
    o.roll={x:x0+ms*0.62,y:y1-ms*0.55,r:ms*0.5};
    o.shelf=[0,1,2].map(i=>({x:o.roll.x+ms*(1.2+i*1.08),y:o.roll.y}));
  }else{
    const lw=UW*0.53;
    let hw=Math.min(UW-lw-UW*0.015,UH*0.5*1.6);
    let hh=Math.min(hw/1.5,UH*0.47);
    hw=Math.min(hw,hh*1.85);
    o.house={x:x1-hw,y:y0,w:hw,h:hh};
    const by=y0+hh+UH*0.02,bh=Math.min(UH*0.42,y1-by);
    o.band={x:o.house.x,y:by,w:hw,h:bh};
    o.area={x:x0,y:y0,w:o.house.x-x0-UW*0.015,h:UH};
    const A=o.area;
    const rMax=Math.min(A.w*0.31,UH*0.31);
    o.dough={x:A.x+A.w*0.56,y:y0+UH*0.58,rMax,rMin:rMax*0.5};
    const ow=Math.min(A.w*0.27,UH*0.27);
    o.oven={x:A.x+A.w*0.17,y:y0+UH*0.24,w:ow,h:ow*0.92};
    const bw=Math.min(A.w*0.15,UH*0.14);
    o.bins=[{x:A.x+A.w*0.11,y:y1-bw*0.62,w:bw,h:bw*0.8},{x:A.x+A.w*0.29,y:y1-bw*0.62,w:bw,h:bw*0.8}];
    const ms=Math.min(A.w*0.1,UH*0.12);
    o.ms=ms;
    o.roll={x:A.x+A.w*0.47,y:y0+ms*0.75,r:ms*0.5};
    o.shelf=[0,1,2].map(i=>({x:o.roll.x+ms*(1.25+i*1.1),y:o.roll.y}));
  }
  const b=o.band;
  o.pk=Math.min(b.h*(o.port?1.02:1.0),b.w*0.40);
  o.tableY=b.y+b.h*(o.port?0.79:0.76);
  o.tableCX=b.x+b.w/2;
  o.seatY=o.tableY+o.pk*0.06;
  o.gapFar=Math.min(b.w*0.6,o.pk*2.3);
  o.gapNear=o.pk*0.64;
  o.tableX0=b.x+b.w*0.03;o.tableX1=b.x+b.w*0.97;
  o.tsz=o.dough.rMax*0.25;
  o.walkSp=mn*0.40;
  o.hk=o.house.h*0.34;
  return o;
}

function tone(f,d,o){
  if(!AC||!MG)return;o=o||{};
  try{
    const t=AC.currentTime+(o.dl||0);
    const os=AC.createOscillator();os.type=o.type||'sine';
    os.frequency.setValueAtTime(f,t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.glide||d));
    const gn=AC.createGain();const v=o.v||0.18;
    gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(v,t+(o.a||0.006));
    gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(gn);gn.connect(MG);os.start(t);os.stop(t+d+0.03);
  }catch(e){}
}
function noise(d,o){
  if(!AC||!MG||!NB)return;o=o||{};
  try{
    const t=AC.currentTime+(o.dl||0);
    const src=AC.createBufferSource();src.buffer=NB;
    const fl=AC.createBiquadFilter();fl.type=o.ft||'lowpass';fl.frequency.setValueAtTime(o.f||1200,t);
    if(o.fto)fl.frequency.exponentialRampToValueAtTime(o.fto,t+d);
    fl.Q.value=o.q||0.8;
    const gn=AC.createGain();const v=o.v||0.12;
    gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+(o.a||0.005));
    gn.gain.exponentialRampToValueAtTime(0.0001,t+d);
    src.connect(fl);fl.connect(gn);gn.connect(MG);
    src.start(t,Math.random()*0.5);src.stop(t+d+0.03);
  }catch(e){}
}

function validHouse(h){
  if(!h||typeof h!=='object'||Array.isArray(h))return null;
  const num=(x,a,b)=>typeof x==='number'&&isFinite(x)&&x>=a&&x<=b;
  const f=h.fav;
  if(!Array.isArray(f)||f.length!==2||(f[0]!==0&&f[0]!==1)||(f[1]!==0&&f[1]!==1)||f[0]===f[1])return null;
  if(!num(h.close,0,6)||!num(h.near,0,3))return null;
  if(!Array.isArray(h.debt)||h.debt.length!==2||!h.debt.every(d=>d===0||d===1))return null;
  if(!Array.isArray(h.rooms)||h.rooms.length!==3)return null;
  const rooms=[];
  for(const r of h.rooms){if(!r||typeof r!=='object'||(r.v!==1&&r.v!==2)||(r.a!==0&&r.a!==1))return null;rooms.push({v:r.v,a:r.a});}
  const od=h.order;
  if(!Array.isArray(od)||od.length!==3||!od.every(x=>Number.isInteger(x)&&x>=0&&x<3)||new Set(od).size!==3)return null;
  if(!Number.isInteger(h.b)||h.b<0||h.b>9)return null;
  if(!Number.isInteger(h.id)||h.id<0||h.id>1e9)return null;
  return {id:h.id,fav:[f[0],f[1]],close:h.close,near:h.near,debt:[h.debt[0],h.debt[1]],rooms,order:od.slice(),b:h.b,
    dish:h.dish===1?1:0,clean:h.clean===1?1:0};
}

  if(raw==null){STORE_STATE='first';return out;}
  let o=null;

  if(!o||typeof o!=='object'||o.v!==1||!Array.isArray(o.houses)){

}

  const M=(u,v,z)=>{const X=(u-0.5)*h.w,Y=(v-0.5)*h.h,Z=(z||0)*h.h*t;const yp=Y*cp-Z*sp;const d=f-Y*sp-Z*cp;const s=f/d*k;return [cx+X*s,cy+yp*s,s];};

function runTasks(p,dt){

  const c=p.cur;if(!c)return;
  c.t+=dt;
  const finish=()=>{p.cur=null;};
  switch(c.k){
    case 'walk':{
      if(p.mode==='seat'){p.mode='stand';p.y=L.seatY+L.pk*0.40;}
      if(p.mode==='hsit'){p.mode='stand';p.atTable=false;}
      const tg=c.to();const dx=tg.x-p.x,dy=tg.y-p.y;const d=hyp(dx,dy);
      const sp=p.spd*L.walkSp*(c.sp||1)*clamp(p.sz/L.pk,0.35,1.1);
      if(d<=sp*dt+0.5){p.x=tg.x;p.y=tg.y;p.mode='stand';finish();}
      else{p.x+=dx/d*sp*dt;p.y+=dy/d*sp*dt;p.ph+=dt*9*p.spd;p.mode='walk';p.dir=dx;}
      break;}
    case 'wait':if(p.mode==='walk')p.mode='stand';if(c.t>=c.d)finish();break;
    case 'do':finish();c.f(p);break;
    case 'sit':p.mode='seat';p.y=L.seatY;finish();break;
    case 'hsit':p.mode='hsit';p.atTable=!!c.table;finish();break;
    case 'until':if(p.mode==='walk'&&!p.inJob)p.mode='stand';if(c.f(p))finish();break;
    case 'anim':
      if(!c.started){c.started=true;playAnim(p,c.a,c.d,c.tg);}
      if(p.mode==='walk')p.mode='stand';
      if(c.t>=c.d){if(p.anim===c.a)p.anim=null;finish();}
      break;
    case 'sync':{
      const m=S.sync[c.n]=(S.sync[c.n]||0)|(1<<p.id);
      if(p.mode==='walk')p.mode='stand';
      if(m===3)finish();
      break;}
  }
}

      if(x>=x0&&x<=x1&&y>=y0&&y<=y1){const c=HM(it.u,it.v2,0);const d=hyp(c[0]-x,c[1]-y);if(d<bd){bd=d;best=it;}}

function roomAt(x,y){

function personAt(x,y){
  for(const p of S.pp){const h=headPos(p);if(hyp(x-h.x,(y-h.y)*0.8)<p.sz*0.2)return p;}
  return null;
}
function shelfAt(x,y){
  const ms=L.ms;

function pickGrab(x,y,id){
  const pz=S.pz;
  // roll
  if(S.H.rollReady&&hyp(x-L.roll.x,y-L.roll.y)<L.roll.r*1.5)return {type:'roll'};
  const si=shelfAt(x,y);if(si>=0)return {type:'model',i:si};

  // dough
  if(pz.st==='raw'&&(pz.loc==='board'||pz.loc==='back')&&!pz.grab){
    const c=pzC(),R=pzR();const d=hyp(x-c[0],y-c[1]);

      }

    }
  }

    const tp={t:bi,x,y,sx:x,sy:y,rot:0};SFX.pick();
    S.pp.forEach(p=>{if(S.fav[p.id]===bi){lookAt(p,x,y,1);}});
    return {type:'top',tp};
  }
  if(bi>=0){L.bins[bi].wig=1;SFX.tiny();return {type:'none'};}
  // oven
  if(inOven(x,y)){
    if(canBake()&&pz.st==='raw'){return {type:'ovenTap'};}
    return {type:'none',wig:'oven'};
  }
  const p=personAt(x,y);

  // furniture
  const it=itemAt(x,y);

  const ri=roomAt(x,y);

}
function moveGrab(gb,x,y,pt){
  if(!gb)return;
  const pz=S.pz;
  switch(gb.type){
    case 'pizza':
      if(gb.g.mode==='stretch'){gb.g.x=x;gb.g.y=y;}
      else{pz.hx=x+gb.g.ox;pz.hy=y+gb.g.oy;gb.g.x=x;gb.g.y=y;}
      break;
    case 'slice':gb.sl.x=x+gb.sl.ox;gb.sl.y=y+gb.sl.oy;break;
    case 'top':gb.tp.x=x;gb.tp.y=y-L.tsz*0.4;break;
    case 'item':{
      if(!gb.moved&&hyp(x-gb.sx,y-gb.sy)>L.mn*0.025){gb.moved=true;gb.it.st='drag';SFX.pick();}
      if(gb.moved){const uv=HM.inv(x,y);const r=RG[gb.it.ri].r;const s=itemSizeUV(gb.it);
        gb.it.u=clamp(uv[0],r[0]+s[0]/2,r[2]-s[0]/2);gb.it.v2=clamp(uv[1],r[1]+s[1]/2,r[3]-s[1]/2);gb.it.lift=1;}
      break;}
  }
  void pt;
}
function dropTarget(x,y){
  const b=L.band;
  if(y<b.y-L.pk*0.1||y>b.y+b.h+L.pk*0.1||x<b.x-L.pk*0.2||x>b.x+b.w+L.pk*0.2)return -1;
  const d0=Math.abs(x-seatX(0)),d1=Math.abs(x-seatX(1));
  return d0<=d1?0:1;
}
function endGrab(gb,x,y,pt,cancel){
  if(!gb)return;
  const pz=S.pz;
  const tap=!pt.moved&&(TIME-pt.t0)<0.45;
  switch(gb.type){
    case 'pizza':{
      const gg=gb.g;if(pz.grab!==gg)break;
      pz.grab=null;
      if(gg.mode==='stretch'){
        stretchStop();
        const e=gg.e||0;
        if(e>0.12){SFX.boing(e);found('stretch');}
      }else{
        if(!cancel&&inOven(pz.hx,pz.hy)||(!cancel&&hyp(pz.hx-ovenMouth()[0],pz.hy-ovenMouth()[1])<L.oven.w*0.75)){
          pz.loc='board';sendToOven();
        }else{
          if(tap&&!cancel){/* tap inside: dent */pz.loc='board';doughTap(x,y);}
          else{pz.fx=pz.hx;pz.fy=pz.hy;pz.loc='back';pz.tw=0;SFX.back();}
        }
      }
      break;}
    case 'slice':{
      const sl=gb.sl;if(sl.st!=='drag')break;
      if(cancel){returnSlice(sl);break;}
      if(tap){
        const who=sl.want>=0?sl.want:(S.pp[0].eaten<=S.pp[1].eaten?0:1);
        sl.st='board';giveSlice(sl,who);break;
      }
      const who=dropTarget(sl.x,sl.y);
      if(who>=0)giveSlice(sl,who);else returnSlice(sl);
      break;}
    case 'top':{
      const tp=gb.tp;
      if(cancel)break;
      if(tap){const p=tapTopping(tp.t);if(!placeTopping(tp.t,p[0],p[1]))SFX.back();}
      else if(!placeTopping(tp.t,tp.x,tp.y))SFX.back();
      break;}
    case 'ovenTap':if(!cancel&&canBake())sendToOven();break;
    case 'person':if(!cancel){const p=gb.p;playAnim(p,'wave',1.0);SFX.wave(p.id);bubble(p,S.fav[p.id],1.8);setFace(p,'happy',1);const o=S.pp[1-p.id];lookAt(o,p.x,p.y-p.sz*0.5,1);}break;
    case 'item':{
      const it=gb.it;
      if(gb.moved){if(cancel){const c=slotC(it.ri,it.v,it.slot);it.u=c[0];it.v2=c[1];it.st='placed';}else dropItem(it,it.u,it.v2);}
      else if(!cancel&&tap)roomTap(gb.ri);
      break;}
    case 'room':if(!cancel&&tap)roomTap(gb.ri);break;
    case 'roll':if(!cancel&&tap){if(!startNewHouse())SFX.tiny();}break;
    case 'model':if(!cancel&&tap){const rec=ST.houses[gb.i];S.model={i:gb.i,t:0.5};if(!rec||!restoreHouse(rec))SFX.tiny();}break;
  }
}
function evXY(e){return [e.clientX,e.clientY];}
function onDown(e){
  e.preventDefault();
  audioInit();
  S.idleT=0;S.hint=null;S.hintUsed=false;
  if(PTR.size>=5)return;
  const [x,y]=evXY(e);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const pt={x,y,sx:x,sy:y,t0:TIME,moved:false,grab:null};
  PTR.set(e.pointerId,pt);
  pt.grab=pickGrab(x,y,e.pointerId);
}
function onMove(e){
  const pt=PTR.get(e.pointerId);if(!pt)return;
  e.preventDefault();
  const [x,y]=evXY(e);
  pt.x=clamp(x,0,W);pt.y=clamp(y,0,H);
  if(hyp(pt.x-pt.sx,pt.y-pt.sy)>L.mn*0.02)pt.moved=true;
  S.idleT=0;
  moveGrab(pt.grab,pt.x,pt.y,pt);
}
function onUp(e){
  const pt=PTR.get(e.pointerId);if(!pt)return;
  e.preventDefault();
  PTR.delete(e.pointerId);
  const cancel=e.type==='pointercancel'||e.type==='lostpointercapture';
  endGrab(pt.grab,pt.x,pt.y,pt,cancel);
  pt.grab=null;
}
function cancelAll(){for(const [,pt] of PTR){endGrab(pt.grab,pt.x,pt.y,pt,true);}PTR.clear();}
cv.addEventListener('pointerdown',onDown,{passive:false});
cv.addEventListener('pointermove',onMove,{passive:false});
cv.addEventListener('pointerup',onUp,{passive:false});
cv.addEventListener('pointercancel',onUp,{passive:false});
cv.addEventListener('lostpointercapture',onUp,{passive:false});
for(const ev of ['touchstart','touchmove','touchend','gesturestart','gesturechange','gestureend','dblclick','contextmenu','selectstart'])
  document.addEventListener(ev,e=>{if(e.cancelable)e.preventDefault();},{passive:false});
document.addEventListener('touchend',()=>audioInit(),{passive:true});

// ================= drawing helpers =================
function buildGrid(){
  gridCv.width=cv.width;gridCv.height=cv.height;
  const c=gridCv.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);
  c.fillStyle=COL.bg;c.fillRect(0,0,W,H);
  const s=Math.max(12,L.mn*0.034);
  c.lineWidth=1;
  for(let pass=0;pass<2;pass++){
    c.strokeStyle=pass?'rgba(255,255,255,0.16)':'rgba(255,255,255,0.07)';
    c.beginPath();
    let i=0;for(let x=0;x<=W+1;x+=s,i++){if((i%5===0)!==!!pass)continue;const X=Math.round(x)+0.5;c.moveTo(X,0);c.lineTo(X,H);}
    i=0;for(let y=0;y<=H+1;y+=s,i++){if((i%5===0)!==!!pass)continue;const Y=Math.round(y)+0.5;c.moveTo(0,Y);c.lineTo(W,Y);}
    c.stroke();
  }
  // drafting frame
  const sa=readSA();const m=Math.max(4,L.mn*0.008);
  c.strokeStyle='rgba(255,255,255,0.35)';c.lineWidth=1;
  c.strokeRect(sa.l+m,sa.t+m,W-sa.l-sa.r-2*m,H-sa.t-sa.b-2*m);
  c.strokeStyle='rgba(255,255,255,0.18)';
  c.strokeRect(sa.l+m*2,sa.t+m*2,W-sa.l-sa.r-4*m,H-sa.t-sa.b-4*m);
}
function sw(w,c,a){g.lineWidth=w;g.strokeStyle=c||COL.w;g.globalAlpha=a==null?1:a;}
function fillS(){g.fillStyle=COL.bg;g.fill();g.stroke();}
function circ(x,y,r){g.beginPath();g.arc(x,y,Math.max(0.1,r),0,TAU);}
function ln(x1,y1,x2,y2){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function hatchRect(x0,y0,x1,y1,sp,ang){
  // draws parallel lines across bbox (caller clips)
  const cx=(x0+x1)/2,cy=(y0+y1)/2,r=hyp(x1-x0,y1-y0)/2+sp;

function dotsRow(x0,x1,y,r,n){for(let i=0;i<n;i++){const x=lerp(x0,x1,(i+0.5)/n);circ(x,y,r);g.stroke();}}
function pattern(owner,x0,y0,x1,y1,lw){
  // owner line pattern (0: diagonal hatch, 1: stripes+dots) inside current clip
  g.save();g.beginPath();g.rect(x0,y0,x1-x0,y1-y0);g.clip();
  sw(lw*0.7,COL.lb,0.9);

function drawTop(t,x,y,sz,rot,baked,lw,a){

function drawMiniPizza(x,y,r,top,lw,sq){

// ================= pizza =================
const PX=new Float32Array(N),PY=new Float32Array(N);
function doughPath(cx,cy,R,mul,off,sq,vy){
  for(let i=0;i<N;i++){const a=i/N*TAU;const r=R*mul*(1+off[i]);PX[i]=cx+Math.cos(a)*r*(1+0.07*sq);PY[i]=cy+Math.sin(a)*r*(1-0.07*sq)*vy;}
  g.beginPath();
  g.moveTo((PX[N-1]+PX[0])/2,(PY[N-1]+PY[0])/2);
  for(let i=0;i<N;i++){const j=(i+1)%N;g.quadraticCurveTo(PX[i],PY[i],(PX[i]+PX[j])/2,(PY[i]+PY[j])/2);}
  g.closePath();
}
function drawPizza(cx,cy,sc,o){
  const pz=S.pz;const R=pzR()*sc;const lw=L.lw*clamp(sc,0.5,1);
  const vy=o.vy||1;const sq=pz.squash;
  const baked=o.baked,blink=o.blink||0;
  // outer

  g.fillStyle=COL.bg;g.fill();
  sw(lw*(1.5+blink*1.2),blink>0.5?COL.lb:COL.w);g.stroke();
  if(baked){doughPath(cx,cy,R,1.035,pz.off,sq,vy);sw(lw*0.7,COL.lb,0.7);g.stroke();}
  // hatch inside crust
  g.save();doughPath(cx,cy,R,0.84,pz.off,sq,vy);g.globalAlpha=1;
  sw(lw,COL.lb,0.9);g.stroke();
  g.clip();
  const spc=L.mn*(0.014+0.02*pz.s)*clamp(sc,0.5,1);
  sw(lw*0.6,COL.w,0.28+blink*0.25);
  hatchRect(cx-R*1.9,cy-R*1.9,cx+R*1.9,cy+R*1.9,Math.max(2.5,spc),-PI/4);
  if(baked){sw(lw*0.5,COL.lb,0.22);hatchRect(cx-R*1.9,cy-R*1.9,cx+R*1.9,cy+R*1.9,Math.max(3,spc*1.6),PI/4);}
  g.restore();
  // crust ticks
  g.globalAlpha=0.85;g.lineWidth=lw*0.7;g.strokeStyle=COL.w;
  const nt=baked?40:30;g.beginPath();
  for(let i=0;i<nt;i++){const a=i/nt*TAU+0.05;const j=Math.round(i/nt*N)%N;const f=1+pz.off[j];
    const r1=R*0.88*f,r2=R*0.97*f;g.moveTo(cx+Math.cos(a)*r1*(1+0.07*sq),cy+Math.sin(a)*r1*vy*(1-0.07*sq));g.lineTo(cx+Math.cos(a)*r2*(1+0.07*sq),cy+Math.sin(a)*r2*vy*(1-0.07*sq));}
  g.stroke();
  if(baked){g.globalAlpha=0.8;for(let i=0;i<9;i++){const a=i/9*TAU+0.3;circ(cx+Math.cos(a)*R*0.92,cy+Math.sin(a)*R*0.92*vy,R*0.035);g.stroke();}}
  g.globalAlpha=1;
  // center mark
  sw(lw*0.6,COL.w,0.45);ln(cx-R*0.07,cy,cx+R*0.07,cy);ln(cx,cy-R*0.07*vy,cx,cy+R*0.07*vy);circ(cx,cy,R*0.035);g.stroke();

    sw(lw*(0.8+pz.nFlash*1.2),COL.w,0.25+pz.nFlash*0.65);
    for(let i=0;i<n;i++){const a=-PI/2+i*TAU/n;const j=Math.round(((a+TAU)%TAU)/TAU*N)%N;ln(cx,cy,cx+Math.cos(a)*R*0.84*(1+pz.off[j]),cy+Math.sin(a)*R*0.84*(1+pz.off[j])*vy);}
    g.setLineDash([]);
  }
  if(o.cut!=null){

    for(let i=0;i<n;i++){const f=clamp(o.cut*n-i,0,1);if(f<=0)continue;const a=-PI/2+i*TAU/n;ln(cx,cy,cx+Math.cos(a)*R*1.04*eo(f),cy+Math.sin(a)*R*1.04*eo(f)*vy);}
  }

    g.save();g.translate(cx+p[0]*f*(1+0.07*sq),cy+p[1]*f*vy*(1-0.07*sq));g.scale(1,vy);

  }
  // grab tab highlight
  if(o.tab){
    const a=o.tab;const j=Math.round(((a+TAU)%TAU)/TAU*N)%N;const r=R*(1+pz.off[j]);const pl=(Math.sin(TIME*5)+1)/2;
    for(let k=0;k<3;k++){const rr=r*(1.06+k*0.07+pl*0.05);sw(lw*(1.8-k*0.4),COL.w,(0.95-k*0.28)*(0.55+pl*0.45));g.beginPath();g.arc(cx,cy,rr,a-0.42+k*0.06,a+0.42-k*0.06);g.stroke();}

function slicePath(R,a0,a1,eat){

// ================= people =================
function ikArm(sx,sy,tx,ty,a,b,side){
  let dx=tx-sx,dy=ty-sy;let d=hyp(dx,dy);const md=(a+b)*0.999;
  if(d>md){dx*=md/d;dy*=md/d;d=md;}if(d<1e-3)d=1e-3;
  const ca=(a*a+d*d-b*b)/(2*a*d);const ang=Math.atan2(dy,dx)+side*Math.acos(clamp(ca,-1,1));
  return [sx+Math.cos(ang)*a,sy+Math.sin(ang)*a,sx+dx,sy+dy];
}
function limb(pts,w,lw){
  g.beginPath();g.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);
  g.globalAlpha=1;g.lineWidth=w+lw*2;g.strokeStyle=COL.w;g.stroke();
  g.lineWidth=Math.max(0.5,w);g.strokeStyle=COL.bg;g.stroke();
}
function drawPerson(p,pass){
  const k=p.sz;if(k<4)return;
  const lw=Math.max(1,L.lw*clamp(k/L.pk,0.6,1.1));
  const seated=p.mode==='seat',hs=p.mode==='hsit';
  let bob=-Math.sin(p.hop*PI)*0.06*k;
  if(p.mode==='walk')bob-=Math.abs(Math.sin(p.ph))*0.015*k;
  if(p.anim==='chair')bob-=Math.sin(clamp(p.animT/p.animD,0,1)*PI)*0.07*k;
  if(seated&&!p.anim&&!p.eating){if(p.id===0)bob-=Math.max(0,Math.sin(TIME*11))*0.006*k*(Math.sin(TIME*0.7)>0.3?1:0);}
  const hx=p.x,hy0=hipY(p),hy=hy0+bob;
  g.lineJoin='round';g.lineCap='round';
  if(pass!=='arms'){
    if(!seated&&!(hs&&p.atTable))drawLegs(p,hx,hy,k,lw,hs);
    g.save();g.translate(hx,hy);g.rotate(p.lean);
    drawTorso(p,k,lw);drawHead(p,k,lw);
    g.restore();
  }
  if(pass!=='body'){
    g.save();g.translate(hx,hy);g.rotate(p.lean);
    const cl=Math.cos(p.lean),sl=Math.sin(p.lean);
    const hand=[];
    for(let i=0;i<2;i++){
      const s=i?1:-1;const sx=s*0.092*k,sy=-0.275*k;
      const v=p.hl[i];const vx=v[0],vy=v[1]-bob;
      const tx=vx*cl+vy*sl,ty=-vx*sl+vy*cl;
      const r=ikArm(sx,sy,tx,ty,0.155*k,0.15*k,-s);
      limb([sx,sy,r[0],r[1],r[2],r[3]],0.044*k,lw);
      g.beginPath();for(let j=0;j<6;j++){const a=j/6*TAU;const rr=0.027*k;j?g.lineTo(r[2]+Math.cos(a)*rr,r[3]+Math.sin(a)*rr):g.moveTo(r[2]+Math.cos(a)*rr,r[3]+Math.sin(a)*rr);}g.closePath();sw(lw,COL.w);fillS();
      hand.push([r[2],r[3]]);
    }
    if(p.hold){
      const mx=(hand[0][0]+hand[1][0])/2,my=(hand[0][1]+hand[1][1])/2-0.03*k;
      if(p.hold.k==='mini')drawMiniPizza(mx,my,0.075*k,p.hold.top,lw,0.6);
      else drawBundle(mx,my,0.07*k,lw);
    }
    g.restore();
  }
}
function drawLegs(p,hx,hy,k,lw,hs){
  for(let i=0;i<2;i++){
    const s=i?1:-1;const ix=hx+s*0.042*k;
    let kx,ky,fx,fy;
    if(hs){kx=ix+s*0.012*k;ky=hy+0.05*k;fx=kx;fy=hy+0.25*k;}
    else{
      const ph=p.ph+(i?PI:0);const walk=p.mode==='walk';

    limb([ix,hy,kx,ky,fx,fy],0.05*k,lw);
    g.beginPath();g.moveTo(fx-0.035*k,fy+0.012*k);g.lineTo(fx-0.03*k,fy-0.018*k);g.lineTo(fx+0.03*k,fy-0.018*k);g.lineTo(fx+0.045*k,fy+0.012*k);g.closePath();sw(lw,COL.w);fillS();

function drawHead0(p,k,lw){

    ln(hcx-rw*0.9,hcy+0.02*k,hcx-rw*0.85,hcy+0.09*k);ln(hcx+rw*0.9,hcy+0.02*k,hcx+rw*0.85,hcy+0.09*k);}

function q3(a,b,c,d){
  const A=HM(a[0],a[1],a[2]),B=HM(b[0],b[1],b[2]),C=HM(c[0],c[1],c[2]),D=HM(d[0],d[1],d[2]);

}
function box3(u0,v0,u1,v1,z0,z1,o){

    const cu=(u0+u1)/2;
    if(o.side!==false){const su=cu<0.5?u1:u0;q3([su,v0,z0],[su,v1,z0],[su,v1,z1],[su,v0,z1]);fillS();if(o.sideF)o.sideF(su);}
    q3([u0,v1,z0],[u1,v1,z0],[u1,v1,z1],[u0,v1,z1]);fillS();if(o.front)o.front();
  }

  const bob=isT?-Math.abs(Math.sin(TIME*4))*r.r*0.25:0;
  const x=r.x,y=r.y+bob,R=r.r,lw=L.lw;
  g.save();g.translate(x,y);g.rotate(-0.25);
  g.beginPath();g.rect(-R*1.1,-R*0.35,R*2.2,R*0.7);sw(lw*1.2,COL.w);fillS();
  g.beginPath();g.moveTo(-R*0.5,R*0.35);g.lineTo(-R*0.6,R*1.0);g.lineTo(R*0.9,R*1.0);g.lineTo(R*0.8,R*0.35);g.closePath();fillS();
  g.save();g.clip();sw(lw*0.5,COL.w,0.5);for(let i=1;i<5;i++){ln(-R*0.6+i*R*0.3,R*0.35,-R*0.6+i*R*0.3,R*1.0);ln(-R*0.6,R*0.35+i*R*0.13,R*0.9,R*0.35+i*R*0.13);}g.restore();
  g.beginPath();g.ellipse(-R*1.1,0,R*0.16,R*0.35,0,0,TAU);sw(lw*1.2,COL.w);fillS();g.beginPath();g.ellipse(-R*1.1,0,R*0.06,R*0.14,0,0,TAU);g.stroke();
  sw(lw*0.7,COL.lb);ln(-R*0.9,-R*0.2,R*1.0,-R*0.2);ln(-R*0.9,R*0.2,R*1.0,R*0.2);
  g.restore();
  if(isT){sw(lw*(1.3+pl),COL.w,0.35+pl*0.55);g.setLineDash([lw*4,lw*3]);g.lineDashOffset=-TIME*20;circ(x,y+R*0.2,R*1.7);g.stroke();g.setLineDash([]);g.lineDashOffset=0;g.globalAlpha=1;}
}

// ================= overlays =================
function drawFloating(){
  for(const [,pt] of PTR){
    const gb=pt.grab;if(!gb)continue;
    if(gb.type==='top'){drawTop(gb.tp.t,gb.tp.x,gb.tp.y,L.tsz*1.2,gb.tp.t?0:0.2,false,L.lw);}
    if(gb.type==='item'&&gb.moved){drawItemFloating(gb.it);}
  }
  for(const sl of S.sl){if(sl.st==='drag'||sl.st==='fly'||sl.st==='offer'||sl.st==='offerback')drawSlice(sl,slicePose(sl));}
}
function drawItemFloating(it){drawItem(it,0.95);}
function drawParticles(){
  for(const q of S.parts){
    const a=1-q.life/q.max;const s=q.sz;
    g.globalAlpha=clamp(a,0,1);
    switch(q.type){
      case 'dust':circ(q.x,q.y,s*0.5);g.fillStyle=COL.w;g.fill();break;
      case 'crumb':g.save();g.translate(q.x,q.y);g.rotate(q.rot);g.beginPath();g.moveTo(-s*0.5,s*0.4);g.lineTo(s*0.5,s*0.4);g.lineTo(0,-s*0.5);g.closePath();sw(L.lw*0.8,COL.lb,a);g.stroke();g.restore();break;
      case 'spark':drawStar(q.x,q.y,s*(0.4+0.6*a),L.lw*0.9);break;
      case 'steam':{sw(L.lw*0.8,COL.lb,a*0.8);g.beginPath();for(let i=0;i<=6;i++){const y=q.y-i*s*0.25;const x=q.x+Math.sin(i*1.4+q.life*6)*s*0.18;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();break;}
      case 'close':{const f=0.6+0.4*Math.sin(q.life*14);sw(L.lw*0.9,COL.lb,a*f);g.beginPath();g.arc(q.x-s*0.15,q.y,s*0.5,-PI*0.4,PI*0.4);g.stroke();g.beginPath();g.arc(q.x+s*0.15,q.y,s*0.5,PI*0.6,PI*1.4);g.stroke();break;}
      case 'bubble':circ(q.x,q.y,s*0.5);sw(L.lw*0.7,COL.w,a);g.stroke();break;
    }
  }
  g.globalAlpha=1;
}
function drawRipples(){for(const r of S.rip){const t=r.t/0.45;sw(L.lw*0.8,COL.w,(1-t)*0.4);circ(r.x,r.y,L.mn*0.012+t*L.mn*0.02);g.stroke();}g.globalAlpha=1;}
function drawHand(x,y,press,alpha){
  const s=L.mn*0.12*(press?0.9:1);
  g.save();g.globalAlpha=alpha;g.translate(x,y);g.rotate(-0.4);
  if(press){for(let i=0;i<2;i++){sw(L.lw,COL.lb,alpha*(0.7-i*0.3));circ(0,0,s*(0.12+i*0.1));g.stroke();}}
  g.globalAlpha=alpha;
  g.beginPath();
  g.moveTo(-0.075*s,0.06*s);g.quadraticCurveTo(-0.075*s,-0.02*s,0,-0.02*s);g.quadraticCurveTo(0.075*s,-0.02*s,0.075*s,0.06*s);
  g.lineTo(0.075*s,0.40*s);g.lineTo(0.15*s,0.37*s);g.lineTo(0.22*s,0.41*s);g.lineTo(0.27*s,0.47*s);g.lineTo(0.29*s,0.76*s);
  g.lineTo(0.15*s,0.93*s);g.lineTo(-0.1*s,0.93*s);g.lineTo(-0.2*s,0.7*s);g.lineTo(-0.27*s,0.5*s);g.lineTo(-0.2*s,0.45*s);g.lineTo(-0.075*s,0.56*s);g.closePath();
  sw(L.lw*1.5,COL.w,alpha);fillS();
  sw(L.lw*0.8,COL.lb,alpha);ln(0.075*s,0.40*s,0.08*s,0.55*s);ln(0.15*s,0.37*s,0.16*s,0.55*s);ln(0.22*s,0.41*s,0.23*s,0.57*s);
  g.setLineDash([L.lw*2,L.lw*1.5]);sw(L.lw*0.6,COL.w,alpha*0.6);ln(0,0.05*s,0,0.35*s);g.setLineDash([]);
  g.restore();g.globalAlpha=1;
}
function drawHint(){
  const h=S.hint;if(!h)return;const tg=h.tg,t=h.t;
  const tap=tg.k==='room'||tg.k==='roll';
  const alpha=t<0.25?t/0.25:(t>2.25?Math.max(0,(2.6-t)/0.35):1);
  let x,y,press;
  if(tap){x=tg.x;y=tg.y;const ph=t%1.1;press=ph>0.4&&ph<0.65;}
  else{const a=clamp((t-0.45)/1.3,0,1);const e=eio(a);x=lerp(tg.x,tg.to.x,e);y=lerp(tg.y,tg.to.y,e);press=t>0.35&&t<1.95;
    if(press&&tg.k==='bin'){drawTop(tg.i,x,y-L.tsz*0.4,L.tsz*1.1,0,false,L.lw);}
  }
  drawHand(x,y,press,alpha);
}
function drawWalkers(){
  const list=S.pp.filter(p=>p.mode!=='seat').sort((a,b)=>a.y-b.y);
  for(const p of list)drawPerson(p,'all');
}
function drawBubbles(){for(const p of S.pp)drawBubble(p);}
function render(){
  g.setTransform(DPR,0,0,DPR,0,0);g.globalAlpha=1;g.setLineDash([]);
  g.drawImage(gridCv,0,0,W,H);
  drawHouse();
  drawShelf();drawRoll();
  drawBand();
  drawOven();drawBins();
  drawBoard();
  drawWalkers();
  drawFloating();
  drawParticles();
  drawBubbles();
  drawHint();
  drawRipples();
}

// ================= main loop =================
let last=0,running=false,rafId=0;
function frame(now){
  rafId=0;if(!running)return;
  let dt=(now-last)/1000;last=now;
  if(!(dt>=0))dt=0;if(dt>0.05)dt=0.05;
  const t0=performance.now();
  try{const n=Math.max(1,Math.min(8,S.ts|0));for(let i=0;i<n;i++)update(dt);render();}catch(e){if(!frame.err){frame.err=1;console.warn(e);}}
  const ms=performance.now()-t0;PERF.n++;PERF.sum+=ms;if(ms>PERF.max)PERF.max=ms;
  rafId=requestAnimationFrame(frame);
}
const PERF={n:0,sum:0,max:0};
function startLoop(){if(running)return;running=true;last=performance.now();rafId=requestAnimationFrame(frame);}
function stopLoop(){running=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;}
function resize(){
  const oW=W,oH=H;
  W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  L=computeLayout();
  buildGrid();
  if(oW&&oH&&(oW!==W||oH!==H)){
    const fx=W/oW,fy=H/oH;
    S.pp.forEach(p=>{if(p.mode!=='seat'){p.x*=fx;p.y*=fy;}if(p.look){p.look.x*=fx;p.look.y*=fy;}});
    S.parts.forEach(q=>{q.x*=fx;q.y*=fy;});
    S.bund.forEach(b=>{b.x*=fx;b.y*=fy;});
    for(const [,pt] of PTR){endGrab(pt.grab,pt.x,pt.y,pt,true);}PTR.clear();
  }
  HM=mkHM();
}
function init(){
  S.fav=favFor(ST.plays);ST.plays++;saveStore();
  S.H=newHouse();S.pz=newPizza();S.pz.drop=0;
  S.pp=[mkPerson(0),mkPerson(1)];
  resize();
  S.pp.forEach(p=>{p.x=seatX(p.id);p.y=L.seatY;p.sz=L.pk;bubble(p,S.fav[p.id],3.6);});
  startLoop();
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){cancelAll();stretchStop();stopLoop();try{if(AC&&AC.state==='running')AC.suspend();}catch(_){}}
  else{startLoop();try{if(AC&&AC.state==='suspended')AC.resume();}catch(_){}}
});
window.addEventListener('pagehide',()=>{cancelAll();stretchStop();});
window.__bp={S,ST,PERF,get L(){return L;},get time(){return TIME;},get running(){return running;},audio:()=>AC?AC.state:'none',store:()=>STORE_STATE,saveOk:()=>SAVE_OK,
  slicePose,pzC,pzR,platePos,seatX,roomCenter,HM:()=>HM,found:()=>Object.assign({},S.found)};
init();
})();
</script>
