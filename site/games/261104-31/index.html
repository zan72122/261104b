(()=>{

// ================= audio (Web Audio synth only) =================
let AC=null, MST=null, NB=null, AMB=null;

function mkLoop(type,f,q){

}
function buildAmb(){try{AMB={rain:mkLoop('bandpass',2600,.55),flow:mkLoop('lowpass',420,.8),snow:mkLoop('bandpass',5600,1.3)};}catch(e){AMB=null;}}
function setAmb(n,gain,freq){

function tone(f,dur,o){

    osc.frequency.setValueAtTime(f,t);

    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    let node=osc;
    if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);node=fl;}
    node.connect(g);g.connect(MST);osc.start(t);osc.stop(t+dur+.05);
  }catch(e){}
}
function nz(dur,o){
  o=o||EMPTY; if(!aok()||!NB) return;
  try{
    const t=AC.currentTime+(o.at||0);
    const s=AC.createBufferSource();s.buffer=NB;
    const fl=AC.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1200,t);fl.Q.value=o.q||1;
    if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
    const g=AC.createGain(),pk=o.gain||.2,atk=o.atk||.004;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+atk);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

}
const SND={
  pick(k){nz(.14,{f:2200,f2:800,q:.9,gain:.12});tone(k==='hat'?1180:k==='muf'?392:523,.12,{gain:.06,type:'triangle'});},

    else{[1568,2093,3136].forEach((f,i)=>tone(f,1.3-i*.3,{gain:.09-i*.02,at:i*.012}));tone(2349,.9,{at:.16,gain:.05});}

  off(){nz(.25,{type:'lowpass',f:900,f2:300,gain:.18});tone(180,.14,{at:.22,type:'triangle',gain:.12});},

    tone(98,2.4,{gain:.28,f2:92});tone(147,2,{gain:.12,at:.02});

  bridge(){tone(140,.3,{type:'triangle',gain:.3,f2:85});nz(.1,{type:'lowpass',f:500,gain:.2});[523,659,784].forEach((f,i)=>tone(f,.4,{at:.2+i*.12,type:'triangle',gain:.09}));},
  ice(){for(let i=0;i<5;i++)tone(2400+Math.random()*1600,.18,{at:i*.07,gain:.045});},
  crack(){nz(.06,{type:'highpass',f:2200,gain:.22});nz(.05,{type:'highpass',f:3000,gain:.15,at:.09});},
  gush(){nz(1.3,{type:'lowpass',f:1100,f2:280,gain:.22,atk:.08});},
  creak(){tone(110,.45,{type:'sawtooth',f2:160,gain:.04,lp:700});},
  clack(v){tone(240+420*v,.04,{type:'triangle',gain:.035+.03*v});},
  drip(lv){const f=1500-760*sat(lv);tone(f,.09,{f2:f*.6,gain:.035});},
  don(g){tone(112,.55,{f2:58,gain:.38*g});nz(.08,{type:'lowpass',f:320,gain:.2*g});},
  ka(g){nz(.05,{f:2600,q:3,gain:.13*g});tone(920,.03,{gain:.05*g});},
  shop(){tone(620,.05,{type:'triangle',gain:.12});tone(520,.06,{type:'triangle',gain:.12,at:.11});tone(780,.3,{at:.25,gain:.05});},
  sweep(){nz(.22,{f:3200,q:.8,gain:.06});},
  boy(){tone(660,.09,{gain:.07,type:'triangle'});tone(880,.12,{gain:.06,type:'triangle',at:.09});},
  knock(){tone(330,.06,{type:'triangle',gain:.07});}
};

// ================= layout =================
let W=1,H=1,DPR=1;
const L={};
let SA={t:0,r:0,b:0,l:0};
function readSA(){
  try{const cs=getComputedStyle(SAel);SA={t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};}catch(e){SA={t:0,r:0,b:0,l:0};}
}
function layout(){
  W=Math.max(1,window.innerWidth|0);H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();
  const top=SA.t, h=Math.max(200,H-SA.t-SA.b), left=SA.l, w=Math.max(200,W-SA.l-SA.r);
  const X=f=>left+w*f, Y=f=>top+h*f;
  const por=h>w*1.05;
  L.por=por;L.top=top;L.h=h;L.left=left;L.w=w;L.bot=top+h;
  if(por){
    L.yF=Y(.335);L.yB=Y(.398);L.yN=Y(.478);L.yNB=Y(.522);
    L.Hb=Math.min(h*.255,w*.56);
    L.boyX=X(.5);L.feetY=Y(.885);
    L.home={umb:[X(.17),Y(.765)],muf:[X(.85),Y(.70)],hat:[X(.80),Y(.915)]};
    L.xT=X(.07);L.xM=X(.24);L.xBr=X(.53);L.xG=X(.745);L.xY=X(.905);L.xS=X(.82);L.xGe=X(.39);
    L.nMin=.08;L.nMax=.68;
    L.sunX=X(.80);L.sunY=Y(.115);
    L.rbX=X(.54);L.rbY=L.yF+h*.07;L.rbR=L.rbY-Y(.075);
  }else{
    L.yF=Y(.36);L.yB=Y(.435);L.yN=Y(.535);L.yNB=Y(.59);
    L.Hb=Math.min(h*.36,w*.25);
    L.boyX=X(.30);L.feetY=Y(.935);
    L.home={umb:[X(.105),Y(.80)],muf:[X(.615),Y(.775)],hat:[X(.49),Y(.915)]};
    L.xT=X(.045);L.xM=X(.19);L.xBr=X(.465);L.xG=X(.675);L.xY=X(.845);L.xS=X(.85);L.xGe=X(.36);
    L.nMin=.40;L.nMax=.76;
    L.sunX=X(.88);L.sunY=Y(.13);
    L.rbX=X(.56);L.rbY=L.yF+h*.10;L.rbR=L.rbY-Y(.07);
  }
  L.s=L.Hb/215;
  L.X=X;
  L.wallH=L.yB-L.yF;
  L.bw=Math.max(22,L.Hb*.14);
  L.xI=L.xBr-L.bw*1.9;
  L.rw=Math.min(L.Hb*.17,L.wallH*.95);
  L.wX=L.xM+L.Hb*.12;L.wY=L.yF+L.wallH*.12;
  L.postX=L.xBr+L.bw*.75;L.postY=L.yF-L.Hb*.2;
  L.sunR=Math.min(w,h)*.075;
  L.ph=L.Hb*.17;
  L.snapRX=L.Hb*.62;L.snapRY=L.Hb*.78;
  L.yFP=L.yF-L.Hb*.02;
  buildGeom();buildSprites();buildBG();
  for(const k of KINDS){const it=IT[k];if(it.st==='home'||it.st==='ret'){it.x=L.home[k][0];it.y=L.home[k][1];if(it.st==='ret')it.st='home';}else if(it.st==='sel'||it.st==='drag'||it.st==='fly'){it.st='home';it.x=L.home[k][0];it.y=L.home[k][1];if(G.worn[k]){it.st='worn';}}}
  ptr=null;
  for(const p of P){if(p.mode==='cross'){p.side=p.prog>.5?(p.cdir>0?'F':'N'):(p.cdir>0?'N':'F');p.mode='walk';p.route=null;}}
}
const nearEdgeY=x=>L.yN+Math.sin(x*.013/L.s+1.3)*2.4*L.s+Math.sin(x*.041/L.s)*1.1*L.s;
const farEdgeY=x=>L.yF+Math.sin(x*.011/L.s+.4)*1.8*L.s;
const bedY=x=>L.yB+Math.sin(x*.017/L.s+2.1)*1.8*L.s;
const waterYat=(x,lv)=>{const b=bedY(x);return b-sat(lv)*(b-farEdgeY(x))*.86;};

// ================= brush helpers =================
function cr(P,seg){
  const out=[];
  for(let i=0;i<P.length-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||P[i+1];
    for(let j=0;j<seg;j++){
      const t=j/seg,t2=t*t,t3=t2*t;
      out.push([.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                .5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);
    }
  }
  out.push(P[P.length-1]);return out;
}
function brushPoly(pts,w,o){
  o=o||EMPTY;const n=pts.length;
  const ts=o.ts!==undefined?o.ts:.2,te=o.te!==undefined?o.te:.3,jit=o.jit!==undefined?o.jit:.25,seed=o.seed||0,mn=o.mn!==undefined?o.mn:.12;
  const Lp=[],Rp=[];
  for(let i=0;i<n;i++){
    const t=n>1?i/(n-1):0;
    const p=pts[i],q=pts[Math.min(n-1,i+1)],r=pts[Math.max(0,i-1)];
    let dx=q[0]-r[0],dy=q[1]-r[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
    let pr=Math.min(ts>0?sstep(0,ts,t):1,te>0?sstep(1,1-te,t):1);
    pr=mn+(1-mn)*pr;
    const wv=w*pr*(1+jit*(hs(seed+i*1.37)-.5)*2)*.5;
    Lp.push(p[0]-dy*wv,p[1]+dx*wv);Rp.push(p[0]+dy*wv,p[1]-dx*wv);
  }
  return [Lp,Rp];
}
function fillPoly(c,LR){
  const Lp=LR[0],Rp=LR[1];
  c.beginPath();c.moveTo(Lp[0],Lp[1]);
  for(let i=2;i<Lp.length;i+=2)c.lineTo(Lp[i],Lp[i+1]);
  for(let i=Rp.length-2;i>=0;i-=2)c.lineTo(Rp[i],Rp[i+1]);
  c.closePath();c.fill();
}
function brush(c,pts,w,a,o){
  if(pts.length<2)return;o=o||EMPTY;
  c.fillStyle=o.col||ink(a);fillPoly(c,brushPoly(pts,w,o));
}
function bbrush(c,pts,w,a,o){ // with nijimi bleed
  o=o||EMPTY;
  c.fillStyle=o.col?o.col:ink(a*.11);fillPoly(c,brushPoly(pts,w*(o.bl||2.3),Object.assign({},o,{jit:.45,seed:(o.seed||0)+9})));
  brush(c,pts,w,a,o);
}
function dry(c,pts,w,seed,a){ // kasure: a few long thin paper streaks along the latter part of a stroke
  srand(seed||7);
  let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  if(len<4)return;
  c.save();c.lineCap='round';
  for(let k=0;k<4;k++){
    const off=(rnd()-.5)*w*.62;
    c.strokeStyle=pap((a||.5)*(.45+rnd()*.55));c.lineWidth=Math.max(.45,w*(.035+rnd()*.05));
    const st=len*(.2+rnd()*.45),ln=len*(.15+rnd()*.35);
    c.setLineDash([.01,st,ln,len*2]);
    c.beginPath();
    for(let i=0;i<pts.length;i++){
      const p=pts[i],q=pts[Math.min(pts.length-1,i+1)],r=pts[Math.max(0,i-1)];
      let dx=q[0]-r[0],dy=q[1]-r[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;
      const x=p[0]-dy*off,y=p[1]+dx*off;if(i)c.lineTo(x,y);else c.moveTo(x,y);
    }
    c.stroke();
  }
  c.restore();
}
function circlePts(cx,cy,rx,ry,a0,a1,n){const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return o;}
function ellipse(c,x,y,rx,ry,rot){c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),rot||0,0,TAU);}

// ================= sprites =================
const SP={};
function mkSprite(w,h,ax,ay,draw){
  const c=document.createElement('canvas');c.width=Math.max(2,Math.ceil(w*DPR));c.height=Math.max(2,Math.ceil(h*DPR));
  const x=c.getContext('2d');x.setTransform(DPR,0,0,DPR,0,0);x.translate(ax,ay);draw(x);
  return {c,w,h,ax,ay};
}
function drawSprite(c,sp,x,y,sx,sy,rot,alpha){
  c.save();c.translate(x,y);if(rot)c.rotate(rot);c.scale(sx,sy);
  if(alpha!==undefined&&alpha<1)c.globalAlpha*=alpha;
  c.drawImage(sp.c,-sp.ax,-sp.ay,sp.w,sp.h);c.restore();
}
function buildSprites(){
  const h=L.Hb,s=L.s;
  // ink blots (nijimi)
  SP.blot=[];
  for(let b=0;b<3;b++){
    SP.blot.push(mkSprite(128,128,64,64,c=>{
      srand(100+b);
      for(let i=0;i<7;i++){
        const r=24+rnd()*30,x=(rnd()-.5)*26,y=(rnd()-.5)*26;
        const g=c.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,ink(.20));g.addColorStop(.55,ink(.10));g.addColorStop(1,ink(0));
        c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
      }
    }));
  }
  SP.white=mkSprite(128,128,64,64,c=>{
    const g=c.createRadialGradient(0,0,0,0,0,62);g.addColorStop(0,wh(.95));g.addColorStop(.6,wh(.6));g.addColorStop(1,wh(0));
    c.fillStyle=g;c.beginPath();c.arc(0,0,62,0,TAU);c.fill();
  });
  // umbrella (bangasa, janome ring). anchor = apex
  const cw=h*.31;
  SP.umb=mkSprite(cw*2+h*.12,h*.72,cw+h*.06,h*.08,c=>{
    const rimY=h*.12;
    const dome=[];
    for(let i=0;i<=24;i++){const t=i/24,a=PI+t*PI;dome.push([Math.cos(a)*cw,rimY+Math.sin(a)*(rimY+h*.03)]);}
    // canopy fill
    c.fillStyle='rgba(239,231,212,.9)';c.beginPath();c.moveTo(dome[0][0],dome[0][1]);for(const p of dome)c.lineTo(p[0],p[1]);
    // scalloped rim
    for(let i=8;i>0;i--){const x0=-cw+(i)*cw/4,x1=-cw+(i-1)*cw/4;c.quadraticCurveTo((x0+x1)/2,rimY+h*.022,x1,rimY);}
    c.closePath();c.fill();c.fillStyle=ink(.07);c.fill();
    // janome dark ring band
    c.save();c.clip();
    c.fillStyle=ink(.34);c.beginPath();c.ellipse(0,rimY,cw*.8,(rimY+h*.03)*.8,0,PI,TAU);c.ellipse(0,rimY,cw*.56,(rimY+h*.03)*.56,0,TAU,PI,true);c.fill();
    c.fillStyle=ink(.10);c.beginPath();c.ellipse(0,rimY,cw*.24,(rimY+h*.03)*.3,0,PI,TAU);c.fill();
    c.restore();
    // ribs
    c.strokeStyle=ink(.28);c.lineWidth=Math.max(.7,s*.9);

      let y,xx=x;if(u<.12)y=lerp(y0,y1,u/.12);else if(u<.72)y=lerp(y1,wy,(u-.12)/.6);else {const t=(u-.72)/.28;y=lerp(wy,y3,t);xx=x+s*6*t;}

function updPeople(dt){
  const route=routeAvail();
  const sunny=Hi>.5,rainy=Ri>.5,snowy=Si>.5||G.snowG>.35;
  bridgeHoldPeople=false;iceHoldPeople=false;
  for(const p of P){
    if(p.mode==='cross'){if(p.route==='bridge')bridgeHoldPeople=true;else iceHoldPeople=true;}
  }
  const festive=G.rev&&revA>.5;
  // a newly appeared crossing route invites someone to try it soon
  if(route&&route!==updPeople.last){
    const lx=landX(route);
    const cand=P.filter(p=>p.k!=='f3'&&p.k!=='f2'&&!(p.mode==='cross'||p.mode==='drum'||p.want)&&!(p.k==='f1'&&!(G.shop>.5)&&p.side==='F'));
    cand.sort((a,b)=>Math.abs(a.x-lx)-Math.abs(b.x-lx));
    for(let i=0;i<Math.min(2,cand.length);i++){cand[i].want=1;cand[i].stay=0;}
  }
  updPeople.last=route;
  for(const p of P){
    p.ph+=dt*TAU*(snowy?3.4:sunny&&!rainy?2.3:1.9)*(p.hurry?1.8:1);
    // drummer
    if(p.k==='f2'&&p.side==='F'&&G.rev){
      if(p.mode!=='cross'){p.mode='drum';continue;}
    }
    if(p.mode==='drum'&&!(p.k==='f2'&&G.rev&&p.side==='F'))p.mode='walk';
    if(p.mode==='cross'){
      const unsafe=p.route==='ice'&&(Hi>.25||G.ice<.85);
      if(unsafe&&!p.hurry){p.hurry=1;const u=p.cdir>0?p.prog:1-p.prog;if(u<.45){p.cdir=-p.cdir;p.prog=1-p.prog;}log('ice-escape');}
      let sp=(p.route==='bridge'?.14:.135)*(snowy&&p.route!=='bridge'?.8:1)*(p.hurry?2.4:1);
      p.prog+=sp*dt;
      if(p.prog>=1){
        const toF=p.cdir>0;p.side=toF?'F':'N';p.mode='walk';p.hurry=0;
        p.x=landX(p.route)+(toF?.03:0);
        if(p.side==='N')p.x=clamp(p.x,L.nMin,L.nMax);
        log(p.route==='bridge'?'cross-bridge':'cross-ice');
        p.route=null;p.want=0;p.stay=0;p.timer=2+Math.random()*3;
        const r=sideRange(p);p.tx=clamp(p.x+(toF?.08:-.06)*(1+Math.random()),r[0],r[1]);
        if(p.k==='f1'&&p.side==='N')p.shopVisit=1;
      }
      continue;
    }
    // desires
    p.stay+=dt;
    if(!p.want){
      if(p.k[0]==='v'){
        if(p.side==='N'&&route&&p.stay>1.5+PDEF.findIndex(d=>d.k===p.k)*1.6)p.want=1;
        if(p.side==='F'&&route&&p.stay>(festive?38+PDEF.findIndex(d=>d.k===p.k)*9:14))p.want=1;
      }else if(p.k==='f1'){
        if(p.side==='F'&&route&&G.shop>.9&&p.stay>5)p.want=1;
        if(p.side==='N'&&route&&p.stay>12)p.want=1;
      }
    }
    const r=sideRange(p);
    if(p.want&&route){
      const lx=landX(route);
      p.tx=p.side==='N'?clamp(lx,0,1):lx+.012;
      if(Math.abs(p.x-p.tx)<.008){
        p.mode='cross';p.route=route;p.prog=0;p.cdir=p.side==='N'?1:-1;p.hurry=0;
        if(route==='bridge')bridgeHoldPeople=true;else iceHoldPeople=true;
        log(route==='bridge'?'start-bridge':'start-ice');
        continue;
      }
    }else{
      if(p.want&&!route&&p.stay>40)p.want=0;
      p.timer-=dt;
      if(p.timer<=0||Math.abs(p.x-p.tx)<.004){
        if(p.timer<=0){
          p.timer=3+Math.random()*5;
          let tx;
          if(p.k==='f1'&&p.side==='N'&&G.shop>.5)tx=(L.xS-L.left)/L.w-.09;
          else if(festive&&p.side==='F')tx=(L.xY-L.left)/L.w+(Math.random()-.5)*.12;
          else tx=lerp(r[0],r[1],Math.random());
          p.tx=clamp(tx,p.side==='N'?L.nMin:r[0],p.side==='N'?((p.k==='f1'&&G.shop>.5)?.9:L.nMax):r[1]);
        }
      }
    }
    const d=p.tx-p.x;
    let sp=.035*(snowy?.62:1)*(sunny&&!rainy?1.15:1)*(p.k==='v3'?.75:1)*(p.want&&route?2.1:1)*(L.por?1:.62);
    if(Math.abs(d)>.003){p.dir=Math.sign(d);p.x+=Math.sign(d)*Math.min(Math.abs(d),sp*dt);p.idle=0;}else p.idle+=dt;

      for(const q of xs){const dd=Math.abs(px-q);const R=L.Hb*.09;if(dd<R){p.hop=Math.sin((1-dd/R)*PI*.5+.0)*1;}}
    }
  }
}

// ================= simulation =================
function sim(dt){
  const wu=G.worn.umb,wm=G.worn.muf,whh=G.worn.hat;
  const a3=!!(wu&&wm&&whh);
  Ri=appr(Ri,wu,2.4,dt);Si=appr(Si,wm,2,dt);Hi=appr(Hi,whh,2,dt);
  if(a3&&!lastAll3){onAll3();}
  lastAll3=a3;
  all3T=a3?all3T+dt:0;
  const cold=Si*(1-Hi);
  const rainMul=a3?2.2:1;
  // rain feeds groove + tributary
  groove+=Ri*rainMul*.036*dt;trib+=Ri*rainMul*.014*dt;
  // snow accumulation
  const acc=Si*(1-.85*Hi)*.075*dt;
  G.snowG=Math.min(1,G.snowG+acc);
  G.snowR=Math.min(1,G.snowR+Si*(1-.45*Hi)*.08*dt);
  G.snowShop=Math.min(1,G.snowShop+Si*(1-.45*Hi)*.08*dt);
  if(G.water<.08)G.snowBed=Math.min(1,G.snowBed+acc*1.3);
  // melt
  const ms=Hi*(1-.6*Si)*.17;
  const mG=Math.min(G.snowG,ms*dt);G.snowG-=mG;
  const mB=Math.min(G.snowBed,ms*1.2*dt);G.snowBed-=mB;
  trib+=mG*.62;groove+=mG*.22;G.water+=mB*.35;
  meltS=appr(meltS,(mG+mB)/Math.max(dt,1e-4),3,dt);
  if(meltS>.08&&surgeLog<=0){log('melt-surge');SND.gush();surgeLog=6;}
  surgeLog-=dt;
  G.snowR=Math.max(0,G.snowR-Hi*(1-Si)*.1*dt);
  G.snowShop=Math.max(0,G.snowShop-Hi*(1-Si)*.1*dt);
  // groove/trib transfer (visible delay)
  const gOut=groove*(1-Math.exp(-1.5*dt)),tOut=trib*(1-Math.exp(-1.1*dt));
  groove-=gOut;trib-=tOut;
  G.water+=gOut+tOut;
  inRateS=appr(inRateS,(gOut+tOut)/Math.max(dt,1e-4),2.5,dt);
  // ice
  if(cold>.05&&G.water>.04)G.ice=Math.min(1,G.ice+cold*.095*dt);
  const iceFloor=(Hi>.05&&Si>.5)?.18:0;
  if(Hi>.05&&G.ice>iceFloor){
    let nv=G.ice-Hi*(a3?.34:.13)*dt;
    if(iceHoldPeople)nv=Math.max(nv,Math.min(G.ice,.9));
    G.ice=Math.max(iceFloor,nv);
  }
  if(G.water<.02)G.ice=Math.max(0,G.ice-.2*dt);
  // drain + evaporation
  const lock=sstep(.5,.95,G.ice);
  G.water-=Math.max(0,G.water-.22)*.03*dt*(1-lock);
  if(Hi>.5&&Ri<.1)G.water=Math.max(0,G.water-(Si<.1?.008:.003)*dt*Hi*(1-lock));
  G.water=clamp(G.water,0,1.1);
  G.wmax=Math.max(G.wmax-.004*dt,Math.min(1,G.water));
  // puddles
  G.pud=sat(G.pud+(Ri*.07-Hi*(1-Ri)*.03-.0025)*dt);
  // flow
  const iceF=sstep(.35,.9,G.ice);
  const levelTerm=sstep(.22,1,G.water)*.45;
  const inTerm=sat(inRateS/.05)*.2+sat((inRateS-.05)/.11)*.65;
  let ft=(levelTerm+inTerm)*(1-iceF);
  if(a3&&G.water>.28)ft=Math.max(ft,1.06);
  flow=appr(flow,ft,1.2,dt);
  const dip=sstep(.16,.32,G.water);
  const wt=flow*dip*(1-sstep(.55,.85,G.ice));
  wheelV=appr(wheelV,wt,a3?1.5:1.1,dt);
  if(wheelV<.002)wheelV=0;
  wheelA+=wheelV*2.6*dt;
  // bridge
  const bt=sstep(.45,.95,wheelV);
  if(G.bridge>=.985&&wheelV>.5)openHold=Math.max(openHold,2.5);
  openHold-=dt;
  const b0=G.bridge;
  if(bt>G.bridge){G.bridge=Math.min(bt,G.bridge+(a3?.62:.42)*wheelV*dt);}
  else if(!bridgeHoldPeople&&openHold<=0){G.bridge=Math.max(bt,G.bridge-.055*dt);}
  if(G.bridge>.985&&b0<=.985){G.bridge=1;SND.bridge();log('bridge-open');fxRing(L.xBr,L.yF,L.Hb*.25,.25);}
  if(G.bridge<.95&&prevBridge>=.95)log('bridge-lowering');
  ropePh+=(G.bridge-b0)*14;
  prevBridge=G.bridge;
  // reveal festival
  if(a3&&G.bridge>=.985&&!G.rev){G.rev=1;log('reveal');SND.success();}

let ptr=null;
function hitHome(x,y){
  let best=null,bd=1e9;
  for(const k of KINDS){
    const it=IT[k];if(it.st!=='home'&&it.st!=='sel'&&it.st!=='ret')continue;
    const r=L.Hb*(k==='umb'?.3:k==='muf'?.26:.27);
    const cy=it.y+(k==='umb'?L.Hb*.14:k==='muf'?L.Hb*.12:-L.Hb*.02);
    const d=dist(x,y,it.x,cy)/r;
    if(d<1&&d<bd){bd=d;best=k;}
  }
  return best;
}
function hitWorn(x,y){
  let best=null,bd=1e9;
  for(const k of KINDS){
    if(IT[k].st!=='worn')continue;
    const a=boyAttach(k);let cx=a.x,cy=a.y,r;
    if(k==='umb'){cy+=L.Hb*.04;r=L.Hb*.3;}else if(k==='hat'){cy-=L.Hb*.03;r=L.Hb*.2;}else{r=L.Hb*.14;cy+=L.Hb*.03;}
    const d=dist(x,y,cx,cy)/r;
    if(d<1&&d<bd){bd=d;best=k;}
  }
  return best;
}
function beginDrag(it,from,x,y){
  it.st='drag';it.from=from;
  if(from==='boy'){const a=boyAttach(it.k);it.x=a.x;it.y=a.y;it.rot=a.r;}
  it.ox=it.x-x;it.oy=it.y-y;it.vx=0;it.vy=0;
  it.sqv-=4.5;it.lift=1;
  ptr.item=it;ptr.from=from;
}
function onDown(x,y){
  const sel=selItem();
  if(sel&&inBoyArea(x,y)&&!hitWorn(x,y)){ptr.wasSel=true;DID.boy=true;wearFly(sel,false);fxTouch(x,y,.7);ptr.done=true;return;}
  const hk=hitHome(x,y);
  if(hk){
    const it=IT[hk];
    if(sel&&sel!==it)sendHome(sel);
    ptr.wasSel=it.st==='sel';
    beginDrag(it,'home',x,y);fxTouch(x,y,1);SND.pick(hk);return;
  }
  const wk=hitWorn(x,y);
  if(wk){if(sel)sendHome(sel);beginDrag(IT[wk],'boy',x,y);fxTouch(x,y,.8);SND.pick(wk);return;}
  if(sel){sendHome(sel);ptr.done=true;return;}
  if(inBoyBody(x,y)){BOY.faceT=1;BOY.hopV=320*L.s;SND.boy();fxRing(x,y,L.Hb*.15,.12);return;}
  sceneryTap(x,y);
}
let swayM=0,swayS=0,swayG=0;
function sceneryTap(x,y){
  const small=()=>fxRing(x,y,L.Hb*.08,.1);
  if(dist(x,y,L.wX,L.wY)<L.rw*1.4){swayM=1;SND.knock();small();return;}
  const sp=GEO.shop;if(sp&&Math.abs(x-sp.x)<sp.sw*.7&&y<sp.base+L.s*6&&y>sp.base-sp.sh-L.Hb*.1){swayS=1;SND.knock();small();return;}
  if(Math.abs(x-L.xG)<L.Hb*.18&&y<L.yF+L.s*4&&y>GEO.gateTop-L.s*6){swayG=1;SND.knock();small();return;}
  for(const p of P){const q=personPos(p);if(dist(x,y,q[0],q[1]-L.ph*.5*q[2])<L.ph*.7){p.jump=.4;SND.knock();small();return;}}
}
function onMove(x,y){
  const t=performance.now();
  const dtm=Math.max(1,t-ptr.lt);
  const vx=(x-ptr.x)/dtm,vy=(y-ptr.y)/dtm;
  ptr.vx=lerp(ptr.vx,vx,.45);ptr.vy=lerp(ptr.vy,vy,.45);

function flickToBoy(it){

}
function onUp(x,y,cancel){
  const it=ptr.item;const dur=performance.now()-ptr.t0;
  if(it&&it.st==='drag'){
    const tap=ptr.moved<14;void dur;
    if(cancel){if(it.from==='boy')wearFly(it,true);else sendHome(it);}

      else removeIt(it);
    }
  }
  ptr=null;
}

// ================= item update =================
function updItems(dt){
  const s=L.s;
  const hint=hintInfo();
  for(const k of KINDS){
    const it=IT[k];
    // squash spring (press shrink, release rebound)
    it.sqv+=(-200*it.sq-11*it.sqv)*dt;it.sq+=it.sqv*dt*.05;it.sq=clamp(it.sq,-.35,.35);
    it.wig=Math.max(0,it.wig-dt*2);
    const hm=L.home[k];
    if(it.st==='home'){
      let ty=hm[1],tx=hm[0];
      if(hint&&hint.type==='wear'&&hint.k===k){const ph=(T*1.25)%2;if(ph<.5){ty-=Math.sin(ph/.5*PI)*L.Hb*.07;}}
      it.x=appr(it.x,tx,14,dt);it.y=appr(it.y,ty,14,dt);
      it.rot=appr(it.rot,Math.sin(T*1.1+k.length)*.03,4,dt);
      it.stretch=appr(it.stretch,0,10,dt);
    }else if(it.st==='sel'){
      it.x=appr(it.x,hm[0],10,dt);it.y=appr(it.y,hm[1]-L.Hb*.1+Math.sin(T*4)*L.Hb*.012,10,dt);
      it.rot=appr(it.rot,Math.sin(T*3)*.06,6,dt);
    }else if(it.st==='drag'){
      it.ox=appr(it.ox,0,3,dt);it.oy=appr(it.oy,-L.Hb*.05,3,dt);
      let tx=ptr?ptr.x+it.ox:it.x,ty=ptr?ptr.y+it.oy:it.y;
      if(inBoyArea(tx,ty)){const a=boyAttach(k);tx=lerp(tx,a.x,.18);ty=lerp(ty,a.y,.18);}
      const px=it.x,py=it.y;
      it.x=appr(it.x,tx,26,dt);it.y=appr(it.y,ty,26,dt);
      const vx=(it.x-px)/Math.max(dt,1e-3),vy=(it.y-py)/Math.max(dt,1e-3);
      const sp=Math.hypot(vx,vy);
      it.stretch=appr(it.stretch,Math.min(.28,sp*.00055/s),12,dt);
      if(sp>30)it.sang=Math.atan2(vy,vx);
      it.rot=appr(it.rot,clamp(vx*.0006,-.4,.4),8,dt);
    }else if(it.st==='fly'||it.st==='ret'){
      it.ft+=dt;const u=sat(it.ft/it.fd),e=eo(u);
      let tx,ty,tr=0;
      if(it.st==='fly'){const a=boyAttach(k);tx=a.x;ty=a.y;tr=a.r;}else{tx=hm[0];ty=hm[1];}
      it.x=lerp(it.fx,tx,e);it.y=lerp(it.fy,ty,e)-Math.sin(u*PI)*L.Hb*(it.st==='ret'?.12:.06);
      it.rot=lerp(it.rot,tr,.3);
      it.stretch=appr(it.stretch,0,10,dt);
      if(u>=1){if(it.st==='fly'){it.st='worn';onWorn(it);}else{it.st='home';it.sqv+=4;SND.land();}}
    }else if(it.st==='worn'){
      const a=boyAttach(k);it.x=a.x;it.y=a.y;it.rot=a.r;it.stretch=0;
      if(hint&&hint.type==='remove'&&hint.k===k){const ph=(T*1.1)%2.2;if(ph<.6)it.wig=Math.max(it.wig,Math.sin(ph/.6*PI));}
    }
  }
}
function drawItem(c,it,alpha){
  const k=it.k,s=L.s;
  const sp=k==='umb'?SP.umb:k==='hat'?SP.hat:SP.muf;
  let sc=1;
  if(it.st==='home')sc=k==='umb'?.82:.92;
  if(it.st==='sel'||it.st==='drag')sc=1.08;
  if(it.st==='ret'){sc=lerp(1.05,k==='umb'?.82:.92,eo(sat(it.ft/it.fd)));}

  if(it.st==='drag'||it.st==='sel'){c.fillStyle=ink(.07);ellipse(c,it.x,it.y+L.Hb*.28,L.Hb*.14,L.Hb*.03);c.fill();}

  let rot=it.rot;

  drawSprite(c,sp,0,0,sx,sy,rot,alpha);
  c.restore();
}

function buildSkySprites(){
  const s=L.s;
  // rainbow: pre-rendered ink-gradation arcs (drawn per frame through a sweep clip)
  const cx=L.rbX,cy=L.rbY,R=L.rbR,bw=Math.max(5,L.Hb*.032);
  const x0=Math.max(0,cx-R-bw*2),x1=Math.min(W,cx+R+bw*2),y0=Math.max(0,cy-R-bw*2),y1=L.yF;
  GEO.rb={x0,y0,w:Math.max(2,x1-x0),h:Math.max(2,y1-y0),bw};
  SP.rainbow=mkSprite(GEO.rb.w,GEO.rb.h,0,0,c=>{
    c.translate(-x0,-y0);
    const al=[.05,.1,.16,.2,.15,.09,.045];
    for(let i=0;i<al.length;i++){
      const gg=c.createLinearGradient(0,cy-R,0,L.yF-L.h*.02);
      gg.addColorStop(0,ink(al[i]));gg.addColorStop(.75,ink(al[i]*.7));gg.addColorStop(1,ink(0));
      c.strokeStyle=gg;c.lineWidth=bw*(.85+hs(i)*.35);c.beginPath();c.arc(cx,cy,R-i*bw*1.02,PI,TAU);c.stroke();
    }
    c.strokeStyle=pap(.45);c.lineWidth=Math.max(.8,s);c.setLineDash([s*8,s*13]);
    for(let i=0;i<3;i++){c.lineDashOffset=i*7;c.beginPath();c.arc(cx,cy,R-bw*(1.5+i*1.9),PI,TAU);c.stroke();}
    c.setLineDash([]);
  });
  // cloud band (soft wash) at half resolution
  const ch=L.top+L.h*.2;
  const dpr0=DPR;DPR=Math.max(.5,DPR*.5);
  SP.clouds=mkSprite(W*1.1,ch,W*.05,0,c=>{for(const cl of GEO.clouds)drawSprite(c,SP.blot[cl.b],cl.x,cl.y,cl.r/64,cl.r/64*.45,0);});
  DPR=dpr0;
  // water texture: horizontal ink streaks and paper glints (scrolled by the flow)
  const th=Math.max(4,L.yN-L.yF+L.s*8);
  SP.waterTex=mkSprite(W,th,0,0,c=>{
    srand(501);
    for(let i=0;i<W/7;i++){
      const x=rnd()*W,y=rnd()*th,l=L.s*(14+rnd()*90),w=L.s*(1+rnd()*3.5);
      const pts=[[x,y],[x+l*.5,y+(rnd()-.5)*L.s*2],[x+l,y+(rnd()-.5)*L.s*2]];
      if(rnd()<.72)brush(c,pts,w,.05+rnd()*.09,{ts:.3,te:.5,jit:.4,seed:i,mn:.1});
      else brush(c,pts,w*.7,0,{ts:.3,te:.5,col:wh(.35+rnd()*.3),seed:i,mn:.1});
      if(x+l>W)brush(c,pts.map(q=>[q[0]-W,q[1]]),w,.06,{ts:.3,te:.5,jit:.4,seed:i,mn:.1});
    }
  });
}
function drawSky(c){
  const s=L.s;
  // cloud wash
  const ca=Ri*.13+Si*.09-Hi*.03*(Ri+Si);

  c.fillStyle='rgba(239,230,210,.95)';c.fillRect(sp.x-sp.sw*.47+sw,sy0,sp.sw*.94,shH);
  c.fillStyle=ink(.18);c.fillRect(sp.x-sp.sw*.47+sw,sy0,sp.sw*.94,shH);
  c.strokeStyle=ink(.35);c.lineWidth=s;for(let i=1;i<5;i++){const y=sy0+shH*i/5;c.beginPath();c.moveTo(sp.x-sp.sw*.47,y);c.lineTo(sp.x+sp.sw*.47,y);c.stroke();}
  if(o>.05){
    // goods: small open umbrellas
    c.save();c.globalAlpha=o;
    for(let i=0;i<3;i++){const ux=sp.x+(i-1)*sp.sw*.28,uy=sp.base-sp.sh*.32;const r=h*.06;
      c.fillStyle=ink(.08+.06*i);c.beginPath();c.arc(ux,uy,r,PI,TAU);c.closePath();c.fill();
      brush(c,circlePts(ux,uy,r,r,PI,TAU,10),s*1.6,.7,{ts:.1,te:.1,mn:.4});
      c.strokeStyle=ink(.4);c.lineWidth=s*.8;for(let j=1;j<4;j++){const aa=PI+j*PI/4;c.beginPath();c.moveTo(ux,uy-r*.05);c.lineTo(ux+Math.cos(aa)*r,uy+Math.sin(aa)*r);c.stroke();}
      brush(c,[[ux,uy],[ux,uy+r*.9]],s*1.4,.7,{});}
    // shopkeeper
    const kx=sp.x-sp.sw*.62,ky=sp.base+s*2;
    const sweeping=G.snowShop>.22&&o>.9;
    drawPersonShape(c,kx,ky,1,{k:'sk',ph:T*2,dir:1,arms:sweeping?'broom':((T%4)<1.5?'wave':'rest'),hunch:Si>.5?1:0,hop:0,bounce:0});
    c.restore();
  }
  if(G.snowShop>.03)snowCap(c,GEO.shopRoof,G.snowShop*h*.045);
}
function drawGateDyn(c){
  if(G.snowR>.05&&GEO.gateKas)snowCap(c,GEO.gateKas.map(p=>[p[0],p[1]-L.s*5]),G.snowR*L.Hb*.025);
}
function drawPeople(c,layer){
  // layer 0: far bank, 1: river crossing, 2: near bank
  const sunny=Hi>.5,rainy=Ri>.5,snowy=Si>.5||G.snowG>.35;
  const festive=G.rev&&revA>.5&&all3();
  for(const p of P){
    const q=personPos(p);
    const lay=p.mode==='cross'?(q[3]?1:(q[1]<(L.yF+L.yN)/2?0:2)):(p.side==='F'?0:2);
    if(lay!==layer)continue;
    let bounce=0,hunch=snowy?1:0,arms='rest',hop=p.hop||0;
    const moving=p.mode==='cross'||p.idle<.05;
    if(sunny&&!rainy&&Si<.5)bounce=1;
    if(p.mode==='drum'){arms='drum';}
    else if(festive&&p.side==='F'&&p.mode!=='cross'){arms='dance';bounce=1;}
    else if(p.hurry)arms='hurry';
    if(p.jump>0){p.jump-=1/60;hop=Math.max(hop,Math.sin(p.jump/.4*PI));}
    drawPersonShape(c,q[0],q[1],q[2],{k:p.k,ph:moving?p.ph:0,dir:p.dir,arms,hunch,hop,bounce:moving||arms==='dance'?bounce:0,on:q[3]});
  }
}
function drawPersonShape(c,x,y,sc,o){
  const s=L.s*sc,ph=L.ph*sc;
  const k=o.k;
  const small=k==='v2'?.78:1;
  const hh=ph*small;
  const step=Math.sin(o.ph);
  const bnc=o.bounce?Math.abs(Math.sin(o.ph))*hh*.12:Math.abs(Math.sin(o.ph))*hh*.025;
  const hopY=o.hop?o.hop*hh*.3:0;
  const by=y-bnc-hopY;
  const hunch=o.hunch?hh*.06:0;
  // shadow
  c.fillStyle=ink(.08);ellipse(c,x,y+s,hh*.22,hh*.05);c.fill();
  // legs
  const stride=(o.hunch?.08:.16)*hh*(o.hop?1.8:1);
  c.strokeStyle=ink(.78);c.lineWidth=Math.max(1,hh*.07);c.lineCap='round';
  c.beginPath();c.moveTo(x-hh*.04,by-hh*.3);c.lineTo(x-hh*.04+step*stride,by);c.moveTo(x+hh*.04,by-hh*.3);c.lineTo(x+hh*.04-step*stride,by);c.stroke();
  // body
  const top=by-hh*.72+hunch;
  c.fillStyle=k[0]==='f'?ink(.42):k==='sk'?ink(.25):ink(.14);
  c.beginPath();c.moveTo(x-hh*.13,top+hh*.06);c.lineTo(x-hh*.2,by-hh*.26);c.lineTo(x+hh*.2,by-hh*.26);c.lineTo(x+hh*.13,top+hh*.06);c.closePath();c.fill();
  c.strokeStyle=ink(.7);c.lineWidth=Math.max(.8,s*1.1);c.stroke();
  if(k[0]==='f'){c.strokeStyle=wh(.8);c.lineWidth=Math.max(.8,s);c.beginPath();c.moveTo(x-hh*.06,top+hh*.08);c.lineTo(x-hh*.1,by-hh*.3);c.moveTo(x+hh*.06,top+hh*.08);c.lineTo(x+hh*.1,by-hh*.3);c.stroke();}
  if(k==='sk'){c.fillStyle=wh(.8);c.fillRect(x-hh*.1,top+hh*.18,hh*.2,hh*.24);}
  // arms
  const sx=x,sy=top+hh*.1;
  c.strokeStyle=ink(.7);c.lineWidth=Math.max(1,hh*.06);
  c.beginPath();
  const A=o.arms;
  if(A==='dance'){const u=Math.sin(o.ph*.5)*.5+.5;c.moveTo(sx-hh*.1,sy);c.lineTo(sx-hh*.28,sy-hh*(.1+.2*u));c.moveTo(sx+hh*.1,sy);c.lineTo(sx+hh*.28,sy-hh*(.3-.2*u));}
  else if(A==='drum'){const hk=Math.max(0,1-(T-drumHit)*5);c.moveTo(sx-hh*.1,sy);c.lineTo(sx-hh*.25,sy-hh*(.25-.25*hk));c.moveTo(sx+hh*.1,sy);c.lineTo(sx+hh*.25,sy-hh*(.05+.2*(1-hk)));}
  else if(A==='wave'){const u=Math.sin(T*9);c.moveTo(sx-hh*.1,sy);c.lineTo(sx-hh*.16,sy+hh*.22);c.moveTo(sx+hh*.1,sy);c.lineTo(sx+hh*(.24+.05*u),sy-hh*.25);}
  else if(A==='broom'){const u=Math.sin(T*8);c.moveTo(sx-hh*.1,sy);c.lineTo(sx+hh*.05,sy-hh*.2);c.moveTo(sx+hh*.1,sy);c.lineTo(sx+hh*.2,sy-hh*.25);c.stroke();c.lineWidth=Math.max(1,hh*.04);c.beginPath();c.moveTo(sx,sy+hh*.1);c.lineTo(sx+hh*(.55+.06*u),sy-hh*.62);c.stroke();c.beginPath();c.lineWidth=Math.max(1,hh*.08);c.moveTo(sx+hh*(.55+.06*u),sy-hh*.62);c.lineTo(sx+hh*(.65+.06*u),sy-hh*.72);}
  else if(A==='hurry'){c.moveTo(sx-hh*.1,sy);c.lineTo(sx-hh*.26,sy-hh*.2);c.moveTo(sx+hh*.1,sy);c.lineTo(sx+hh*.26,sy-hh*.2);}
  else if(o.hunch){c.moveTo(sx-hh*.1,sy);c.lineTo(sx-hh*.02,sy+hh*.12);c.moveTo(sx+hh*.1,sy);c.lineTo(sx+hh*.02,sy+hh*.12);}
  else{const u=step*hh*.06;c.moveTo(sx-hh*.11,sy);c.lineTo(sx-hh*.18-u,sy+hh*.25);c.moveTo(sx+hh*.11,sy);c.lineTo(sx+hh*.18+u,sy+hh*.25);}
  c.stroke();
  // head
  const hy=top-hh*.1+hunch*.5,hr=hh*.12;
  c.fillStyle=wh(.92);c.beginPath();c.arc(x,hy,hr,0,TAU);c.fill();
  c.strokeStyle=ink(.75);c.lineWidth=Math.max(.8,s*1.1);c.stroke();
  c.fillStyle=ink(.8);
  if(k==='v1'){c.beginPath();c.arc(x,hy-hr*.3,hr*.95,PI,TAU);c.fill();c.beginPath();c.arc(x,hy-hr*1.15,hr*.45,0,TAU);c.fill();}
  else if(k==='v2'){c.beginPath();c.arc(x,hy-hr*.25,hr*1,PI*1.05,TAU-.05);c.fill();}
  else if(k==='v3'){c.beginPath();c.arc(x,hy-hr*.35,hr*.9,PI*1.2,TAU-.2);c.fill();c.strokeStyle=ink(.7);c.lineWidth=Math.max(1,hh*.04);c.beginPath();c.moveTo(x+hh*.24*o.dir,by);c.lineTo(x+hh*.2*o.dir,by-hh*.42);c.stroke();}
  else if(k==='sk'){c.beginPath();c.arc(x,hy-hr*.3,hr*.95,PI,TAU);c.fill();c.fillStyle=wh(.9);c.fillRect(x-hr,hy-hr*.75,hr*2,hr*.3);}
  else {c.beginPath();c.arc(x,hy-hr*.3,hr*.95,PI,TAU);c.fill();c.strokeStyle=wh(.95);c.lineWidth=Math.max(1,hr*.35);c.beginPath();c.moveTo(x-hr,hy-hr*.4);c.lineTo(x+hr,hy-hr*.4);c.stroke();c.strokeStyle=ink(.7);c.lineWidth=Math.max(.6,s*.7);c.stroke();}
  c.fillStyle=ink(.8);c.beginPath();c.arc(x+o.dir*hr*.35,hy+hr*.15,Math.max(.7,hr*.12),0,TAU);c.fill();
}
function drawParticles(c){
  const s=L.s;
  // rain: tapered harai strokes batched
  if(RAIN.length){
    c.lineCap='round';
    c.strokeStyle=ink(.30);c.lineWidth=Math.max(.6,s*.75);c.beginPath();
    for(const d of RAIN){c.moveTo(d.x,d.y);c.lineTo(d.x-d.l*.12,d.y-d.l);}c.stroke();
    c.strokeStyle=ink(.45);c.lineWidth=Math.max(.9,s*1.4);c.beginPath();
    for(const d of RAIN){c.moveTo(d.x,d.y);c.lineTo(d.x-d.l*.03,d.y-d.l*.25);}c.stroke();
    if(Hi>.3){c.fillStyle=wh(.95*Hi);c.beginPath();for(const d of RAIN)if(d.gl){c.moveTo(d.x+s*2.2,d.y-d.l*.3);c.arc(d.x,d.y-d.l*.3,s*2.2,0,TAU);}c.fill();
      c.strokeStyle=ink(.25*Hi);c.lineWidth=Math.max(.5,s*.6);c.beginPath();for(const d of RAIN)if(d.gl&&((d.x*7|0)%3===0)){const yy=d.y-d.l*.3;c.moveTo(d.x-s*4,yy);c.lineTo(d.x+s*4,yy);c.moveTo(d.x,yy-s*4);c.lineTo(d.x,yy+s*4);}c.stroke();}
  }
  if(SNOW.length){
    c.fillStyle=wh(.98);c.beginPath();for(const f of SNOW){c.moveTo(f.x+f.r,f.y);c.arc(f.x,f.y,f.r,0,TAU);}c.fill();
    c.strokeStyle=ink(.16);c.lineWidth=Math.max(.5,s*.6);c.beginPath();for(const f of SNOW){c.moveTo(f.x+f.r,f.y);c.arc(f.x,f.y,f.r,0,TAU);}c.stroke();
  }
  for(const w of WD){
    const u=w.t/w.life;
    if(w.k==='ring'){c.strokeStyle=ink(.25*(1-u));c.lineWidth=Math.max(.5,s*.7);ellipse(c,w.x,w.y,s*(1+u*6),s*(.4+u*2));c.stroke();}
    else{c.fillStyle=ink(.35*(1-u));c.beginPath();c.arc(w.x,w.y,s*1.3,0,TAU);c.fill();}
  }
}
function updFX(dt){
  for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;if(f.vx!==undefined){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.g||0)*dt;}if(f.t>f.life)FX.splice(i,1);}
}
function drawFX(c){
  for(const f of FX){
    const u=f.t/f.life;
    if(f.k==='blot'){const r=lerp(f.r0,f.r1,eo(Math.min(1,u*1.6)));c.globalAlpha=f.a*(1-u);drawSprite(c,SP.blot[f.b],f.x,f.y,r/50,r/50*.8,0);c.globalAlpha=1;}
    else if(f.k==='stroke'){const n=Math.max(2,Math.ceil(f.pts.length*Math.min(1,f.t/f.dr)));c.globalAlpha=1-sstep(.25,1,u);bbrush(c,f.pts.slice(0,n),f.w,.7,{ts:.1,te:.5,seed:3});c.globalAlpha=1;}
    else if(f.k==='drop'){c.fillStyle=ink(.6*(1-u));c.beginPath();c.arc(f.x,f.y,f.r,0,TAU);c.fill();}
    else if(f.k==='puff'){c.fillStyle=wh(.95*(1-u));c.beginPath();c.arc(f.x,f.y,f.r*(1+u),0,TAU);c.fill();c.strokeStyle=ink(.12*(1-u));c.lineWidth=.7;c.stroke();}
  }
}
function drawHintGlow(c){
  const h=hintInfo();if(!h)return;
  const pulse=.5+.5*Math.sin(T*3.2);
  const rip=(T*.7)%1;
  const ring=(x,y,r0)=>{c.strokeStyle=ink(.22*(1-rip));c.lineWidth=L.s*(2.4-1.6*rip);c.beginPath();c.arc(x,y,r0*(1+rip*.5),0,TAU);c.stroke();};
  if(h.type==='wear'){const it=IT[h.k];const cy=it.y+(h.k==='umb'?L.Hb*.1:h.k==='muf'?L.Hb*.12:0);
    c.globalAlpha=.7+.3*pulse;drawSprite(c,SP.white,it.x,cy,L.Hb*.0056,L.Hb*.0048,0);c.globalAlpha=.22+.12*pulse;drawSprite(c,SP.blot[2],it.x,cy+L.Hb*.04,L.Hb*.004,L.Hb*.0016,0);c.globalAlpha=1;
    ring(it.x,cy,L.Hb*.22);}
  else if(h.type==='remove'){const a=boyAttach(h.k);c.globalAlpha=.6+.3*pulse;drawSprite(c,SP.white,a.x,a.y,L.Hb*.0042,L.Hb*.0032,0);c.globalAlpha=1;ring(a.x,a.y,L.Hb*.16);}
  else if(h.type==='boy'){c.globalAlpha=.55+.3*pulse;drawSprite(c,SP.white,L.boyX,L.feetY-L.Hb*.55,L.Hb*.009,L.Hb*.011,0);c.globalAlpha=1;
    c.strokeStyle=ink(.2*(1-rip));c.lineWidth=L.s*2.2;ellipse(c,L.boyX,L.feetY-L.Hb*.58,L.Hb*(.4+.12*rip),L.Hb*(.6+.12*rip));c.stroke();}
}

// ================= main render =================
function render(){
  const c=ctx;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.globalAlpha=1;
  if(BG)c.drawImage(BG,0,0,W,H);
  drawSky(c);
  drawTrib(c);
  drawMillDyn(c);
  drawGateDyn(c);
  drawFestival(c);
  drawPeople(c,0);
  drawWater(c);
  drawBridge(c);
  drawPeople(c,1);
  drawNearEdgeOver(c);
  drawPuddles(c);
  drawSnowGround(c);
  drawGroove(c);
  drawShopDyn(c);
  drawPeople(c,2);
  drawHintGlow(c);
  // items at home / selected / returning
  for(const k of KINDS){const it=IT[k];if(it.st==='home'||it.st==='sel'||it.st==='ret')drawItem(c,it);}
  drawBoy(c);
  for(const k of KINDS){const it=IT[k];if(it.st==='drag'||it.st==='fly')drawItem(c,it);}
  drawParticles(c);
  drawFX(c);
  drawDemo(c);
}

// ================= loop =================
let raf=0,lastT=0,dirty=false;
function frame(t){
  raf=0;
  if(hidden)return;
  let dt=lastT?(t-lastT)/1000:1/60;lastT=t;
  if(!(dt>0))dt=1/60;
  dt=Math.min(dt,.05);
  step(dt);
  render();
  raf=requestAnimationFrame(frame);
}
function step(dt){
  T+=dt;dtFrame=dt;
  sim(dt);
  updPeople(dt);
  updItems(dt);
  updBoy(dt);
  updWeather(dt);
  updFX(dt);
  swayM=Math.max(0,swayM-dt*1.5);swayS=Math.max(0,swayS-dt*1.5);swayG=Math.max(0,swayG-dt*1.5);
  // idle → one demonstration
  if(!ptr)idleT+=dt;
  if(DEMO.on){DEMO.t+=dt;}
  else if(idleT>4&&demoReady&&BOY.spin<0){const h=hintInfo();if(h&&!DEMO_DONE[h.type]&&!DID[h.type]){startDemo(h);demoReady=false;DEMO_DONE[h.type]=true;}}
  // ambience
  if(aok()){
    setAmb('rain',Ri*.09*(all3()?1.3:1),2200+Hi*900);
    setAmb('flow',Math.min(.16,flow*.12*(1-sstep(.5,.95,G.ice))),300+900*flow);
    setAmb('snow',Si*.025,5600);
  }
  saveT+=dt;
  if(saveT>2.5){saveT=0;save();}
}
function startLoop(){if(!raf&&!hidden){lastT=0;raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',()=>{
  hidden=document.visibilityState==='hidden';
  if(hidden){
    if(raf){cancelAnimationFrame(raf);raf=0;}
    if(ptr)onUp(ptr.x,ptr.y,true);
    save();
    try{if(AC&&AC.state==='running')AC.suspend();}catch(e){}
  }else{
    try{if(AC&&AC.state!=='running')AC.resume();}catch(e){}
    startLoop();
  }
});
window.addEventListener('pagehide',()=>save());
let rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{layout();render();},60);}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);

// ================= boot =================
resetPeople();
const restored=loadSave();
layout();
for(const k of KINDS){const it=IT[k];if(G.worn[k]){it.st='worn';}else{it.st='home';it.x=L.home[k][0];it.y=L.home[k][1];}}
if(G.tried.umb||G.tried.muf||G.tried.hat)DID.wear=true;
if(restored){Ri=G.worn.umb;Si=G.worn.muf;Hi=G.worn.hat;lastAll3=!!all3();if(lastAll3){rbA=1;rbSweep=1;}revA=G.rev;firstWater=G.water<.06;prevBridge=G.bridge;prevIce=G.ice;prevBridgeDraw=G.bridge;
  if(G.ice>=.9)sim.icePath=1;
  const moving=G.water>.3&&G.ice<.55;
  flow=wheelV=moving?(G.bridge>.5?.95:.4):0;prevWheel=wheelV;if(G.bridge>=.985)openHold=4;}
render();
startLoop();
// test / inspection hook (read-only snapshot + fast-forward for automated checks)
window.__gf={
  snap:()=>({water:G.water,ice:G.ice,snowG:G.snowG,snowR:G.snowR,snowShop:G.snowShop,snowBed:G.snowBed,bridge:G.bridge,rev:G.rev,shop:G.shop,pud:G.pud,worn:Object.assign({},G.worn),
    flow,wheelV,wheelA,Ri,Si,Hi,rbA,revA,groove,trib,meltS,inRateS,storageOK,T,audio:AC?AC.state:'none',shopkeeper:G.shop>.05,
    sweeping:G.snowShop>.22&&G.shop>.9,icePath:iceSolid(),bridgeOpen:bridgeOpen(),drumKind,ptr:!!ptr,
    items:KINDS.map(k=>({k,st:IT[k].st,x:IT[k].x,y:IT[k].y})),
    people:P.map(p=>({k:p.k,side:p.side,mode:p.mode,route:p.route,x:p.x,prog:p.prog,hurry:p.hurry})),
    demo:DEMO.on,hint:hintInfo(),idleT,particles:RAIN.length+SNOW.length+FX.length+WD.length,L:{boyX:L.boyX,feetY:L.feetY,Hb:L.Hb,home:L.home,por:L.por}}),
  log:LOG,
  ff:(sec)=>{const n=Math.round(sec*30);for(let i=0;i<n;i++)step(1/30);render();},
  attach:(k)=>{const a=boyAttach(k);return [a.x,a.y];}
};
})();
</script>
