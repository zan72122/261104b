   format dressup / style neon / subject no_animal_princess
   光る衣装を女の子へ運ぶ → 動作・楽器・照明が増える → 衣装どうしが掛け合う
   → 五つで壁が開き本番 → せり台でフィナーレ（最後に着せた衣装が主役）→ 小舞台へ
   ===================================================================== */
const cv=document.getElementById('c');
const saEl=document.getElementById('sa');
let ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>t<=0?0:(t>=1?1:t*t*(3-2*t));
const eo=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const rnd=(a,b)=>a+Math.random()*(b-a);
/* 基本ネオン三色 + 重なりの紫 + 発光芯の白 */
const P='#ff4fb4',C='#3fe6ff',Y='#ffe14a',V='#b66cff',WH='#ffffff',BODY='#ffc4e4';
const COLORS=[P,C,Y,V,WH];

/* ---------------- neon stroke helpers ---------------- */
let LW=3;
let Q=0; /* 品質段階: 0=最高, 1=外周グロー省略, 2=DPR1.5, 3=DPR1 */
function strokeP(p){if(p)ctx.stroke(p);else ctx.stroke();}
function glow(col,w,a,h,pth){
  if(!(a>0.004))return;
  if(h===undefined)h=1;
  ctx.strokeStyle=col;
  if(h>0){
    if(Q<1){ctx.globalAlpha=Math.min(1,0.10*a*h);ctx.lineWidth=w*4.8;strokeP(pth);}
    ctx.globalAlpha=Math.min(1,(Q<1?0.22:0.3)*a*h);ctx.lineWidth=w*2.3;strokeP(pth);
  }
  ctx.globalAlpha=Math.min(1,0.95*a);ctx.lineWidth=w;strokeP(pth);
  ctx.strokeStyle=WH;ctx.globalAlpha=Math.min(1,0.6*a);ctx.lineWidth=Math.max(0.7,w*0.36);strokeP(pth);
  ctx.globalAlpha=1;
}
function glow2(col,w,a,pth){
  if(!(a>0.004))return;
  ctx.strokeStyle=col;
  ctx.globalAlpha=Math.min(1,0.18*a);ctx.lineWidth=w*3;strokeP(pth);
  ctx.globalAlpha=Math.min(1,0.92*a);ctx.lineWidth=w;strokeP(pth);
  ctx.globalAlpha=1;
}
/* 背景色で裏側の線を隠す（色面は塗らない） */
function occ(){ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fill();}
function shp(x,y,rot,sx,sy,fn,arg){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.scale(sx||0.001,sy||0.001);ctx.beginPath();fn(arg);ctx.restore();
}
function shpIn(x,y,rot,sx,sy,fn,k,ox,oy,arg){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.scale(sx||0.001,sy||0.001);
  ctx.translate(ox,oy);ctx.scale(k,k);ctx.translate(-ox,-oy);ctx.beginPath();fn(arg);ctx.restore();
}
/* 二重輪郭 */
function dbl(x,y,rot,sx,sy,fn,c1,c2,w,a,k,ox,oy,doOcc,arg){
  shp(x,y,rot,sx,sy,fn,arg);if(doOcc)occ();glow(c1,w,a);
  shpIn(x,y,rot,sx,sy,fn,k,ox,oy,arg);glow(c2,Math.max(2,w*0.72),a*0.95,0.7);
}
function polyPath(pts,k,cx,cy){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){
    let x=pts[i][0],y=pts[i][1];
    if(k!==undefined){x=cx+(x-cx)*k;y=cy+(y-cy)*k;}
    if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);
  }
  ctx.closePath();
}

/* ---------------- shape builders (normalized) ---------------- */
const BLD={
  boot(){
    ctx.moveTo(-0.36,-1);ctx.lineTo(0.3,-1);ctx.lineTo(0.3,0.22);
    ctx.quadraticCurveTo(0.34,0.42,0.74,0.5);ctx.quadraticCurveTo(1.04,0.58,0.98,0.92);
    ctx.lineTo(-0.38,0.92);ctx.quadraticCurveTo(-0.46,0.5,-0.36,0.1);ctx.closePath();
  },
  bootDeco(){ctx.moveTo(-0.4,-0.72);ctx.lineTo(0.32,-0.72);ctx.moveTo(-0.08,-0.42);ctx.lineTo(0.1,-0.2);ctx.lineTo(-0.08,-0.14);ctx.lineTo(0.12,0.1);},
  glove(){
    ctx.moveTo(-0.42,0.98);ctx.lineTo(-0.42,0.42);ctx.lineTo(0.42,0.42);ctx.lineTo(0.42,0.98);ctx.closePath();
    ctx.moveTo(-0.36,0.42);ctx.lineTo(-0.42,-0.36);ctx.quadraticCurveTo(-0.42,-1,0,-1);ctx.quadraticCurveTo(0.42,-1,0.4,-0.36);
    ctx.lineTo(0.42,-0.08);ctx.quadraticCurveTo(0.64,-0.5,0.86,-0.36);ctx.quadraticCurveTo(1.0,-0.2,0.7,0.1);ctx.lineTo(0.38,0.42);
  },
  gloveDeco(){ctx.moveTo(-0.13,-0.86);ctx.lineTo(-0.13,-0.46);ctx.moveTo(0.13,-0.86);ctx.lineTo(0.13,-0.46);},
  skirt(){
    ctx.moveTo(-0.42,-0.72);ctx.lineTo(0.42,-0.72);ctx.lineTo(0.98,0.48);
    for(let i=0;i<4;i++){const x0=0.98-0.49*i,x1=x0-0.49;ctx.quadraticCurveTo((x0+x1)/2,0.9,x1,0.48);}
    ctx.closePath();
  },
  pleats(ph){
    for(let k=0;k<5;k++){
      const u=((k/5+ph)%1+1)%1*2-1;
      if(Math.abs(u)>0.86)continue;
      ctx.moveTo(u*0.4,-0.5);ctx.lineTo(u*0.88,0.46);
    }
    ctx.moveTo(-0.52,-0.5);ctx.lineTo(0.52,-0.5);
  },
  jacketHalf(m){
    ctx.moveTo(m*-0.14,-0.86);ctx.lineTo(m*-0.46,-0.76);ctx.quadraticCurveTo(m*-1.06,-0.8,m*-0.94,-0.16);
    ctx.lineTo(m*-0.62,-0.06);ctx.quadraticCurveTo(m*-0.56,-0.28,m*-0.46,-0.34);ctx.lineTo(m*-0.44,0.6);
    ctx.quadraticCurveTo(m*-0.25,0.72,m*-0.08,0.58);ctx.lineTo(m*-0.04,-0.3);ctx.closePath();
  },
  jacketDeco(){ctx.moveTo(-0.14,-0.86);ctx.quadraticCurveTo(0,-0.98,0.14,-0.86);ctx.moveTo(-0.91,-0.26);ctx.lineTo(-0.64,-0.17);ctx.moveTo(0.91,-0.26);ctx.lineTo(0.64,-0.17);},
  star(){
    for(let i=0;i<10;i++){const a=-PI/2+i*PI/5,r=i%2?0.46:1;const x=Math.cos(a)*r,y=Math.sin(a)*r;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);}
    ctx.closePath();
  },
  ribbon(){ctx.moveTo(-0.15,0.42);ctx.quadraticCurveTo(-0.55,1.05,-0.95,0.82);ctx.moveTo(0.15,0.42);ctx.quadraticCurveTo(0.55,1.05,0.95,0.82);},
  hand(){
    ctx.moveTo(-0.13,0.75);ctx.lineTo(-0.13,0.1);ctx.quadraticCurveTo(0,-0.12,0.13,0.1);ctx.lineTo(0.13,0.64);
    ctx.quadraticCurveTo(0.25,0.5,0.37,0.68);ctx.quadraticCurveTo(0.49,0.56,0.6,0.76);ctx.quadraticCurveTo(0.72,0.68,0.77,0.88);
    ctx.lineTo(0.75,1.25);ctx.quadraticCurveTo(0.62,1.56,0.3,1.6);ctx.lineTo(0.06,1.6);
    ctx.quadraticCurveTo(-0.16,1.45,-0.36,1.06);ctx.quadraticCurveTo(-0.44,0.86,-0.13,0.75);
    ctx.moveTo(0.06,1.6);ctx.lineTo(0.06,1.86);ctx.moveTo(0.3,1.6);ctx.lineTo(0.3,1.86);
  }
};

/* ---------------- items ---------------- */
const IDS=['boots','gloves','skirt','jacket','hair'];
const COLS={boots:[Y,P],gloves:[C,Y],skirt:[P,C],jacket:[C,P],hair:[Y,P]};
const SLOT={hair:[-1,-0.9],gloves:[-1,-0.49],boots:[-1,-0.07],jacket:[1,-0.7],skirt:[1,-0.34]};

for(const id of IDS)items[id]={id,st:'slot',x:0,y:0,sc:{x:1,v:0},fl:0,fly:null};
let order=[];
const isOn=id=>items[id].st==='worn';
const starNow=()=>order.length?order[order.length-1]:null;

/* ---------------- storage ---------------- */
const SKEY='gf261104-49-stage';
let storeState='none';
let lastStar=null;const seenStars=new Set();
function loadSave(){
  let raw=null;
  try{raw=window.localStorage.getItem(SKEY);}catch(e){storeState='blocked';return null;}
  if(raw==null){storeState='empty';return null;}
  try{
    const d=JSON.parse(raw);
    if(!d||typeof d!=='object'||d.v!==1||!Array.isArray(d.o)||d.o.length>5)throw 0;
    const o=[];
    for(const id of d.o){if(typeof id!=='string'||IDS.indexOf(id)<0||o.indexOf(id)>=0)throw 0;o.push(id);}
    let s=null;
    if(d.s!=null){if(typeof d.s!=='string'||IDS.indexOf(d.s)<0)throw 0;s=d.s;}
    const seen=[];
    if(d.n!=null){if(!Array.isArray(d.n)||d.n.length>5)throw 0;for(const id of d.n){if(IDS.indexOf(id)<0)throw 0;if(seen.indexOf(id)<0)seen.push(id);}}
    storeState='restored';
    return {o,s,seen};
  }catch(e){
    storeState='invalid';
    try{window.localStorage.removeItem(SKEY);}catch(_){}
    return null;
  }
}
function save(){
  try{
    window.localStorage.setItem(SKEY,JSON.stringify({v:1,o:order.slice(),s:lastStar,n:Array.from(seenStars)}));
    storeState='saved';
  }catch(e){storeState='save-failed';}
}

/* ---------------- music clock ---------------- */
const BPM=100,BEAT=60/BPM,STEP=BEAT/2,BAR=STEP*8;
const nf=s=>261.63*Math.pow(2,s/12);
const CHORDS=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];
const chordAt=n=>CHORDS[((Math.floor(n/8)%4)+4)%4];
const RING_SEQ=[0,1,2,3,4,3,2,1];
function ringSemi(n){const ch=chordAt(n);const ext=[ch[0],ch[1],ch[2],ch[0]+12,ch[1]+12];return ext[RING_SEQ[((n%8)+8)%8]]+12;}
const F_STOMP=1,F_R=2,F_CLAP=4,F_RING=8,F_BELL=16,F_BAR=32,F_ACLAP=64,F_ASTOMP=128,F_CALL=256,F_ACC=512,F_FIN=1024,F_RESP=2048;
const FIN_STEPS=16;
const SKIRT_RUN=[0,2,4,7,9,12,14,16,19,16,14,12,9,12,24,24];
const MELODY=[0,4,7,9,7,4,2,12];

/* ---------------- state ---------------- */
let W=0,H=0,DPR=1;const SA={t:0,r:0,b:0,l:0};
const L={};
let clock=0,last=null,raf=0,hidden=false,needClear=true;
let phase='small',phaseT=0,openT=0,openE=0,walkDur=2,finaleStep0=1e9,liftRise=0,pendingOpen=false,finStarUsed=null;
let lastInput=0;
const wob={girl:0,wallL:0,wallR:0,floor:0};
const E={boots:0,gloves:0,skirt:0,jacket:0,hair:0};
let wJ=0,wS=0,wH=0;

const girl={x:0,y:0,sc:1};
const spot={x:0,y:0,rx:10,ry:10,m:0};
const cur={o:0,pulses:[],grand:0,gA:0};

const timeline=[];
function later(dt,fn){timeline.push({t:clock+dt,fn});}

let cheer=0,aClapT=-10,aStompT=-10,presentW=0;

/* ---------------- layout ---------------- */
function dprCap(){return Math.min(Q>=3?1:(Q>=2?1.5:2),window.devicePixelRatio||1);}
function readSafe(){
  try{const s=getComputedStyle(saEl);SA.t=parseFloat(s.paddingTop)||0;SA.r=parseFloat(s.paddingRight)||0;SA.b=parseFloat(s.paddingBottom)||0;SA.l=parseFloat(s.paddingLeft)||0;}catch(e){}
}
function layout(){
  W=Math.max(1,Math.round(window.innerWidth));H=Math.max(1,Math.round(window.innerHeight));
  DPR=dprCap();
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  readSafe();
  const top=SA.t+6,bot=H-SA.b-6,left=SA.l+6,right=W-SA.r-6;
  const Hu=bot-top,Wu=right-left,por=H>=W;
  let G,colW;
  if(por){colW=clamp(Wu*0.23,72,150);G=Math.min(Hu*0.44,(Wu-2*colW)/0.62);}
  else{colW=clamp(Wu*0.12,84,150);G=Math.min(Hu*0.5,Wu*0.36);}
  G=Math.max(110,G);
  L.top=top;L.bot=bot;L.left=left;L.right=right;L.Hu=Hu;L.Wu=Wu;L.por=por;L.G=G;L.colW=colW;
  L.cx=(left+right)/2;
  LW=clamp(G/112,2.2,3.4);
  L.valY=top+Math.max(Hu*0.055,24);
  L.feetY=L.valY+0.13*G+G;
  L.backY=L.feetY-0.1*G;
  L.frontY=L.feetY+0.16*G;
  L.liftY=Math.max(L.frontY+0.3*G,bot-Math.max(0.1*G,30));
  L.boxHW=por?Math.min(0.46*G,Wu*0.5-colW*0.45):0.46*G;
  L.boxL=L.cx-L.boxHW;L.boxR=L.cx+L.boxHW;
  L.backHW=L.boxHW*0.72;L.frontHW=L.boxHW;
  L.iconR=clamp(Math.min(colW*0.44,0.14*G),26,64);
  L.slotXL=Math.max(left+colW*0.5,L.boxL-colW*0.6);
  L.slotXR=Math.min(right-colW*0.5,L.boxR+colW*0.6);
  L.hitR=Math.max(L.iconR*1.15,34);
  L.curN=clamp(Math.round(L.boxHW*0.5/(0.045*G)),5,9);
  L.curSpan=L.boxHW*0.52;
  L.spotX=Math.min(right-14,L.cx+0.62*G);L.spotY=L.valY-0.005*G;
  L.liftRX=0.34*G;L.liftRY=0.075*G;
  buildAudience();
  needClear=true;
}
function buildAudience(){
  const G=L.G,aud=[],rows=[];
  const nF=L.por?5:4;
  const y0=L.frontY+0.26*(L.bot-L.frontY),y1=L.bot-0.01*G;
  for(let r=0;r<nF;r++){
    const t=nF>1?r/(nF-1):0,y=lerp(y0,y1,t),rr=lerp(0.026,0.05,t)*G;
    const u=clamp((y-L.frontY)/Math.max(1,L.liftY-L.frontY),0,1.15);
    const rwh=lerp(0.15,0.3,u)*G+0.06*G+rr;
    const sp=rr*2.8,row={y,rr,front:true,i:rows.length,rwh};
    rows.push(row);
    for(const sd of [-1,1]){
      for(let j=0;j<40;j++){
        const x=L.cx+sd*(rwh+j*sp+(r%2)*sp*0.5);
        if(x<L.left-rr*0.3||x>L.right+rr*0.3)break;
        aud.push({x,y,r:rr,row:row.i,front:true,sd,ph:Math.random()*TAU,stick:(j+r)%2===0,tw:0,hit:-9});
      }
    }
  }
  const nS=4,ys0=L.valY+0.16*G,ys1=L.frontY-0.07*G;
  for(let r=0;r<nS;r++){
    const t=r/(nS-1),y=lerp(ys0,ys1,t),rr=lerp(0.02,0.032,t)*G,sp=rr*2.9;
    const row={y,rr,front:false,i:rows.length};
    rows.push(row);
    for(const sd of [-1,1]){
      const edge=sd<0?L.boxL:L.boxR;
      for(let j=0;j<40;j++){
        const x=edge+sd*(0.04*G+rr+j*sp+(r%2)*sp*0.5);
        if(x<L.left+rr*0.5||x>L.right-rr*0.5)break;
        aud.push({x,y,r:rr,row:row.i,front:false,sd,ph:Math.random()*TAU,stick:(j+r)%2===1,tw:0,hit:-9});
      }
    }
  }
  L.aud=aud;L.rows=rows;
  buildAudSprites();
}
/* 観客の頭と肩は列ごとに一度だけ焼いておき、毎フレームは貼るだけにする */
function buildAudSprites(){
  L.spr=[];
  const main=ctx;
  try{
    for(const row of L.rows){
      const r=row.rr,pad=7,w=Math.ceil(1.9*r+pad*2),h=Math.ceil(1.8*r+pad*2),ox=0.95*r+pad,oy=1.45*r+pad;
      const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*DPR));c.height=Math.max(1,Math.ceil(h*DPR));
      const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.lineCap='round';g.lineJoin='round';
      ctx=g;
      const x=ox,y=oy,hr=0.55*r,hy=y-0.9*r;
      ctx.beginPath();ctx.moveTo(x+hr,hy);ctx.arc(x,hy,hr,0,TAU);
      ctx.moveTo(x-0.95*r,y+0.35*r);ctx.quadraticCurveTo(x,y-0.5*r,x+0.95*r,y+0.35*r);
      if(!row.front&&r>7){ctx.moveTo(x-0.2*hr,hy+0.25*hr);ctx.quadraticCurveTo(x,hy+0.5*hr,x+0.2*hr,hy+0.25*hr);}
      glow2(row.front?C:P,2,1);
      ctx=main;
      L.spr[row.i]={c,w,h,ox,oy};
    }
  }finally{ctx=main;}
}
function slotPos(id){const s=SLOT[id];return {x:s[0]<0?L.slotXL:L.slotXR,y:L.feetY+s[1]*L.G};}

/* ---------------- audio ---------------- */
const AU={ac:null,master:null,nb:null,ready:false,started:false,pad:null};
function audioInit(){
  try{
    if(!AU.ac){
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      const ac=new AC();AU.ac=ac;
      const comp=ac.createDynamicsCompressor();
      comp.threshold.value=-16;comp.knee.value=10;comp.ratio.value=4;comp.attack.value=0.003;comp.release.value=0.25;
      const m=ac.createGain();m.gain.value=0.7;m.connect(comp);comp.connect(ac.destination);AU.master=m;
      const len=Math.floor(ac.sampleRate*1.0),nb=ac.createBuffer(1,len,ac.sampleRate),d=nb.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      AU.nb=nb;
      try{const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(e){}
      makePad();
    }
    if(AU.ac.state!=='running'&&!hidden){const p=AU.ac.resume();if(p&&p.then)p.then(audioCheck,()=>{});}
    audioCheck();
  }catch(e){}
}
function audioCheck(){
  const ac=AU.ac;
  if(ac&&ac.state==='running'&&!AU.ready&&!hidden){
    AU.ready=true;
    if(!AU.started){AU.started=true;try{sStartup(ac.currentTime+0.03);}catch(e){}}
  }
}
function dest(pan){
  const ac=AU.ac;
  if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=clamp(pan,-1,1);p.connect(AU.master);return p;}
  return AU.master;
}
function envG(t,peak,att,dec){
  const g=AU.ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+att);

function sLand(t){const g=envG(t,0.13,0.004,0.12);g.connect(dest(0));tone('sine',200,t,0.15,g,120);}
function sWob(t){const g=envG(t,0.05,0.003,0.05);g.connect(dest(0));tone('sine',520,t,0.06,g,470);}

function sCrowdClap(t,vel){for(let i=0;i<4;i++)sClap(t+rnd(0,0.03),rnd(-0.85,0.85),vel*0.42,rnd(0,1));}

function padChord(n,t){if(!AU.pad)return;const ch=chordAt(n);for(const v of AU.pad.os)v.o.frequency.setTargetAtTime(nf(ch[v.i]-12),t,0.05);}

/* ---------------- patterns ---------------- */
function audienceActive(){return openT>0.55&&(phase==='opening'||phase==='show'||phase==='walk'||phase==='finale'||phase==='bow');}
function stepFlags(n){
  const s=((n%8)+8)%8;let f=0;
  const b=isOn('boots'),g=isOn('gloves');
  if(b&&g){
    const bootsLead=order.indexOf('boots')<order.indexOf('gloves');
    const call=s<=2,resp=s>=4&&s<=6;
    if(call||resp){
      const bootsHit=bootsLead?call:resp;
      if(bootsHit){f|=F_STOMP;if(s%2===1)f|=F_R;}else f|=F_CLAP;
      f|=call?F_CALL:F_RESP;
      if(s===2||s===6)f|=F_ACC;
    }
  }else if(b){
    if(s%2===0){f|=F_STOMP;if(s===2||s===6)f|=F_R;if(s===0)f|=F_ACC;}
  }else if(g){
    if(s===2||s===6)f|=F_CLAP;
  }
  if(isOn('skirt'))f|=F_RING;
  if(isOn('hair')){if(isOn('skirt')){if(s%2===1)f|=F_BELL;}else if(s===0||s===4)f|=F_BELL;}
  if(s===0)f|=F_BAR;
  if(audienceActive()){
    if(s===2||s===6)f|=F_ACLAP;
    if(b&&(s===0||s===4))f|=F_ASTOMP;
  }
  return f;
}
function finaleFlags(n){
  if(!(phase==='walk'||phase==='finale'))return 0;
  const k=n-finaleStep0;if(k<0||k>=FIN_STEPS)return 0;
  const st=starNow();let f=F_FIN;
  if(st==='boots'){f|=F_STOMP;if(k%2)f|=F_R;else f|=F_ACC;}
  else if(st==='gloves'){if(k%2===0)f|=F_CLAP|F_ACC;else f|=F_ACLAP;}
  return f;
}
function allFlags(n){return stepFlags(n)|finaleFlags(n);}

let nextStep=0;const visQ=[];
function schedule(){
  const hz=clock+0.11;
  while(nextStep*STEP<hz){
    const n=nextStep++,tS=n*STEP;
    if(tS<clock-0.06)continue;
    const ev={n,t:tS,f:allFlags(n),k:n-finaleStep0,star:starNow(),duet:isOn('boots')&&isOn('gloves')};
    if(AU.ready){try{stepAudio(ev,AU.ac.currentTime+Math.max(0,tS-clock)+0.012);}catch(e){}}
    visQ.push(ev);
  }
  while(visQ.length&&visQ[0].t<=clock){const ev=visQ.shift();onStepVis(ev);}
}
function ringTheta(t){return TAU*((t===undefined?clock:t)/BAR)+PI/2;}
function stepAudio(ev,t){
  const f=ev.f,n=ev.n,s=((n%8)+8)%8;
  if(f&F_STOMP){const R=!!(f&F_R);sDrum(t,ev.duet?((f&F_CALL)?70:82):(R?74:66),R?0.25:-0.25,(f&F_ACC)?1:0.78);}
  if(f&F_CLAP)sClap(t,0,(f&F_ACC)?0.95:0.75,(f&F_CALL)?1:0.45);
  if(f&F_RING)sPluck(t,nf(ringSemi(n)),Math.cos(ringTheta(ev.t))*0.85,0.75);
  if(f&F_BELL){
    if(isOn('skirt'))sBell(t,nf(ringSemi(n)+7),Math.cos(ringTheta(ev.t))*0.7,0.55,0.7);
    else sBell(t,nf(chordAt(n)[s===0?0:2]+24),0.25,0.75,1.2);
  }
  if(f&F_BAR)padChord(n,t);
  if(f&F_ACLAP)sCrowdClap(t,isOn('gloves')?0.9:0.62);
  if(f&F_ASTOMP)sCrowdStomp(t,0.75);
  if(f&F_FIN)finaleAudio(ev,t);
}
function finaleAudio(ev,t){
  const k=ev.k,st=ev.star;
  if(st==='hair'){if(k%2===0){sPop(t);const ch=chordAt(ev.n);ch.forEach((c,i)=>sBell(t+0.05+i*0.04,nf(c+24),(i-1)*0.6,0.6,1.0));}}
  else if(st==='boots'){if(k%4===0)sCrowdStomp(t,0.9);}
  else if(st==='gloves'){if(k%2===1)sCrowdClap(t,1);}
  else if(st==='skirt'){sPluck(t,nf(SKIRT_RUN[k]+12),Math.cos(ringTheta(ev.t))*0.9,0.9);if(k%4===0)sBell(t,nf(SKIRT_RUN[k]+24),0,0.5,0.9);}
  else if(st==='jacket'){if(k===0){padBoost=0.16;sWhoosh(t,1.4,250,3000,0.25);}if(k%4===0){const ch=chordAt(ev.n);ch.forEach((c,i)=>sBell(t+i*0.03,nf(c+12),(i-1)*0.5,0.5,1.4));}}
  else{if(k%2===0)sPluck(t,nf(MELODY[(k/2)|0]+12),0,0.9);}
  if(k===14){sDrum(t,46,0,1.2);[12,16,19,24].forEach((s,i)=>sBell(t+0.02+i*0.03,nf(s),(i-1.5)*0.4,0.6,1.6));sCheer(t+0.1,1.8,0.55);}
}

/* ---------------- effects ---------------- */
function addP(x,y,vx,vy,life,col,len,g,layer){
  if(parts.length>=MAXP)parts.shift();
  parts.push({x,y,vx,vy,life,max:life,col,len:len||0.05,g:g||0,layer:layer===undefined?1:layer});
}
function burst(x,y,n,spd,cols,life,layer,len,g){
  for(let i=0;i<n;i++){const a=TAU*i/n+rnd(-0.2,0.2),v=spd*rnd(0.7,1.1);addP(x,y,Math.cos(a)*v,Math.sin(a)*v,life*rnd(0.8,1.1),cols[i%cols.length],len||0.05,g||0,layer);}
}
function addRing(x,y,r0,r1,ry,dur,col,w,layer){if(rings.length>40)rings.shift();rings.push({x,y,r0,r1,ry,t0:clock,dur,col,w:w||1,layer:layer===undefined?1:layer});}
function addRun(kind,idx,x0,dir,col,spd,life){if(runs.length>80)runs.shift();runs.push({kind,idx,x0,dir,col,spd,t0:clock,life,dead:false});}
function addDart(x0,y0,cx,cy,x1,y1,dur,col){if(darts.length>40)darts.shift();darts.push({x0,y0,cx,cy,x1,y1,t0:clock,dur,col});}
const NB=5;
function bandGeom(i){
  const t=i/(NB-1);const y=lerp(L.backY,L.frontY,Math.pow(t,1.3));
  const hwc=lerp(L.backHW,L.frontHW,t);
  const hw=lerp(hwc,Math.max(hwc,W*0.5+20),openE*(0.25+0.75*t));
  return {y,hw};
}
function rwHW(u){return lerp(0.15,0.3,u)*L.G;}
function liftY(){let y=L.liftY;if(phase==='show')y+=Math.sin(clock*1.6)*0.016*L.G;return y-liftRise*L.G;}
function nearestBand(y){let bi=0,bd=1e9;for(let i=0;i<NB;i++){const d=Math.abs(bandGeom(i).y-y);if(d<bd){bd=d;bi=i;}}return bi;}
function onLiftNow(){return phase==='finale'||phase==='bow'||(phase==='walk'&&phaseT>walkDur*0.7)||(phase==='return'&&phaseT<0.5);}
function floorStomp(x,acc){
  const G=L.G;
  if(!onLiftNow()){
    const bi=nearestBand(girl.y);
    addRun('band',bi,x,-1,Y,1.5,1.3);addRun('band',bi,x,1,Y,1.5,1.3);
    if(acc){const b2=Math.min(NB-1,bi+1);addRun('band',b2,x,-1,P,1.2,1.3);addRun('band',b2,x,1,P,1.2,1.3);}
    addRing(x,girl.y,0.03*G,(acc?0.42:0.3)*G,0.22,0.5,Y,1,0);
    if(openE>0.5)addRun('rw',0,0,1,Y,0.9,1.4);
  }else{
    addRing(x,liftY(),0.05*G,0.55*G,0.22,0.55,Y,1,0);
    addRun('rw',0,1,-1,Y,0.9,1.4);
  }
}
function curtainClap(acc){
  if(!isOn('jacket'))return;
  cur.o=Math.min(1,cur.o+(acc?0.62:0.44));
  cur.pulses.push({t0:clock,amp:acc?0.09:0.065});
  if(cur.pulses.length>6)cur.pulses.shift();
  padBoost=Math.min(0.12,padBoost+0.04);
}
function mid(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function zoneOf(id){const p=pose;return id==='boots'?mid(p.ftL,p.ftR):mid(p.haL,p.haR);}
function onStepVis(ev){
  const f=ev.f,s=((ev.n%8)+8)%8,G=L.G,p=pose;
  if(f&F_STOMP){E.boots=1;const R=!!(f&F_R);floorStomp(R?p.ftR.x:p.ftL.x,!!(f&F_ACC));}
  if(f&F_CLAP){
    E.gloves=1;const m=mid(p.haL,p.haR);
    burst(m.x,m.y,(f&F_ACC)?10:7,0.55*G,[C,Y,WH],0.32,1,0.05);
    curtainClap(!!(f&F_ACC));
  }
  if(ev.duet&&(s===4||s===0)&&(f&(F_STOMP|F_CLAP))){
    const lead=order.indexOf('boots')<order.indexOf('gloves')?'boots':'gloves';
    const fol=lead==='boots'?'gloves':'boots';
    const a=zoneOf(s===4?lead:fol),b=zoneOf(s===4?fol:lead);
    for(const sd of [-1,1])addDart(a.x+sd*0.08*G,a.y,girl.x+sd*0.55*G*girl.sc,(a.y+b.y)/2,b.x+sd*0.06*G,b.y,0.32,V);
  }

  }
  if(f&F_BELL){

    if(isOn('skirt'))addRing(spot.x,spot.y,spot.rx*0.5,spot.rx*1.9,spot.ry/spot.rx,0.45,V,1,spot.y>=ringGeom().y?1:0);
    else addRing(p.head.x,p.head.y,p.hr*1.45,p.hr*2.3,1,0.55,Y,1,0);

  }
  if(f&F_ACLAP){aClapT=ev.t;}
  if(f&F_ASTOMP){aStompT=ev.t;for(let i=0;i<L.rows.length;i++){const r=L.rows[i];if(!r.front)continue;addRun('row',i,0,-1,Y,1.3,1);addRun('row',i,0,1,Y,1.3,1);}}
  if(f&F_FIN)finaleVis(ev);
}
function finaleVis(ev){

      for(let b=0;b<nB;b++){
        const x=L.cx+rnd(-0.5,0.5)*Math.min(W*0.8,2.2*G),y=rnd(L.top+0.05*G,Math.max(L.top+0.08*G,p.head.y-0.42*G));
        burst(x,y,16,0.75*G,[Y,P,V,WH],0.95,0,0.07,0.35*G);

    for(let i=0;i<L.rows.length;i++){if(L.rows[i].front){addRun('row',i,0,-1,Y,1.5,1);addRun('row',i,0,1,Y,1.5,1);}}
    if(k===14)addRing(girl.x,liftY(),0.05*G,1.4*G,0.22,1,Y,1.5,0);
  }else if(st==='gloves'){
    const m=mid(p.haL,p.haR);
    const pick=()=>L.aud.length?L.aud[(Math.random()*L.aud.length)|0]:null;
    for(let i=0;i<3;i++){
      const a=pick();if(!a)break;
      if(k%2===0)addDart(m.x,m.y,(m.x+a.x)/2,Math.min(m.y,a.y)-0.35*G,a.x,a.y-a.r,0.34,C);
      else{addDart(a.x,a.y-a.r,(m.x+a.x)/2,Math.min(m.y,a.y)-0.35*G,m.x,m.y,0.3,V);a.hit=clock;}
    }
    if(k===14)burst(m.x,m.y,18,1.0*G,[C,Y,V,WH],0.6,1,0.07);
  }else if(st==='skirt'){
    const g=ringGeom();
    if(k%4===0)addRing(g.x,g.y,0.3*G,1.7*G,0.24,1.6,[P,C,Y,V][(k/4)|0],1.4,0);
    const th=ringTheta(ev.t);burst(g.x+Math.cos(th)*g.rx*1.3,g.y+Math.sin(th)*g.ry*1.3,6,0.4*G,[P,Y,WH],0.4,0,0.05);
    if(k===14){addRing(g.x,g.y,0.2*G,1.9*G,0.24,1.2,V,1.6,0);addRing(g.x,g.y,0.1*G,1.4*G,0.24,1.0,P,1.4,0);}
  }else if(st==='jacket'){
    if(k%4===0)cur.pulses.push({t0:clock,amp:0.12});
  }else{
    if(k%2===0)burst(p.head.x+rnd(-0.35,0.35)*G,p.head.y-0.2*G,6,0.3*G,[P,WH,C],0.5,0,0.05);
  }
  if(k===14){addRing(girl.x,girl.y-0.5*G*girl.sc,0.1*G,1.2*G,1,0.9,WH,1.2,0);cheer=1;}
}
function chainFX(id){
  const t=AU.ready?AU.ac.currentTime+0.005:0,G=L.G,p=pose;

function ikPole(ax,ay,tx,ty,l1,l2,px,py,J,Ee){
  const dx=tx-ax,dy=ty-ay,d=Math.hypot(dx,dy)||1e-4;

  if((j1x-px)*(j1x-px)+(j1y-py)*(j1y-py)<(j2x-px)*(j2x-px)+(j2y-py)*(j2y-py)){J.x=j1x;J.y=j1y;}else{J.x=j2x;J.y=j2y;}

    if(guide.k==='remove')return first?anchor(guide.id):slotPos(guide.id);

const tA={x:0,y:0};

  p.pig=Math.sin(PI*Bt*1.0)*0.25*D;

/* 動いている手足は、少し前の位置を押しても掴めるようにする */
const limbHist=[];
function hitPts(id){

/* ---------------- guide / input ---------------- */
function computeGuide(){
  if(drag||demo.active)return null;

  if(phase!=='small')return null;
  for(const id of SUGGEST)if(items[id].st==='slot')return {k:'wear',id};
  if(order.length===5){
    let id=REMOVE_PREF.find(x=>x!==lastStar&&!seenStars.has(x));
    if(!id)id=REMOVE_PREF.find(x=>x!==lastStar)||'boots';

  }

function inSnap(id,x,y,px,py){
  const s=pose.s,sp=slotPos(id);
  /* 自分の置き場の近くで離したら必ず戻す */
  if(Math.hypot(px-sp.x,py-sp.y)<L.hitR*1.25||Math.hypot(x-sp.x,y-sp.y)<L.hitR*1.1)return false;
  const test=(qx,qy)=>{
    if(Math.abs(qx-girl.x)<0.36*s&&qy>girl.y-1.08*s&&qy<girl.y+0.1*s)return true;
    for(const p of anchorPts(id))if(Math.hypot(qx-p.x,qy-p.y)<0.36*L.G)return true;
    return false;
  };
  return test(x,y)||test(px,py);
}
function hitTest(x,y){
  let best=null,bd=1;
  for(const id of IDS){
    const it=items[id];
    if(it.st==='slot'||(it.st==='fly'&&it.fly&&!it.fly.toBody)){
      const d=Math.hypot(x-it.x,y-it.y)/L.hitR;if(d<bd){bd=d;best={k:'item',id,body:false};}
    }else if(it.st==='worn'){
      for(const p of hitPts(id)){const d=Math.hypot(x-p.x,y-p.y)/p.r;if(d<bd){bd=d;best={k:'item',id,body:true};}}
    }
  }
  if(best)return best;
  if(phase==='show'){
    const dx=(x-L.cx)/(L.liftRX+24),dy=(y-liftY())/Math.max(L.liftRY*2.4,34);
    if(dx*dx+dy*dy<1)return {k:'lift'};
  }
  const s=pose.s;
  if(Math.abs(x-girl.x)<0.3*s&&y>girl.y-1.0*s&&y<girl.y+0.04*s)return {k:'girl'};
  if(openE<0.5){
    if(y>L.valY&&(x<L.boxL||x>L.boxR||y>L.frontY))return {k:'wall',sd:x<L.cx?-1:1};
    if(y>L.backY-0.05*L.G&&y<=L.frontY)return {k:'floor'};
  }else{
    let bm=null,bdm=1e9;
    for(const m of L.aud){const d=Math.hypot(x-m.x,y-(m.y-0.5*m.r));if(d<m.r*1.6&&d<bdm){bdm=d;bm=m;}}
    if(bm)return {k:'aud',m:bm};
    if(y>L.backY-0.05*L.G&&y<=L.frontY)return {k:'floor'};
  }
  return null;
}
function onDown(e){

  if(drag)return;

  const h=hitTest(x,y);
  if(!h)return;
  if(h.k==='item'){
    const it=items[h.id];
    it.fl=1;it.sc.x=0.74;it.sc.v=-2;
    const ly=(h.id==='hair'&&h.body)?0:1;
    burst(it.x,it.y,16,0.8*L.G,[WH,COLS[h.id][0],COLS[h.id][1]],0.34,ly,0.08);
    addRing(it.x,it.y,(h.body?0.06*L.G:L.iconR*0.7),(h.body?0.24*L.G:L.iconR*1.8),1,0.4,WH,1.5,ly);
    addRing(it.x,it.y,(h.body?0.04*L.G:L.iconR*0.5),(h.body?0.16*L.G:L.iconR*1.25),1,0.32,COLS[h.id][0],1.3,ly);
    if(AU.ready)sTick(AU.ac.currentTime+0.003,1300);
    drag={id:h.id,pid:e.pointerId,px:x,py:y,sx:x,sy:y,ox:it.x-x,oy:it.y-y,vx:0,vy:0,fromBody:h.body,moved:false,pressing:true,lt:performance.now()};
    if(!h.body){it.st='drag';it.fly=null;}
    try{cv.setPointerCapture(e.pointerId);}catch(_){}

  }
  if(h.k==='lift'){startWalk();return;}
  if(h.k==='girl')wob.girl=1;
  else if(h.k==='wall')wob[h.sd<0?'wallL':'wallR']=1;
  else if(h.k==='floor')wob.floor=1;
  else if(h.k==='aud')h.m.hit=clock;
  if(AU.ready)sWob(AU.ac.currentTime+0.005);
}
function onMove(e){
  if(!drag||e.pointerId!==drag.pid)return;
  if(e.cancelable)e.preventDefault();
  const x=e.clientX,y=e.clientY,now=performance.now(),dtm=Math.max(4,now-drag.lt)/1000;
  drag.vx=lerp(drag.vx,(x-drag.px)/dtm,0.35);drag.vy=lerp(drag.vy,(y-drag.py)/dtm,0.35);
  drag.px=x;drag.py=y;drag.lt=now;lastInput=clock;
  if(!drag.moved&&Math.hypot(x-drag.sx,y-drag.sy)>11){
    drag.moved=true;drag.pressing=false;
    if(drag.fromBody&&items[drag.id].st==='worn'){unwear(drag.id);const it=items[drag.id];drag.ox=it.x-x;drag.oy=it.y-y;}

}
function onUp(e){if(!drag||e.pointerId!==drag.pid)return;if(e.cancelable)e.preventDefault();drop(false);}
function onCancel(e){if(!drag||e.pointerId!==drag.pid)return;drop(true);}
function drop(cancel){

  if(it.st!=='drag')return;
  if(!d.moved&&!d.fromBody){it.st='slot';it.sc.v+=3;if(!cancel)showGhost(d.id);return;}

/* ---------------- update ---------------- */
function springStep(s,t,dt){
  const n=Math.max(1,Math.ceil(dt/0.008)),h=dt/n;
  for(let i=0;i<n;i++){s.v+=(320*(t-s.x)-16*s.v)*h;s.x+=s.v*h;}
}
function update(dt){
  for(let i=timeline.length-1;i>=0;i--){if(timeline[i].t<=clock){const f=timeline[i].fn;timeline.splice(i,1);try{f();}catch(e){}}}
  phaseT+=dt;
  switch(phase){
    case 'small':openT=Math.max(0,openT-dt/1.6);if(pendingOpen&&order.length===5&&openT<=0){startOpen();}else if(pendingOpen&&order.length<5)pendingOpen=false;break;
    case 'opening':openT=Math.min(1,openT+dt/1.8);if(openT>=1)setPhase('show');break;
    case 'show':openT=1;break;
    case 'walk':openT=1;if(clock>=finaleStep0*STEP-0.0001)setPhase('finale');break;
    case 'finale':liftRise=Math.min(0.06,liftRise+dt*0.12);if(clock>=(finaleStep0+FIN_STEPS)*STEP)setPhase('bow');break;
    case 'bow':if(phaseT>=1.3)setPhase('return');break;
    case 'return':liftRise=Math.max(0,liftRise-dt*0.1);openT=Math.max(0,1-Math.max(0,phaseT-0.7)/1.7);if(phaseT>=2.6){setPhase('small');onShowEnd();}break;
  }
  if(phase!=='finale'&&phase!=='bow'&&phase!=='return')liftRise=Math.max(0,liftRise-dt*0.2);
  openE=sm(openT);
  // girl position
  const G=L.G,SC=1.12;
  let gx=L.cx,gy=L.feetY,gs=1;
  if(phase==='walk'){const u=sm(phaseT/Math.max(0.1,walkDur));gy=lerp(L.feetY,L.liftY,u);gs=lerp(1,SC,u);}
  else if(phase==='finale'||phase==='bow'){gy=L.liftY-liftRise*G;gs=SC;}
  else if(phase==='return'){const u=sm(phaseT/2.2);gy=lerp(L.liftY-liftRise*G,L.feetY,u);gs=lerp(SC,1,u);}
  girl.x=gx;girl.y=gy;girl.sc=gs;
  // weights
  const rk=1-Math.exp(-dt*7);
  wJ+=((isOn('jacket')?1:0)-wJ)*rk;wS+=((isOn('skirt')?1:0)-wS)*rk;wH+=((isOn('hair')?1:0)-wH)*rk;
  const bp=(clock/BAR)%1;
  const nl=0.5-0.5*Math.cos(TAU*bp),nr=0.5-0.5*Math.cos(TAU*bp-1.1);
  armVel=lerp(armVel,Math.abs(nl-armUpL)/Math.max(dt,1e-3),0.2);armUpL=nl;armUpR=nr;armUpAvg=(nl+nr)/2;
  for(const id of IDS)E[id]=Math.max(0,E[id]-dt*4.5);
  padBoost=Math.max(0,padBoost-dt*0.1);
  for(const k in wob)wob[k]=Math.max(0,wob[k]-dt*3);
  cheer=Math.max(0,cheer-dt*0.25);
  let pw=0;
  if(drag&&drag.id==='gloves'&&items.gloves.st==='drag'){const it=items.gloves;const d=Math.hypot(it.x-girl.x,it.y-(girl.y-0.5*G*girl.sc));pw=clamp(1.4-d/(0.75*G),0,1);}
  presentW=lerp(presentW,pw,1-Math.exp(-dt*8));
  // guide
  guide=computeGuide();
  const gk=guide?guide.k+guide.id:'';
  if(gk!==guideKey){guideKey=gk;guideSince=clock;}
  computePose(dt);
  guidePop();
  // items
  for(const id of IDS){
    const it=items[id];
    let tgt=1;
    if(drag&&drag.id===id)tgt=drag.pressing?0.82:1.05;
    springStep(it.sc,tgt,dt);
    it.fl=Math.max(0,it.fl-dt*3.2);
    if(it.st==='slot'){const sp=slotPos(id);it.x=sp.x;it.y=sp.y;}
    else if(it.st==='fly'){
      const f=it.fly,u=clamp((clock-f.t0)/f.dur,0,1);
      const d=f.toBody?anchor(id):slotPos(id),e=eo(u);
      it.x=lerp(f.x0,d.x,e);it.y=lerp(f.y0,d.y,e)-Math.sin(PI*u)*0.05*G;
      if(u>=1){
        if(f.toBody)wear(id);
        else{it.st='slot';it.fly=null;it.sc.x=0.86;if(AU.ready)sLand(AU.ac.currentTime+0.005);}
      }
    }else if(it.st==='drag'&&drag&&drag.id===id){
      drag.ox*=Math.exp(-dt*10);drag.oy=lerp(drag.oy,-L.iconR*0.45,1-Math.exp(-dt*10));
      it.x=drag.px+drag.ox;it.y=drag.py+drag.oy;
      drag.vx*=Math.exp(-dt*6);drag.vy*=Math.exp(-dt*6);
    }else if(it.st==='drag'){it.st='fly';it.fly={toBody:false,x0:it.x,y0:it.y,t0:clock,dur:0.3};}
  }
  // curtain
  let ct=0;if(wJ>0.02)ct=isOn('gloves')?0.14:0.06+0.12*armUpAvg;
  if(!isOn('jacket'))ct=0;
  cur.o+=(ct-cur.o)*(1-Math.exp(-dt*(cur.o>ct?0.55:3)));
  for(let i=cur.pulses.length-1;i>=0;i--)if((clock-cur.pulses[i].t0)*1.5>1.5)cur.pulses.splice(i,1);
  const jf=(phase==='finale'&&starNow()==='jacket');
  if(jf){cur.gA=Math.min(1,cur.gA+dt*2.5);cur.grand=clamp((clock/STEP-finaleStep0+1)/9,0,1);}
  else{cur.gA=Math.max(0,cur.gA-dt*1.2);}
  // spot
  let tx,ty,trx,try_,tm;
  if(wS>0.5&&isOn('skirt')){const g=ringGeom(),t2=ringTheta();tx=g.x+Math.cos(t2)*g.rx;ty=g.y+Math.sin(t2)*g.ry;trx=0.085*G;try_=0.032*G;tm=1;}
  else{tx=pose.head.x;ty=pose.head.y;trx=pose.hr*1.5;try_=pose.hr*1.5;tm=0;}
  const sk=1-Math.exp(-dt*7);
  if(wH<0.03){spot.x=tx;spot.y=ty;spot.rx=trx;spot.ry=try_;}
  else{spot.x=lerp(spot.x,tx,sk);spot.y=lerp(spot.y,ty,sk);spot.rx=lerp(spot.rx,trx,sk);spot.ry=lerp(spot.ry,try_,sk);}
  spot.m=tm;
  padUpdate();
  // effects
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];q.life-=dt;if(q.life<=0){parts.splice(i,1);continue;}
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.g*dt;const dr=Math.exp(-dt*2.2);q.vx*=dr;q.vy*=dr;
  }
  for(let i=rings.length-1;i>=0;i--)if(clock-rings[i].t0>rings[i].dur)rings.splice(i,1);
  for(let i=runs.length-1;i>=0;i--)if(runs[i].dead||clock-runs[i].t0>runs[i].life)runs.splice(i,1);
  for(let i=darts.length-1;i>=0;i--)if(clock-darts[i].t0>darts[i].dur+0.1)darts.splice(i,1);
  if(ghost&&clock-ghost.t0>0.95)ghost=null;
  // demo
  if(!demo.done&&!demo.active&&phase==='small'&&!drag&&clock-lastInput>4&&guide&&(guide.k==='wear'||guide.k==='remove')){
    demo.active=true;demo.t0=clock;demo.id=guide.id;demo.kind=guide.k;
  }
  if(demo.active&&clock-demo.t0>3.3){demo.active=false;demo.done=true;demo.hx=null;}
}

function drawWalls(){

function curtainThreads(sd,cb){
  const G=L.G,n=L.curN,edge=sd<0?L.boxL:L.boxR,span=L.curSpan;
  const o=cur.o,bp=clock/BAR;
  const swA=(0.004+wJ*(0.012+0.05*clamp(armVel*0.5,0,1)))*G;

  for(let i=0;i<n;i++){

    const restX=edge-sd*span*k;
    const openX=edge-sd*span*0.14*k+sd*beyondEdge*(1-k);
    const x0=lerp(restX,openX,o);
    const bot=lerp(L.frontY-0.02*G,lerp(L.feetY-0.15*G,L.valY+0.35*G,1-k),o*0.9);
    cb(i,x0,yTop,bot,swA,bp,sd);
  }
}
function threadX(i,x0,s,swA,bp,sd,amp){
  let dx=s*swA*Math.sin(TAU*bp+i*0.55+s*2.4);

  return x0+dx;
}
function drawCurtain(){

function drawAudience(){

    const bob=Math.abs(Math.sin(PI*Bt+m.ph*0.3))*r*0.16*(0.4+cheerUp);
    const x=m.x+wS*Math.sin(th+m.ph*0.2)*r*0.35+(wJ>0.05?Math.sin(TAU*clock/BAR+m.x*0.01)*r*0.25*wJ:0);

    arms.moveTo(x-0.7*r,y-0.05*r);arms.lineTo(x-spread*r,y-up*r);
    arms.moveTo(x+0.7*r,y-0.05*r);arms.lineTo(x+spread*r,y-up*r);
    if(wS>0.1&&m.stick){const sa=th*2+m.ph,hx=x+spread*r,hy2=y-up*r;sticks.moveTo(hx,hy2);sticks.lineTo(hx+Math.cos(sa)*1.1*r,hy2+Math.sin(sa)*1.1*r);}
    if(m.tw>clock){const tx=x+0.5*r,ty=y-2.1*r,k=0.4*r;tw.moveTo(tx-k,ty);tw.lineTo(tx+k,ty);tw.moveTo(tx,ty-k);tw.lineTo(tx,ty+k);}
  }
  ctx.globalAlpha=1;
  glow2(V,2,a*0.4,seats);
  glow2(Y,2,a*(0.55+0.45*ce),arms);
  if(wS>0.1)glow(V,Math.max(2,LW*0.7),a*wS,0.8,sticks);
  glow(WH,2,a,0.6,tw);
}
function drawRuns(){
  const G=L.G;const paths={};
  const get=c=>paths[c]||(paths[c]=new Path2D());
  for(const r of runs){
    const age=clock-r.t0;if(age<0)continue;
    if(r.kind==='band'){
      const b=bandGeom(r.idx),x=r.x0+r.dir*r.spd*G*age;
      if(Math.abs(x-L.cx)>b.hw+4){r.dead=true;continue;}
      const pth=get(r.col);pth.moveTo(x,b.y);pth.lineTo(x-r.dir*0.1*G,b.y);
    }else if(r.kind==='rw'){
      if(openE<0.5){r.dead=true;continue;}
      const u=r.x0+r.dir*r.spd*age;if(u<0||u>1){r.dead=true;continue;}
      const y=lerp(L.frontY,L.liftY,u),hw=rwHW(u),pth=get(r.col);
      pth.moveTo(L.cx-hw,y);pth.quadraticCurveTo(L.cx,y+0.03*G,L.cx+hw,y);
    }else{
      const row=L.rows[r.idx];if(!row||openE<0.5){r.dead=true;continue;}
      const x0=L.cx+r.dir*row.rwh,x=x0+r.dir*r.spd*G*age;
      if(x<L.left-20||x>L.right+20){r.dead=true;continue;}
      const y=row.y+row.rr*0.75,pth=get(r.col);pth.moveTo(x,y);pth.lineTo(x-r.dir*0.12*G,y);
    }
  }
  for(const c in paths)glow(c,Math.max(2,LW*0.9),1,0.9,paths[c]);
}
function drawRings(layer){
  for(const g of rings){
    if(g.layer!==layer)continue;
    const u=(clock-g.t0)/g.dur;if(u<0||u>1)continue;
    const r=Math.max(0.5,lerp(g.r0,g.r1,eo(u)));
    ctx.beginPath();ctx.ellipse(g.x,g.y,r,Math.max(0.5,r*g.ry),0,0,TAU);
    glow2(g.col,Math.max(2,LW*g.w*(1-u*0.5)),(1-u)*0.9);
  }
}
function drawParts(layer){
  for(const col of COLORS){
    const p1=new Path2D(),p2=new Path2D();let a1=false,a2=false;
    for(const q of parts){
      if(q.layer!==layer||q.col!==col)continue;
      const k=q.life/q.max,l=q.len*(0.4+0.6*k);
      const pth=k>0.45?p1:p2;
      pth.moveTo(q.x,q.y);pth.lineTo(q.x-q.vx*l,q.y-q.vy*l);
      if(k>0.45)a1=true;else a2=true;
    }
    if(a1)glow2(col,Math.max(2,LW*0.8),1,p1);
    if(a2)glow2(col,2,0.5,p2);
  }
}
function drawDarts(){
  const paths={};
  for(const d of darts){
    const u=(clock-d.t0)/d.dur;if(u<0||u>1)continue;
    const u0=Math.max(0,u-0.12);
    const pt=t=>{const it=1-t;return [it*it*d.x0+2*it*t*d.cx+t*t*d.x1,it*it*d.y0+2*it*t*d.cy+t*t*d.y1];};
    const a=pt(u0),b=pt((u0+u)/2),c=pt(u);
    const pth=paths[d.col]||(paths[d.col]=new Path2D());
    pth.moveTo(a[0],a[1]);pth.lineTo(b[0],b[1]);pth.lineTo(c[0],c[1]);
  }
  for(const c in paths)glow(c,Math.max(2,LW*0.9),1,0.9,paths[c]);
}
function drawSlots(){
  const R=L.iconR;
  for(const id of IDS){
    const sp=slotPos(id),it=items[id];
    ctx.beginPath();ctx.moveTo(sp.x-R*0.85,sp.y+R*1.05);ctx.lineTo(sp.x+R*0.85,sp.y+R*1.05);
    ctx.moveTo(sp.x-R*0.85,sp.y+R*1.05);ctx.lineTo(sp.x-R*0.95,sp.y+R*0.95);ctx.moveTo(sp.x+R*0.85,sp.y+R*1.05);ctx.lineTo(sp.x+R*0.95,sp.y+R*0.95);
    glow2(COLS[id][1],2,0.5);
    const home=it.st==='slot'||(it.st==='fly'&&it.fly&&!it.fly.toBody);
    if(!home){
      ctx.setLineDash([3,7]);
      drawIcon(id,sp.x,sp.y,R,{a:0.2,ghost:true,e:0,fl:0});
      ctx.setLineDash([]);
    }
  }
  for(const id of IDS){
    const it=items[id];
    if(!(it.st==='slot'||it.st==='fly'))continue;
    const g=guide&&guide.k==='wear'&&guide.id===id&&it.st==='slot';
    let hop=0,sq=1;
    if(g){const c=(clock-guideSince)%1.8;if(c<0.42){const u=c/0.42;hop=Math.sin(PI*u)*Math.min(0.014*L.G,5);sq=1+0.035*Math.sin(TAU*u);}}
    let sc=it.sc.x;
    if(it.st==='fly'&&it.fly.toBody)sc*=lerp(1,0.8,clamp((clock-it.fly.t0)/it.fly.dur,0,1));
    drawIcon(id,it.x,it.y-hop,R*sc,{a:g?1:0.82,sx:1/sq,sy:sq,rot:0,fl:it.fl,e:E[id],ghost:false});
  }
}
let popCycle=-1;
function guidePop(){
  if(!guide||guide.k!=='remove'||drag)return;
  const cyc=Math.floor((clock-guideSince)/1.8);
  if(cyc!==popCycle){popCycle=cyc;const it=items[guide.id];if(it.st==='worn'){it.sc.x=1.16;it.sc.v=0;}}
}
function drawGuideWorn(){
  if(!guide||guide.k!=='remove'||drag)return;
  const c=(clock-guideSince)%1.8;
  if(c<0.6){const e=Math.sin(PI*c/0.6);for(const q of anchorPts(guide.id)){ctx.beginPath();ctx.arc(q.x,q.y,q.r*(0.9+0.3*e),0,TAU);glow2(COLS[guide.id][0],2,0.55*e);}}
}
function drawDragFeedback(){
  if(drag&&items[drag.id].st==='drag'){
    const it=items[drag.id];
    const inZ=inSnap(drag.id,it.x,it.y,drag.px,drag.py);
    const a=inZ?0.75:0.2+0.2*(0.5+0.5*Math.sin(clock*TAU*1.6));
    drawWornGhost(drag.id,a);
  }
  if(ghost){
    const u=clamp((clock-ghost.t0)/0.9,0,1),sp=slotPos(ghost.id),an=anchor(ghost.id),e=sm(u);
    const x=lerp(sp.x,an.x,e),y=lerp(sp.y,an.y,e)-Math.sin(PI*u)*0.1*L.G;
    ghost.pos={x,y};
    drawIcon(ghost.id,x,y,L.iconR*lerp(1,0.7,u),{a:0.5*Math.sin(PI*u),ghost:true,e:0,fl:0});
    drawWornGhost(ghost.id,0.25+0.35*Math.sin(PI*u));
  }
}
function drawDragItem(){
  if(!drag)return;const it=items[drag.id];if(it.st!=='drag')return;
  const sp=Math.hypot(drag.vx,drag.vy),st=clamp(sp/2400,0,0.12);
  drawIcon(drag.id,it.x,it.y,L.iconR*it.sc.x,{a:1,sx:1-st*0.5,sy:1+st,rot:clamp(drag.vx/3000,-0.3,0.3),fl:it.fl,e:E[drag.id],ghost:false});
}
function drawDemo(){
  if(!demo.active)return;
  const t=clock-demo.t0,id=demo.id,G=L.G;
  const from=demo.kind==='wear'?{x:items[id].x,y:items[id].y}:anchor(id);
  const to=demo.kind==='wear'?anchor(id):slotPos(id);
  let hx,hy,ha=1,ga=0,press=0;
  if(t<0.5){const u=eo(t/0.5);hx=lerp(from.x+0.3*G,from.x,u);hy=lerp(from.y+0.35*G,from.y,u);ha=u;}
  else if(t<0.8){hx=from.x;hy=from.y;press=Math.sin(PI*(t-0.5)/0.3);}
  else if(t<2.2){const u=sm((t-0.8)/1.4);hx=lerp(from.x,to.x,u);hy=lerp(from.y,to.y,u)-Math.sin(PI*u)*0.12*G;ga=0.55;}
  else if(t<2.6){hx=to.x;hy=to.y;ga=0.55*(1-(t-2.2)/0.4);}
  else{const u=clamp((t-2.6)/0.7,0,1);hx=to.x+u*0.2*G;hy=to.y+u*0.3*G;ha=1-u;}
  demo.hx=hx;demo.hy=hy;
  if(t>0.8&&t<2.6)drawWornGhost(id,0.2+0.25*(0.5+0.5*Math.sin(clock*TAU*1.6)));
  if(ga>0.01)drawIcon(id,hx,hy,L.iconR*0.9,{a:ga,ghost:true,e:0,fl:0});
  if(press>0.01){ctx.beginPath();ctx.arc(from.x,from.y,L.iconR*(1.1+0.2*press),0,TAU);glow2(WH,2,press*0.7);}
  const hs=clamp(0.12*G,34,64)*(1-0.08*press);
  shp(hx,hy,-0.35,hs,hs,BLD.hand);glow(WH,Math.max(2,LW*0.85),ha*0.95,0.8);
}
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(needClear){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);needClear=false;}
  else{ctx.fillStyle='rgba(0,0,0,0.42)';ctx.fillRect(0,0,W,H);}
  ctx.lineCap='round';ctx.lineJoin='round';
  drawAudience();
  drawRunway();
  drawLift();
  drawWalls();
  drawGrandCurtain();
  drawFloor();
  drawRuns();
  drawRings(0);
  drawParts(0);
  drawDarts();
  drawValance();
  drawCurtain();
  drawSpotBeam();
  drawRing(false);
  drawGirl();
  drawRing(true);
  drawGuideWorn();
  drawSlots();
  drawDragFeedback();
  drawRings(1);
  drawParts(1);
  drawDragItem();
  drawDemo();
}

/* ---------------- loop ---------------- */
let lastW=0,lastH=0,lastD=0;
function checkResize(){
  const w=Math.round(window.innerWidth),h=Math.round(window.innerHeight),d=dprCap();
  if(w!==lastW||h!==lastH||d!==lastD){lastW=w;lastH=h;lastD=d;layout();}
}
function frame(ts){
  raf=0;
  if(hidden)return;
  raf=requestAnimationFrame(frame);
  if(last===null)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>0&&dt<0.25){fpsAcc+=dt;fpsN++;if(fpsAcc>=2){fpsVal=fpsN/fpsAcc;if(clock>10&&fpsVal<47&&Q<(clock>15&&!drag?3:1))Q++;fpsAcc=0;fpsN=0;}}
  dt=clamp(dt,0,0.05);
  try{
    checkResize();
    clock+=dt;
    if(AU.ac&&!AU.ready&&AU.ac.state==='running')audioCheck();
    schedule();
    update(dt);
    draw();
  }catch(e){
    if(!frame.warned){frame.warned=true;try{console.warn(e);}catch(_){}}
  }
}
function onVis(){
  if(document.hidden){
    hidden=true;
    if(drag)drop(true);
    if(raf){cancelAnimationFrame(raf);raf=0;}
    if(AU.ac){AU.ready=false;try{if(AU.pad)AU.pad.g.gain.setValueAtTime(0,AU.ac.currentTime);}catch(e){}try{const p=AU.ac.suspend();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
  }else{
    hidden=false;last=null;needClear=true;fpsAcc=0;fpsN=0;
    if(!raf)raf=requestAnimationFrame(frame);
    if(AU.ac){try{const p=AU.ac.resume();if(p&&p.then)p.then(audioCheck,()=>{});}catch(e){}}
  }
}

/* ---------------- init ---------------- */
function init(){
  const sv=loadSave();
  if(sv){
    for(const id of sv.o)items[id].st='worn';
    order=sv.o.slice();lastStar=sv.s;for(const id of sv.seen)seenStars.add(id);
  }
  checkResize();
  girl.x=L.cx;girl.y=L.feetY;girl.sc=1;
  computePose(0.016);
  for(const id of IDS){const sp=slotPos(id);items[id].x=sp.x;items[id].y=sp.y;}
  spot.x=pose.head.x;spot.y=pose.head.y;
  cv.addEventListener('pointerdown',onDown,{passive:false});
  window.addEventListener('pointermove',onMove,{passive:false});
  window.addEventListener('pointerup',onUp,{passive:false});
  window.addEventListener('pointercancel',onCancel);
  cv.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.pid)drop(false);});
  window.addEventListener('blur',()=>{if(drag)drop(true);});
  const unlock=()=>{if(AU.ac&&AU.ac.state!=='running')audioInit();};
  window.addEventListener('pointerup',unlock);window.addEventListener('touchend',unlock,{passive:true});
  const stop=e=>{if(e.cancelable)e.preventDefault();};
  document.addEventListener('touchstart',stop,{passive:false});
  document.addEventListener('touchmove',stop,{passive:false});
  document.addEventListener('gesturestart',stop,{passive:false});
  document.addEventListener('gesturechange',stop,{passive:false});
  document.addEventListener('dblclick',stop,{passive:false});
  document.addEventListener('contextmenu',stop);
  document.addEventListener('selectstart',stop);
  document.addEventListener('visibilitychange',onVis);
  window.addEventListener('pagehide',()=>{if(drag)drop(true);});
  window.addEventListener('resize',checkResize);
  window.addEventListener('orientationchange',()=>setTimeout(checkResize,120));
  window.__neon49={
    state:()=>({phase,openT:+openT.toFixed(3),order:order.slice(),star:starNow(),guide:guide?guide.k+':'+guide.id:null,
      demo:demo.active?'active':(demo.done?'done':'pending'),audio:AU.ac?AU.ac.state:'none',audioReady:AU.ready,store:storeState,
      parts:parts.length,rings:rings.length,runs:runs.length,clock:+clock.toFixed(2),drag:drag?drag.id:null,curtain:+cur.o.toFixed(3),
      spotMode:spot.m,lastStar,finStar:finStarUsed,items:IDS.map(id=>id+':'+items[id].st).join(','),fps:+fpsVal.toFixed(1),
      E:Object.assign({},E),aClapT,aStompT,cheer:+cheer.toFixed(2),Q,dpr:DPR}),
    slot:id=>{const p=slotPos(id);return {x:p.x,y:p.y};},
    item:id=>({x:items[id].x,y:items[id].y,st:items[id].st}),
    anchor:id=>{const a=anchor(id);return {x:a.x,y:a.y};},
    pts:id=>anchorPts(id).map(q=>({x:q.x,y:q.y,r:q.r})),
    lift:()=>({x:L.cx,y:liftY()}),
    girl:()=>({x:girl.x,y:girl.y,s:pose.s,head:{x:pose.head.x,y:pose.head.y,r:pose.hr},hands:[pose.haL.x,pose.haL.y,pose.haR.x,pose.haR.y]}),
    layout:()=>({W,H,G:L.G,iconR:L.iconR,hitR:L.hitR,LW,boxL:L.boxL,boxR:L.boxR,frontY:L.frontY,liftY:L.liftY,valY:L.valY,safe:Object.assign({},SA),aud:L.aud.length}),
    relayout:()=>{layout();},
    flags:n=>allFlags(n),step:()=>Math.floor(clock/STEP),spot:()=>({x:spot.x,y:spot.y,m:spot.m})
  };
  raf=requestAnimationFrame(frame);
}
init();
})();
</script>
