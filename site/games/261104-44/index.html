<canvas id="c"></canvas><div id="sa"></div>
<script>
(function(){
'use strict';
/* ================= palette (primaries only, flat) ================= */
const RED='#e2301f', BLUE='#1f4fae', YEL='#f7c61a', INK='#141414', WHITE='#ffffff';
const TAU=Math.PI*2;
const PMAX=90;               // particle cap
const WALK=48, RUN=90;       // resident speeds (u/s)

/* ================= utils ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<=0?0:t>=1?1:1-Math.pow(1-t,3);
const easeIO=t=>t<=0?0:t>=1?1:(t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2);
const back=t=>{if(t<=0)return 0;if(t>=1)return 1;const c=1.8;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const Q=new URLSearchParams(location.search);
let seed=Q.has('seed')?(Math.abs(parseInt(Q.get('seed'),10))%2147483646)+1:((Date.now()%2147483646)|0)+1;
function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
const rr=(a,b)=>a+(b-a)*rnd();
function pickW(list){let s=0;for(const o of list)s+=o.w;if(s<=0)return null;let k=rnd()*s;for(const o of list){k-=o.w;if(k<=0)return o;}return list[list.length-1];}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* ================= audio (Web Audio synthesis, started by first touch) ================= */
const AU={ctx:null,out:null,noise:null,started:false};
function audioStart(){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  if(!AU.ctx){
    try{
      const c=new AC(); AU.ctx=c;
      const comp=c.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=5;
      const g=c.createGain(); g.gain.value=0.55; g.connect(comp); comp.connect(c.destination); AU.out=g;
      const len=(c.sampleRate*0.6)|0, b=c.createBuffer(1,len,c.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      AU.noise=b;
      const s=c.createBufferSource(); s.buffer=c.createBuffer(1,1,c.sampleRate); s.connect(c.destination); s.start(0);
    }catch(e){ AU.ctx=null; return; }
  }
  AU.started=true;
  if(AU.ctx.state!=='running' && !document.hidden){ try{ const p=AU.ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
}
function aok(){ return !!(AU.ctx && AU.started && !document.hidden && AU.ctx.state!=='closed'); }
function now0(){ return AU.ctx.currentTime+0.005; }
function tone(f,t0,dur,type,vol,f2){
  const c=AU.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(vol,t0+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(AU.out); o.start(t0); o.stop(t0+dur+0.03);
}
function noise(t0,dur,freq,q,vol,type){
  const c=AU.ctx, s=c.createBufferSource(); s.buffer=AU.noise;
  const f=c.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q;
  const g=c.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(AU.out); s.start(t0,Math.random()*0.4); s.stop(t0+dur+0.03);
}
const SCALE=[523.25,587.33,659.25,783.99,880.00,1046.5,1174.66,1318.51,1567.98,1760.0];
function xylo(f,t,v){ tone(f,t,0.42,'sine',0.30*(v||1)); tone(f*3.98,t,0.07,'sine',0.07*(v||1)); noise(t,0.02,f*2,4,0.05*(v||1)); }
const SND={
  open(step){ if(!aok())return; const t=now0(); const f=SCALE[((step%SCALE.length)+SCALE.length)%SCALE.length]; xylo(f,t); noise(t,0.05,1500,2,0.10); },
  close(){ if(!aok())return; const t=now0(); tone(330,t,0.09,'triangle',0.22,190); noise(t,0.05,1300,3,0.18); tone(247,t+0.08,0.08,'triangle',0.16,160); },
  letter(){ if(!aok())return; const t=now0(); noise(t,0.22,3500,0.7,0.10,'highpass'); tone(990,t+0.02,0.16,'sine',0.05,1980); },
  receive(){ if(!aok())return; const t=now0(); xylo(1318.5,t,0.6); xylo(1760,t+0.08,0.5); },
  conn(type){ if(!aok())return; const t=now0();
    if(type==='H'){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>{tone(f,t+i*0.075,0.5,'triangle',0.20);tone(f*2,t+i*0.075,0.2,'sine',0.05);}); tone(2093,t+0.32,0.6,'sine',0.06); }
    else if(type==='V'){ [392,440,493.9,523.25,587.3,659.25].forEach((f,i)=>tone(f*1.5,t+i*0.055,0.28,'triangle',0.18)); tone(1975.5,t+0.36,0.5,'sine',0.06); }
    else { tone(392,t,0.5,'triangle',0.16,1046.5); [783.99,987.77,1174.66].forEach((f,i)=>tone(f,t+0.28+i*0.02,0.7,'triangle',0.13)); tone(2349,t+0.3,0.6,'sine',0.05); }
  },
  clap(){ if(!aok())return; const t=now0()+0.08; for(let i=0;i<4;i++) noise(t+i*0.13+Math.random()*0.02,0.05,2400,1.2,0.22,'bandpass'); },
  fold(){ if(!aok())return; const t=now0(); [784,659,523].forEach((f,i)=>tone(f,t+i*0.08,0.22,'triangle',0.14)); },
  pop(){ if(!aok())return; const t=now0(); tone(220,t,0.12,'sine',0.22,660); },
  soft(){ if(!aok())return; const t=now0(); tone(196,t,0.09,'sine',0.10,150); },
  boing(){ if(!aok())return; const t=now0(); tone(300,t,0.18,'sine',0.12,420); },
  balloon(){ if(!aok())return; const t=now0(); tone(420,t,0.7,'sine',0.12,980); tone(630,t+0.1,0.6,'triangle',0.05,1400); },
  fanfare(){ if(!aok())return; const t=now0(); [523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{tone(f,t+i*0.09,0.9,'triangle',0.14);}); [261.6,329.6,392].forEach(f=>tone(f,t+0.5,1.2,'triangle',0.10)); },
  tick(i){ if(!aok())return; const t=now0(); xylo(SCALE[(i*2)%SCALE.length],t,0.45); },
  bag(){ if(!aok())return; const t=now0(); noise(t,0.12,900,1,0.16); tone(523.25,t+0.05,0.3,'triangle',0.12); tone(784,t+0.15,0.4,'triangle',0.12); }
};
/* parade music: tiny step sequencer with lookahead, never stacks after resume */
const MUSIC={on:false,next:0,step:0};
const MEL=[0,2,4,7,4,2,0,null,5,7,9,7,5,4,2,null,0,2,4,7,9,7,9,12,11,9,7,4,2,4,0,null];
const BASS=[-12,null,-5,null,-12,null,-5,null,-7,null,-3,null,-7,null,-5,null];
function musicTick(){
  if(!MUSIC.on||!aok()||AU.ctx.state!=='running') return;
  const c=AU.ctx, sp=0.2;
  if(MUSIC.next<c.currentTime-0.05||MUSIC.next>c.currentTime+1) MUSIC.next=c.currentTime+0.06;
  while(MUSIC.next<c.currentTime+0.25){
    const i=MUSIC.step%MEL.length, m=MEL[i], b=BASS[MUSIC.step%BASS.length];
    if(m!==null) xylo(523.25*Math.pow(2,m/12),MUSIC.next,0.45);
    if(b!==null) tone(261.63*Math.pow(2,b/12),MUSIC.next,0.22,'triangle',0.12);
    if(MUSIC.step%4===2) noise(MUSIC.next,0.03,5000,1,0.05,'highpass');
    MUSIC.next+=sp; MUSIC.step++;
  }
}

/* ================= world topology ================= */
// 4 buildings, road between building 1 and 2. lane = side holding outside stairs.
const BUILD=[
  {floors:2,lane:'L',roof:RED, par:YEL, door:BLUE},
  {floors:3,lane:'R',roof:BLUE,par:RED, door:YEL},
  {floors:3,lane:'L',roof:YEL, par:BLUE,door:RED},
  {floors:2,lane:'R',roof:RED, par:BLUE,door:YEL}
];
const WINS=[]; // window ids: c0f0=0 c0f1=1 c1f0=2 c1f1=3 c1f2=4 c2f0=5 c2f1=6 c2f2=7 c3f0=8 c3f1=9
BUILD.forEach((b,c)=>{for(let f=0;f<b.floors;f++)WINS.push({c,f});});
const WID=(c,f)=>WINS.findIndex(w=>w.c===c&&w.f===f);
const NW=WINS.length;
const SHUT=[BLUE,RED,YEL,BLUE,RED,RED,YEL,BLUE,YEL,RED];
const STRIP=[RED,YEL,BLUE,YEL,RED,YEL,RED,YEL,BLUE,YEL];
// connections: H = side by side (stall), V = stacked (stairs), X = across the road (bridge)
const CONN=[
  {t:'H',a:WID(0,0),b:WID(1,0),f:0},{t:'H',a:WID(0,1),b:WID(1,1),f:1},
  {t:'H',a:WID(2,0),b:WID(3,0),f:0},{t:'H',a:WID(2,1),b:WID(3,1),f:1},
  {t:'V',a:WID(0,0),b:WID(0,1)},{t:'V',a:WID(1,0),b:WID(1,1)},{t:'V',a:WID(1,1),b:WID(1,2)},
  {t:'V',a:WID(2,0),b:WID(2,1)},{t:'V',a:WID(2,1),b:WID(2,2)},{t:'V',a:WID(3,0),b:WID(3,1)},
  {t:'X',a:WID(1,0),b:WID(2,0),f:0},{t:'X',a:WID(1,1),b:WID(2,1),f:1},{t:'X',a:WID(1,2),b:WID(2,2),f:2}
];
// graph nodes: 0..NW-1 ledges, then one node per H (plaza) and per X (bridge middle)
let NN=NW;
CONN.forEach(c=>{ if(c.t!=='V'){ c.node=NN++; } });
const EDGES=[];
CONN.forEach((c,ci)=>{
  if(c.t==='V') EDGES.push({conn:ci,a:c.a,b:c.b,k:'V'});
  else { EDGES.push({conn:ci,a:c.a,b:c.node,k:c.t}); EDGES.push({conn:ci,a:c.node,b:c.b,k:c.t}); }
});
const ADJ=[]; for(let i=0;i<NN;i++)ADJ.push([]);
EDGES.forEach((e,i)=>{ADJ[e.a].push(i);ADJ[e.b].push(i);});
const NODE_KIND=n=>n<NW?'ledge':(CONN.find(c=>c.node===n).t==='H'?'plaza':'mid');
const NODE_CONN=[]; CONN.forEach((c,ci)=>{ if(c.node!==undefined) NODE_CONN[c.node]=ci; });

/* ================= canvas + layout ================= */
const cv=document.getElementById('c'), cx=cv.getContext('2d');
const saEl=document.getElementById('sa');
let W=0,H=0,DPR=1;
const L={u:1,win:[],ledge:[],node:[],E:[],bld:[]};
let bg=null, bgx=null, needLayout=true, snapAll=true;

function layout(){
  W=Math.max(1,window.innerWidth|0); H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  let st=0,sr=0,sb=0,sl=0;
  try{ const cs=getComputedStyle(saEl); st=parseFloat(cs.paddingTop)||0; sr=parseFloat(cs.paddingRight)||0; sb=parseFloat(cs.paddingBottom)||0; sl=parseFloat(cs.paddingLeft)||0; }catch(e){}
  const X0=sl, X1=W-sr, Y0=st, Y1=H-sb, w=X1-X0, h=Y1-Y0;
  const u=clamp(Math.min(h/760,w/424),0.45,1.9);
  L.u=u; L.X0=X0; L.X1=X1; L.Y0=Y0; L.Y1=Y1; L.lw=Math.max(2,3.4*u); L.tw=Math.max(1.4,2*u);
  const boyArea=150*u;
  const groundY=Y1-boyArea;
  const fh=Math.min((groundY-Y0)/4.3,185*u);
  const mLane=22*u, mPad=4*u, mGap=14*u, mRoad=40*u, mMar=6*u;
  const wsH=(w-2*mMar-2*mGap-mRoad-4*(mLane+3*mPad))/4;
  const ws=Math.max(30,Math.min(wsH,0.52*fh,64*u*(w/h>1.6?1.3:1)));
  let E=w-2*mMar-2*mGap-mRoad-4*(ws+mLane+3*mPad);
  let lane=mLane, pad=mPad, gap=mGap, road=mRoad;
  if(E>0){
    const dl=Math.min(E*0.03,18*u); lane+=dl; E-=dl*4;
    const dp=Math.min(E*0.016,12*u); pad+=dp; E-=dp*12;
    const dr=Math.min(E*0.32,230*u); road+=dr; E-=dr;
    const dg=Math.min(E*0.22,150*u); gap+=dg; E-=dg*2;
  }
  const bw=lane+ws+3*pad;
  const total=4*bw+2*gap+road;
  let x=X0+(w-total)/2;
  L.ws=ws; L.fh=fh; L.groundY=groundY; L.lane=lane; L.pad=pad; L.gap=gap; L.road=road; L.bw=bw;
  L.bld=[];
  for(let c=0;c<4;c++){
    const b=BUILD[c];
    const B={x,w:bw,top:groundY-b.floors*fh};
    if(b.lane==='L'){ B.laneX=x+pad; B.winX=x+2*pad+lane; B.xNear=B.laneX+lane-3*u; B.xFar=B.laneX+3*u; }
    else { B.winX=x+pad; B.laneX=x+2*pad+ws; B.xNear=B.laneX+3*u; B.xFar=B.laneX+lane-3*u; }
    L.bld.push(B);
    x+=bw+(c===1?road:gap);
  }
  L.roadL=L.bld[1].x+bw; L.roadR=L.bld[2].x; L.roadC=(L.roadL+L.roadR)/2;
  const ledgeY=f=>f===0?groundY:groundY-f*fh-0.2*fh;
  L.ledgeY=ledgeY;
  L.win=[]; L.ledge=[]; L.node=[];
  WINS.forEach((wd,i)=>{
    const B=L.bld[wd.c], base=groundY-wd.f*fh;
    const r={x:B.winX,y:base-0.2*fh-ws,s:ws};
    // generous hit box (>=48px): window cell, plus a little into the alley/road
    const hx0=Math.max(B.x-Math.min(gap,road)*0.45,B.winX-pad-6*u), hx1=Math.min(B.x+bw+Math.min(gap,road)*0.45,B.winX+ws+pad+6*u);
    r.hx=hx0; r.hw=Math.max(48,hx1-hx0); r.hy=r.y-Math.min(14*u,(fh-ws)*0.45); r.hh=Math.max(48,ws+2*Math.min(14*u,(fh-ws)*0.45));
    L.win.push(r);
    L.ledge.push({x:B.winX+ws/2,y:ledgeY(wd.f)});
  });
  for(let n=0;n<NW;n++) L.node[n]=L.ledge[n];
  CONN.forEach(c=>{
    if(c.node===undefined) return;
    const A=L.ledge[c.a], Bp=L.ledge[c.b];
    if(c.t==='H'){ const ra=L.win[c.a], rb=L.win[c.b]; L.node[c.node]={x:(ra.x+ra.s+rb.x)/2,y:A.y}; }
    else L.node[c.node]={x:L.roadC,y:c.f===0?groundY+8*u:A.y};
  });
  // edge polylines
  L.E=EDGES.map(e=>{
    const c=CONN[e.conn]; let pts;
    if(e.k==='V'){
      const B=L.bld[WINS[c.a].c], A=L.ledge[c.a], Bt=L.ledge[c.b];
      const my=(A.y+Bt.y)/2;
      pts=[{x:A.x,y:A.y},{x:B.xNear,y:A.y},{x:B.xFar,y:my},{x:B.xNear,y:Bt.y},{x:Bt.x,y:Bt.y}];
    } else if(e.k==='X' && c.f===0){
      const a=L.node[e.a], b=L.node[e.b];
      const yy=groundY+8*u;
      if(e.a<NW) pts=[{x:a.x,y:a.y},{x:L.roadL-2*u,y:yy},{x:b.x,y:b.y}];
      else pts=[{x:a.x,y:a.y},{x:L.roadR+2*u,y:yy},{x:b.x,y:b.y}];
    } else {
      const a=L.node[e.a], b=L.node[e.b]; pts=[{x:a.x,y:a.y},{x:b.x,y:b.y}];
    }
    const cum=[0]; let len=0;
    for(let i=1;i<pts.length;i++){ len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); cum.push(len); }
    return {pts,cum,len:Math.max(1,len)};
  });
  // full stair / bridge band polylines per connection
  L.cp=CONN.map((c,ci)=>{
    if(c.t==='V'){ return L.E[EDGES.findIndex(e=>e.conn===ci)]; }
    const A=L.ledge[c.a], B=L.ledge[c.b];
    const pts=[{x:A.x,y:A.y},{x:B.x,y:B.y}];
    const len=Math.max(1,Math.hypot(B.x-A.x,B.y-A.y));
    return {pts,cum:[0,len],len};
  });
  L.boy={x:L.roadC,y:Y1-10*u};
  if(L.boy.x-40*u<X0) L.boy.x=X0+40*u;
  L.sun={x:X1-48*u,y:Y0+52*u,r:26*u};
  buildBg();
  needLayout=false; snapAll=true;
}
function polyAt(P,t){ // point at fraction t along polyline
  const d=clamp(t,0,1)*P.len; const pts=P.pts, cum=P.cum;
  for(let i=1;i<pts.length;i++){
    if(d<=cum[i]||i===pts.length-1){ const seg=cum[i]-cum[i-1]||1; const k=clamp((d-cum[i-1])/seg,0,1);
      return {x:lerp(pts[i-1].x,pts[i].x,k),y:lerp(pts[i-1].y,pts[i].y,k),dx:pts[i].x-pts[i-1].x,dy:pts[i].y-pts[i-1].y}; }
  }
  return {x:pts[0].x,y:pts[0].y,dx:1,dy:0};
}
function polyPart(g,P,t0,t1){ // trace part of polyline between fractions
  const a=polyAt(P,t0); g.moveTo(a.x,a.y);
  const d0=t0*P.len,d1=t1*P.len;
  for(let i=1;i<P.pts.length-1;i++){ if(P.cum[i]>d0&&P.cum[i]<d1) g.lineTo(P.pts[i].x,P.pts[i].y); }
  const b=polyAt(P,t1); g.lineTo(b.x,b.y);
}

/* ================= static background (cached) ================= */
function buildBg(){
  if(!bg){ bg=document.createElement('canvas'); bgx=bg.getContext('2d'); }
  bg.width=cv.width; bg.height=cv.height;
  const g=bgx, u=L.u;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle=WHITE; g.fillRect(0,0,W,H);
  g.lineJoin='miter'; g.lineCap='butt';
  const gy=L.groundY;
  // road (yellow, Mondrian squares)
  g.fillStyle=YEL; g.fillRect(L.roadL,gy,L.roadR-L.roadL,H-gy);
  const sq=Math.max(6,8*u); let k=0;
  for(let y=gy+20*u;y<H;y+=sq*2.2){ g.fillStyle=[RED,WHITE,BLUE,WHITE][k++%4]; g.fillRect(L.roadC-sq/2,y,sq,sq); }
  g.lineWidth=L.lw; g.strokeStyle=INK;
  g.beginPath(); g.moveTo(L.roadL,gy); g.lineTo(L.roadL,H); g.moveTo(L.roadR,gy); g.lineTo(L.roadR,H); g.stroke();
  // sidewalk lines
  g.beginPath(); g.moveTo(0,gy); g.lineTo(W,gy); g.stroke();
  g.lineWidth=L.tw;
  const cy2=gy+16*u;
  g.beginPath(); g.moveTo(0,cy2); g.lineTo(L.roadL,cy2); g.moveTo(L.roadR,cy2); g.lineTo(W,cy2); g.stroke();
  // little flat blocks on the front sidewalk (Mondrian rhythm)
  for(let x=L.X0+10*u;x<W;x+=34*u){ if(x>L.roadL-14*u&&x<L.roadR+4*u) continue; g.fillStyle=((x/34|0)%3===0)?RED:((x/34|0)%3===1?BLUE:YEL); g.fillRect(x,gy+5*u,7*u,6*u); }

    // parapet band

    g.lineWidth=L.tw; g.strokeStyle=INK; g.stroke();
    g.fillStyle=INK; g.beginPath(); g.arc(dx+dw*0.75,gy-dh*0.42,Math.max(1.2,1.6*u),0,TAU); g.fill();
    // grid lines
    g.lineWidth=L.tw; g.strokeStyle=INK; g.beginPath();
    for(let f=1;f<b.floors;f++){ const y=gy-f*L.fh; g.moveTo(B.x,y); g.lineTo(B.x+B.w,y); }
    g.moveTo(B.x,B.top+9*u); g.lineTo(B.x+B.w,B.top+9*u);
    const lx=b.lane==='L'?B.laneX+L.lane+L.pad/2:B.laneX-L.pad/2;
    g.moveTo(lx,B.top+9*u); g.lineTo(lx,gy);
    g.stroke();
    g.lineWidth=L.lw; g.strokeRect(B.x,B.top,B.w,hgt);
    // balconies under upper windows
    for(let f=1;f<b.floors;f++){
      const r=L.win[WID(c,f)];
      g.fillStyle=INK; g.fillRect(r.x-5*u,r.y+r.s,r.s+10*u,Math.max(3,4*u));
    }

}

/* ================= persistence (device only, optional) ================= */
const SAVE_KEY='gf261104_44_mado';

}

/* ================= game state ================= */
const S={phase:'play',t:0,round:0,firstWin:WID(1,1),focus:-1,idle:0,hint:null,hintDone:false,

  rd:{H:0,V:0,X:0,fold:0},combo:0,lastTapT:-9,lastWin:-1,finaleAt:-1,phaseT:0,lastDeliver:-1,

const FIRSTS=[WID(1,1),WID(2,1),WID(2,0),WID(1,0)];
const wins=WINS.map((wd,i)=>({i,c:wd.c,f:wd.f,open:false,aFrom:0,aT:-9,pT:-9,delivered:false,openedAt:-9,lastTap:-9,col:SHUT[i],bnc:-9,peek:rnd()*TAU}));

function wdisp(w){
  const k=clamp((S.t-w.aT)/(w.open?0.42:0.30),0,1);

function settled(w){ return w.open && S.t-w.aT>0.32; }

/* ================= graph helpers ================= */

function neighbors(i){ const out=[]; conns.forEach(c=>{ if(c.a===i) out.push({w:c.b,c}); else if(c.b===i) out.push({w:c.a,c}); }); return out; }

/* ================= particles ================= */
function burst(x,y,n,spd){
  const u=L.u;
  for(let i=0;i<n;i++){
    if(parts.length>=PMAX) parts.shift();
    const a=rr(-Math.PI*0.95,-Math.PI*0.05), s=rr(0.4,1)*spd*u;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,rot:rr(0,TAU),vr:rr(-10,10),col:[RED,BLUE,YEL,WHITE][(rnd()*4)|0],life:0,max:rr(0.6,1.1),w:rr(3,5)*u,h:rr(2,3.5)*u});
  }
}

/* ================= windows: open / close / deliver ================= */
function noteFor(i){
  if(S.t-S.lastTapT<1.4) S.combo++; else S.combo=0;
  S.lastTapT=S.t; const w=WINS[i]; return w.f*2+w.c+S.combo;
}
function boyLookAt(i){ S.boyLook=i; S.boyLookT=S.t; }

  const w=wins[i];

    w.pT=S.t; w.bnc=S.t; SND.open(noteFor(i));
    const r=L.win[i]; burst(r.x+r.s/2,r.y+r.s*0.4,3,120); return;

}
function openWin(w,user){
  w.aFrom=wdisp(w); w.aT=S.t; w.open=true; w.pT=S.t; w.openedAt=S.t;
  const r=L.win[w.i];
  if(user){ SND.open(noteFor(w.i)); burst(r.x+r.s/2,r.y+r.s*0.55,5,150); }
  const R=res[w.i];
  if(!w.delivered){
    w.delivered=true; S.disc.deliver++; S.lastDeliver=w.i; S.rd.first=1;
    if(wins.filter(x=>x.delivered).length===1){ STORE.data.last=w.i; writeSave(); }
    R.st='await'; R.stT=S.t;

function closeWin(w,user){

  conns.forEach(c=>{
    if(c.a!==w.i&&c.b!==w.i) return;
    c.src=(c.a===w.i)?1:0;                 // retract toward the side that stays open
    if(c.t==='H'){
      if(c.st==='on'){ c.st='fold'; if(S.phase==='play') stallFolded(c); else c.keeper=-1; }
      else if(c.st==='grow') c.st='fold';

}
function launchEnvelope(i){ const b=bagPos(); envs.push({i,x0:b.x,y0:b.y,t:0,dur:0.3}); SND.letter(); }
function updEnvs(dt){
  for(let k=envs.length-1;k>=0;k--){
    const e=envs[k]; e.t+=dt;
    if(e.t>=e.dur){
      envs.splice(k,1);
      const R=res[e.i]; if(R.st==='await'){ R.st='hold'; R.stT=S.t; }
      SND.receive(); boy.capT=S.t+0.15;
      const r=L.win[e.i]; burst(r.x+r.s/2,r.y+r.s/2,4,110); wins[e.i].pT=S.t;
    }
  }
}
function stallFolded(c){
  S.disc.fold++; S.rd.fold=1; SND.fold();

  if(c.keeper>=0){ const k=res[c.keeper]; if(k.st==='out'&&!k.seg&&k.node===n) setAct(k,'sit',rr(6,10)); }
  c.keeper=-1;
  residentsAtNode(n).forEach(r=>{ if(r.act!=='sit') setAct(r,benchFree(n)?'sit':'look',rr(6,10)); });
  if(!residentsAtNode(n).some(r=>r.act==='sit')){
    // nobody was there: the nearest resident comes to rest on the bench that stayed
    let best=null,bd=99;
    res.forEach(r=>{ if(r.st!=='out'||r.evac||(r.act==='keep'&&!r.seg)) return; const s0=nodeOf(r), d=hops(bfs(s0),s0,n); if(d<bd){bd=d;best=r;} });

}
function benchFree(n){ return residentsAtNode(n).filter(r=>r.act==='sit').length<2; }

function evacuate(ci){
  const C=CONN[ci], eis=[]; EDGES.forEach((e,i)=>{ if(e.conn===ci) eis.push(i); });

      let sAlong, toA;
      if(C.t==='V'){ sAlong=q; toA=sAlong<0.5; r.seg={e:r.seg.e,dir:toA?-1:1,t:toA?1-q:q}; r.path=[]; }
      else {
        const first=(r.seg.e===eis[0]); sAlong=first?q*0.5:0.5+q*0.5; toA=sAlong<0.5;
        if(first){ r.seg={e:eis[0],dir:toA?-1:1,t:toA?1-q:q}; r.path=toA?[]:[{e:eis[1],dir:1}]; }
        else { r.seg={e:eis[1],dir:toA?-1:1,t:toA?1-q:q}; r.path=toA?[{e:eis[0],dir:-1}]:[]; }

/* ================= connections ================= */
function growDur(c){ return c.t==='H'?0.55:c.t==='V'?0.7:0.8; }
function updConns(dt){
  conns.forEach(c=>{
    const A=wins[c.a], B=wins[c.b];
    const both=settled(A)&&settled(B), ready=c.delay<0||S.t>=c.delay;
    switch(c.st){
      case 'none': if(both&&ready){ c.st='grow'; if(!c.fsrc) c.src=(A.openedAt<=B.openedAt)?0:1; } break;
      case 'grow':
        if(!(A.open&&B.open)){ c.st='fold'; break; }
        c.p=Math.min(1,c.p+dt/growDur(c));
        if(c.p>=1){ c.st='on'; c.onT=S.t; connected(c); }
        break;
      case 'wait':
        if(A.open&&B.open){ c.st='on'; break; }
        if(!onConnEdges(c.ci)&&!(CONN[c.ci].node!==undefined&&residentsAtNode(CONN[c.ci].node).length)) c.st='fold';
        break;
      case 'fold':
        if(both&&ready){ c.st='grow'; break; }
        c.p=Math.max(0,c.p-dt/0.45); if(c.p<=0) c.st='none';
        break;
    }
    c.cp=clamp(c.cp+(c.st==='on'?dt/0.3:-dt/0.25),0,1);
    c.bp=clamp(c.bp+(c.built?dt/0.35:-dt/0.4),0,1);
    if(c.keeper>=0){
      const k=res[c.keeper], n=CONN[c.ci].node;
      const ok=k.st==='out'&&c.st==='on'&&((k.then==='keep'&&k.dest===n)||(k.act==='keep'&&!k.seg&&k.node===n));
      if(!ok) c.keeper=-1;
    }
  });
}
function connected(c){
  SND.conn(c.t);
  const m=connMid(c); burst(m.x,m.y,10,170);
  boy.hopT=S.t;
  if(c.t==='H'){ c.built=true; S.disc.stall++; S.rd.H=1; }
  else if(c.t==='V'){ S.disc.stairs++; S.rd.V=1; }
  else { S.disc.bridge++; S.rd.X=1; }
  if(S.phase==='play'){ reactAll(c); SND.clap(); }
  computeFocus();
}
function nodeOf(r){ if(r.seg){ const e=EDGES[r.seg.e]; return r.seg.dir>0?e.b:e.a; } return r.node; }
function reactAll(c){
  const m=connMid(c);
  const outs=res.filter(r=>r.st==='out'&&!r.evac);
  outs.forEach(r=>{ r.face=m.x>=r.x?1:-1; r.look=S.t; if(r.act==='keep'&&!r.seg){ r.clapT=S.t; return; } r.after=null; setAct(r,'clap',0.9); r.wait=0; });
  const free=r=>!(r.act==='keep'&&!r.seg);
  if(c.t==='H'){
    const n=CONN[c.ci].node;
    let k=null;
    for(const r of [res[c.a],res[c.b]]){ if(r.st!=='out'||r.evac||!free(r)) continue; const prev=bfs(nodeOf(r)); if(prev[n]!==-2){ k=r; break; } }
    if(k){ k.after={dest:n,then:'keep',run:false}; c.keeper=k.i; k.then='keep'; k.dest=n; }
    outs.forEach(r=>{ if(r!==k&&free(r)&&rnd()<0.6){ r.after={dest:n,then:'shop',run:false}; r.wait=rr(0,0.6); } });
  } else if(c.t==='X'){
    // a queue: everyone who can reach an end runs over; the balloon holder goes first
    const q=[], el=e=>L.E[e].len/(EDGES[e].k==='V'?1.25:1), plen=pa=>pa?pa.reduce((s,x)=>s+el(x.e),0):1e9;

    q.sort((p,s)=>(p.r.i===balloon.holder?-1:s.r.i===balloon.holder?1:p.tt-s.tt));
    let arr=-9;
    q.forEach(o=>{ const at=Math.max(o.tt,arr+0.9); arr=at; o.r.after={dest:o.far,then:'wave',run:true}; o.r.wait=0.9+at-o.tt; });

    if(up.st==='out'&&!up.evac&&free(up)) up.after={dest:st?CONN[st.ci].node:c.a,then:st?'shop':'wave',run:false};
    if(lo.st==='out'&&!lo.evac&&free(lo)&&!st) { lo.after={dest:c.b,then:'wave',run:false}; lo.wait=0.5; }

/* ================= residents ================= */
function setAct(r,a,d){ r.act=a; r.actT=0; r.actD=d; }
function goTo(r,dest,then,run){
  const from=r.node, prev=bfs(from), p=pathFrom(prev,from,dest);
  if(!p){ if(then==='keep'){ const c=connOfNode(dest); if(c&&c.keeper===r.i) c.keeper=-1; } r.then=null; r.dest=-1; setAct(r,'look',rr(0.8,1.5)); return false; }
  r.path=p; r.then=then; r.dest=dest; r.run=!!run;
  if(then==='keep'){ const c=connOfNode(dest); if(c) c.keeper=r.i; }
  if(!p.length){ arrive(r); return true; }
  r.act='walk'; r.actD=0; startNext(r); return true;
}
function startNext(r){
  if(!r.path.length){ arrive(r); return; }
  const nx=r.path[0];
  if(!walkable(nx.e)&&!r.evac){
    const d=r.dest, th=r.then; r.path=[];
    if(d>=0&&d!==r.node&&S.phase!=='closing'){ goTo(r,d,th,r.run); } else { r.then=null; setAct(r,'look',rr(0.6,1.2)); }
    return;

function arrive(r){ r.evac=false; const th=r.then; r.then=null; r.dest=-1; r.run=false; doThen(r,th); }
function doThen(r,th){
  const n=r.node, c=connOfNode(n);

  if((th==='keep'||th==='shop')&&c&&c.t==='H'){
    if(c.st==='on'){ setAct(r,'shop',rr(3,5)); return; }
    if(c.built&&benchFree(n)){ setAct(r,'sit',rr(4,7)); return; }
  }
  if(th==='sit'&&c&&c.built&&c.st!=='on'&&benchFree(n)){ setAct(r,'sit',rr(4,7)); return; }
  if(th==='enter'){ r.st='enter'; r.stT=S.t; return; }
  if(th==='march'){ setAct(r,'wave',rr(0.5,1)); return; }
  if(th==='wave'){ setAct(r,'wave',1.6); return; }
  setAct(r,'look',rr(1,2));

function endAct(r){
  if(r.act==='keep'){ const c=connOfNode(r.node); if(c&&c.keeper===r.i) c.keeper=-1; }
  r.act='idle'; r.think=Math.min(r.think,rr(0.3,1.5));
}
function think(r){
  r.think=rr(2.5,5);

    const o=pickW(opts); if(o) goTo(r,o.dest,o.then,false); else setAct(r,'wave',1.2);
    return;
  }
  conns.forEach(c=>{

/* ================= focus (one clear invitation) ================= */
function computeFocus(){
  if(S.phase!=='play'){ S.focus=-1; return; }
  const und=wins.filter(w=>!w.delivered);
  if(und.length===NW){ S.focus=S.firstWin; return; }
  const ref=S.lastWin>=0?L.win[S.lastWin]:null;
  const best=list=>{ let b=-1,bd=1e9; list.forEach(w=>{ const r=L.win[w.i]; const d=ref?Math.hypot(r.x-ref.x,r.y-ref.y):w.i; if(d<bd){bd=d;b=w.i;} }); return b; };
  const hasN=(w,t)=>neighbors(w.i).some(o=>o.c.t===t&&wins[o.w].open);
  let c;
  if(!S.rd.H&&(c=und.filter(w=>hasN(w,'H'))).length){ S.focus=best(c); return; }
  if(!S.rd.V&&(c=und.filter(w=>hasN(w,'V'))).length){ S.focus=best(c); return; }
  if(!S.rd.X&&(c=und.filter(w=>hasN(w,'X'))).length){ S.focus=best(c); return; }
  if(!S.rd.fold&&S.rd.V&&S.rd.X){ const st=conns.find(h=>h.t==='H'&&h.st==='on'); if(st){ S.focus=wins[st.a].openedAt>wins[st.b].openedAt?st.a:st.b; return; } }
  if((c=und.filter(w=>neighbors(w.i).some(o=>wins[o.w].open))).length){ S.focus=best(c); return; }
  if(und.length){ S.focus=best(und); return; }
  S.focus=-1;
}

/* ================= balloon (rare surprise) ================= */

  const r=L.win[w.i];
  balloon.st='rise'; balloon.t=0; balloon.win=w.i; balloon.holder=-1;
  balloon.x=r.x+r.s/2; balloon.y=r.y+r.s/2; balloon.col=[RED,BLUE,YEL][(rnd()*3)|0];

function updBalloon(dt){

/* ================= finale: all windows open -> parade -> home -> next round ================= */

  SND.fanfare();
  wins.forEach(w=>{ if(!w.open) openWin(w,false); w.pT=S.t; const r=L.win[w.i]; burst(r.x+r.s/2,r.y+r.s/2,2,140); });
  const dist=new Array(NW).fill(99); dist[last]=0; const q=[last];
  while(q.length){ const i=q.shift(); neighbors(i).forEach(o=>{ if(dist[o.w]>dist[i]+1){ dist[o.w]=dist[i]+1; q.push(o.w);} }); }

}

/* ================= update ================= */

  const k=snapAll?1:Math.min(1,dt*16);

    if(r.seg){ r.x=r.tx; r.y=r.ty; } else { r.x+=(r.tx-r.x)*k; r.y+=(r.ty-r.y)*k; } });
  snapAll=false;

  let tilt=0; const tl=S.t-boy.tiltT; if(tl>=0&&tl<1.1) tilt=Math.sin(tl/1.1*Math.PI)*0.3*f;
  tilt+=wobK(boy.wig,20,5)*0.15;
  cx.save(); cx.translate(x,bt-1*u); cx.rotate(tilt); cx.translate(-x,-(bt-1*u));
  const hy0=bt-14*u;
  circ(x,hy0,13*u,WHITE,lw);
  let capR=0,capY=0; if(capping){ const k=Math.sin(ct/0.7*Math.PI); capR=-0.28*f*k; capY=-3.5*u*k; }
  cx.save(); cx.translate(x,hy0-8*u+capY); cx.rotate(capR);
  cx.beginPath(); cx.arc(0,1*u,12.6*u,Math.PI,0); cx.closePath(); cx.fillStyle=BLUE; cx.fill(); cx.lineWidth=lw; cx.strokeStyle=INK; cx.stroke();
  box(f>0?3*u:-20*u,-0.5*u,17*u,4.4*u,BLUE,lw);
  circ(f*2*u,-5*u,3.2*u,YEL,Math.max(1,1.4*u));
  cx.restore(); cx.restore();
  // a new bundle of letters drops into the bag
  if(S.bundle){ const k=clamp((S.t-S.bundle.t)/0.75,0,1); if(k<1){ const yy=lerp(-30*u,by-12*u,ease(k)); for(let i=0;i<3;i++) envIcon(bx+(i-1)*4*u,yy-i*5*u,1.1,0); } }
}
function drawEnvs(){
  envs.forEach(e=>{ const R=L.win[e.i]; const k=clamp(e.t/e.dur,0,1); const tx=R.x+R.s/2, ty=R.y+R.s*0.55;
    const x=lerp(e.x0,tx,k), y=lerp(e.y0,ty,k)-Math.sin(k*Math.PI)*40*L.u; envIcon(x,y,lerp(1.2,0.5,k*k),(1-k)*0.7*boy.face); });
}
function drawParts(){
  parts.forEach(p=>{ cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.col; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    if(p.col===WHITE){ cx.lineWidth=1; cx.strokeStyle=INK; cx.strokeRect(-p.w/2,-p.h/2,p.w,p.h); } cx.restore(); });
}
function drawTaps(){
  const u=L.u;
  S.taps.forEach(t=>{ const k=(S.t-t.t)/0.5, r0=4*u+k*8*u, r1=r0+5*u*(1-k);
    for(let i=0;i<4;i++){ const a=i*TAU/4+0.4; line(t.x+Math.cos(a)*r0,t.y+Math.sin(a)*r0,t.x+Math.cos(a)*r1,t.y+Math.sin(a)*r1,Math.max(1.5,2*u)); } });
}
function drawHint(){
  const h=S.hint; if(!h) return; const R=L.win[h.win], u=L.u;
  const tx=R.x+R.s*0.55, ty=R.y+R.s*0.62, sx=L.boy.x+40*u, sy=L.boy.y-30*u;
  const k=h.t<0.7?easeIO(h.t/0.7):1;
  const press=h.t>0.7&&h.t<1.0?Math.sin((h.t-0.7)/0.3*Math.PI):0;
  let sc=1; if(h.t<0.15) sc=ease(h.t/0.15); if(h.t>1.5) sc=1-ease((h.t-1.5)/0.4);
  const x=lerp(sx,tx,k), y=lerp(sy,ty,k)+press*4*u, lw=Math.max(1.5,2.2*u);
  if(h.t>0.75&&h.t<1.25){ const q=(h.t-0.75)/0.5; cx.beginPath(); cx.arc(tx,ty,6*u+q*16*u,0,TAU); cx.lineWidth=Math.max(1,4*u*(1-q)); cx.strokeStyle=INK; cx.stroke(); }
  if(sc<=0.01) return;
  cx.save(); cx.translate(x,y); const s2=sc*(1-press*0.1); cx.scale(s2,s2);
  cx.beginPath(); cx.moveTo(-4*u,4*u); cx.arc(0,4*u,4*u,Math.PI,0); cx.lineTo(4*u,18*u); cx.lineTo(-4*u,18*u); cx.closePath();
  cx.fillStyle=WHITE; cx.fill(); cx.lineWidth=lw; cx.strokeStyle=INK; cx.stroke();
  circ(3*u,25*u,10*u,WHITE,lw);
  circ(-7*u,21*u,3.6*u,WHITE,lw);
  box(-3*u,13*u,6.5*u,7*u,WHITE);
  cx.restore();
}
function draw(){
  cx.setTransform(1,0,0,1,0,0);
  cx.drawImage(bg,0,0);
  cx.setTransform(DPR,0,0,DPR,0,0);
  drawSun(); drawRoofs();
  conns.forEach(c=>{ if(c.t==='V') drawStairs(c); });
  wins.forEach(drawWindow);
  conns.forEach(c=>{ if(c.t==='H') drawStallBack(c); else if(c.t==='X') drawBridge(c); });
  const list=res.filter(r=>r.st==='out'||r.st==='emerge'||r.st==='enter');
  list.sort((a,b)=>(a.y||0)-(b.y||0));
  list.forEach(drawResident);
  conns.forEach(c=>{ if(c.t==='H') drawCounter(c); });
  drawBalloon(); drawBoy(); drawEnvs(); drawParts(); drawTaps(); drawHint();
}

/* ================= input (Pointer Events, one finger is enough) ================= */
function hitWindow(x,y){
  let best=-1,bd=1e9;
  L.win.forEach((r,i)=>{ if(x>=r.hx&&x<=r.hx+r.hw&&y>=r.hy&&y<=r.hy+r.hh){ const d=Math.hypot(x-(r.x+r.s/2),y-(r.y+r.s/2)); if(d<bd){bd=d;best=i;} } });
  return best;
}
function tapOther(x,y){
  const u=L.u;
  for(const r of res){ if(r.st==='out'&&Math.hypot(r.x-x,r.y-20*u-y)<16*u){ r.hop=S.t; if(r.actD<=0||r.act==='look'||r.act==='wave'){ r.face=x>=r.x?1:-1; if(!r.seg) setAct(r,'wave',1); } SND.boing(); return; } }
  if(Math.abs(x-L.boy.x)<30*u&&y>L.boy.y-100*u&&y<L.boy.y+6*u){ boy.wig=S.t; boy.capT=S.t; SND.boing(); return; }
  if(Math.hypot(x-L.sun.x,y-L.sun.y)<L.sun.r+8*u){ sunWob=S.t; SND.soft(); return; }
  for(let c=0;c<4;c++){ const B=L.bld[c]; const rh=Math.min(L.fh*0.55,B.w*0.62);
    if(x>=B.x-6*u&&x<=B.x+B.w+6*u&&y>=B.top-rh&&y<=L.groundY){ bldWob[c]=S.t; S.taps.push({x,y,t:S.t}); SND.soft(); return; } }
  S.taps.push({x,y,t:S.t}); SND.soft();
}
const ptrs=new Set();
function onDown(e){
  if(e.cancelable) e.preventDefault();
  audioStart();
  if(ptrs.has(e.pointerId)) return;
  ptrs.add(e.pointerId); if(ptrs.size>10) ptrs.clear();
  S.idle=0; S.hint=null; S.hintDone=false;
  if(needLayout) layout();
  const x=e.clientX, y=e.clientY, i=hitWindow(x,y);
  if(i>=0) tapWindow(i); else tapOther(x,y);
}
function onUp(e){ ptrs.delete(e.pointerId); if(e.type==='pointerup') audioStart(); }
cv.addEventListener('pointerdown',onDown,{passive:false});
window.addEventListener('pointerup',onUp,{passive:true});
window.addEventListener('pointercancel',onUp,{passive:true});
window.addEventListener('lostpointercapture',onUp,{passive:true});
document.addEventListener('touchstart',e=>{ if(e.cancelable) e.preventDefault(); },{passive:false});
document.addEventListener('touchmove',e=>{ if(e.cancelable) e.preventDefault(); },{passive:false});
document.addEventListener('touchend',e=>{ if(e.cancelable) e.preventDefault(); audioStart(); },{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());

/* ================= main loop / visibility ================= */
let last=performance.now(), raf=0;
function frame(ts){
  raf=0;
  if(document.hidden) return;
  if(needLayout) layout();
  let dt=(ts-last)/1000; last=ts; if(!(dt>0)) dt=0; if(dt>0.05) dt=0.05;
  update(dt); draw(); S.frames++;
  raf=requestAnimationFrame(frame);
}
function pause(){ if(raf){ cancelAnimationFrame(raf); raf=0; } ptrs.clear(); if(AU.ctx&&AU.ctx.state==='running'){ try{ const p=AU.ctx.suspend(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} } }
function resume(){ last=performance.now(); MUSIC.next=0; if(AU.ctx&&AU.started){ try{ const p=AU.ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} } if(!raf) raf=requestAnimationFrame(frame); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pause(); else resume(); });
window.addEventListener('pagehide',pause);
window.addEventListener('pageshow',()=>{ if(!document.hidden) resume(); });
window.addEventListener('resize',()=>{ needLayout=true; });
window.addEventListener('orientationchange',()=>{ needLayout=true; setTimeout(()=>{ needLayout=true; },300); });

/* ================= boot ================= */
loadSave();
S.flags=Math.min(4,STORE.data.rounds);
S.firstWin=nextFirst();
layout();
res.forEach(r=>{ const P=L.node[r.home]; r.x=r.tx=P.x; r.y=r.ty=P.y; });
computeFocus();
// read-only hooks for automated checks (no UI)
window.__mado={S,wins,res,conns,balloon,STORE,L,
  center:i=>({x:L.win[i].x+L.win[i].s/2,y:L.win[i].y+L.win[i].s/2}),
  hit:i=>({x:L.win[i].hx,y:L.win[i].hy,w:L.win[i].hw,h:L.win[i].hh}),
  disp:i=>wdisp(wins[i]),
  forceBalloon:()=>{ S.forceBalloon=true; },
  audio:()=>AU.ctx?AU.ctx.state:'none', parts:()=>parts.length, PMAX};
raf=requestAnimationFrame(frame);
})();
</script>
