<script>
(()=>{
'use strict';
/* =====================================================================
   ぱくっ、ふわり！ねんどのお菓子屋と風船のお茶会  (game 261104-48)
   format shop_pretend / style clay / subject no_animal_princess
   棚のお菓子をタップ → 注文した人が食べて風船を残す → 渡す順番で
   招待・出口ダッシュ・並び食べ・皿交換・帽子事件・屋根浮上・ベンチ・半分こ
   → 売り切れで棚が花畑になりお茶会とダンス → 関係を覚えたまま次の開店へ
   ===================================================================== */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const eo=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t);};
const eio=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-2*(1-t)*(1-t);};
const eob=t=>{t=clamp(t,0,1)-1;const c=1.7;return 1+(c+1)*t*t*t+c*t*t;};
const rr=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[(Math.random()*a.length)|0];
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function hx(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
function shade(h,k){let [r,g,b]=hx(h);if(k>0){r+=(255-r)*k;g+=(255-g)*k;b+=(255-b)*k;}else{r*=1+k;g*=1+k;b*=1+k;}return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';}
function mixc(a,b,t){const A=hx(a),B=hx(b);return 'rgb('+(lerp(A[0],B[0],t)|0)+','+(lerp(A[1],B[1],t)|0)+','+(lerp(A[2],B[2],t)|0)+')';}

/* 粘土の色（焦げ茶の台 + 赤・黄・白・緑・青） */
const COL={
  board:'#3a2214',boardD:'#27150b',
  red:'#c4352a',redD:'#93241b',
  yel:'#e2b12c',yelD:'#b8861a',
  wht:'#ede5cf',whtD:'#c9bea3',
  grn:'#3d9446',grnD:'#2a6c33',
  blu:'#2e69b0',bluD:'#1f4a82',sky:'#3a76bd',
  skin:'#d99c6c',skinD:'#b47a4e',
  hair:'#4a2a18',cara:'#7a3e17',wood:'#7a4724',woodL:'#a8692f',
  dough:'#c98a2e',sponge:'#ead08e',ink:'#24130a'
};

/* ---------------- 音（Web Audio 合成） ---------------- */
let AC=null,MG=null,NB=null;
function audioStart(){
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
      AC=new A();
      MG=AC.createGain(); MG.gain.value=.6;
      const cp=AC.createDynamicsCompressor(); cp.threshold.value=-14; cp.ratio.value=4;
      MG.connect(cp); cp.connect(AC.destination);
      const n=Math.floor(AC.sampleRate*.6); NB=AC.createBuffer(1,n,AC.sampleRate);
      const d=NB.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended'){const p=AC.resume(); if(p&&p.catch) p.catch(()=>{});}
  }catch(e){AC=null;}
}
function tone(f,dur,o){
  if(!AC) return; o=o||{};
  try{
    const t0=AC.currentTime+(o.at||0)+.005;
    const os=AC.createOscillator(),g=AC.createGain();
    os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t0);
    if(o.f2) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+dur);
    const v=Math.max(.0002,o.vol==null?.15:o.vol),a=o.att||.006;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    if(o.vib){const l=AC.createOscillator(),lg=AC.createGain(); l.frequency.value=o.vibR||8; lg.gain.value=o.vib; l.connect(lg); lg.connect(os.frequency); l.start(t0); l.stop(t0+dur+.05);}
    os.connect(g); g.connect(MG); os.start(t0); os.stop(t0+dur+.05);
  }catch(e){}
}
function noise(dur,o){
  if(!AC||!NB) return; o=o||{};
  try{
    const t0=AC.currentTime+(o.at||0)+.005;
    const s=AC.createBufferSource(); s.buffer=NB; s.loop=true;
    const fl=AC.createBiquadFilter(); fl.type=o.ft||'bandpass'; fl.frequency.setValueAtTime(o.f||1000,t0); fl.Q.value=o.q||1;
    if(o.f2) fl.frequency.exponentialRampToValueAtTime(o.f2,t0+dur);
    const g=AC.createGain(),v=o.vol==null?.1:o.vol,a=o.att||.004;
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(v,t0+a); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    s.connect(fl); fl.connect(g); g.connect(MG); s.start(t0,Math.random()*.3); s.stop(t0+dur+.05);
  }catch(e){}
}
const ST=n=>Math.pow(2,n/12);
const SFX={
  press(it){const f={cake:392,donut:466,pudding:523}[it]||440; tone(f,.14,{vol:.2,f2:f*.72}); noise(.07,{ft:'lowpass',f:600,vol:.07});},
  fly(){noise(.32,{f:700,f2:2300,q:1.3,vol:.05}); tone(520,.26,{type:'triangle',f2:980,vol:.04});},
  land(){tone(1320,.09,{type:'triangle',vol:.1}); tone(1980,.07,{vol:.05,at:.02});},
  success(n){const b=523.25*ST((n%7)*2);[0,4,7,12].forEach((s,i)=>{tone(b*ST(s),.38,{vol:.12,at:i*.07}); tone(b*ST(s)*2,.22,{type:'triangle',vol:.035,at:i*.07});});},
  munch(it){
    if(it==='cake'){noise(.1,{ft:'lowpass',f:700,vol:.15}); noise(.1,{ft:'lowpass',f:560,vol:.11,at:.13});}
    else if(it==='donut'){noise(.05,{f:2600,q:2,vol:.12}); noise(.05,{f:3100,q:2,vol:.1,at:.08}); noise(.05,{f:2300,q:2,vol:.08,at:.16});}
    else {tone(330,.24,{vol:.13,vib:34,vibR:15,f2:250});}
  },
  balloon(){tone(260,.5,{vol:.1,f2:900}); tone(1500,.05,{type:'square',vol:.025,at:.5});},
  thud(){tone(150,.12,{vol:.16,f2:88}); noise(.05,{ft:'lowpass',f:380,vol:.07});},
  nope(){tone(300,.2,{vol:.08,vib:22,vibR:9,f2:260});},
  giggle(){tone(700,.07,{vol:.06}); tone(900,.07,{vol:.06,at:.09});},
  wind(){noise(1.2,{f:380,f2:1700,q:.7,vol:.12,att:.35});},
  clap(n){for(let i=0;i<n;i++) noise(.045,{ft:'highpass',f:1400,vol:.11,at:i*.17+Math.random()*.03});},
  chime(){[0,7,12,16].forEach((s,i)=>tone(784*ST(s),.55,{vol:.09,at:i*.09}));},
  roof(){tone(110,1.5,{type:'triangle',vol:.06,f2:260}); [0,4,7,11,14,19].forEach((s,i)=>tone(392*ST(s),.4,{vol:.07,at:.5+i*.13}));},
  bloom(i){const sc=[0,2,4,7,9,12,14,16,19,21];tone(392*ST(sc[i%10]),.32,{type:'triangle',vol:.07});},
  pour(){noise(.9,{f:900,f2:1400,q:3,vol:.06});},
  invite(){tone(988,.12,{vol:.09,f2:1318}); tone(1318,.16,{vol:.09,at:.15,f2:988});},
  swap(){tone(880,.08,{type:'triangle',vol:.09}); tone(1175,.08,{type:'triangle',vol:.09,at:.11});},
  tear(){noise(.2,{f:1300,f2:480,q:1.5,vol:.11});},
  hop(){tone(600,.09,{f2:840,vol:.05});},
  pop(){tone(900,.06,{type:'triangle',vol:.05,f2:1300});},
  sip(){tone(520,.18,{vol:.05,f2:380,vib:10,vibR:20});},
  music(dur){
    const mel=[0,4,7,9,7,4,2,4,0,2,4,7,12,9,7,4];const step=.28;
    for(let i=0;i*step<dur;i++){const s=mel[i%mel.length];
      tone(523.25*ST(s),.24,{type:'triangle',vol:.06,at:i*step});
      if(i%2===0) tone(130.8*ST([0,0,5,7][(i>>2)%4]),.3,{vol:.06,at:i*step});}
  }
};

/* ---------------- レイアウト ---------------- */
let W=1,H=1,DPR=1,L={u:1};
const SA={t:0,r:0,b:0,l:0};
function readSA(){try{const s=getComputedStyle(document.getElementById('sa'));SA.t=parseFloat(s.paddingTop)||0;SA.r=parseFloat(s.paddingRight)||0;SA.b=parseFloat(s.paddingBottom)||0;SA.l=parseFloat(s.paddingLeft)||0;}catch(e){}}
function computeLayout(){
  W=Math.max(1,window.innerWidth|0); H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px';
  readSA();
  const por=W<H*1.05;
  const u=por?Math.min(W/400,H/760):Math.min(H/540,W/880);
  L={por,u,cs:por?clamp((H/W)/1.6,1,1.3):1.22,is:por?1.14:1.25};
  if(por){
    L.roofTop=Math.max(SA.t*.6,H*.03); L.eave=H*.165; L.split=H*.29;
    L.head={x:W*.5,y:H*.24}; L.caseTop=H*.318; L.shelfY=H*.405; L.counterB=H*.475;
    L.slots=[W*.2,W*.5,W*.8]; L.slotW=Math.min(W*.28,130*u);
    L.floorY=H*.865-Math.min(SA.b,34)*.5; L.floorTop=L.counterB;
    L.fx0=SA.l+30*u; L.fx1=W-SA.r-30*u;
    L.bench={x:W*.11+SA.l*.5,gap:Math.max(W*.115,44*u),y:L.split-3*u,s:.7};
    L.steps={x:W*.05+SA.l*.5,y0:L.split,y1:H*.56};
    L.tea={x:W*.5,y:H*.435,seats:[[W*.13,H*.52],[W*.31,H*.52],[W*.69,H*.52]],s:.8};
    L.dance={x:W*.5,y:H*.785,r:30*u*L.cs};
    L.lift={x:W*.73,y:Math.max(SA.t+H*.05,H*.07),s:.4};
    L.door=Math.min(W*.13,62*u);
  }else{
    L.roofTop=Math.max(SA.t*.6,H*.03); L.eave=H*.16; L.split=H*.30;
    L.head={x:W*.5,y:H*.235}; L.caseTop=H*.322; L.shelfY=H*.42; L.counterB=H*.51;
    L.slots=[W*.33,W*.5,W*.67]; L.slotW=Math.min(W*.15,140*u);
    L.floorY=H*.88-Math.min(SA.b,30)*.5; L.floorTop=L.counterB;
    L.fx0=SA.l+W*.03+22*u; L.fx1=W-SA.r-W*.03-22*u;
    L.bench={x:W*.085+SA.l,gap:Math.max(W*.065,54*u),y:L.split-3*u,s:.76};
    L.steps={x:W*.04+SA.l,y0:L.split,y1:H*.585};
    L.tea={x:W*.5,y:H*.455,seats:[[W*.22,H*.56],[W*.36,H*.56],[W*.64,H*.56]],s:.85};
    L.dance={x:W*.5,y:H*.8,r:30*u*L.cs};
    L.lift={x:W*.8,y:Math.max(SA.t+H*.06,H*.08),s:.36};
    L.door=Math.min(W*.08,70*u);
  }
}

/* ---------------- スプライト基盤 ---------------- */
let SP={};
function mkS(w,h,pad,ax,ay,fn){
  const c=document.createElement('canvas');
  const tw=w+pad*2,th=h+pad*2;
  c.width=Math.max(1,Math.ceil(tw*DPR)); c.height=Math.max(1,Math.ceil(th*DPR));
  const g=c.getContext('2d'); g.scale(DPR,DPR); g.translate(pad,pad);
  try{fn(g,w,h);}catch(e){ERR.push(String(e&&e.stack||e));}
  return {c,w:tw,h:th,ax:(pad+ax*w)/tw,ay:(pad+ay*h)/th};
}
function ds(s,x,y,sx,sy,rot,a){
  if(!s) return; if(sx==null) sx=1; if(sy==null) sy=sx;
  if(a!=null){if(a<=.004) return; ctx.globalAlpha=Math.min(1,a);}
  if(rot){const c=Math.cos(rot),n=Math.sin(rot);ctx.setTransform(DPR*c*sx,DPR*n*sx,-DPR*n*sy,DPR*c*sy,DPR*x,DPR*y);}
  else ctx.setTransform(DPR*sx,0,0,DPR*sy,DPR*x,DPR*y);
  ctx.drawImage(s.c,-s.w*s.ax,-s.h*s.ay,s.w,s.h);
  ctx.setTransform(DPR,0,0,DPR,0,0); if(a!=null) ctx.globalAlpha=1;
}

/* ---------------- 粘土の描画ヘルパー ---------------- */
function ellP(cx,cy,rx,ry,n){const a=[];n=n||28;for(let i=0;i<n;i++){const t=i/n*TAU,c=Math.cos(t),s=Math.sin(t);a.push([cx+c*rx,cy+s*ry,c,s]);}return a;}
function rrP(x,y,w,h,r,k){
  r=Math.min(r,w/2,h/2); k=k||5; const a=[];
  const C=[[x+w-r,y+r,-Math.PI/2],[x+w-r,y+h-r,0],[x+r,y+h-r,Math.PI/2],[x+r,y+r,Math.PI]];
  for(let ci=0;ci<4;ci++){
    const cx=C[ci][0],cy=C[ci][1],a0=C[ci][2];
    for(let j=0;j<=k;j++){const t=a0+j/k*Math.PI/2,c=Math.cos(t),s=Math.sin(t);a.push([cx+c*r,cy+s*r,c,s]);}
    const N=C[(ci+1)%4],en=a0+Math.PI/2,ex=Math.cos(en),ey=Math.sin(en);
    const sx=cx+ex*r,sy=cy+ey*r,tx=N[0]+Math.cos(N[2])*r,ty=N[1]+Math.sin(N[2])*r;
    const m=Math.max(1,Math.round(Math.hypot(tx-sx,ty-sy)/(Math.max(w,h)/7)));
    for(let j=1;j<m;j++) a.push([lerp(sx,tx,j/m),lerp(sy,ty,j/m),ex,ey]);
  }
  return a;
}
function polyP(pts,per){
  per=per||4; const a=[],n=pts.length;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n],dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1,nx=dy/l,ny=-dx/l;
    for(let j=0;j<per;j++) a.push([lerp(p[0],q[0],j/per),lerp(p[1],q[1],j/per),nx,ny]);}
  return a;
}
function wob(p,seed,amp){
  const R=rng(seed*9973+13),f1=R()*TAU,f2=R()*TAU,f3=R()*TAU,n=p.length;
  return p.map((q,i)=>{const k=i/n*TAU;const d=amp*(Math.sin(k*2+f1)*.45+Math.sin(k*5+f2)*.3+Math.sin(k*9+f3)*.15+(R()-.5)*.35);return [q[0]+q[2]*d,q[1]+q[3]*d,q[2],q[3]];});
}
function pathP(g,p){
  const n=p.length; g.beginPath();
  const a=p[n-1],b=p[0]; g.moveTo((a[0]+b[0])/2,(a[1]+b[1])/2);
  for(let i=0;i<n;i++){const c=p[i],d=p[(i+1)%n]; g.quadraticCurveTo(c[0],c[1],(c[0]+d[0])/2,(c[1]+d[1])/2);}
  g.closePath();
}
function fprint(g,x,y,r,al,R){
  R=R||Math.random; g.lineWidth=Math.max(.6,r*.07);
  for(let j=1;j<6;j++){const q=r*j/5,a0=R()*TAU;
    g.beginPath(); g.ellipse(x,y,q*1.25,q*.8,.4,a0,a0+TAU*(.45+R()*.4)); g.strokeStyle='rgba(25,8,0,'+al+')'; g.stroke();
    g.beginPath(); g.ellipse(x+.8,y+.9,q*1.25,q*.8,.4,a0,a0+TAU*.3); g.strokeStyle='rgba(255,245,225,'+(al*.6)+')'; g.stroke();}
}
function clay(g,p,col,o){
  o=o||{}; let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const q of p){if(q[0]<x0)x0=q[0];if(q[0]>x1)x1=q[0];if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1];}
  const bw=Math.max(1,x1-x0),bh=Math.max(1,y1-y0),R=rng((o.seed||7)*31+5),mn=Math.min(bw,bh);
  if(o.shadow!==false){g.save();g.translate(mn*.04+1,mn*.07+1.5);pathP(g,p);g.fillStyle='rgba(15,5,0,.32)';g.fill();g.restore();}
  pathP(g,p); g.fillStyle=col; g.fill();
  g.save(); pathP(g,p); g.clip();
  const gr=g.createLinearGradient(x0,y0,x0+bw*.45,y1);
  gr.addColorStop(0,'rgba(255,248,230,.30)'); gr.addColorStop(.5,'rgba(255,255,255,0)'); gr.addColorStop(1,'rgba(30,10,0,.32)');
  g.fillStyle=gr; g.fillRect(x0,y0,bw,bh);
  g.lineWidth=Math.max(1.5,mn*.13); g.strokeStyle='rgba(40,15,0,.15)'; pathP(g,p); g.stroke();
  const fpn=o.fp==null?1:o.fp;
  for(let k=0;k<fpn;k++) fprint(g,x0+bw*(.2+R()*.6),y0+bh*(.2+R()*.6),Math.min(mn*.45,mn*(.14+R()*.12)+3),.1,R);
  const sp=o.speck==null?Math.min(60,Math.round(bw*bh/260)):o.speck;
  for(let k=0;k<sp;k++){g.beginPath();g.arc(x0+R()*bw,y0+R()*bh,.5+R()*1.1,0,TAU);g.fillStyle=R()<.5?'rgba(20,5,0,.12)':'rgba(255,250,235,.12)';g.fill();}
  if(o.in) o.in(g,x0,y0,bw,bh);
  g.restore();
  if(o.sheen!==false){const sw=Math.min(bw*.15,22),sh=Math.min(bh*.08,9);g.beginPath();g.ellipse(x0+Math.min(bw*.3,sw*2.2),y0+Math.min(bh*.24,sh*3),sw,sh,-.5,0,TAU);g.fillStyle='rgba(255,250,235,.2)';g.fill();}
}
function blob(g,cx,cy,rx,ry,col,seed,o){o=o||{};clay(g,wob(ellP(cx,cy,rx,ry,o.n||28),seed,o.amp!=null?o.amp:Math.min(rx,ry)*.08),col,Object.assign({seed},o));}
function slab(g,x,y,w,h,r,col,seed,o){o=o||{};clay(g,wob(rrP(x,y,w,h,r,5),seed,o.amp!=null?o.amp:Math.min(w,h)*.04+.6),col,Object.assign({seed},o));}
function poly(g,pts,col,seed,o){o=o||{};clay(g,wob(polyP(pts,o.per||5),seed,o.amp!=null?o.amp:1.2),col,Object.assign({seed},o));}
function groove(g,pts,lw,al){
  g.lineCap='round'; g.lineJoin='round';
  const line=()=>{g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);};
  g.lineWidth=lw; g.strokeStyle='rgba(25,8,0,'+(al==null?.3:al)+')'; line(); g.stroke();
  g.save(); g.translate(lw*.35,lw*.5); g.lineWidth=lw*.55; g.strokeStyle='rgba(255,245,225,.2)'; line(); g.stroke(); g.restore();
}
function dot(g,x,y,r,col){g.beginPath();g.arc(x,y,r,0,TAU);g.fillStyle=col;g.fill();}

/* ---------------- お菓子のスプライト ---------------- */
function drawCake(g,w,h){
  slab(g,w*.1,h*.4,w*.8,h*.52,w*.09,COL.wht,11,{fp:1});

  if(k.mouth!==k._m){k._m=k.mouth;k.mouthT=0;}else if(k.mouth!=='smile'){k.mouthT+=dt;if(k.mouthT>1.8)k.mouth='smile';}
  const lk=clerkLook(),dx=lk.x-L.head.x,dy=lk.y-L.head.y,dd=Math.hypot(dx,dy)||1,gm=Math.min(1,dd/(40*L.u));
  k.gx+=(dx/dd*2.2*gm-k.gx)*Math.min(1,dt*9);k.gy+=(dy/dd*1.7*gm-k.gy)*Math.min(1,dt*9);

function update(dt){
  T+=dt;FRAME++;
  for(let i=0;i<procs.length;i++)adv(procs[i]);
  if(procs.some(p=>p.dead))procs=procs.filter(p=>!p.dead);
  for(const c of custs)updCust(c,dt);
  updFlights(dt);updHat(dt);updBalloons(dt);
  if(phase==='shop'){
    for(const c of custs){
      if(!c.order&&!c.busy&&!c.keep&&c.orderAt>0&&T>=c.orderAt&&showOrders()){const it=chooseOrder(c);if(it){c.order=it;c.orderT=T;c.orderAt=0;SFX.pop();log('order',{who:c.id,item:it});}else c.orderAt=T+1;}
      if(c.keep&&!c.busy){if(hatActive)c.keepUntil=Math.max(c.keepUntil,T+3);else if(T>c.keepUntil)run(finishPiece(c));}
    }
    if(!custs.some(o=>o.order)&&!flights.length)for(const c of custs)if(c.keep)c.keepUntil=Math.min(c.keepUntil,T+2.5);
    if(stockTotal()===0&&!endPending){endPending=true;log('lastSale');}
    if(endPending){for(const c of custs)if(c.keep)c.keepUntil=Math.min(c.keepUntil,T+.8);
      if(flights.length===0&&custs.every(c=>!c.busy&&!c.keep)&&!hatActive&&!hatPending&&!roofBusy&&!(roofQueued&&!roofUp)&&balloons.every(b=>b.st!=='rise')){endPending=false;run(partyProc());}}
  }
  if(phase==='shop'&&FRAME%20===0)separate();
  computeGuide();
  for(const s of slots){s.press=Math.max(0,s.press-dt*4);s.wig=Math.max(0,s.wig-dt*2.5);for(let k=0;k<4;k++)s.pop[k]=Math.min(1,s.pop[k]+dt*3);}
  shk.shelf=Math.max(0,shk.shelf-dt*2);shk.lid=Math.max(0,shk.lid-dt*2);lidJolt=lerp(lidJolt,0,Math.min(1,dt*6));
  updClerk(dt);
  const u=L.u;
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    if(p.type===0){p.vy+=620*u*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    else if(p.type===1){p.vx*=Math.pow(.05,dt);p.vy*=Math.pow(.05,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;}
    else{p.x+=(p.vx+Math.sin(T*3+p.max*7)*30*u)*dt;p.y+=p.vy*dt;}}
  for(let i=winds.length-1;i>=0;i--){winds[i].t+=dt;if(winds[i].t>winds[i].life)winds.splice(i,1);}
  for(let i=dents.length-1;i>=0;i--){dents[i].t+=dt;if(dents[i].t>.45)dents.splice(i,1);}
  for(const f of FLOWERS)f.b=Math.max(0,f.b-dt*2.5);
  if(!hint.done&&phase==='shop'&&T-lastInput>4&&sold===0&&guide>=0){hint.done=true;hint.t=0;hint.slot=guide;log('hint');}
  if(hint.t>=0){hint.t+=dt;if(hint.t>2.6)hint.t=-1;else if(hint.t>1&&hint.t<1.3)slots[hint.slot].press=Math.max(slots[hint.slot].press,.45);}
}

    ctx.strokeStyle='rgba(245,238,220,'+a+')';ctx.lineWidth=4*u;ctx.lineCap='round';ctx.beginPath();
    for(let i=0;i<=8;i++){const xx=x-w.dir*w.len*i/8,yy=w.y+Math.sin(i*.9+T*8)*w.amp*(i/8);if(i)ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy);}ctx.stroke();}
  for(const p of parts){const a=clamp(p.life/p.max*1.6,0,1);ctx.globalAlpha=a;
    if(p.type===1){ctx.fillStyle=p.col;const r=p.r*(.6+.4*Math.sin(T*20+p.x));ctx.fillRect(p.x-r,p.y-r*.25,r*2,r*.5);ctx.fillRect(p.x-r*.25,p.y-r,r*.5,r*2);}
    else if(p.type===2){ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*.55,T*3+p.max,0,TAU);ctx.fill();}
    else{ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}}
  ctx.globalAlpha=1;
  for(const d of dents){const t=d.t/.45;ds(SP.dent,d.x,d.y,1+t*.7,1+t*.7,0,1-t);}
  if(hint.t>=0&&SP.hand){const p=slotPos(hint.slot,Math.max(0,stock[ITEMS[hint.slot]]-1)),tx=p.x+4*u,ty=p.y-24*u,t=hint.t;
    let x,y,a=1,s=1;
    if(t<.8){const e=eo(t/.8);x=lerp(tx+80*u,tx,e);y=lerp(ty+150*u,ty,e);a=Math.min(1,t*3);}
    else if(t<1.5){x=tx;y=ty+Math.sin(clamp((t-.8)/.5,0,1)*Math.PI)*8*u;s=1-.08*Math.sin(clamp((t-.8)/.5,0,1)*Math.PI);}
    else{const e=eo((t-1.5)/1.1);x=lerp(tx,tx+70*u,e);y=lerp(ty,ty+120*u,e);a=1-e;}
    ds(SP.hand,x,y,s*1.45*L.cs,s*1.45*L.cs,-.25,a);}
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ds(SP.bg,0,0);
  if(lidT>.001){ds(SP.garden,0,0);for(const b of balloons)if(b.tie.kind==='gar'&&b.st==='tied')drawBalloon(b);}
  drawLid();
  drawClerkBody();
  drawShelf();
  drawSlots();
  drawClerkHands();
  drawTeaTable();
  drawStools();
  drawSteps();
  const ord=custs.slice().sort((a,b)=>a.y-b.y);
  for(const c of ord)drawCust(c);
  for(const c of ord)drawBubble(c);
  drawHat();
  drawFlights();
  for(const b of balloons)if(b.st==='rise'||b.st==='away')drawBalloon(b);
  drawFX();
}

/* ---------------- 入力 ---------------- */
function hitSlot(x,y){const u=L.u;for(let i=0;i<3;i++)if(Math.abs(x-L.slots[i])<L.slotW/2&&y>L.shelfY-84*u&&y<L.shelfY+24*u)return i;return -1;}
function hitCust(x,y){let best=null,bd=1e9;for(const c of custs){const g=c.geo;if(!g)continue;if(y<g.hy-30*g.U||y>c.y+5*g.U)continue;const dx=Math.abs(x-c.x);if(dx<30*g.U&&dx<bd){bd=dx;best=c;}}return best;}
function hitClerk(x,y){return Math.hypot(x-L.head.x,y-L.head.y)<36*L.u;}
function wobbleAt(x,y){
  dents.push({x,y,t:0});if(dents.length>8)dents.shift();SFX.thud();
  for(let i=0;i<3;i++)addP(x,y,rr(-50,50)*L.u,rr(-110,-50)*L.u,pick([COL.woodL,COL.wood,COL.yel]),rr(1.5,2.5)*L.u,.5,0);
  if(y>L.caseTop-10*L.u&&y<L.counterB+10*L.u)shk.shelf=.6;else if(y<L.split&&lidT<.5)shk.lid=.7;
}
function trySell(si){
  const it=ITEMS[si],s=slots[si];
  if(phase!=='shop'||stock[it]<=0){s.wig=.7;shk.shelf=.4;SFX.thud();return;}
  const r=showOrders()?receiverFor(it):null;
  if(!r){s.press=.6;s.wig=1;SFX.nope();for(const c of custs)if(c.order)c.bubBob=1;clerk.tilt=1;log('nope',{item:it});return;}
  stock[it]--;sold++;history.push({item:it,to:r.id});if(sold===1)firstEater=r;
  log('sale',{n:sold,item:it,to:r.id,left:stock[it]});
  run(saleProc(r,it,si));
}
function partyTap(x,y){
  const pp=potPos();if(tea.on&&!tea.poured&&Math.hypot(x-pp.x,y-(pp.y-14*L.u))<48*L.u){pourTea(true);return;}
  const c=hitCust(x,y);if(c){c.jump=-6;c.wig=1;SFX.giggle();return;}
  for(const f of FLOWERS)if(morph>.5&&Math.hypot(x-f.x,y-f.y)<20*L.u){f.b=1;SFX.bloom(f.n);return;}
  wobbleAt(x,y);
}
function onTap(x,y){
  audioStart();lastInput=T;tapCount++;hint.done=true;hint.t=-1;
  if(phase==='party'){partyTap(x,y);return;}
  const si=hitSlot(x,y);if(si>=0){trySell(si);return;}
  const c=hitCust(x,y);if(c){c.wig=1;c.jump=-3;SFX.giggle();return;}
  if(hitClerk(x,y)){clerk.wig=1;clerk.happy=.5;SFX.giggle();return;}
  wobbleAt(x,y);
}
cv.addEventListener('pointerdown',e=>{if(e.cancelable)e.preventDefault();try{onTap(e.clientX,e.clientY);}catch(err){ERR.push(String(err&&err.stack||err));}},{passive:false});
['touchstart','touchmove','touchend'].forEach(t=>document.addEventListener(t,e=>{if(e.cancelable)e.preventDefault();},{passive:false}));
['gesturestart','gesturechange','dblclick','contextmenu','selectstart'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();}));

/* ---------------- ループ・初期化 ---------------- */
let rafId=0,lastNow=0,running=false;
function frame(now){
  rafId=0;if(!running)return;
  let dt=(now-lastNow)/1000;lastNow=now;if(!(dt>0))dt=1/60;dt=Math.min(dt,1/20);
  try{update(dt);render();}catch(e){ERR.push(String(e&&e.stack||e));}
  rafId=requestAnimationFrame(frame);
}
function start(){if(running)return;running=true;lastNow=performance.now();rafId=requestAnimationFrame(frame);}
function stop(){running=false;if(rafId)cancelAnimationFrame(rafId);rafId=0;}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();try{if(AC&&AC.state==='running'){const p=AC.suspend();if(p&&p.catch)p.catch(()=>{});}}catch(e){}}
  else{start();try{if(AC&&AC.state!=='running'){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}}catch(e){}}
});
let rzT=0;
function onResize(){clearTimeout(rzT);rzT=setTimeout(()=>{const w=window.innerWidth|0,h=window.innerHeight|0;if(w===W&&h===H&&Math.min(2,window.devicePixelRatio||1)===DPR)return;
  computeLayout();buildAll();for(const c of custs){if(c.seg){c.at=c.seg.b;c.seg=null;}if(c.at.k==='px')c.at=fl(custF(c),c);computeGeo(c,0);}if(HAT)HAT.destX=clamp(HAT.destX,0,W);if(!running)render();},120);}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',onResize);
function init(){
  computeLayout();buildAll();
  const pos={A:.4,B:.68,C:.02};
  for(const c of custs){c.at=fl(pos[c.id],c);const P=res(c.at);c.x=P.x;c.y=P.y;c.s=P.s;c.firstPending=false;c.face=c.id==='C'?-1:1;}
  CU.A.order='cake';CU.A.orderT=-.3;CU.B.order='donut';CU.B.orderT=-.2;CU.C.order='pudding';CU.C.orderT=-.1;
  for(const c of custs){c.bub=1;computeGeo(c,0);}
  computeGuide();
  log('open',{bond:Object.assign({},bond)});
  render();start();
}
window.__shop={
  get s(){return {T:+T.toFixed(2),phase,cycle,sold,stock:Object.assign({},stock),roofUp,lidT:+lidT.toFixed(2),morph:+morph.toFixed(2),hatActive,hatPending,hatDone,
    bond:Object.assign({},bond),cbond:Object.assign({},cbond),guide,balloons:balloons.length,flights:flights.length,parts:parts.length,err:ERR.slice(),buildMs:Math.round(buildMs),
    seats:seatsOcc.map(c=>c?c.id:'-').join(''),teaGlow:tea.glow,audio:AC?AC.state:'none',
    custs:custs.map(c=>({id:c.id,x:Math.round(c.x),y:Math.round(c.y),f:+custF(c).toFixed(3),order:c.order,busy:c.busy,keep:c.keep,seated:c.seated,atExit:c.atExit,invited:c.invited,bub:+c.bub.toFixed(2),mode:c.geo?c.geo.mode:'',plate:c.plate.item,amt:c.plate.amt,hat:c.hatOn,offer:!!(c.order&&isOfferer(c))})),
    press:slots.map(s=>+s.press.toFixed(2)),fly:flights.filter(f=>f.kind==='sale').map(f=>({item:f.item,sx:+f.sx.toFixed(2),sy:+f.sy.toFixed(2),ph:+f.ph.toFixed(2)}))};},
  log:LOG,memory,
  slotXY(i){const p=slotPos(i,0);return {x:p.x,y:p.y-22*L.u};},
  custXY(id){const c=CU[id];return {x:c.x,y:c.geo?c.geo.shY+14*c.geo.U:c.y-60};},
  potXY(){const p=potPos();return {x:p.x,y:p.y-14*L.u};},
  advance(sec){const n=Math.round(sec*60);for(let i=0;i<n;i++)update(1/60);render();},
  tap(x,y){onTap(x,y);}
};
init();
})();
