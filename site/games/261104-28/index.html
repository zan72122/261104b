<script>
(()=>{
'use strict';
// ================= basics =================
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-(1-t)*(1-t);
const eio=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const eob=t=>{const c=1.70158;t=t-1;return 1+(c+1)*t*t*t+c*t*t;};
const rnd=(a,b)=>a+Math.random()*(b-a);
const hyp=(x,y)=>Math.sqrt(x*x+y*y);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry(1);
const pick=a=>a[Math.floor(R()*a.length)%a.length];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const C={paper:'#fbf1d6',paper2:'#f1e1b8',ink:'#1b1511',red:'#e8452f',redD:'#b3301f',yel:'#f6b62a',yelD:'#c98712',
  teal:'#1fa595',tealD:'#137569',pink:'#f59bb6',pinkD:'#d0698c',skin:'#ffd9bb',skinD:'#eaae88',wh:'#ffffff',
  wood:'#d99550',woodD:'#a86930',sky:'#d7f0ec',skyD:'#b5e0d9',grey:'#a9b1b0',greyD:'#7d8584',brown:'#8a5a33',
  kraft:'#d9b27a',kraftD:'#b08548',leaf:'#4caf50',leafD:'#2e7d32',navy:'#3a4f8f'};
const LW=8;

// ================= audio (Web Audio synth only) =================
let AC=null,MG=null,NB=null;
function audioStart(){
  try{
    if(!AC){
      const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
      AC=new A();
      const comp=AC.createDynamicsCompressor();
      comp.threshold.value=-14;comp.knee.value=10;comp.ratio.value=4;
      MG=AC.createGain();MG.gain.value=0.7;MG.connect(comp);comp.connect(AC.destination);
      const n=Math.floor(AC.sampleRate*0.8);NB=AC.createBuffer(1,n,AC.sampleRate);
      const d=NB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
      const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(MG);s.start(0);
    }
    if(AC.state!=='running'&&AC.resume){const p=AC.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){AC=null;}
}
function aok(){return AC&&AC.state==='running';}
function tone(f,d,o){
  if(!aok())return; o=o||{};
  const t0=AC.currentTime+(o.at||0), g=AC.createGain(), os=AC.createOscillator();
  os.type=o.type||'sine'; os.frequency.setValueAtTime(f,t0);
  if(o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t0+d*(o.slide||1));
  if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=f*(o.vd||0.03);l.connect(lg);lg.connect(os.frequency);l.start(t0);l.stop(t0+d+.05);}
  const v=(o.v||0.3), a=o.a||0.008;
  g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  let node=os;
  if(o.lp){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;fl.Q.value=o.q||0.7;os.connect(fl);node=fl;}
  node.connect(g); g.connect(MG); os.start(t0); os.stop(t0+d+.05);
}
function noise(d,o){
  if(!aok())return; o=o||{};
  const t0=AC.currentTime+(o.at||0), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain();
  s.buffer=NB; s.loop=true; f.type=o.ft||'bandpass'; f.frequency.setValueAtTime(o.f||1200,t0); f.Q.value=o.q||1;
  if(o.to) f.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  const v=o.v||0.2; g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(v,t0+(o.a||0.01));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+d);
  s.connect(f); f.connect(g); g.connect(MG); s.start(t0,Math.random()*0.3); s.stop(t0+d+.05);
}
const PENT=[0,2,4,7,9,12,14,16,19,21,24];
const nt=(b,i)=>b*Math.pow(2,PENT[clamp(i|0,0,PENT.length-1)]/12);
const SFX={
  tick(p){tone(520*(p||1),0.09,{type:'triangle',v:0.08,to:420*(p||1)});},
  open(p){p=p||1;noise(0.12,{f:2400*p,q:2,v:0.25});tone(330*p,0.16,{type:'square',v:0.12,to:880*p,lp:2400});tone(990*p,0.12,{at:0.05,v:0.12});},
  roll(p){p=p||1;for(let i=0;i<7;i++){tone(nt(700*p,(i*2)%9),0.05,{at:0.06*i,type:'triangle',v:0.13});}},
  rumble(){noise(0.9,{f:160,q:0.8,v:0.45,ft:'lowpass'});for(let i=0;i<5;i++)tone(70+i*3,0.12,{at:i*0.16,type:'square',v:0.12,lp:300});},
  thud(){tone(110,0.25,{type:'sine',v:0.45,to:50});noise(0.15,{f:200,ft:'lowpass',v:0.3});},
  boing(p){p=p||1;tone(180*p,0.45,{type:'sine',v:0.35,to:620*p,slide:0.5,vib:18,vd:0.12});},
  puff(){noise(0.7,{f:600,to:1800,q:0.6,v:0.2,a:0.15});tone(660,0.5,{v:0.07,a:0.15,vib:5});},
  jingle(p){p=p||1;for(let i=0;i<4;i++){tone(2093*p*(1+i*0.003),0.5,{at:i*0.09,v:0.09});tone(3136*p,0.3,{at:i*0.09+0.02,v:0.05});}},
  flutter(){for(let i=0;i<6;i++)noise(0.07,{at:i*0.07,f:3000+i*200,q:3,v:0.08});},
  whirr(){tone(400,0.8,{type:'sawtooth',v:0.05,to:1400,lp:1800,vib:30,vd:0.05});noise(0.8,{f:2500,q:1.5,v:0.06});},
  squeak(){tone(700,0.35,{type:'triangle',v:0.15,to:1300,vib:9,vd:0.04});},
  hop(p){p=p||1;tone(440*p,0.1,{type:'triangle',v:0.15,to:660*p});},
  catchS(p){p=p||1;tone(392*p,0.08,{type:'square',v:0.08,lp:1800});tone(587*p,0.1,{at:0.06,type:'square',v:0.07,lp:1800});},
  sale(p){p=p||1;const b=523*p;[0,4,7,12].forEach((s,i)=>{tone(b*Math.pow(2,s/12),0.32,{at:i*0.075,type:'triangle',v:0.17});tone(b*2*Math.pow(2,s/12),0.2,{at:i*0.075,v:0.05});});},
  discover(p){p=p||1;tone(784*p,0.18,{type:'square',v:0.1,lp:3000});tone(1175*p,0.3,{at:0.09,type:'triangle',v:0.16});noise(0.25,{f:5000,q:1,v:0.08});},
  rare(){[0,4,7,11,14,19].forEach((s,i)=>tone(660*Math.pow(2,s/12),0.4,{at:i*0.07,type:'triangle',v:0.14}));},
  rip(){noise(0.5,{f:3000,to:600,q:0.8,v:0.5});noise(0.35,{at:0.18,f:4000,to:900,q:1,v:0.4});tone(160,0.5,{at:0.1,type:'sawtooth',v:0.1,to:60,lp:700});},
  fanfare(){const m=[0,4,7,12,7,12,16,19];m.forEach((s,i)=>{tone(392*Math.pow(2,s/12),0.32,{at:i*0.13,type:'square',v:0.09,lp:2600});tone(196*Math.pow(2,s/12),0.3,{at:i*0.13,type:'triangle',v:0.1});});noise(0.6,{at:1.0,f:6000,q:0.7,v:0.12});},
  hum(){const m=[0,2,4,2,0,-3];m.forEach((s,i)=>tone(262*Math.pow(2,s/12),0.3,{at:i*0.28,type:'sine',v:0.07,vib:5.5,vd:0.02,lp:900,a:0.06}));},
  build(){for(let i=0;i<4;i++){tone(220+i*60,0.08,{at:i*0.12,type:'square',v:0.1,lp:900});noise(0.05,{at:i*0.12,f:900,v:0.12});}},
  rain(){noise(2.4,{f:4200,q:0.4,v:0.09,a:0.4});},
  step(){noise(0.04,{f:500,q:1,v:0.05});},
  whoosh(){noise(0.35,{f:500,to:2600,q:0.8,v:0.16});},
  pop(p){p=p||1;tone(600*p,0.07,{type:'sine',v:0.2,to:1200*p});}
};

// ================= drawing primitives =================
let X=ctx; // current drawing context (album thumbnails swap it)
function ink(w){X.strokeStyle=C.ink;X.lineWidth=w||LW;X.lineJoin='round';X.lineCap='round';}
function fs(f,w){if(f){X.fillStyle=f;X.fill();}if(w!==0){ink(w);X.stroke();}}
function circ(x,y,r){X.beginPath();X.arc(x,y,Math.max(0.1,r),0,TAU);}
function ell(x,y,rx,ry,rot){X.beginPath();X.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot||0,0,TAU);}
function rrect(x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();}
function poly(pts){X.beginPath();X.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)X.lineTo(pts[i],pts[i+1]);X.closePath();}
function line(x1,y1,x2,y2,w,col){X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.strokeStyle=col||C.ink;X.lineWidth=w||LW;X.lineCap='round';X.stroke();}
// halftone (網点) pattern
let HT=null;
function makeHT(){const c=document.createElement('canvas');c.width=c.height=12;const g=c.getContext('2d');g.fillStyle='rgba(27,21,17,0.55)';g.beginPath();g.arc(3,3,2,0,TAU);g.fill();g.beginPath();g.arc(9,9,2,0,TAU);g.fill();HT=c;}
const PERF={ht:1,sky:1,clouds:1};
function halftone(a){if(!HT||!PERF.ht)return;let pt=X.__ht;if(!pt){pt=X.createPattern(HT,'repeat');X.__ht=pt;}X.save();X.globalAlpha=a||0.35;X.fillStyle=pt;X.fill();X.restore();}
// 集中線 burst around a point
function speedLines(x,y,r1,r2,n,a,seed){
  X.save();X.globalAlpha=a;X.fillStyle=C.ink;
  let s=seed||1;
  for(let i=0;i<n;i++){
    s=(s*9301+49297)%233280;const j=s/233280;
    const an=i/n*TAU+j*0.2, w=0.012+j*0.02, rr1=r1*(0.85+j*0.4);
    X.beginPath();X.moveTo(x+Math.cos(an-w)*rr1,y+Math.sin(an-w)*rr1);X.lineTo(x+Math.cos(an)*r2,y+Math.sin(an)*r2);X.lineTo(x+Math.cos(an+w)*rr1,y+Math.sin(an+w)*rr1);X.fill();
  }
  X.restore();
}
function burstShape(x,y,r,n,col,rot){
  X.beginPath();for(let i=0;i<n*2;i++){const a=i/(n*2)*TAU+(rot||0), rr=i%2?r*0.55:r;i?X.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):X.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}X.closePath();fs(col,5);
}
function star(x,y,r,col,w){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*0.45:r;i?X.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):X.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}X.closePath();fs(col,w===undefined?4:w);}
function note(x,y,k){X.save();X.translate(x,y);X.scale(k,k);ell(0,0,10,7,-0.4);fs(C.ink,0);line(8,-2,8,-34,4);X.beginPath();X.moveTo(8,-34);X.quadraticCurveTo(20,-26,18,-16);X.strokeStyle=C.ink;X.lineWidth=4;X.stroke();X.restore();}
function drop(x,y,k){X.beginPath();X.moveTo(x,y-10*k);X.quadraticCurveTo(x+7*k,y+2*k,x,y+6*k);X.quadraticCurveTo(x-7*k,y+2*k,x,y-10*k);X.fillStyle='#7fd0e8';X.fill();X.strokeStyle=C.ink;X.lineWidth=2.5;X.stroke();}

// ================= items =================
const ITEMS={
  ichigo:{base:1,mo:'hop'}, pan:{base:1,mo:'hop'}, flower:{mo:'hop'},
  button:{mo:'roll'}, wheel:{mo:'heavy'}, spring:{mo:'bounce'}, cloud:{mo:'float'},
  bell:{mo:'swing'}, ribbon:{mo:'flutter'}, balloon:{mo:'rise'}, pinwheel:{mo:'spin'}, bigbutton:{mo:'roll'}
};
const FOUND=['button','wheel','spring','cloud','bell','ribbon','balloon','pinwheel'];
function drawItem(t,x,y,k,rot,ph){
  X.save();X.translate(x,y);if(rot)X.rotate(rot);X.scale(k,k);ph=ph||0;
  switch(t){
  case 'ichigo':
    X.beginPath();X.moveTo(0,30);X.bezierCurveTo(-38,8,-34,-24,0,-20);X.bezierCurveTo(34,-24,38,8,0,30);fs(C.red,6);
    X.beginPath();X.moveTo(8,26);X.bezierCurveTo(26,8,26,-12,14,-18);X.lineTo(20,-8);X.bezierCurveTo(22,6,14,18,8,26);X.fillStyle=C.redD;X.fill();
    X.fillStyle=C.yel;[[-12,-4],[8,-6],[-4,8],[12,8],[0,-12],[-14,10]].forEach(p=>{ell(p[0],p[1],2.5,3.5);X.fill();});
    poly([-16,-20,-6,-28,0,-36,6,-28,16,-20,4,-18,0,-12,-4,-18]);fs(C.leaf,4);break;
  case 'pan':
    X.beginPath();X.moveTo(-36,14);X.bezierCurveTo(-40,-24,40,-24,36,14);X.closePath();fs('#eaa45a',6);
    X.beginPath();X.moveTo(10,12);X.bezierCurveTo(30,8,34,-6,26,-12);X.lineTo(34,12);X.closePath();X.fillStyle='#bf7a35';X.fill();
    [-16,0,16].forEach(o=>line(o-6,-2,o+6,-12,4));break;
  case 'button': case 'bigbutton':{
    const big=t==='bigbutton', r=big?44:30, f=big?C.red:C.yel, d=big?C.redD:C.yelD;
    circ(0,0,r);fs(f,6);X.beginPath();X.arc(0,0,r-2,0.2,1.7);X.strokeStyle=d;X.lineWidth=7;X.stroke();
    circ(0,0,r*0.68);ink(4);X.stroke();
    X.fillStyle=C.ink;[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(p=>{circ(p[0]*r*0.24,p[1]*r*0.24,r*0.1);X.fill();});
    circ(-r*0.45,-r*0.5,r*0.12);X.fillStyle=C.wh;X.fill();
    if(big){star(r*0.9,-r*0.9,14,C.yel,3);}
    break;}
  case 'wheel':
    circ(0,0,38);fs(C.woodD,6);circ(0,0,27);fs(C.wood,4);
    for(let i=0;i<6;i++){const a=i*TAU/6;line(Math.cos(a)*8,Math.sin(a)*8,Math.cos(a)*26,Math.sin(a)*26,6);}
    circ(0,0,9);fs(C.yel,4);break;
  case 'spring':{
    const sq=1+Math.sin(ph*14)*0.18*Math.max(0,1-ph*0.6);
    X.scale(1/Math.sqrt(sq),sq);
    for(let i=0;i<5;i++){const yy=24-i*12;ell(0,yy,24,7);X.strokeStyle=C.ink;X.lineWidth=10;X.stroke();X.strokeStyle=C.teal;X.lineWidth=5;X.stroke();}
    rrect(-26,26,52,10,4);fs(C.grey,4);rrect(-26,-38,52,10,4);fs(C.grey,4);break;}
  case 'cloud':
    X.beginPath();X.arc(-20,6,16,Math.PI*0.5,Math.PI*1.5);X.arc(-4,-8,20,Math.PI*1.1,Math.PI*1.9);X.arc(18,0,17,Math.PI*1.3,Math.PI*0.5);X.closePath();fs(C.wh,6);
    X.fillStyle=C.ink;circ(-8,2,2.8);X.fill();circ(8,2,2.8);X.fill();
    X.fillStyle=C.pink;ell(-15,8,4,2.5);X.fill();ell(15,8,4,2.5);X.fill();break;
  case 'bell':
    X.save();X.rotate(Math.sin(ph*9)*0.35*Math.max(0,1-ph*0.5));
    X.beginPath();X.moveTo(-30,22);X.quadraticCurveTo(-26,-30,0,-30);X.quadraticCurveTo(26,-30,30,22);X.closePath();fs(C.yel,6);
    X.beginPath();X.moveTo(14,18);X.quadraticCurveTo(18,-14,4,-24);X.lineTo(14,-22);X.quadraticCurveTo(26,-8,24,18);X.closePath();X.fillStyle=C.yelD;X.fill();
    rrect(-34,18,68,10,5);fs(C.yelD,5);circ(0,32,7);fs(C.ink,0);
    circ(0,-34,6);ink(4);X.stroke();
    poly([0,-30,-18,-42,-18,-22]);fs(C.red,3);poly([0,-30,18,-42,18,-22]);fs(C.red,3);X.restore();break;
  case 'ribbon':{
    const fl=Math.sin(ph*12)*0.15;
    X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(-30,-30-fl*40,-34,-4);X.quadraticCurveTo(-30,14,0,0);fs(C.pink,5);
    X.beginPath();X.moveTo(0,0);X.quadraticCurveTo(30,-30+fl*40,34,-4);X.quadraticCurveTo(30,14,0,0);fs(C.pink,5);
    poly([-4,4,-16,34+fl*20,-6,30,4,4]);fs(C.pinkD,4);poly([4,4,16,34-fl*20,6,30,-4,4]);fs(C.pinkD,4);
    circ(0,0,8);fs(C.red,4);break;}
  case 'balloon':
    X.beginPath();X.moveTo(0,22);X.quadraticCurveTo(6,40,-4,56);X.strokeStyle=C.ink;X.lineWidth=3;X.stroke();
    ell(0,-12,27,33);fs(C.red,6);ell(-9,-24,6,10,-0.4);X.fillStyle='#ffb3a4';X.fill();
    poly([-6,22,6,22,0,16]);fs(C.redD,3);break;
  case 'pinwheel':
    line(0,0,0,50,7,C.ink);line(0,0,0,50,3,C.woodD);
    X.save();X.rotate(ph*10);
    const cols=[C.red,C.yel,C.teal,C.pink];
    for(let i=0;i<4;i++){X.save();X.rotate(i*TAU/4);X.beginPath();X.moveTo(0,0);X.lineTo(0,-34);X.quadraticCurveTo(22,-26,24,-6);X.closePath();fs(cols[i],4);X.restore();}
    circ(0,0,6);fs(C.wh,3);X.restore();break;
  case 'flower':
    poly([-22,0,22,0,8,40,-8,40]);fs('#cfe8f5',5);
    [[-14,-14,C.pink],[12,-18,C.yel],[0,-30,C.red]].forEach(p=>{
      for(let i=0;i<5;i++){const a=i*TAU/5;ell(p[0]+Math.cos(a)*9,p[1]+Math.sin(a)*9,7,7);fs(p[2],3);}
      circ(p[0],p[1],5);fs(C.yel,3);});
    break;
  }
  X.restore();
}
function drawTray(x,y,k){X.save();X.translate(x,y);X.scale(k,k);ell(0,0,40,10);fs('#f7e6c2',5);ell(0,-2,30,5);X.fillStyle='#e6cf9f';X.fill();X.restore();}
function drawCrate(x,y,t){
  // display crate full of base produce (infinite)
  X.save();X.translate(x,y);
  const pos=[[-34,-30],[0,-36],[34,-30],[-18,-48],[18,-48]];
  pos.forEach(p=>drawItem(t,p[0],p[1],0.62,(p[0]*0.01),0));
  rrect(-62,-24,124,40,6);fs(C.wood,6);halftone(0.18);
  line(-56,-4,56,-4,4);X.restore();

function newState(prevPrefer){

const OKT=t=>t===null||(typeof t==='string'&&Object.prototype.hasOwnProperty.call(ITEMS,t)&&t!=='bigbutton');
function sanitize(o){
  if(!o||typeof o!=='object'||o.v!==1||typeof o.id!=='string')return null;
  const n=newState('spring');
  n.id=o.id.slice(0,40);n.seed=(o.seed|0)||1;n.created=+o.created||Date.now();n.upd=+o.upd||n.created;

  if(o.slots&&typeof o.slots==='object')['main','stall','upper'].forEach(k=>{const a=o.slots[k];if(Array.isArray(a))for(let i=0;i<n.slots[k].length;i++)n.slots[k][i]=OKT(a[i]===undefined?null:a[i])?(a[i]===undefined?null:a[i]):null;});
  if(o.st&&typeof o.st==='object')STORY.forEach(k=>{const v=o.st[k];const ok=k==='A'?['wait','reg']:(k==='B'?['browse','want1','want2','gone']:(k==='K'?['none','want','need','gone']:['none','want','gone']));if(v&&ok.indexOf(v.s)>=0){n.st[k].s=v.s;if(Array.isArray(v.sp))for(let i=0;i<SPN[k];i++)n.st[k].sp[i]=v.sp[i]?1:0;}});
  if(o.fac&&typeof o.fac==='object'){const s=o.fac.stall,u=o.fac.upper;

function loadStore(){
  let raw=null;
  try{raw=localStorage.getItem(SKEY);}catch(e){canSave=false;bootInfo='denied';return;}
  if(raw===null){bootInfo='fresh';return;}
  try{
    const o=JSON.parse(raw);
    if(!o||!Array.isArray(o.shops))throw 0;
    const shops=o.shops.map(sanitize).filter(Boolean).slice(0,4);
    store={v:1,cur:typeof o.cur==='string'?o.cur:null,shops:shops};
    bootInfo=shops.length?'restore':'corrupt';
  }catch(e){store={v:1,cur:null,shops:[]};bootInfo='corrupt';}
}
function saveNow(){
  if(!S)return;S.upd=Date.now();

  const copy=JSON.parse(JSON.stringify(S));
  if(i>=0)store.shops[i]=copy;else{store.shops.unshift(copy);}
  store.shops.sort((a,b)=>b.upd-a.upd);if(store.shops.length>4)store.shops.length=4;

}

  hint:()=>{if(!W||!W.hint)return null;const g=spotWorld(W.hint.c,W.hint.sp);const p=w2s(g.x,g.y);return {id:W.hint.c.id,k:W.hint.sp.k,x:p.x,y:p.y};},
  card:i=>AL&&AL.cards[i]?{x:AL.cards[i].x+AL.cards[i].w/2,y:AL.cards[i].y+AL.cards[i].h/2,shop:!!AL.cards[i].shop}:null,
  forceRare:()=>{if(W)W.forceRare=1;},
  active:()=>activeSpots().map(a=>{const g=spotWorld(a.c,a.sp);const p=w2s(g.x,g.y);return {id:a.c.id,k:a.sp.k,x:p.x,y:p.y};}),
  busy:()=>W?W.busy:0,T:()=>T,running:()=>running,
  perf:PERF,
  bench2:n=>{let u=0,r=0;for(let i=0;i<n;i++){let t=performance.now();update(1/60);u+=performance.now()-t;t=performance.now();render();r+=performance.now()-t;}return {u:u/n,r:r/n};},
  bench:n=>{const t0=performance.now();for(let i=0;i<n;i++){update(1/60);render();}return (performance.now()-t0)/n;},
  w2s:(x,y)=>w2s(x,y)};
})();
</script>
