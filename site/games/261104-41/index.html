<title>しゃっ、ぽろん！チョークのうたう花壇</title>
<style>

  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left)}
</style>

<script src="../../gf-playlog.js" defer></script>

<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<script>
(()=>{
'use strict';
/* =====================================================================
   しゃっ、ぽろん！チョークのうたう花壇  (game 261104-41)
   canvas_draw / chalk / no_animal_princess
   黒板に一本線 → 長さ（指が通った軌跡）で音 → 音が右端の花壇の芽を育てる →
   なぞり直し＝重なり（和音・花弁）／交差＝掛け合い／短長交互＝足踏み散水 →
   満開で土の帯がせり上がり合唱舞台＋五色の波 → 舞台で歌い手入れ替え →
   歌の最後に花束 → 受け取ると次の空の花壇へ。文字UIなし・外部通信なし。
   ===================================================================== */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const backOut=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=Math.random;
const rr=(a,b)=>a+(b-a)*R();
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);

/* ---------------- colors (white + up to 2 of yellow/aqua/pink) ---------------- */
const CN=['white','yellow','aqua','pink'];
const RGB={white:[246,243,232],yellow:[247,213,106],aqua:[152,214,233],pink:[245,184,200]};
const rgba=(n,a)=>{const c=RGB[n]||RGB.white;return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
const GARDEN_PALS=[['yellow','aqua'],['pink','aqua'],['yellow','pink']];
const STAGE_PALS=[['pink','yellow'],['aqua','yellow'],['pink','aqua'],['yellow','pink'],['aqua','pink'],['yellow','aqua']];

/* ---------------- state ---------------- */
let W=1,H=1,dpr=1,U=1,portrait=true,T=0;
const SA={t:0,r:0,b:0,l:0};
const L={draw:null};
const S={
  mode:'garden',strokes:[],flowers:[],pairs:[],marks:[],arcs:[],
  chalk:0,chalkLift:[-9,-9,-9],pal:['white','yellow','aqua'],cycle:0,palStep:0,
  disc:{short:0,long:0,retrace:0,cross:0,alt:0,bloom:0,bouquet:0},
  seq:[],stageLog:[],stageDirty:false,stageDid:{retrace:0,long:0,short:0},
  leadSmall:0,leadTall:0,offer:null,pinned:null,ptr:null,
  lastInput:0,full:false,bloomSched:false,bandRise:0,bandT0:-9,bandFall:-9,bedAlpha:1,bedInT:-9,
  tintA:0,tintT0:-9,wave:null,sweep:null,eraser:null,
  song:{t0:0,gb:-1,n:0,hold:false},demoDone:{},invite:null,timers:[],gen:0,
  saveState:'none',memStems:null,log:[],countShort:0
};
let SID=1,FID=1;
const logE=(e,x)=>{S.log.push({t:+T.toFixed(2),e,x:x||0});if(S.log.length>200)S.log.shift();};
function after(sec,fn){S.timers.push({t:T+sec,fn,g:S.gen});}
function runTimers(){
  if(!S.timers.length)return;
  const due=[],keep=[];
  for(const o of S.timers){ if(o.g!==S.gen)continue; if(o.t<=T)due.push(o); else keep.push(o); }
  S.timers=keep; due.sort((a,b)=>a.t-b.t);
  for(const o of due){ if(o.g===S.gen)o.fn(); }
}
const fById=id=>{for(const f of S.flowers)if(f.id===id)return f;return null;};
const sById=id=>{for(const s of S.strokes)if(s.id===id)return s;return null;};
const colOf=i=>S.pal[clamp(i|0,0,2)];
const waterCol=()=>S.pal.indexOf('aqua')>0?'aqua':'white';
const cheekCol=()=>S.pal.indexOf('pink')>0?'pink':(S.pal.indexOf('yellow')>0?'yellow':'white');
const centerCol=()=>S.pal.indexOf('yellow')>0?'yellow':S.pal[1];

/* ---------------- canvases & textures ---------------- */
const boardC=document.createElement('canvas'),inkC=document.createElement('canvas');
let boardG=null,inkG=null;
let grain={},dabs={},DAB_SZ=20,DAB_R=9,noisePat=null;
const rubC={};

function buildGrain(){
  grain={};
  for(const n of CN){
    const sz=128,c=document.createElement('canvas');c.width=c.height=sz;
    const g=c.getContext('2d'),id=g.createImageData(sz,sz),d=id.data,col=RGB[n],rnd=mulberry(31+n.length*101+n.charCodeAt(0));
    const cells=16,cs=sz/cells,low=new Float32Array(cells*cells);
    for(let i=0;i<low.length;i++)low[i]=rnd();
    for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
      const lv=low[((y/cs)|0)*cells+((x/cs)|0)];
      let a=0.62+0.38*rnd();const r=rnd();
      if(r<0.13+0.22*lv)a*=0.08;else if(r<0.34)a*=0.55;
      const i=(y*sz+x)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=(a*255)|0;
    }
    g.putImageData(id,0,0);
    const p=ctx.createPattern(c,'repeat');
    try{ if(p&&p.setTransform&&typeof DOMMatrix==='function'){const k=Math.max(0.75,1/dpr);p.setTransform(new DOMMatrix([k,0,0,k,0,0]));} }catch(e){}
    grain[n]=p;
  }
  const nc=document.createElement('canvas');nc.width=nc.height=128;
  const ng=nc.getContext('2d'),nid=ng.createImageData(128,128),nd=nid.data,rn=mulberry(555);
  for(let i=0;i<nd.length;i+=4){const v=rn();const w=v<0.5?0:255;nd[i]=nd[i+1]=nd[i+2]=w;nd[i+3]=(rn()*(v<0.5?26:16))|0;}
  ng.putImageData(nid,0,0);
  noisePat=ctx.createPattern(nc,'repeat');
  try{ if(noisePat&&noisePat.setTransform&&typeof DOMMatrix==='function'){const k=1/dpr;noisePat.setTransform(new DOMMatrix([k,0,0,k,0,0]));} }catch(e){}
}
function buildDabs(){
  dabs={};
  const r=Math.max(6,Math.round(9*dpr)),sz=r*2+2;
  for(const n of CN){
    const arr=[],col=RGB[n];
    for(let v=0;v<6;v++){
      const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');
      const id=g.createImageData(sz,sz),d=id.data,rnd=mulberry(997+v*131+n.length*17+n.charCodeAt(1));
      const k1=rnd()*TAU,k2=rnd()*TAU,a1=0.08+0.08*rnd(),a2=0.05+0.06*rnd();
      for(let y=0;y<sz;y++)for(let x=0;x<sz;x++){
        const dx=x-r-0.5,dy=y-r-0.5,dd=Math.hypot(dx,dy),an=Math.atan2(dy,dx);
        const rad=r*(0.82+a1*Math.sin(3*an+k1)+a2*Math.sin(5*an+k2));
        if(dd>rad)continue;
        const e=dd/rad;let a;
        if(rnd()<0.1+0.6*e*e*e)a=rnd()*0.22;else a=0.6+0.4*rnd();
        const i=(y*sz+x)*4;d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=(a*255)|0;
      }
      g.putImageData(id,0,0);arr.push(c);
    }
    dabs[n]=arr;
  }
  DAB_SZ=sz;DAB_R=r;
}
function buildBoard(){
  boardC.width=cv.width;boardC.height=cv.height;
  boardG=boardC.getContext('2d');const g=boardG;
  g.setTransform(dpr,0,0,dpr,0,0);
  g.globalAlpha=1;g.fillStyle='#213a2c';g.fillRect(0,0,W,H);
  const rnd=mulberry(20261104);
  g.lineCap='round';g.lineJoin='round';
  for(let i=0;i<150;i++){
    const x=rnd()*W,y=rnd()*H,len=40+rnd()*U*0.6,a=(rnd()-0.5)*0.9+(rnd()<0.5?0:PI);
    g.strokeStyle=rnd()<0.5?'rgba(52,86,66,0.075)':'rgba(16,32,24,0.09)';
    g.lineWidth=20+rnd()*U*0.16;
    g.beginPath();g.moveTo(x,y);
    g.quadraticCurveTo(x+Math.cos(a)*len*0.5+(rnd()-0.5)*60,y+Math.sin(a)*len*0.5+(rnd()-0.5)*60,x+Math.cos(a)*len,y+Math.sin(a)*len);
    g.stroke();
  }
  g.strokeStyle=grain.white;
  for(let i=0;i<24;i++){
    g.globalAlpha=0.025+rnd()*0.045;g.lineWidth=22+rnd()*U*0.13;
    const x=rnd()*W,y=rnd()*H,rx=U*(0.08+rnd()*0.28),ry=rx*(0.15+rnd()*0.3),tilt=(rnd()-0.5)*0.6;
    g.beginPath();
    for(let j=0;j<=6;j++){const t=j/6;const px=x+(t-0.5)*rx*2,py=y+Math.sin(t*PI*3)*ry+(t-0.5)*rx*tilt;if(j)g.lineTo(px,py);else g.moveTo(px,py);}
    g.stroke();
  }
  g.lineWidth=1.6;
  for(let i=0;i<16;i++){
    g.globalAlpha=0.03+rnd()*0.04;
    const x=rnd()*W,y=rnd()*H,s=U*(0.05+rnd()*0.12);
    g.beginPath();g.moveTo(x,y);
    for(let j=0;j<4;j++)g.quadraticCurveTo(x+(rnd()-0.5)*s*2,y+(rnd()-0.5)*s*2,x+(rnd()-0.5)*s*2,y+(rnd()-0.5)*s*2);
    g.stroke();
  }
  g.globalAlpha=1;g.fillStyle=noisePat;g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(10,22,15,0.32)';g.lineWidth=Math.max(8,U*0.035);g.strokeRect(0,0,W,H);
  g.strokeStyle='rgba(10,22,15,0.18)';g.lineWidth=Math.max(16,U*0.07);g.strokeRect(0,0,W,H);
  g.globalAlpha=1;
}
function buildRub(){
  const k=2,rw=Math.max(8,Math.ceil(W/k)),rh=Math.max(8,Math.ceil(H/k));
  for(let v=0;v<3;v++){
    const base=document.createElement('canvas');base.width=rw;base.height=rh;const g=base.getContext('2d');
    const rnd=mulberry(77+v*1000);g.lineCap='round';
    const blobs=v===2?34:22;
    for(let b=0;b<blobs;b++){
      const cx=rnd()*rw,cy=rnd()*rh,rad=(0.07+rnd()*0.15)*Math.max(rw,rh),ang=(rnd()-0.5)*0.7+(v===1?0.6:-0.45);
      const n=v===2?40:70;
      for(let q=0;q<n;q++){
        const ox=(rnd()-0.5)*2*rad,oy=(rnd()-0.5)*2*rad;const e=(ox*ox+oy*oy)/(rad*rad);if(e>1)continue;
        const l=rad*(0.12+rnd()*0.4);
        g.strokeStyle='rgba(255,255,255,'+((0.08+rnd()*0.22)*(1-e*0.6))+')';g.lineWidth=0.6+rnd()*1.6;
        g.beginPath();g.moveTo(cx+ox,cy+oy);g.lineTo(cx+ox+Math.cos(ang)*l,cy+oy+Math.sin(ang)*l);g.stroke();
      }
    }
    for(const n of CN){
      const c=document.createElement('canvas');c.width=rw;c.height=rh;const t=c.getContext('2d');
      t.drawImage(base,0,0);t.globalCompositeOperation='source-in';t.fillStyle=rgba(n,1);t.fillRect(0,0,rw,rh);
      rubC[n+v]=c;
    }
  }
}
/* ---------------- ink (drawn lines) ---------------- */
function stampDab(g,col,x,y,w,rnd,am){
  const vs=dabs[col];if(!vs)return;
  const v=vs[(rnd()*vs.length)|0];
  const s=w*dpr/(1.64*DAB_R)*DAB_SZ*(0.84+0.32*rnd());
  let a=(0.5+0.45*rnd())*am;if(rnd()<0.07)a*=0.3;
  g.globalAlpha=clamp(a,0,1);
  g.drawImage(v,x*dpr-s/2+(rnd()-0.5)*w*0.3*dpr,y*dpr-s/2+(rnd()-0.5)*w*0.3*dpr,s,s);
}
function stampSeg(g,col,ax,ay,bx,by,w,rnd,am,carry){
  const sp=Math.max(1.1,w*0.3);const d=dist(ax,ay,bx,by);
  let t=carry;
  while(t<=d){const u=d>0?t/d:0;stampDab(g,col,ax+(bx-ax)*u,ay+(by-ay)*u,w,rnd,am);t+=sp;}
  return t-d;
}
function passW(i){return L.lw*(1+0.32*i);}
function renderPass(s,i){
  const ps=s.passes[i];if(!ps)return;
  const g=inkG,col=colOf(ps.c),rnd=mulberry(ps.seed),w=passW(i),am=1+0.12*i;
  g.setTransform(1,0,0,1,0,0);
  if(ps.dotted){for(const p of ps.rs.dots){stampDab(g,col,p.x,p.y,w*1.35,rnd,am*1.1);stampDab(g,col,p.x+0.6,p.y-0.4,w*1.0,rnd,am);}}
  else{const pts=ps.rs;let c=0;for(let k=1;k<pts.length;k++)c=stampSeg(g,col,pts[k-1].x,pts[k-1].y,pts[k].x,pts[k].y,w,rnd,am,c);}
  g.globalAlpha=1;
}
function rerenderInk(){
  inkC.width=cv.width;inkC.height=cv.height;inkG=inkC.getContext('2d');
  for(const s of S.strokes)for(let i=0;i<s.passes.length;i++)renderPass(s,i);
}

/* ---------------- layout ---------------- */
let needLayout=true;
function readSafe(){
  try{const cs=getComputedStyle(document.getElementById('safe'));
    SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}
function remapPt(p,m){p.x=m.nx+(p.x-m.ox)*m.k;p.y=m.ny+(p.y-m.oy)*m.k;}
function layout(){
  const old=L.draw?{x0:L.draw.x0,y0:L.draw.y0,x1:L.draw.x1,y1:L.draw.y1}:null;
  W=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1);
  H=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
  dpr=Math.min(2,Math.max(1,window.devicePixelRatio||1));
  readSafe();portrait=H>=W;U=Math.min(W,H);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  L.lw=clamp(U*0.02,7,14);L.tol=clamp(U*0.058,20,36);L.long=clamp(U*0.27,100,220);L.tap=9;
  L.colW=portrait?W*0.38:Math.min(W*0.3,400);
  L.colX=W-SA.r-L.colW;
  L.trayH=clamp(U*0.13,54,78);
  L.trayY=H-SA.b-L.trayH;
  L.draw={x0:SA.l+4,y0:SA.t+4,x1:L.colX-4,y1:L.trayY-2};
  L.boyH=portrait?Math.min(H*0.23,L.colW*1.35):Math.min(H*0.34,L.colW*0.85);
  L.boyX=L.colX+L.colW*0.55;L.boyY=H-SA.b-6;
  L.tiers=portrait?4:3;L.per=portrait?3:4;
  const bedBottom=L.boyY-L.boyH-H*0.035,bedTop=SA.t+12;
  L.ts=(bedBottom-bedTop)/(L.tiers-1+1.3);
  L.tierY=[];L.slots=[];
  for(let i=0;i<L.tiers;i++)L.tierY.push(bedBottom-i*L.ts);
  const sp=L.colW*0.66/(L.per-1);
  L.bedX0=L.colX+L.colW*0.04;L.bedX1=L.colX+L.colW*0.97;L.bedNar=L.colW*0.07;
  for(let i=0;i<L.tiers;i++){
    const k=i/Math.max(1,L.tiers-1),xl=L.bedX0+L.bedNar*k+L.colW*0.12,xr=L.bedX1-L.bedNar*k-L.colW*0.1;
    for(let j=0;j<L.per;j++)L.slots.push({x:lerp(xl,xr,j/(L.per-1))+(i%2?L.colW*0.03:-L.colW*0.015),y:L.tierY[i],tier:i});
  }
  L.smallH=[0.34*L.ts,0.56*L.ts];L.tallH=[0.9*L.ts,1.22*L.ts];
  L.headS=Math.min(L.ts*0.15,sp*0.46);L.headT=Math.min(L.ts*0.19,sp*0.6);
  L.bandH=portrait?H*0.2:H*0.25;L.bandTop=L.draw.y1-L.bandH;
  L.stX0=L.draw.x0+U*0.05;L.stX1=L.colX+L.colW*0.06;
  L.stScale=portrait?0.8:0.88;
  // chalks on the tray
  const cl0=clamp(U*0.2,66,124),cl1=clamp(U*0.15,52,94),th0=clamp(U*0.05,17,30),th1=clamp(U*0.04,14,24);
  const gap=clamp(U*0.035,12,26);
  L.chalks=[];let cx=L.draw.x0+gap*0.8;
  const lens=[cl0,cl1,cl1],ths=[th0,th1,th1];
  for(let i=0;i<3;i++){
    const len=lens[i];L.chalks.push({x:cx+len/2,y:L.trayY+L.trayH*0.52,hy:L.trayY+L.trayH*0.5,len,th:ths[i],hw:Math.max(48,len+gap*0.8),hh:L.trayH});
    cx+=len+gap;
  }
  L.pin={x:L.draw.x0+U*0.14,y:L.draw.y0+U*0.2,size:U*0.26};
  L.offer={x:L.boyX-L.boyH*0.27,y:L.boyY-L.boyH*1.12,size:L.boyH*0.72};
  // bed decoration geometry (stable)
  const rnd=mulberry(4242+S.cycle*7);
  L.bedGeo=[];
  for(let i=0;i<L.tiers;i++){
    const bumps=[],dots=[];
    for(let k=0;k<=10;k++)bumps.push((rnd()-0.5)*L.ts*0.05-(k%3===1?L.ts*0.03:0));
    for(let k=0;k<26;k++)dots.push({u:0.04+rnd()*0.92,v:rnd(),s:0.5+rnd()});
    L.bedGeo.push({bumps,dots});
  }
  L.bandGeo=[];for(let k=0;k<=24;k++)L.bandGeo.push((rnd()-0.5)*U*0.012);
  L.hatch=[];for(let k=0;k<70;k++)L.hatch.push({u:rnd(),v:rnd(),l:0.4+rnd()*0.8});
  // remap drawn things to the new draw rect (uniform fit keeps shapes)
  if(old){
    const ow=old.x1-old.x0,oh=old.y1-old.y0,nw=L.draw.x1-L.draw.x0,nh=L.draw.y1-L.draw.y0;
    const k=Math.min(nw/Math.max(1,ow),nh/Math.max(1,oh));
    if(Math.abs(k-1)>1e-4||old.x0!==L.draw.x0||old.y0!==L.draw.y0){
      const m={ox:old.x0,oy:old.y0,k,nx:L.draw.x0+(nw-ow*k)/2,ny:L.draw.y0+(nh-oh*k)/2};
      for(const s of S.strokes){
        for(const ps of s.passes){for(const p of ps.rs)remapPt(p,m);if(ps.rs.dots)for(const p of ps.rs.dots)remapPt(p,m);}
        for(const p of s.rc)remapPt(p,m);
        s.bb=bboxOf(s.passes[0].rs);const c={x:s.cx,y:s.cy};remapPt(c,m);s.cx=c.x;s.cy=c.y;
      }
      for(const mk of S.marks)remapPt(mk,m);
    }
  }
  buildGrain();buildDabs();buildBoard();buildRub();rerenderInk();boardVer++;
  for(const f of S.flowers)f.sprKey='';
  if(S.offer)S.offer.sprKey='';
  pinSprite=null;
  if(S.mode!=='garden')assignStage();
  if(S.ptr){S.ptr=null;scratch(0);}
}

/* ---------------- audio (Web Audio synthesis) ---------------- */
const A={ctx:null,out:null,noise:null,scrG:null,scrF:null,live:0,MAX:14};
function gestureOK(){try{const ua=navigator.userActivation;return !ua||ua.isActive||ua.hasBeenActive;}catch(e){return true;}}
function audioUnlock(){
  if(!gestureOK())return; // touch activation arrives on release; drawing never waits for audio
  try{

/* ---------------- geometry helpers ---------------- */
function resample(pts,sp){
  const out=[{x:pts[0].x,y:pts[0].y}];let px=pts[0].x,py=pts[0].y,acc=0;

    acc+=d;px=qx;py=qy;
  }
  const lp=pts[pts.length-1],lo=out[out.length-1];
  if(Math.hypot(lp.x-lo.x,lp.y-lo.y)>0.5)out.push({x:lp.x,y:lp.y});

}

function strokeProps(len){

    for(const p of rs){
      if(p.x<s.bb.x0-L.tol||p.x>s.bb.x1+L.tol||p.y<s.bb.y0-L.tol||p.y>s.bb.y1+L.tol)continue;
      let hit=false;

        for(let i=0;i<pts.length;i+=1){const dx=pts[i].x-p.x,dy=pts[i].y-p.y;if(dx*dx+dy*dy<=tol2){hit=true;break;}}

  singFlower(f,{dur:f.kind==='tall'?f.noteDur:0.32,grow:true});

    f.bloomed=true;f.st='open';f.pop=1;logE('bloom',f.id);
    const hp={x:f.hx,y:f.hy};spark(hp.x,hp.y,4,colOf(f.c),70);
    if(f.pendingDuet){const pd=f.pendingDuet;f.pendingDuet=null;duet(pd);}
    checkFull();
  });
}
function checkFull(){
  if(S.mode!=='garden'||S.bloomSched)return;
  if(S.flowers.length>=L.slots.length&&S.flowers.every(f=>f.bloomed)){S.bloomSched=true;after(0.7,startStage);}
}
function singFlower(f,o){
  if(!f)return;o=o||{};
  const short=o.short||(f.kind==='small'&&!o.dur);
  const k=o.k!=null?o.k:f.voiceK;
  const dur=o.dur!=null?o.dur:(f.kind==='tall'?Math.min(f.noteDur,1.4):0.3);
  f.singT0=T;f.singDur=dur+0.12;f.riseUntil=Math.max(f.riseUntil,T+dur+0.3);
  if(o.vib!==false){for(const id of f.lines){const s=sById(id);if(s)vibrate(s,o.soft?2.5:4);}}
  if(!aOK()||o.mute)return;
  const t=now()+(o.delay||0),g=o.gain||1;
  if(f.kind==='small'||short){sPluck(kToF(k),t,0.13*g,0.55);sVoice(kToF(k),t,Math.max(0.2,dur),0.05*g,1,0.5);}
  else sVoice(kToF(k),t,dur,0.1*g,0,1);
  if(o.chord!==false){
    const ex=f.extra.slice(-2);
    ex.forEach((st,i)=>sVoice(kToF(k+st),t+0.01*(i+1),Math.max(0.25,dur),0.055*g,i?2:1,0.7));
  }
}
function flowerHit(x,y){
  let best=null,bd=1e9;
  for(const f of S.flowers){
    if(f.st==='seed'||f.leave>0)continue;
    const r=Math.max(26,f.hr2*1.3),d=dist(x,y,f.hx,f.hy);
    if(d<r&&d<bd){bd=d;best=f;}
  }
  return best;
}

/* ---------------- line finalize: the core rules ---------------- */
function finalizeLine(raw,c,len,dotted){
  let rs,rc;
  if(dotted){rs=raw.line.slice();rs.dots=raw.dots;rs.line=raw.line;rc=raw.line.slice();}
  else{rs=resample(raw,3);rc=resample(raw,8);if(rc.length<2)rc=[raw[0],raw[raw.length-1]];}
  const pk=len>=L.long?1:0;
  const rt=dotted?null:findRetrace(rs);
  const crosses=findCrosses(rc,rt?rt.id:-1);
  let target=null,newS=null;
  if(rt){target=retraceStroke(rt,rs,len,c,pk);}
  else{
    newS=makeStroke(rs,rc,len,c,dotted);
    if(dotted)renderPass(newS,0);
    if(S.mode==='garden'&&S.flowers.length<L.slots.length)target=plantFromStroke(newS);
    else target=assignFromStroke(newS);
    if(newS.kind==='long'&&!S.disc.long){S.disc.long=1;success(lineTip(newS),false);}
    if(newS.kind==='short')S.countShort++;
    S.disc.short=1;
  }
  // crossings -> call & response pairs
  if(target&&crosses.length){
    const made=[];
    for(const cr of crosses.slice(0,3)){
      const of=fById(cr.s.flower);if(!of||of===target)continue;
      const p=addPair(target,of,cr.x,cr.y);if(p&&!made.includes(p))made.push(p);
      addFlight(cr.x,cr.y,()=>({x:of.hx,y:of.hy}),0.4,S.pal[1],null);
      addFlight(cr.x,cr.y,()=>({x:target.hx,y:target.hy}),0.4,S.pal[1],null);
      spark(cr.x,cr.y,5,S.pal[1],80);
    }
    if(made.length){
      const first=!S.disc.cross;S.disc.cross=1;logE('cross',made.length);
      success({x:crosses[0].x,y:crosses[0].y},!first);
      if(S.mode!=='garden'){S.stageDirty=true;S.stageLog.push({type:'cross',fid:target.id});}
      if(target.bloomed)after(0.45,()=>duet(made));else target.pendingDuet=made;
    }
  }
  // alternation short/long -> stomp & ordered watering
  if(newS&&target){
    S.seq.push({kind:newS.kind,fid:target.id});if(S.seq.length>12)S.seq.shift();
    let r=1;for(let i=S.seq.length-1;i>0;i--){if(S.seq[i].kind!==S.seq[i-1].kind)r++;else break;}
    if(r>=3)altEvent(S.seq.slice(-Math.min(r,4)),target);
  }
}
function plantFromStroke(s){
  const f=newFlower(s,S.flowers.length);
  S.flowers.push(f);
  if(S.flowers.length>=L.slots.length)S.full=true;
  vibrate(s,s.kind==='long'?7:5);playLineNote(s);
  const tip=lineTip(s);
  addFlight(tip.x,tip.y,()=>{const p=slotPos(f);return{x:p.x,y:p.y-6};},0.42,colOf(s.passes[0].c),()=>sproutFlower(f),{big:true});
  logE('new-'+s.kind,f.id);
  return f;
}
function assignFromStroke(s){
  if(!S.flowers.length)return null;
  const want=s.kind==='long'?'tall':'small';
  let cands=S.flowers.filter(f=>f.kind===want&&f.leave<0);let convert=false;
  if(!cands.length){cands=S.flowers.filter(f=>f.leave<0);convert=true;}
  let best=null,bd=1e18;
  for(const f of cands){const d=Math.abs(f.bx-s.cx)+0.35*Math.abs(f.by-s.cy);if(d<bd){bd=d;best=f;}}
  const f=best;if(!f)return null;
  if(convert){f.kind=want;f.hr=s.r;f.sprKey='';f.pop=1;}
  f.lines.push(s.id);s.flower=f.id;f.voiceK=s.k;f.noteDur=s.dur;
  vibrate(s,s.kind==='long'?7:5);playLineNote(s);
  const tip=lineTip(s);
  addFlight(tip.x,tip.y,()=>({x:f.hx,y:f.hy}),0.4,colOf(s.passes[0].c),()=>{
    f.pop=1;f.leadT=T;
    if(f.bloomed)singFlower(f,{dur:f.kind==='tall'?f.noteDur:0.3});
  },{big:true});
  if(S.mode==='stage'||S.mode==='bloom'){
    if(want==='tall')S.leadTall=f.id;else S.leadSmall=f.id;
    S.stageDirty=true;S.stageLog.push({type:s.kind,fid:f.id,r:s.r});
    if(s.kind==='long')S.stageDid.long=1;else S.stageDid.short=1;
    logE('stage-'+s.kind,f.id);
  }
  return f;
}
function retraceStroke(s,rs,len,c,pk){
  const f=fById(s.flower);
  const pi=s.passes.length;
  if(pi<6){s.passes.push({rs,c,seed:(R()*1e9)|0,dotted:false,len});renderPass(s,pi);}
  vibrate(s,6);
  const stepTab=pk?[-3,-5,-8,-10]:[2,4,7,9];
  if(f&&f.layers.length<4){f.layers.push(pk);f.lc.push(c);f.extra.push(stepTab[f.layers.length-1]);f.sprKey='';}
  // both notes at once (original + new)
  if(aOK()&&f){const t=now();sTap(t);sPluck(kToF(f.voiceK),t+0.02,0.13,0.7);sPluck(kToF(f.voiceK+(f.extra[f.extra.length-1]||2)),t+0.025,0.12,0.7);}
  const first=!S.disc.retrace;S.disc.retrace=1;
  logE('retrace',f?f.layers.length:0);
  if(f){
    const m=lineMid(s);
    addFlight(m.x,m.y,()=>({x:f.hx,y:f.hy}),0.38,colOf(c),()=>{
      f.pop=1.3;spark(f.hx,f.hy,7,colOf(c),90);
      if(f.bloomed)singFlower(f,{dur:f.kind==='tall'?Math.min(1.2,f.noteDur):0.45});
    },{big:true});
    success(m,!first);
    if(S.mode!=='garden'){S.stageDirty=true;S.stageDid.retrace=1;S.stageLog.push({type:'retrace',fid:f.id,pk});}
  }
  return f;
}
function pluckStroke(s,p){
  s.pn=(T-(s.pt||-9)<0.8)?Math.min(5,(s.pn||0)+1):0;s.pt=T;
  vibrate(s,5+s.pn);dust(p.x,p.y,3+s.pn,'white',35+s.pn*8);
  const f=fById(s.flower);
  if(aOK())sTap(now());
  if(f&&f.bloomed){f.pop=Math.min(1.6,0.7+0.2*s.pn);singFlower(f,{k:f.voiceK+s.pn});if(s.pn>=2)spark(f.hx,f.hy,2+s.pn,colOf(f.c),60);
    if(f.partners.length){const o=fById(f.partners[f.partners.length-1]);if(o&&o.bloomed){faceEach(f,o,1.6);after(0.36,()=>singFlower(o,{short:true}));}}}
  else if(aOK())sPluck(kToF(s.k),now()+0.02,0.12,0.5);
  logE('pluck',s.id);
}
function addPair(fa,fb,x,y){
  let p=S.pairs.find(q=>(q.a===fa.id&&q.b===fb.id)||(q.a===fb.id&&q.b===fa.id));
  const mk={x,y,flash:1,pa:fa.id,pb:fb.id};
  if(S.marks.length<48)S.marks.push(mk);
  if(!p){p={a:fa.id,b:fb.id,marks:[]};S.pairs.push(p);fa.partners.push(fb.id);fb.partners.push(fa.id);}
  p.marks.push(mk);
  return p;
}
function faceEach(a,b,d){a.faceTo=b.id;b.faceTo=a.id;a.faceUntil=b.faceUntil=T+d;a.riseUntil=Math.max(a.riseUntil,T+d);b.riseUntil=Math.max(b.riseUntil,T+d);}
function duet(newPairs){
  // chain: new pairs (2 rounds) then connected pairs (1 round) -> spreading call & response
  const seq=[];const used=new Set();
  for(const p of newPairs){if(!S.pairs.includes(p))continue;used.add(p);seq.push(p,p);}
  const ids=new Set();newPairs.forEach(p=>{ids.add(p.a);ids.add(p.b);});
  for(const p of S.pairs){if(seq.length>=8)break;if(used.has(p))continue;if(ids.has(p.a)||ids.has(p.b)){used.add(p);seq.push(p);}}
  let t=0;
  seq.forEach((p,i)=>{
    const round=seq.indexOf(p)===i?0:1;
    after(t,()=>duetSing(p,0,round));t+=0.34;
    after(t,()=>duetSing(p,1,round));t+=0.36;
  });
  logE('duet',seq.length);
}
function duetSing(p,who,round){
  const f=fById(who?p.b:p.a),o=fById(who?p.a:p.b);if(!f||!o)return;
  faceEach(f,o,1.4);
  singFlower(f,{short:true,k:f.voiceK+(round?1:0),dur:0.3});
  for(const m of p.marks)m.flash=1;
  if(S.arcs.length<10)S.arcs.push({a:f.id,b:o.id,t0:T});
  B.lookAtF=f.id;B.lookUntil=T+0.5;
}
function altEvent(items,target){
  const first=!S.disc.alt;S.disc.alt=1;
  logE('alt',items.map(i=>i.kind==='long'?'L':'S').join(''));
  target.altWater=true;
  // the newest drawn order replaces any waiting stomp / ordered watering
  const dropped=B.q.filter(q=>q.type==='water'&&q.ordered);
  B.q=B.q.filter(q=>!(q.type==='stomp'||(q.type==='water'&&q.ordered)));
  for(const it of items){const i=B.q.findIndex(q=>q.type==='water'&&q.fid===it.fid);if(i>=0)B.q.splice(i,1);}
  boyQ({type:'stomp',pattern:items.map(i=>i.kind)});
  for(const it of items)boyQ({type:'water',fid:it.fid,ordered:true});
  for(const q of dropped){if(!items.some(it=>it.fid===q.fid)){const f=fById(q.fid);if(f&&!f.bloomed)boyQ({type:'water',fid:q.fid});}}
  for(const it of items){const f=fById(it.fid);if(f)f.altT=T;}
  if(first)after(0.15,()=>sChime(0,false));
}
function success(p,soft){
  if(aOK())sChime(now()+0.05,false);
  if(p)spark(p.x,p.y,soft?5:9,S.pal[1],110);
  if(!soft)B.jumpT=T;
}

/* ---------------- boy ---------------- */
const B={act:null,q:[],lookX:0,lookY:0,lx:0,ly:0,lookAtF:0,lookUntil:-9,jumpT:-9,pokeT:-9,beatT:-9,
  spout:{x:0,y:0},hand:{x:0,y:0},aim:-2.2,aimCur:-2.0,tilt:0,stepFoot:0,stepLift:0,stepHeavy:0,bow:0,offer:0};
function boyQ(a){if(B.q.length<24)B.q.push(a);}
function boyActDur(a){
  if(a.type==='water')return a.ordered?0.62:(B.q.length>1?0.45:0.72);
  if(a.type==='stomp')return a.pattern.reduce((s,k)=>s+(k==='long'?0.5:0.28),0)+0.15;
  if(a.type==='bow')return 1.15;
  return 0.5;
}
function boyUpdate(dt){
  if(!B.act&&B.q.length){
    let idx=0;
    if(B.q[0].type==='water'&&!B.q[0].ordered){
      // default habit: little sprouts first, tall ones afterwards
      for(let i=0;i<B.q.length&&B.q[i].type==='water'&&!B.q[i].ordered;i++){const f=fById(B.q[i].fid);if(f&&f.kind==='small'){idx=i;break;}}
    }
    B.act=B.q.splice(idx,1)[0];B.act.t0=T;B.act.dur=boyActDur(B.act);B.act.done=false;B.act.step=-1;B.act.ld=0;
    if(B.act.type==='water'){const f=fById(B.act.fid);if(!f){B.act=null;}else if(aOK())sWater(now()+0.08,B.act.dur*0.6);}
  }
  const a=B.act;
  if(a){
    const p=(T-a.t0)/a.dur;
    if(a.type==='water'){
      const f=fById(a.fid);
      if(!f){B.act=null;}
      else{
        B.lookAtF=f.id;B.lookUntil=T+0.3;
        const tx=f.hx||f.bx,ty=(f.st==='open'?f.hy:f.by-10);
        B.aim=Math.atan2(ty-(B.shoulderY||L.boyY-L.boyH*0.66),tx-(B.shoulderX||L.boyX));
        B.tilt=lerp(B.tilt,p>0.1&&p<0.8?0.5:0,0.25);
        if(p>0.12&&p<0.72&&T-a.ld>0.04){a.ld=T;spawnDrop(f.bx,f.by-(f.st==='open'?fHeight(f)*0.5*fScale(f):6));}
        if(p>=0.6&&!a.done){a.done=true;waterHit(f,a.ordered);}
      }
    }else if(a.type==='stomp'){
      let acc=0.08,idx=-1;
      for(let i=0;i<a.pattern.length;i++){const d=a.pattern[i]==='long'?0.5:0.28;if(T-a.t0>=acc)idx=i;acc+=d;}
      if(idx>a.step){a.step=idx;B.stepFoot=idx%2;B.stepT=T;B.stepHeavy=a.pattern[idx]==='long'?1:0;
        if(aOK())sStomp(now(),B.stepHeavy);
        logE(B.stepHeavy?'stomp-L':'stomp-S');
        const fx=L.boyX+(B.stepFoot?1:-1)*L.boyH*0.07;dust(fx,L.boyY,B.stepHeavy?7:4,'white',B.stepHeavy?70:40,true);}
    }
    if(B.act&&p>=1){if(a.type==='water'&&!a.done){const f=fById(a.fid);if(f)waterHit(f,a.ordered);}B.act=null;B.tilt=0;}
  }else B.tilt=lerp(B.tilt,0,0.2);
}
function spawnDrop(tx,ty){
  const sx=B.spout.x,sy=B.spout.y,d=dist(sx,sy,tx,ty),tf=clamp(d/650,0.3,0.65),g=1300*(U/700);
  addP({k:2,x:sx,y:sy,vx:(tx-sx)/tf+rr(-14,14),vy:(ty-sy)/tf-0.5*g*tf+rr(-14,14),g,max:tf,sz:rr(2.4,4.2),col:waterCol()});
}
function waterHit(f,ordered){
  logE(ordered?'water-o':'water',f.id);
  if(!f.bloomed&&f.st!=='grow')bloomFlower(f);
  else{f.pop=1;singFlower(f,{dur:f.kind==='tall'?Math.min(0.9,f.noteDur):0.3});}
  if(ordered){f.altT=T;spark(f.hx||f.bx,(f.hy||f.by)-4,3,S.pal[1],60);}
}
function boyPoke(){B.pokeT=T;B.jumpT=T;sGiggle();dust(L.boyX,L.boyY-L.boyH*0.9,4,'white',40,true);logE('poke-boy');}

/* ---------------- stage, chorus, bouquet, next bed ---------------- */
const BEAT=0.6;
function setPal(pair){
  S.pal=['white',pair[0],pair[1]];
  rerenderInk();for(const f of S.flowers)f.sprKey='';if(S.offer)S.offer.sprKey='';pinSprite=null;
}
function startStage(){
  if(S.mode!=='garden')return;
  S.mode='bloom';S.disc.bloom=1;logE('stage-start');
  assignStage();
  S.bandT0=T;B.jumpT=T;
  if(aOK()){sRumble(now(),1.4);sChime(now()+0.1,true);}
  S.flowers.forEach((f,i)=>{
    after(0.12+i*0.06,()=>{const p=slotPos(f);f.jump={t0:T,dur:0.72,fx:p.x,fy:p.y};f.place='stage';});
    after(0.12+i*0.06+0.72,()=>{if(aOK())sPluck(kToF(f.voiceK),now(),0.08,0.4);dust(f.bx,f.by,3,'white',40,true);});
  });
  after(1.2,()=>{S.wave={t0:T};chorusAll(2.3,1);});
  after(1.2+0.6,()=>setPal(STAGE_PALS[0]));
  after(1.2+1.8,()=>setPal(STAGE_PALS[1]));
  after(4.7,()=>{
    S.mode='stage';S.palStep=1;S.song={t0:T,gb:-1,n:0,hold:false};S.tintT0=T;S.wave=null;
    S.stageLog=[];S.stageDirty=false;pickLeads();logE('stage-ready');
  });
}
function pickLeads(){
  const sm=S.flowers.filter(f=>f.kind==='small'),tl=S.flowers.filter(f=>f.kind==='tall');
  const by=(a,b)=>b.layers.length-a.layers.length||b.id-a.id;
  sm.sort(by);tl.sort(by);
  S.leadSmall=sm.length?sm[0].id:0;S.leadTall=tl.length?tl[0].id:0;
}
function chorusAll(dur,big){
  const fl=S.flowers.filter(f=>f.leave<0);if(!fl.length)return;
  const notes=[...new Set(fl.map(f=>f.voiceK))].sort((a,b)=>a-b).slice(0,7);
  for(const f of fl){f.singT0=T;f.singDur=dur;f.riseUntil=T+dur+0.3;for(const id of f.lines){const s=sById(id);if(s)vibrate(s,big?4:2.5);}}
  if(!aOK())return;const t=now();
  const g=big?0.085:0.06;
  notes.forEach((k,i)=>sVoice(kToF(k),t+i*0.02,dur,g/Math.sqrt(Math.max(1,notes.length/3)),i%3,0.8));
  if(big)sPluck(kToF(notes[0]-5),t,0.12,1.2);
}
function rotatePal(){S.palStep=(S.palStep+1)%STAGE_PALS.length;setPal(STAGE_PALS[S.palStep]);S.sweep={t0:T,col:S.pal[1]};logE('pal',S.palStep);}
function songUpdate(){
  if(S.mode!=='stage'||S.song.hold)return;
  const gb=Math.floor((T-S.song.t0)/BEAT);
  while(S.song.gb<gb){S.song.gb++;onBeat(((S.song.gb%8)+8)%8);if(S.song.hold)break;}
}
function onBeat(b){
  if(b===0){
    S.song.n++;
    if(S.song.n>1&&S.stageDirty&&S.stageLog.some(e=>e.type!=='cross')&&S.stageLog.length>=2&&!(S.offer&&S.offer.state==='fly')){finaleAndCompose();return;}
    if(S.song.n>1&&S.song.n%2===1)rotatePal();
  }
  B.beatT=T;
  const ls=fById(S.leadSmall),lt=fById(S.leadTall);
  if(b===0||b===4){
    const back=S.flowers.filter(f=>f.id!==S.leadSmall&&f.id!==S.leadTall&&f.leave<0);
    const pick=back.filter((f,i)=>i%3===(S.song.n%3)).slice(0,3);
    for(const f of pick)singFlower(f,{dur:BEAT*1.6,gain:0.45,chord:false,soft:true});
  }
  if(ls&&b%2===0){const ns=[ls.voiceK].concat(ls.extra.map(e=>ls.voiceK+e));singFlower(ls,{short:true,k:ns[(b>>1)%ns.length],dur:0.28,chord:ls.extra.length>0&&b===0});}
  if(lt&&(b===0||b===4))singFlower(lt,{dur:BEAT*1.8});
  if(S.pairs.length&&b%2===1){
    const p=S.pairs[(S.song.n*2+(b>>2))%S.pairs.length];
    if(p)duetSing(p,(b>>1)%2,0);
  }
}
function finaleAndCompose(){
  if(S.offer&&S.offer.state==='fly')return;
  S.song.hold=true;S.stageDirty=false;
  chorusAll(1.1,1);B.jumpT=T;
  after(1.0,()=>boyQ({type:'bow'}));
  after(1.25,composeBouquet);
  after(3.0,()=>{S.song.hold=false;S.song.t0=T;S.song.gb=-1;});
}
function composeBouquet(){
  if(S.mode!=='stage'||(S.offer&&S.offer.state==='fly'))return;
  const log=S.stageLog.filter(e=>e.type!=='cross').slice(-5);
  const stems=[],src=[];let carry=[],carryC=[];
  for(const a of log){
    const f=fById(a.fid);if(!f)continue;
    if(a.type==='retrace'){
      stems.push({t:f.kind==='tall'?1:0,h:clamp(0.25+0.4*f.hr,0,1),l:f.layers.slice(-4),lc:f.lc.slice(-4).map(v=>clamp(v,0,2)),c:clamp(f.c,0,2)});

const KEY='gf-261104-41-bouquet';
function validStems(a){
  if(!Array.isArray(a)||a.length<1||a.length>8)return false;
  for(const s of a){
    if(!s||typeof s!=='object')return false;
    if(s.t!==0&&s.t!==1)return false;
    if(typeof s.h!=='number'||!(s.h>=0&&s.h<=1))return false;
    if(!Number.isInteger(s.c)||s.c<0||s.c>2)return false;
    if(!Array.isArray(s.l)||s.l.length>4||!s.l.every(v=>v===0||v===1))return false;
    if(!Array.isArray(s.lc)||s.lc.length!==s.l.length||!s.lc.every(v=>Number.isInteger(v)&&v>=0&&v<=2))return false;
  }

}
function loadSaved(){

/* ---------------- drawing helpers (chalk look) ---------------- */
function cs(g,path,col,w,a){g.globalAlpha=a;g.strokeStyle=grain[col]||grain.white;g.lineWidth=w;g.stroke(path);}
function cs2(g,path,col,w,a){cs(g,path,col,w,a);g.save();g.translate(0.7,0.45);cs(g,path,col,w*0.55,a*0.45);g.restore();}
function wobCircle(p,x,y,r,seed,n){
  n=n||Math.max(10,Math.min(26,(r*1.2)|0));const rnd=mulberry(seed||7);
  const ks=[];for(let i=0;i<n;i++)ks.push(1+(rnd()-0.5)*0.08);
  for(let i=0;i<=n;i++){const a=i/n*TAU,k=ks[i%n];const px=x+Math.cos(a)*r*k,py=y+Math.sin(a)*r*k;if(i)p.lineTo(px,py);else p.moveTo(px,py);}

function hatchIn(g,clipPath,x0,y0,x1,y1,col,a,sp,ang){
  g.save();g.clip(clipPath);
  const p=new Path2D();const dx=Math.cos(ang||0.9),dy=Math.sin(ang||0.9);const len=Math.hypot(x1-x0,y1-y0);

function dabAt(g,col,x,y,sz,a,v){

/* flower heads: rings of petals; overlays add rings (short=round, long=pointed) */
function drawHead(g,r,kind,layers,cols,seed){
  const rnd=mulberry(seed||1);
  const baseN=kind==='tall'?7:5,baseSh=kind==='tall'?1:0;
  const rings=[{n:baseN,sh:baseSh,col:cols[0],rad:r,off:0}];
  layers.forEach((lk,i)=>rings.push({n:baseN+2*(i+1)+lk,sh:lk,col:cols[i+1]||cols[0],rad:r*(i%2===0?1.16+0.07*i:0.8),off:(i+1)*0.41}));
  rings.slice().sort((a,b)=>b.rad-a.rad).forEach(rg=>{
    for(let i=0;i<rg.n;i++){
      const a=rg.off+i/rg.n*TAU+(rnd()-0.5)*0.14;
      g.save();g.rotate(a);
      const Ln=rg.rad*(rg.sh?0.8:0.66),Wd=rg.rad*(rg.sh?0.24:0.34),d0=rg.rad*0.3;
      const p=new Path2D();
      if(rg.sh===0)p.ellipse(d0+Ln/2,0,Ln/2,Wd,0,0,TAU);
      else{p.moveTo(d0,0);p.quadraticCurveTo(d0+Ln*0.45,-Wd*1.35,d0+Ln,0);p.quadraticCurveTo(d0+Ln*0.45,Wd*1.35,d0,0);}
      const h=new Path2D();for(let k=-1;k<=1;k++){h.moveTo(d0+Ln*0.18,k*Wd*0.42);h.lineTo(d0+Ln*0.82,k*Wd*0.3);}
      cs(g,h,rg.col,Math.max(1,rg.rad*0.055),0.5);
      cs(g,p,rg.col,Math.max(1.3,rg.rad*0.08),0.95);
      g.restore();
    }
  });
  if(layers.length>=3){for(let k=0;k<12;k++){const a=k/12*TAU+0.2;dabAt(g,cols[2]||cols[0],Math.cos(a)*r*0.5,Math.sin(a)*r*0.5,Math.max(2.5,r*0.16),0.85,k);}}
  const cr=r*0.38,cp=new Path2D();wobCircle(cp,0,0,cr,seed+3,14);
  hatchIn(g,cp,-cr,-cr,cr,cr,cols.center||'yellow',0.55,Math.max(2,cr*0.28),0.7);
  cs(g,cp,'white',Math.max(1.2,r*0.07),0.9);
}
function flowerSprite(f){
  const r=fHeadR(f);
  const cols=[colOf(f.c)].concat(f.lc.map(colOf));cols.center=centerCol();
  const key=f.kind+'|'+f.layers.join('')+'|'+cols.join(',')+'|'+cols.center+'|'+r.toFixed(1)+'|'+dpr;
  if(f.spr&&f.sprKey===key)return f.spr;

  const c=f.spr||document.createElement('canvas');c.width=c.height=sz;
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,sz/2,sz/2);g.lineCap='round';g.lineJoin='round';
  drawHead(g,r,f.kind,f.layers,cols,f.id*31+7);
  f.spr=c;f.sprKey=key;f.sprExt=ext;

}

/* bouquet (from stems) */
function drawBouquet(g,stems,cx,cy,size,seed){
  const n=stems.length,rnd=mulberry(seed||9);
  const items=stems.map((st,i)=>{
    const ang=n>1?lerp(-0.55,0.55,i/(n-1)):0;
    const len=size*(st.t?0.6+0.26*st.h:0.36+0.2*st.h);
    return{st,i,ang,len,hx:cx+Math.sin(ang)*len,hy:cy-Math.cos(ang)*len};
  });
  const order=items.slice().sort((a,b)=>b.len-a.len);
  for(const it of order){
    const p=new Path2D();p.moveTo(cx+Math.sin(it.ang)*size*0.02,cy+size*0.2);
    p.quadraticCurveTo(cx+Math.sin(it.ang)*it.len*0.4,cy-it.len*0.4,it.hx,it.hy);

      lp.moveTo(mx,my);lp.quadraticCurveTo(mx+size*0.06,my-size*0.05,mx+size*0.1,my-size*0.01);lp.quadraticCurveTo(mx+size*0.05,my+size*0.01,mx,my);cs(g,lp,'white',1.4,0.5);}
  }
  for(const it of order){
    const r=size*(it.st.t?0.135:0.105);
    const cols=[colOf(it.st.c)].concat(it.st.lc.map(colOf));cols.center=centerCol();
    g.save();g.translate(it.hx,it.hy);g.rotate(it.ang*0.6);

  }

  hatchIn(g,wp,cx-size*0.25,cy-size*0.05,cx+size*0.25,cy+size*0.45,'white',0.3,Math.max(3,size*0.035),2.2);
  cs2(g,wp,'white',Math.max(1.5,size*0.018),0.85);
  const rb=new Path2D(),by=cy+size*0.1,rc=S.pal[2];
  rb.moveTo(cx,by);rb.quadraticCurveTo(cx-size*0.16,by-size*0.12,cx-size*0.14,by+size*0.02);rb.quadraticCurveTo(cx-size*0.08,by+size*0.04,cx,by);
  rb.quadraticCurveTo(cx+size*0.16,by-size*0.12,cx+size*0.14,by+size*0.02);rb.quadraticCurveTo(cx+size*0.08,by+size*0.04,cx,by);
  rb.moveTo(cx,by);rb.lineTo(cx-size*0.07,by+size*0.16);rb.moveTo(cx,by);rb.lineTo(cx+size*0.06,by+size*0.17);
  cs(g,rb,rc,Math.max(1.6,size*0.02),0.95);

}

/* ---------------- guidance (one invitation at a time) & demo hand ---------------- */
const HD={on:false,type:'',t0:0,path:[],ghost:[],abort:-9};
function latestStroke(pref){

}
function computeInvite(){
  if(S.ptr)return null;

  if(S.mode==='bloom'||S.mode==='reset')return null;
  if(S.strokes.length===0)return{type:'chalk'};
  const idle=T-S.lastInput;
  if(idle<1.6||FL.length||B.act)return null;
  if(S.mode==='garden'){
    if(S.strokes.length<3&&!S.disc.long)return S.countShort>=2?{type:'long'}:{type:'chalk'};
    if(!S.disc.long&&S.countShort>=2)return{type:'long'};
    if(!S.disc.retrace){const s=latestStroke(x=>x.kind==='long'&&!x.passes[0].dotted)||latestStroke(x=>!x.passes[0].dotted)||latestStroke();return s?{type:'retrace',sid:s.id}:null;}
    if(!S.disc.cross){const s=latestStroke(x=>x.kind==='long')||latestStroke();return s?{type:'cross',sid:s.id}:null;}

  }

/* ---------------- input ---------------- */
function toLocal(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function hitChalk(p){for(let i=0;i<L.chalks.length;i++){const c=L.chalks[i];if(Math.abs(p.x-c.x)<=c.hw/2&&Math.abs(p.y-c.hy)<=c.hh/2)return i;}return -1;}
function hitBoy(p){const h=L.boyH;return Math.abs(p.x-L.boyX)<h*0.22&&p.y>L.boyY-h*1.0&&p.y<L.boyY;}
function hitOffer(p){const o=S.offer;if(!o)return false;return dist(p.x,p.y,o.x,o.y-o.size*0.22)<Math.max(52,o.size*0.58);}
function nearestStroke(p,maxD){let best=null,bd=maxD;for(const s of S.strokes){if(p.x<s.bb.x0-maxD||p.x>s.bb.x1+maxD||p.y<s.bb.y0-maxD||p.y>s.bb.y1+maxD)continue;const d=minDistTo(p.x,p.y,s);if(d<bd){bd=d;best=s;}}return best;}
function onDown(e){
  if(e.cancelable)e.preventDefault();

  if(S.offer&&(S.offer.state==='offer'||S.offer.state==='build')&&hitOffer(p)){acceptBouquet();return;}
  const ci=hitChalk(p);
  if(ci>=0){S.chalk=ci;S.chalkLift[ci]=T;sWood();const c=L.chalks[ci];dust(c.x,c.y-6,4,colOf(ci),40,true);logE('chalk',ci);return;}
  if(hitBoy(p)){boyPoke();return;}
  const fl=flowerHit(p.x,p.y);
  if(fl&&!inDraw(p.x,p.y)){fl.pop=0.8;if(fl.bloomed)singFlower(fl,{gain:0.7});logE('poke-flower',fl.id);return;}
  if(S.mode==='reset'||!inDraw(p.x,p.y))return;
  const pl=nearestStroke(p,L.tol*0.8);
  S.ptr={id:e.pointerId,pts:[p],len:0,c:S.chalk,pluck:pl,stamped:false,lastT:performance.now(),consumed:false,longCue:false,dustL:0,rnd:Math.random,carry:0};
  if(!pl){stampDab(inkG,colOf(S.chalk),p.x,p.y,L.lw,R,1);stampDab(inkG,colOf(S.chalk),p.x+0.5,p.y,L.lw*0.8,R,0.9);inkG.globalAlpha=1;S.ptr.stamped=true;}
  dust(p.x,p.y,4,colOf(S.chalk),45);

  try{cv.setPointerCapture(e.pointerId);}catch(_){}
}
function onMove(e){

}
function moveTo(p){

  const last=pt.pts[pt.pts.length-1],d=dist(last.x,last.y,q.x,q.y);

    const nowMs=performance.now(),sp=d/Math.max(4,nowMs-pt.lastT);pt.lastT=nowMs;
    scratch(clamp(0.35+sp*0.6,0,1),pt.len/L.long);
    if(pt.len-pt.dustL>16){pt.dustL=pt.len;dust(q.x,q.y,1,colOf(pt.c),30);}

function finishStroke(pt,cancel){

    const p=pt.pts[0],a=rr(-0.5,0.3),sp=L.lw*1.8,dots=[],line=[];
    for(let i=0;i<3;i++)dots.push({x:p.x+Math.cos(a)*sp*i,y:p.y+Math.sin(a)*sp*i});
    for(let i=0;i<=6;i++)line.push({x:p.x+Math.cos(a)*sp*i/3,y:p.y+Math.sin(a)*sp*i/3});

/* ---------------- update ---------------- */
function update(dt){
  if(needLayout){needLayout=false;layout();}
  runTimers();
  // band & bed
  if(S.bandT0>0&&S.bandFall<0)S.bandRise=clamp((T-S.bandT0)/1.3,0,1);
  if(S.bandFall>0)S.bandRise=clamp(1-(T-S.bandFall)/0.9,0,1);
  if(S.mode==='garden')S.bedAlpha=S.bedInT>0?clamp((T-S.bedInT)/0.8,0,1):1;
  else if(S.mode==='reset')S.bedAlpha=S.bedInT>0?clamp((T-S.bedInT)/0.8,0,1):0;
  else S.bedAlpha=clamp(1-(T-S.bandT0)/1.0,0,1);
  if(S.mode==='stage'||S.mode==='bloom'){S.tintA=S.tintT0>0?clamp((T-S.tintT0)/1.2,0,1):0;}
  else if(S.mode==='reset')S.tintA=Math.max(0,S.tintA-dt*0.8);
  // flowers
  for(const f of S.flowers){
    if(f.st==='sprout')f.growth=lerp(0,0.35,easeOut((T-f.sproutT)/0.35));
    else if(f.st==='grow'){f.growth=lerp(0.35,1,ease((T-f.growT0)/f.growDur));f.bloom=clamp((T-f.growT0-f.growDur*0.5)/0.4,0,1);}
    else if(f.st==='open'){f.growth=1;f.bloom=1;}
    f.pop*=Math.pow(0.02,dt);
    const singing=T<f.singT0+f.singDur;
    f.env=lerp(f.env,singing?1:0,clamp(dt*(singing?18:7),0,1));
    let fd=0;
    if(T<f.faceUntil){const o=fById(f.faceTo);if(o)fd=Math.sign(o.bx-f.bx)||0;}
    f.face=lerp(f.face,fd,clamp(dt*6,0,1));
    f.rise=lerp(f.rise,T<f.riseUntil?1:0,clamp(dt*5,0,1));
    const pp=fPlacePos(f);
    if(f.jump){const p=clamp((T-f.jump.t0)/f.jump.dur,0,1),e=ease(p);
      f.bx=lerp(f.jump.fx,pp.x,e);f.by=lerp(f.jump.fy,pp.y,e)-Math.sin(p*PI)*L.ts*0.6;if(p>=1)f.jump=null;}
    else{f.bx=pp.x;f.by=pp.y;}
  }
  if(S.flowers.length&&S.mode==='reset'){
    for(const f of S.flowers){if(f.leave>0&&T>f.leave&&!f.gone){f.gone=true;
      for(let i=0;i<3;i++)addFlight(f.hx+rr(-6,6),f.hy+rr(-6,6),()=>({x:L.pin.x,y:L.pin.y}),rr(0.6,0.9),colOf(f.c),null);}}
  }
  if(S.mode==='garden'&&(T%1)<dt){
    for(const f of S.flowers){
      if(f.st==='sprout'&&T-f.sproutT>3&&!(B.act&&B.act.fid===f.id)&&!B.q.some(q=>q.fid===f.id))boyQ({type:'water',fid:f.id});
    }
  }
  boyUpdate(dt);
  songUpdate();
  updateFlights(dt);updateParticles(dt);
  for(const m of S.marks)m.flash*=Math.pow(0.05,dt);
  S.arcs=S.arcs.filter(a=>T-a.t0<0.9);
  // eraser wipe (reset)
  if(S.eraser){
    const e=S.eraser,p=clamp((T-e.t0)/e.dur,0,1),d=L.draw,rows=4;
    const rp=p*rows,ri=Math.min(rows-1,Math.floor(rp)),f=rp-ri;
    const ex=ri%2===0?lerp(d.x0,d.x1,f):lerp(d.x1,d.x0,f),ey=lerp(d.y0+(d.y1-d.y0)*0.12,d.y1-(d.y1-d.y0)*0.1,ri/(rows-1))+Math.sin(f*PI*3)*U*0.03;
    if(e.lx!=null){
      inkG.setTransform(1,0,0,1,0,0);inkG.globalCompositeOperation='destination-out';inkG.globalAlpha=0.9;inkG.lineCap='round';
      inkG.lineWidth=U*0.2*dpr;inkG.strokeStyle='#000';inkG.beginPath();inkG.moveTo(e.lx*dpr,e.ly*dpr);inkG.lineTo(ex*dpr,ey*dpr);inkG.stroke();
      inkG.globalCompositeOperation='source-over';inkG.globalAlpha=1;
      boardVer++;boardG.setTransform(dpr,0,0,dpr,0,0);boardG.globalAlpha=0.014;boardG.strokeStyle=grain.white;boardG.lineWidth=U*0.13;boardG.lineCap='round';
      boardG.beginPath();boardG.moveTo(e.lx,e.ly);boardG.lineTo(ex,ey);boardG.stroke();boardG.globalAlpha=1;
      if(R()<0.5)dust(ex,ey+U*0.06,1,'white',40);
    }
    e.lx=ex;e.ly=ey;e.x=ex;e.y=ey;
    if(p>=1)S.eraser=null;
  }
  // invitation & demo
  S.invite=computeInvite();
  if(S.invite&&!HD.on&&!S.ptr){
    const dt2=(S.invite.type==='chalk'&&S.strokes.length===0&&S.cycle===0)?'draw':null;
    const idle=T-S.lastInput;
    if(dt2&&!S.demoDone[dt2]&&idle>=(dt2==='draw'?4.0:4.6))startDemo(dt2,S.invite);
  }
  updateDemo();
  // boy look target
  let lx=L.draw.x0+(L.draw.x1-L.draw.x0)*0.5,ly=L.draw.y0+(L.draw.y1-L.draw.y0)*0.45;
  if(S.ptr&&!S.ptr.consumed){const q=S.ptr.pts[S.ptr.pts.length-1];lx=q.x;ly=q.y;}
  else if(HD.on){const hp=handPos();lx=hp.x;ly=hp.y;}
  else if(T<B.lookUntil&&fById(B.lookAtF)){const f=fById(B.lookAtF);lx=f.hx;ly=f.hy;}
  else if(S.eraser){lx=S.eraser.x;ly=S.eraser.y;}
  else if(S.invite){
    const iv=S.invite;
    if(iv.type==='chalk'){const c=L.chalks[S.chalk];const ph=(T%4)<2;lx=ph?c.x:lx;ly=ph?c.y:ly;}
    else if((iv.type==='retrace'||iv.type==='cross')&&sById(iv.sid)){const m=lineMid(sById(iv.sid));lx=m.x;ly=m.y;}
    else if(iv.type==='bouquet'){lx=W*0.3;ly=H*0.55;}
    else if(iv.type==='slot'){const sl=L.slots[S.flowers.length];if(sl){lx=sl.x;ly=sl.y;}}
  }else if(S.mode==='garden'&&S.flowers.length===0){const ph=Math.floor(T/1.3)%3;if(ph===1){lx=L.slots[0].x;ly=L.slots[0].y-20;}else if(ph===2){lx=L.slots[L.slots.length-1].x;ly=L.slots[L.slots.length-1].y;}}
  B.lookX=lx;B.lookY=ly;B.lx=lerp(B.lx||lx,lx,clamp(dt*8,0,1));B.ly=lerp(B.ly||ly,ly,clamp(dt*8,0,1));
  if(!S.ptr&&scrLevel>0)scratch(0);
}

/* ---------------- render ---------------- */
const bgC=document.createElement('canvas');let bgKey='',boardVer=0;

function drawTint(){

    for(let i=0;i<seq.length;i++){

      ctx.save();ctx.beginPath();ctx.arc(cx,cy,Math.max(1,r1),0,TAU);if(r0>0)ctx.arc(cx,cy,r0,0,TAU,true);ctx.clip('evenodd');
      ctx.globalAlpha=seq[i][1];ctx.drawImage(rubC[col+seq[i][2]],0,0,W,H);

      ctx.globalAlpha=0.35*Math.sin(p*PI);ctx.drawImage(rubC[S.pal[1]+'1'],0,0,W,H);ctx.restore();}

function drawPinned(g){

function strokePathDisp(s,amp,ph,col,w,a){
  const ps=s.passes[0];
  if(ps.dotted){for(let i=0;i<ps.rs.dots.length;i++){const d=ps.rs.dots[i];dabAt(ctx,col,d.x,d.y+Math.sin(ph+i)*amp*0.6,w*1.4,a,i);}return;}
  const rs=ps.rs,n=rs.length;if(n<2)return;
  const p=new Path2D();
  for(let i=0;i<n;i++){
    const a0=rs[Math.max(0,i-1)],a1=rs[Math.min(n-1,i+1)];let nx=-(a1.y-a0.y),ny=a1.x-a0.x;const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
    const d=amp*Math.sin(PI*i/(n-1))*Math.cos(ph);
    const x=rs[i].x+nx*d,y=rs[i].y+ny*d;if(i)p.lineTo(x,y);else p.moveTo(x,y);
  }
  cs(ctx,p,col,w,a);
}
function drawLineFx(){

    const amp=s.vibA*Math.exp(-(T-s.vibT0)*4);
    if(amp>0.35&&cnt<6){cnt++;strokePathDisp(s,amp,(T-s.vibT0)*40,colOf(s.passes[s.passes.length-1].c),L.lw*0.7,clamp(amp/5,0.3,0.95));}
  }

      if(iv.type==='retrace'){

        strokePathDisp(s,0,0,'white',L.lw*0.45,0.18+0.12*Math.sin(T*5));
        for(let k=0;k<4;k++){const j=Math.max(0,i-k*3),qq=rs[j];dabAt(ctx,'white',qq.x,qq.y,L.lw*(1.2-k*0.22),0.9-k*0.2,k);}
        starAt(q.x,q.y,L.lw*0.9,S.pal[1],0.9,T*3);

        const ph=(T%1.8);const amp=ph<0.5?Math.sin(ph/0.5*PI)*L.lw*0.7:0;

        const m=lineMid(s);starAt(m.x,m.y,L.lw*(0.6+0.25*Math.sin(T*4)),S.pal[1],0.55,0);
      }
    }
  }
  for(const m of S.marks){starAt(m.x,m.y,L.lw*(0.75+0.8*m.flash),m.flash>0.2?S.pal[1]:'white',0.55+0.4*m.flash,m.x*0.1);}
}
function starAt(x,y,r,col,a,rot){
  const p=new Path2D();
  for(let i=0;i<4;i++){const an=rot+i*PI/4,rr2=i%2?r*0.55:r;p.moveTo(x-Math.cos(an)*rr2,y-Math.sin(an)*rr2);p.lineTo(x+Math.cos(an)*rr2,y+Math.sin(an)*rr2);}
  cs(ctx,p,col,Math.max(1.5,r*0.22),a);

function drawBed(ctx){
  const a=S.bedAlpha;if(a<=0.01)return;
  const top=L.tierY[L.tiers-1]-L.ts*0.32,bot=L.tierY[0]+L.ts*0.2,x0=L.bedX0,x1=L.bedX1,nar=L.bedNar*1.4;
  ctx.save();
  // raised bed frame (seen a little from above): sides narrow toward the back
  const fr=new Path2D();
  fr.moveTo(x0,bot);fr.lineTo(x0+nar,top);fr.moveTo(x1-nar,top);fr.lineTo(x1,bot);
  cs(ctx,fr,'white',2,0.35*a);
  // front border of stones
  const bh=L.ts*0.16,br=new Path2D();
  br.moveTo(x0-3,bot);br.lineTo(x1+3,bot);br.moveTo(x0-1,bot+bh);br.lineTo(x1+1,bot+bh);
  const nb=6;for(let k=0;k<=nb;k++){const x=lerp(x0,x1,k/nb);br.moveTo(x,bot+2);br.lineTo(x+1,bot+bh*0.5);if(k<nb){const x2=lerp(x0,x1,(k+0.5)/nb);br.moveTo(x2,bot+bh*0.5);br.lineTo(x2+1,bot+bh-2);}}
  br.moveTo(x0,bot+bh*0.5);br.lineTo(x1,bot+bh*0.5);
  cs(ctx,br,'white',1.8,0.55*a);
  const bp=new Path2D();bp.rect(x0,bot,x1-x0,bh);hatchIn(ctx,bp,x0,bot,x1,bot+bh,'white',0.14*a,4,2.3);
  // soil rows (furrows) from back to front
  for(let i=L.tiers-1;i>=0;i--){
    const y=L.tierY[i],geo=L.bedGeo[i],k=i/Math.max(1,L.tiers-1);
    const xl=x0+nar*k+6,xr=x1-nar*k-6;
    const ap=S.mode==='reset'?clamp((S.bedAlpha*1.5)-(i*0.15),0,1):a;
    if(ap<=0.01)continue;
    const row=new Path2D(),band=new Path2D(),yb=y+L.ts*0.07;
    for(let q=0;q<=10;q++){const u=q/10,x=lerp(xl,xr,u),yy=y-Math.sin(u*PI)*L.ts*0.06-Math.abs(Math.sin(u*PI*3))*L.ts*0.04+geo.bumps[q]*0.5;if(q){row.lineTo(x,yy);band.lineTo(x,yy);}else{row.moveTo(x,yy);band.moveTo(x,yy);}}
    band.lineTo(xr-3,yb);band.lineTo(xl+3,yb);band.closePath();
    hatchIn(ctx,band,xl,y-L.ts*0.12,xr,yb,'white',0.3*ap,Math.max(3,L.ts*0.03),2.1);
    cs2(ctx,row,'white',2.4,0.8*ap);
    const under=new Path2D();under.moveTo(xl+3,yb);under.lineTo(xr-3,yb);cs(ctx,under,'white',1.6,0.4*ap);
    for(const d of geo.dots){const x=lerp(xl+4,xr-4,d.u);dabAt(ctx,'white',x,y-1+d.v*L.ts*0.06,2.4*d.s,0.36*ap,(d.u*10)|0);}
  }
  ctx.restore();
}
function drawBedSlots(){

      if(inv){starAt(s.x,yy-w*1.4-Math.abs(Math.sin(T*4))*6,w*0.9,S.pal[1],0.9,T*2);}

}
function drawStageBand(ctx){
  const r=S.bandRise;if(r<=0.005)return;
  const bt=bandTopNow(),y2=bt+L.bandH*0.46,yb=L.trayY+2;
  const top=new Path2D(),step=new Path2D();
  for(let k=0;k<=24;k++){const x=lerp(-4,W+4,k/24);const yy=bt+L.bandGeo[k];if(k)top.lineTo(x,yy);else top.moveTo(x,yy);

  const area=new Path2D();area.rect(0,bt,W,yb-bt);

  const blink=((T+0.7)%3.7)<0.11;
  for(const sx of[-1,1]){
    const ec=new Path2D();
    if(blink){ec.moveTo(htx+sx*5*s-2.4*s,hty-1*s);ec.lineTo(htx+sx*5*s+2.4*s,hty-1*s);cs(ctx,ec,'white',1.8,0.9);}
    else{wobCircle(ec,htx+sx*5*s,hty-1*s,2.8*s,sx+9,10);cs(ctx,ec,'white',Math.max(1.2,1.4*s),0.85);
      dabAt(ctx,'white',htx+sx*5*s+ex,hty-1*s+ey,Math.max(2.4,2.6*s),0.95,sx+2);}
  }
  const ck=new Path2D();for(const sx of[-1,1]){for(let k=0;k<3;k++){const cx=htx+sx*9*s,cy=hty+4*s;ck.moveTo(cx-2.5*s,cy+k*1.2*s-1*s);ck.lineTo(cx+2.5*s,cy+k*1.2*s-1.6*s);}}
  cs(ctx,ck,cheekCol(),1.6,0.7);
  const mp=new Path2D();
  const happy=jt<0.8||T-B.pokeT<0.8||offering||(S.mode==='stage'&&T-B.beatT<0.3);
  if(happy){mp.ellipse(htx+ldx*0.6*s,hty+6.5*s,3.4*s,2.6*s,0,0,PI);mp.closePath();}
  else if(restless){mp.moveTo(htx-2.5*s,hty+7*s);mp.quadraticCurveTo(htx,hty+6*s,htx+2.5*s,hty+7.2*s);}
  else{mp.moveTo(htx-3.2*s,hty+6*s);mp.quadraticCurveTo(htx,hty+8.6*s,htx+3.2*s,hty+6*s);}
  cs(ctx,mp,'white',Math.max(1.5,1.8*s),0.9);
  ctx.restore();
  ctx.restore();
}
function drawEraser(){
  const e=S.eraser;if(!e||e.x==null)return;
  const w=U*0.16,h=U*0.06;
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(Math.sin(T*9)*0.08);
  const p=new Path2D();p.rect(-w/2,-h/2,w,h*0.55);
  const p2=new Path2D();p2.rect(-w/2,h*0.05,w,h*0.45);
  hatchIn(ctx,p,-w/2,-h/2,w/2,h*0.05,S.pal[1],0.55,3,0.3);cs(ctx,p,'white',2,0.85);
  hatchIn(ctx,p2,-w/2,0,w/2,h/2,'white',0.35,2.4,1.2);cs(ctx,p2,'white',2,0.8);
  ctx.restore();
}
function drawFlights(){
  for(const f of FL){
    if(T<f.t0)continue;
    if(f.spr&&f.spr.spr){const fl=f.spr,ext=(fl.sprExt||10)*0.8;ctx.globalAlpha=0.9;ctx.drawImage(fl.spr,f.x-ext,f.y-ext,ext*2,ext*2);continue;}
    dabAt(ctx,f.col,f.x,f.y,f.big?L.lw*1.5:L.lw*0.9,0.95,(T*20)|0);
    if(f.big)starAt(f.x,f.y,L.lw*0.8,'white',0.7,T*6);
  }
  ctx.globalAlpha=1;
}
function drawParticles(){
  for(const p of P){
    const a=clamp(1-p.life/p.max,0,1);
    if(p.k===1){starAt(p.x,p.y,p.sz*(0.6+0.4*a),p.col,a*0.9,(p.rot||0)+p.life*3);}
    else dabAt(ctx,p.col,p.x,p.y,p.sz*2,(p.k===2?0.9:0.75)*(p.k===2?1:a),(p.x|0));
  }
  ctx.globalAlpha=1;
}
function drawHand(){
  if(HD.on){
    for(const g of HD.ghost){const a=clamp(1-(T-g.t)/1.8,0,1)*(HD.abort>0?clamp(1-(T-HD.abort)/0.25,0,1):1);if(a>0)dabAt(ctx,'white',g.x,g.y,L.lw*0.85,0.5*a,(g.x|0));}
    const hp=handPos();let a=1;if(HD.abort>0)a=clamp(1-(T-HD.abort)/0.25,0,1);
    const s=clamp(U*0.0026,0.85,1.7);
    ctx.save();ctx.translate(hp.x,hp.y+(hp.down?0:-6));ctx.scale(s,s);
    // pointing hand: fingertip at the origin, hand and sleeve toward lower-right
    const ch=new Path2D();ch.moveTo(-1,-1);ch.lineTo(5,8);cs(ctx,ch,'white',5,0.85*a);
    const fg=new Path2D();
    fg.moveTo(-2,6);fg.quadraticCurveTo(-3,0,2,1);fg.quadraticCurveTo(6,2,9,7);fg.lineTo(20,24);
    fg.moveTo(-2,6);fg.lineTo(10,27);
    const palm=new Path2D();
    palm.moveTo(10,27);palm.quadraticCurveTo(6,36,12,44);palm.quadraticCurveTo(20,54,34,50);palm.quadraticCurveTo(44,44,40,32);palm.quadraticCurveTo(34,22,20,24);
    const kn=new Path2D();kn.moveTo(13,34);kn.quadraticCurveTo(18,33,20,37);kn.moveTo(15,41);kn.quadraticCurveTo(21,40,23,44);
    kn.moveTo(26,25);kn.quadraticCurveTo(24,18,30,17);kn.quadraticCurveTo(35,18,34,27);
    const sl=new Path2D();sl.moveTo(34,50);sl.lineTo(50,70);sl.moveTo(40,32);sl.lineTo(60,56);sl.moveTo(46,74);sl.lineTo(64,52);
    hatchIn(ctx,palm,8,20,44,54,'white',0.25*a,4,0.8);
    cs2(ctx,fg,'white',2.4,0.9*a);cs2(ctx,palm,'white',2.4,0.9*a);cs(ctx,kn,'white',1.8,0.7*a);cs2(ctx,sl,'white',2.4,0.85*a);
    ctx.restore();ctx.globalAlpha=1;
  }
}
function drawOffer(){
  const o=S.offer;if(!o)return;
  const key=o.stems.length+'|'+S.pal.join(',')+'|'+o.size.toFixed(1)+'|'+dpr;
  if(!o.spr||o.sprKey!==key){o.spr=bouquetSprite(o.stems,o.size,31);o.sprKey=key;}
  let x=L.offer.x,y=L.offer.y,sc=1,a=1;
  if(o.state==='build'){const p=clamp((T-o.t0)/(0.55+o.src.length*0.08),0,1);sc=0.3+0.7*easeOut(p);a=p;}
  else if(o.state==='offer'){const k=T-o.t0;sc=1+0.05*Math.sin(k*5);y-=Math.abs(Math.sin(k*2.6))*6;
    const hp=new Path2D();const rx=o.size*0.6,ry=o.size*0.64,hcx=x,hcy=y-o.size*0.28;for(let i=0;i<18;i++){const an=i/18*TAU+k*0.7;hp.moveTo(hcx+Math.cos(an)*rx,hcy+Math.sin(an)*ry);hp.lineTo(hcx+Math.cos(an+0.14)*rx,hcy+Math.sin(an+0.14)*ry);}
    cs(ctx,hp,S.pal[1],2.4,0.5+0.35*Math.sin(k*6));}
  else if(o.state==='fly'){const p=ease((T-o.t0)/0.9);x=lerp(o.fx,L.pin.x,p);y=lerp(o.fy,L.pin.y,p)-Math.sin(p*PI)*U*0.15;sc=lerp(1,L.pin.size/o.size,p);}
  o.x=x;o.y=y;
  const e=o.spr.ext*sc,tilt=0;
  ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
  ctx.globalAlpha=a;ctx.drawImage(o.spr,-e,-o.size*0.1*sc-e,e*2,e*2);ctx.restore();ctx.globalAlpha=1;
}

/* ---------------- main loop & lifecycle ---------------- */
let running=false,rafId=0,lastTs=null;
function frame(ts){
  if(!running)return;
  rafId=requestAnimationFrame(frame);
  if(lastTs==null)lastTs=ts;
  let dt=(ts-lastTs)/1000;lastTs=ts;
  if(!(dt>0))dt=0;if(dt>0.05)dt=0.05;
  T+=dt;
  update(dt);
  render();
}
function pause(){
  if(!running)return;running=false;cancelAnimationFrame(rafId);
  if(S.ptr){const pt=S.ptr;S.ptr=null;if(!pt.consumed&&pt.len>=20)finishStroke(pt,true);}
  scratch(0);
  try{if(A.ctx&&A.ctx.state==='running'){const p=A.ctx.suspend();if(p&&p.catch)p.catch(()=>{});}}catch(e){}
}
function resume(){
  if(running)return;running=true;lastTs=null;S.lastInput=T;
  try{if(A.ctx&&A.ctx.state!=='running'&&gestureOK()){const p=A.ctx.resume();if(p&&p.catch)p.catch(()=>{});}}catch(e){}
  rafId=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume();});
window.addEventListener('pagehide',pause);
window.addEventListener('pageshow',()=>{if(!document.hidden)resume();});
window.addEventListener('resize',()=>{needLayout=true;});
window.addEventListener('orientationchange',()=>{needLayout=true;});

// debug/test surface (no UI)
window.__g41={
  snap:()=>({mode:S.mode,strokes:S.strokes.length,passes:S.strokes.reduce((a,s)=>a+s.passes.length,0),flowers:S.flowers.length,
    bloomed:S.flowers.filter(f=>f.bloomed).length,sprouts:S.flowers.filter(f=>f.st!=='seed').length,pairs:S.pairs.length,marks:S.marks.length,
    disc:Object.assign({},S.disc),pal:S.pal.slice(),chalk:S.chalk,leadSmall:S.leadSmall,leadTall:S.leadTall,offer:S.offer?S.offer.state:null,
    offerStems:S.offer?S.offer.stems.map(s=>({t:s.t,l:s.l.length})):null,pinned:S.pinned?S.pinned.stems.length:0,saveState:S.saveState,
    audio:A.ctx?A.ctx.state:'none',voices:A.live,particles:P.length,flights:FL.length,boy:B.act?B.act.type:null,boyQ:B.q.length,
    invite:S.invite?S.invite.type:null,demo:HD.on?HD.type:null,stageLog:S.stageLog.map(e=>e.type),cycle:S.cycle,T:+T.toFixed(2),
    layout:{W,H,dpr,draw:Object.assign({},L.draw),colX:L.colX,trayY:L.trayY,boyX:L.boyX,boyY:L.boyY,boyH:L.boyH,long:L.long,tol:L.tol,
      chalks:L.chalks.map(c=>({x:c.x,y:c.hy,w:c.hw,h:c.hh})),slots:L.slots.map(s=>({x:s.x,y:s.y})),offer:Object.assign({},L.offer),pin:Object.assign({},L.pin)},
    fl:S.flowers.map(f=>({id:f.id,kind:f.kind,st:f.st,layers:f.layers.length,partners:f.partners.length,hx:+f.hx.toFixed(1),hy:+f.hy.toFixed(1),bx:+f.bx.toFixed(1),by:+f.by.toFixed(1),place:f.place,k:f.voiceK})),
    st:S.strokes.map(s=>({id:s.id,kind:s.kind,len:+s.len.toFixed(1),passes:s.passes.length,flower:s.flower,cx:+s.cx.toFixed(1),cy:+s.cy.toFixed(1)})),
    log:S.log.slice(-60)})
};

// boot
S.pinned=(()=>{const st=loadSaved();return st?{stems:st}:null;})();
layout();needLayout=false;
B.lx=L.draw.x0+(L.draw.x1-L.draw.x0)*0.5;B.ly=H*0.4;
running=!document.hidden;
if(running)rafId=requestAnimationFrame(frame);
})();
</script>
