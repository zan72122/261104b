<script>
(()=>{
'use strict';
// ================= basics =================
const TAU=Math.PI*2, PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-(1-t)*(1-t);
const eio=t=>t<.5?2*t*t:1-2*(1-t)*(1-t);
const rnd=(a,b)=>a+Math.random()*(b-a);
const damp=(c,t,r,dt)=>c+(t-c)*(1-Math.exp(-r*dt));
const cv=document.getElementById('c');
const mainCtx=cv.getContext('2d');
let ctx=mainCtx;
const saEl=document.getElementById('sa');

// palette: kinari cloth + vermilion / yamabuki / wakakusa / sora / koge-cha
const COL={kin:'#efe4cc',kin2:'#e2d1b0',kin3:'#cdb68c',red:'#d8432a',yel:'#eda21c',yel2:'#f4c35a',
  grn:'#82b13a',grn2:'#a5c95e',sky:'#4ea5d2',brn:'#5a3921',brn2:'#7d5535',skin:'#f1d2aa',
  gray:'#cbc1ab',dough:'#d6a764'};
const BC=[COL.red,COL.yel,COL.grn]; // bread colour == pattern: 0 swirl(strawberry) 1 stripe(butter twist) 2 dot(green round)
const NOTE=[523.25,659.25,783.99];
const FEST_ROWS=7,MAX_ROWS=12,KNIT_STEP=0.25;
function rowH(){return Math.min(8,56/Math.max(1,fest.rows.length));}
const SHC={};
function shade(h,a){const k=h+a;if(SHC[k])return SHC[k];const n=parseInt(h.slice(1),16);
  const r=n>>16&255,g=n>>8&255,b=n&255,t=a<0?0:255,p=Math.abs(a);const f=v=>Math.round(v+(t-v)*p);
  return SHC[k]='rgb('+f(r)+','+f(g)+','+f(b)+')';}
function rgba(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}

// ================= knit textures =================
const STITCH=7;
let SC=1; // device px per design unit
function makeTile(hex,px){
  const w=Math.max(3,Math.round(STITCH*px)),h=Math.max(3,Math.round(STITCH*0.8*px));
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=shade(hex,-0.3);g.fillRect(0,0,w,h);
  for(let oy=-h;oy<=h;oy+=h){for(let s=-1;s<=1;s+=2){
    g.save();g.translate(w/2+s*w*0.22,h*0.45+oy);g.rotate(-s*0.5);
    g.fillStyle=hex;g.beginPath();g.ellipse(0,0,w*0.26,h*0.64,0,0,TAU);g.fill();
    g.fillStyle=shade(hex,0.2);g.beginPath();g.ellipse(0,-h*0.2,w*0.09,h*0.27,0,0,TAU);g.fill();
    g.restore();}}
  return c;
}
function makeLinen(px){
  const w=Math.max(4,Math.round(6*px));const c=document.createElement('canvas');c.width=w;c.height=w;
  const g=c.getContext('2d');g.fillStyle=COL.kin;g.fillRect(0,0,w,w);
  g.fillStyle='rgba(150,120,80,.13)';g.fillRect(0,0,w,Math.max(1,w*0.18));g.fillRect(0,0,Math.max(1,w*0.18),w);
  g.fillStyle='rgba(255,255,255,.25)';g.fillRect(w*0.5,w*0.5,w*0.3,w*0.3);return c;
}
function pat(hex){
  const g=ctx;const cache=g.__p||(g.__p={});
  let p=cache[hex];if(p)return p;
  try{
    const t=hex==='linen'?makeLinen(SC):makeTile(hex,SC);p=g.createPattern(t,'repeat');
    if(p&&typeof p.setTransform==='function'&&typeof DOMMatrix==='function'){p.setTransform(new DOMMatrix([1/SC,0,0,1/SC,0,0]));}
    else{p=g.createPattern(hex==='linen'?makeLinen(1):makeTile(hex,1),'repeat');}
  }catch(e){p=null;}
  return cache[hex]=p||(hex==='linen'?COL.kin:hex);
}

// ================= state =================
let W=1,H=1,DPR=1,K=1,DW=390,DH=720;
const L={};
const TSC=[1.04,0.93,0.98,0.9]; // 0 hat uncle, 1 girl, 2 grandma, 3 boy
let custs=[],line=[],sel=-1,nextId=1,eats=0,everGiven=false,drags=0,dragSkip=false,round=0,lastCol=0;
const breads=[0,1,2].map(i=>({slot:i,type:[1,0,2][i],p:0,v:0,regrow:1,hopT:0,hop:0,sc:i===1?1.12:1}));
const flights=[];
let linkVis=[];
let phase='shop',phT=0,open=0,holdT=0,awn=0;
const fest={t:0,groups:[],turn:0,turnT:0,last:-1,rows:[],rowK:1,same:true,beat:0,sawSame:false,sawMix:false};
const garlands=[];
const sk={lean:0,slot:-1,knitT:0,nod:0,lx:0,ly:0,humAt:-9,wob:0,loopT:0};
const guide={idle:0,demo:null,demos:0,inv:null,manualT:0,invT:0,lastT:-1};
const parts=[];
const wob={flag:0,houses:[0,0,0,0,0,0,0,0],awn:0};
let time=0,drag=null;

function mkCust(type){return{id:nextId++,type,x:0,tx:0,dx:0,dy:0,sx:1,hop:0,base:-1,over:-1,third:-1,cuff:-1,
  lv:[0,0,0],muff:null,q:[],held:-1,bites:0,st:'idle',stt:0,speed:1,rev:null,prev:null,wave:0,mot:rnd(0,6),
  hl:[-40,-52],hr:[40,-52],lk:[0,0],blink:rnd(1,4),cuffP:0,spin:0,leg:0,drag:false,walk:null,leaving:false,
  gone:false,sinceSel:0,newKind:'',shy:0,vx:0};}
function byId(id){for(let i=0;i<custs.length;i++)if(custs[i].id===id)return custs[i];return null;}
function lookOf(c){return{base:c.base,over:c.over,third:c.third,cuff:c.cuff,muff:c.muff,lv:c.lv.slice()};}
function hasC(l,t){return t>=0&&(l.base===t||l.over===t||l.third===t);}

// ================= layout =================
function readSafe(){const s=getComputedStyle(saEl);return{t:parseFloat(s.paddingTop)||0,r:parseFloat(s.paddingRight)||0,
  b:parseFloat(s.paddingBottom)||0,l:parseFloat(s.paddingLeft)||0};}
function slotX(p){const n=Math.max(1,line.length);return L.cx+(p-(n-1)/2)*L.cs;}
function linkX(s){return (slotX(s)+slotX(s+1))/2;}
function breadXY(i){const b=breads[i];return{x:L.cx+(i-1)*L.bs,y:L.counter-6-b.hop};}
function resize(){
  W=Math.max(1,window.innerWidth|0);H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  const sa=readSafe();
  const aw=Math.max(200,W-sa.l-sa.r),ah=Math.max(300,H-sa.t-sa.b);
  K=Math.min(aw/390,ah/720);DW=W/K;DH=H/K;SC=K*DPR;
  L.x0=sa.l/K;L.x1=(W-sa.r)/K;L.y0=sa.t/K;L.y1=(H-sa.b)/K;
  const AW=L.x1-L.x0,AH=L.y1-L.y0;
  L.cx=(L.x0+L.x1)/2;L.ground=L.y1-12;L.counter=L.ground-252;
  const extra=Math.max(0,AH-720);
  L.roof=L.counter-238-extra*0.35;
  L.flagY=L.roof-118;
  L.cs=Math.min(AW*0.31,165);L.bs=Math.min(AW*0.29,125);
  L.shopW=Math.min(AW*0.98,560);L.shopL=L.cx-L.shopW/2;L.shopR=L.cx+L.shopW/2;
  L.winW=Math.min(L.shopW-56,2*L.bs+170);
  L.awnY=L.roof+40;
  L.bigW=Math.min(3*L.cs+130,AW/0.8*0.93);
  L.poleIn=Math.min(L.cs+44,L.shopW/2-16);
  mainCtx.__p={};flagKey='';for(const k in BALLS)delete BALLS[k];
  for(const c of custs){const p=line.indexOf(c.id);if(p>=0&&!c.drag&&!c.walk){c.x=c.tx=slotX(p);}}
}
let flagKey='';

// ================= audio (Web Audio synthesis) =================
const AU={c:null,m:null,nb:null,voices:0};
function auInit(){
  if(AU.c){if(AU.c.state!=='running'&&!document.hidden){try{const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{
    const c=new AC();AU.c=c;
    const m=c.createGain();m.gain.value=0.5;
    if(c.createDynamicsCompressor){const k=c.createDynamicsCompressor();k.threshold.value=-16;k.ratio.value=4;m.connect(k);k.connect(c.destination);}
    else m.connect(c.destination);
    AU.m=m;
    const len=Math.floor(c.sampleRate*1.2);const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
    if(c.resume){const p=c.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){AU.c=null;}
}
function vOk(){return AU.c&&AU.c.state==='running'&&AU.voices<30;}
function tone(f,dur,o){
  o=o||{};if(!vOk())return;
  try{
  const c=AU.c,t0=c.currentTime+(o.delay||0)+0.005;
  const os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);
  if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(30,o.to),t0+(o.slide||dur));
  const g=c.createGain();const v=o.vol||0.15;
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+(o.att||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  let node=os;
  if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;os.connect(fl);node=fl;}
  if(o.vib){const lfo=c.createOscillator();lfo.frequency.value=o.vib;const lg=c.createGain();lg.gain.value=f*0.015;
    lfo.connect(lg);lg.connect(os.frequency);lfo.start(t0);lfo.stop(t0+dur+0.03);}
  node.connect(g);g.connect(AU.m);os.start(t0);os.stop(t0+dur+0.03);
  AU.voices++;os.onended=()=>{AU.voices--;try{g.disconnect();}catch(e){}};
  }catch(e){}
}
function noise(dur,o){
  o=o||{};if(!vOk()||!AU.nb)return;
  try{
  const c=AU.c,t0=c.currentTime+(o.delay||0)+0.005;
  const s=c.createBufferSource();s.buffer=AU.nb;
  const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1200,t0);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t0+dur);f.Q.value=o.q||1;
  const g=c.createGain();g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(o.vol||0.1,t0+(o.att||0.005));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(AU.m);s.start(t0,Math.random()*0.5);s.stop(t0+dur+0.03);
  AU.voices++;s.onended=()=>{AU.voices--;try{g.disconnect();}catch(e){}};
  }catch(e){}
}
const S={
  squash(t,s){tone(NOTE[t]*0.55*(s||1),0.16,{to:NOTE[t]*0.33,vol:0.2});noise(0.07,{f:800,ft:'lowpass',vol:0.07});},
  boing(t){tone(NOTE[t]*0.45,0.24,{type:'triangle',to:NOTE[t]*0.9,slide:0.15,vol:0.1,delay:0.08});},
  whoosh(){noise(0.24,{f:500,f2:2000,q:0.8,vol:0.06});},
  mogu(){tone(200,0.09,{type:'triangle',lp:650,vol:0.18});tone(170,0.1,{type:'triangle',lp:650,vol:0.16,delay:0.15});},
  stitches(t,layer){const b=NOTE[t]*Math.pow(2,(layer*2)/12);const st=[0,2,4,7,9,12];
    for(let i=0;i<6;i++)tone(b*Math.pow(2,st[i]/12),0.07,{type:'square',lp:2200,vol:0.035,delay:i*0.12});},
  pluck(t,strong){tone(NOTE[t]/2,0.7,{type:'triangle',vol:strong?0.2:0.15});tone(NOTE[t],0.45,{vol:0.08,delay:0.01});},
  bell(f,v,d){v=v||0.12;tone(f,1.3,{vol:v,delay:d});tone(f*2.76,0.6,{vol:v*0.3,delay:d});tone(f*5.4,0.3,{vol:v*0.12,delay:d});},
  ratchet(n,gap){for(let i=0;i<n;i++)noise(0.03,{f:2300,q:3,vol:0.08,delay:i*(gap||0.05)});},
  hum(){const m=[392,440,392,349.2,392,440];m.forEach((f,i)=>tone(f,0.3,{type:'triangle',lp:650,vib:5,vol:0.06,delay:i*0.25,att:0.06}));},
  drum(a){tone(a?125:100,0.2,{to:55,vol:0.22});noise(0.05,{f:6000,ft:'highpass',vol:0.025});},
  jingle(t){[0,4,7].forEach((s,i)=>tone(NOTE[t]*Math.pow(2,s/12),0.26,{type:'triangle',vol:0.07,delay:i*0.09}));},
  tick(){tone(880,0.05,{vol:0.035});},
  pop(){tone(rnd(480,900),0.09,{to:220,vol:0.08});},
  select(t){tone(t>=0?NOTE[t]*0.75:440,0.12,{type:'triangle',vol:0.09});tone(t>=0?NOTE[t]:587,0.12,{type:'triangle',vol:0.07,delay:0.07});},
  drop(){tone(330,0.1,{type:'triangle',vol:0.1});tone(262,0.14,{type:'triangle',vol:0.09,delay:0.06});},
  fanfare(){[0,4,7,12,16].forEach((s,i)=>S.bell(523.25*Math.pow(2,s/12),0.09,i*0.13));},
  muff(){S.bell(NOTE[0]*2,0.1,0);S.bell(NOTE[1]*2,0.1,0.14);S.bell(NOTE[2]*2,0.1,0.28);}
};

// ================= clothes model =================
// layers: base = body + sleeve ground, over = knitted onto sleeves, third = hem band; 3 different -> muffler
function applyTo(l,t){
  let kind;
  if(l.base<0){l.base=t;kind='base';}
  else if(l.over<0){if(t===l.base){l.lv[0]++;kind='thick';}else{l.over=t;kind='over';}}
  else if(l.third<0){if(t===l.over){l.lv[1]++;kind='thick';}else{l.third=t;kind='third';if(t!==l.base){l.muff=[l.base,l.over,t];kind='muff';}}}
  else{if(t===l.third){l.lv[2]++;kind='thick';}
    else{const had=!!l.muff;l.base=l.over;l.over=l.third;l.third=t;l.lv=[l.lv[1],l.lv[2],0];kind='slide';
      if(l.base!==l.third){l.muff=[l.base,l.over,l.third];if(!had)kind='muff';}}}
  for(let i=0;i<3;i++)l.lv[i]=Math.min(l.lv[i],3);
  l.cuff=t;return kind;
}
// a link exists when the sleeve-cuff colours match, or a cuff matches the neighbour's body pattern colour
function linkRule(a,b){
  if(!a||!b||a.cuff<0||b.cuff<0)return null;
  if(a.cuff===b.cuff)return{col:a.cuff,strong:true,src:0};
  if(b.base===a.cuff)return{col:a.cuff,strong:false,src:0};
  if(a.base===b.cuff)return{col:b.cuff,strong:false,src:1};
  return null;
}
function effLook(c){return (c.st==='rev'&&c.prev)?c.prev:c;}
function countLinks(order,overId,overLook){
  let n=0;
  for(let s=0;s<order.length-1;s++){
    const a=order[s]===overId?overLook:lookOf(byId(order[s])),b=order[s+1]===overId?overLook:lookOf(byId(order[s+1]));
    if(linkRule(a,b))n++;}
  return n;
}
function isLinkedAt(p){return (p>0&&linkVis[p-1]&&linkVis[p-1].on)||(linkVis[p]&&linkVis[p].on);}

// ================= guidance: choose ONE invitation =================
function scoreBread(c,t){
  const l=lookOf(c);const kind=applyTo(l,t);let s=0;
  s+=kind==='thick'?-1:2;
  const lay=(c.base>=0)+(c.over>=0)+(c.third>=0);
  if(kind==='over'){for(const o of custs)if(o!==c&&!o.leaving&&o.base===l.over&&o.over===l.base)s+=3;}
  if(kind==='over'&&((l.base===1&&l.over===2)||(l.base===2&&l.over===1)))s+=1;
  const before=countLinks(line,-1,null),after=countLinks(line,c.id,l);
  if(lay>=2||eats>=8)s+=(after-before)*3;
  if(eats>=10&&after===line.length-1&&after>before)s+=3;
  if(t===(eats%3))s+=0.15;
  return s;
}
function scoreFest(c,t){
  let s=0;const cuffs=line.map(id=>id===c.id?t:byId(id).cuff);const same=cuffs.every(x=>x===cuffs[0]);
  const big=arr=>{const n=[0,0,0];for(const x of arr)if(x>=0)n[x]++;return Math.max(n[0],n[1],n[2]);};
  if(!fest.sawSame){s+=(big(cuffs)-big(line.map(id=>byId(id).cuff)))*2.5;if(same)s+=3;}
  if(!fest.sawMix&&!same)s+=4;
  if(fest.sawSame&&fest.sawMix){if(fest.same&&!same)s+=1.5;if(!fest.same&&same)s+=1.5;}
  if(t!==fest.last)s+=1;if(t===c.cuff)s-=2;
  if(t===(eats%3))s+=0.15;return s;
}
function dragSug(){
  if(phase!=='shop'||drags>0||dragSkip||eats<6||line.length<3)return null;
  for(const id of line){const c=byId(id);if(!c||c.cuff<0||c.walk||c.st!=='idle')return null;}
  const n=line.length;if(countLinks(line,-1,null)>=n-1)return null;
  for(let p=0;p<n-1;p++){const sw=line.slice();const t=sw[p];sw[p]=sw[p+1];sw[p+1]=t;
    if(countLinks(sw,-1,null)===n-1)return{kind:'drag',id:line[p],to:p+1};}
  return null;
}
function computeInvite(){
  if(phase!=='shop'&&phase!=='fest')return null;
  const c=byId(sel);if(!c||c.leaving||c.walk)return null;
  const d=dragSug();if(d)return d;
  if(!everGiven)return{kind:'bread',type:0};
  let best=0,bs=-1e9;
  for(let t=0;t<3;t++){const s=phase==='fest'?scoreFest(c,t):scoreBread(c,t);if(s>bs){bs=s;best=t;}}
  return{kind:'bread',type:best};
}

// ================= actions =================
function select(id,manual){
  const c=byId(id);if(!c||c.leaving)return;
  if(sel!==id)c.sinceSel=0;sel=id;if(manual)guide.manualT=5;guide.invT=0;
}
function presentFirst(){for(const id of line){const c=byId(id);if(c&&!c.leaving&&!c.walk)return c;}return null;}
function pendingOf(c){let n=c.q.length+(c.st==='eat'?1:0);for(const f of flights)if(f.cid===c.id)n++;return n;}
function give(slot){
  const b=breads[slot];b.p=1;b.v=0;
  S.squash(b.type);S.boing(b.type);
  const P=breadXY(slot);
  for(let i=0;i<4;i++)addP({k:'f',x:P.x+rnd(-30,30),y:P.y-rnd(10,50),vx:rnd(-50,50),vy:rnd(-90,-30),g:120,max:rnd(.6,1),col:BC[b.type],rot:rnd(0,6),vr:rnd(-4,4),sz:rnd(3,5)});
  if(guide.inv&&guide.inv.kind==='drag')dragSkip=true;
  let c=byId(sel);if(!c||c.leaving||c.walk)c=presentFirst();if(!c)return;
  if(pendingOf(c)>=3){ // busy: hand it to a neighbour so continuous taps keep growing clothes
    const p=line.indexOf(c.id);let alt=null,bn=9;
    for(const q of [p+1,p-1,p+2,p-2]){const o=byId(line[q]);if(o&&!o.walk&&!o.leaving){const k=pendingOf(o);if(k<2&&k<bn){bn=k;alt=o;}}}
    c.speed=Math.min(2.8,c.speed+0.4);
    if(!alt)return;c=alt;}
  b.regrow=0;
  flights.push({type:b.type,x0:P.x,y0:P.y-30,cid:c.id,t:0,dur:0.4,rot:0});

// ================= festival =================
function festRegroup(){
  const gs=[];
  for(const id of line){const c=byId(id);if(!c||c.cuff<0)continue;let g=null;
    for(const x of gs)if(x.col===c.cuff)g=x;if(!g){g={col:c.cuff,ids:[]};gs.push(g);}g.ids.push(id);}
  if(fest.last>=0){const i=gs.findIndex(g=>g.col===fest.last);if(i>0){const g=gs.splice(i,1)[0];gs.unshift(g);}}
  fest.groups=gs;fest.turn=0;fest.turnT=0;fest.same=gs.length<=1;
  if(fest.same)fest.sawSame=true;else fest.sawMix=true;
}
function startOpening(){
  phase='opening';phT=0;holdT=0;fest.rows=[];fest.rowK=1;fest.last=lastCol;fest.t=0;fest.beat=0;fest.sawSame=false;fest.sawMix=false;
  festRegroup();flagKey='';S.ratchet(22,0.09);S.fanfare();
}
function startFinale(){phase='finale';phT=0;S.fanfare();S.bell(1046.5,0.12,0.7);}
function startClosing(){
  phase='closing';phT=0;
  garlands.unshift({cols:line.map(id=>byId(id).cuff),tas:line.map(id=>!!byId(id).muff),bases:line.map(id=>byId(id).base)});
  if(garlands.length>3)garlands.pop();
  round++;
  const lp=(round%2===1)?0:line.length-1;const lc=byId(line[lp]);
  lc.leaving=true;lc.walk={x0:lc.x,x1:lp===0?L.cx-DW*0.75:L.cx+DW*0.75,t:0,dur:2.3};
  line.splice(lp,1);
  const present=custs.filter(c=>!c.leaving).map(c=>c.type);
  const types=[0,1,2,3].filter(t=>present.indexOf(t)<0&&t!==lc.type);
  const nt=types.length?types[Math.floor(Math.random()*types.length)]:lc.type;
  const nc=mkCust(nt);custs.push(nc);
  // arrival order changes: on alternate rounds the newcomer squeezes in between the two who stayed
  if(round%2===1){line.splice(1,0,nc.id);nc.x=lp===0?L.cx-DW*0.75:L.cx+DW*0.75;}
  else if(lp===0){line.push(nc.id);nc.x=L.cx+DW*0.75;}else{line.unshift(nc.id);nc.x=L.cx-DW*0.75;}
  for(let p=0;p<line.length;p++){const c=byId(line[p]);c.tx=slotX(p);}
  nc.walk={x0:nc.x,x1:nc.tx,t:0,dur:2.5};
  sel=nc.id;nc.sinceSel=0;drags=0;dragSkip=false;
  for(const v of linkVis){v.key='';v.on=false;v.knit=0;v.kt=0;v.kD=false;v.pulse=1;}
  fest.rows=[];flagKey='';S.bell(784,0.08,0);S.bell(659,0.08,0.2);
}

function yarnBall(x,y,r,col){ // cached sprite per colour/size (drawn once at device resolution)

let flagCv=null,flagCtx=null,flagFW=0,flagFH=0,flagN=3;

function buildFlag(){
  const cs=line.map(byId).filter(Boolean);const n=Math.max(1,cs.length);flagN=n;
  const RH=rowH(),FW=L.bigW,mainH=86,FH=mainH+fest.rows.length*RH+12;flagFW=FW;flagFH=FH;

  if(same){ctx.fillStyle=pat(COL.kin);ctx.fillRect(0,0,FW,mainH);ctx.fillStyle=pat(BC[Math.max(0,cuffs[0])]);
    for(let y=4;y<mainH;y+=16)ctx.fillRect(0,y,FW,8);}
  for(let i=0;i<n;i++){const c=cs[i],x0=i*pw;
    if(!same){ctx.fillStyle=pat(c.cuff>=0?BC[c.cuff]:COL.kin2);ctx.fillRect(x0,0,pw,mainH);}

    ctx.fillStyle=pat(COL.kin);for(let x=7;x<FW;x+=16){if(fest.rows[j]===2){circ(x,y+RH/2,Math.min(1.9,RH*0.25));ctx.fill();}

    const env=0.25+0.75*Math.sin(PI*xm/FW);const off=flagAmp(i)*env*Math.sin(time*flagOm(i)-xm*0.03+i*0.9);
    drawTassel(x0+xm,y0+visH-4+off*u2,c.muff,58*u2,Math.sin(time*2.5+i)*0.16);}
}

function updCust(c,dt){

  c.cuffP=Math.max(0,c.cuffP-dt*2.2);c.wave=Math.max(0,c.wave-dt);c.shy=Math.max(0,c.shy-dt*0.7);

  else if(c.st==='react'){if(c.stt>1.7){c.st='idle';c.stt=0;}}

function updBreads(dt){

function updKeeper(dt){

function updFest(dt){

          const odd=line.find(x=>bg.ids.indexOf(x)<0);if(odd!=null)id=odd;} // the odd one out can bring everyone in step

function update(dt){

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stop();endDrag(false);if(AU.c&&AU.c.state==='running'){try{const p=AU.c.suspend();if(p&&p.catch)p.catch(()=>{});}catch(e){}}}
  else{if(AU.c){try{const p=AU.c.resume();if(p&&p.catch)p.catch(()=>{});}catch(e){}}start();}});
window.addEventListener('pagehide',stop);
window.addEventListener('pageshow',()=>{if(!document.hidden)start();});
window.addEventListener('resize',()=>{endDrag(false);resize();});
window.addEventListener('orientationchange',()=>{endDrag(false);setTimeout(resize,250);});

// automation hook for tests (no UI)
window.__gf={
  st:()=>({phase,open,sel,eats,awn,line:line.slice(),
    custs:custs.map(c=>({id:c.id,type:c.type,base:c.base,over:c.over,third:c.third,cuff:c.cuff,muff:c.muff,st:c.st,x:c.x,q:c.q.length,leaving:c.leaving,sx:c.sx,dx:c.dx,dy:c.dy})),
    links:linkVis.map(v=>({on:v.on,col:v.col,strong:v.strong,grow:v.grow,climb:v.climb,knit:v.knit,a:v.a,b:v.b})),
    breads:breads.map(b=>({type:b.type,p:b.p,regrow:b.regrow,hop:b.hop})),flights:flights.length,
    fest:{same:fest.same,sawSame:fest.sawSame,sawMix:fest.sawMix,rows:fest.rows.slice(),groups:fest.groups.map(g=>({col:g.col,ids:g.ids.slice()})),turn:fest.turn,last:fest.last},
    garlands:garlands.length,parts:parts.length,ft:perf.ft,ftMax:perf.max,inv:guide.inv,demo:guide.demo?guide.demo.kind:null,voices:AU.voices,au:AU.c?AU.c.state:'none',running}),
  scr:(x,y)=>{const s=camS();return{x:(L.cx+(x-L.cx)*s)*K,y:(L.ground+(y-L.ground)*s)*K};},
  bread:t=>{const i=breads.findIndex(b=>b.type===t);const P=breadXY(i);return window.__gf.scr(P.x,P.y-30*breads[i].sc);},
  cust:id=>{const c=byId(id);return window.__gf.scr(c.x+c.dx,L.ground+c.dy-90*TSC[c.type]);},
  slot:p=>window.__gf.scr(slotX(p),L.ground-90),
  L:()=>Object.assign({K,DW,DH},L)
};

// ================= init =================
(function init(){
  const types=[0,1,2,3].sort(()=>Math.random()-0.5).slice(0,3);
  for(const t of types){const c=mkCust(t);custs.push(c);line.push(c.id);}
  resize();
  for(let p=0;p<line.length;p++){const c=byId(line[p]);c.x=c.tx=slotX(p);}
  sel=line[1];
  start();
})();
})();
</script>
</body>
