(()=>{
'use strict';
/* ===================================================================
   さっ、ぱらり！前髪ちょきんと、おもちゃ棚のひみつ部屋 (game 261104-40)
   fr-261029-4 / photo_collage / no_animal_princess
   前髪を横に払って切る → 見えた側の棚を女の子が指さす → 写真をめくると
   奥のおもちゃがコトン → 積み木の箱が階段 → 上段のゼンマイで車が走る →
   棚の空きが埋まると壁が開いて隠し部屋 → パレード → 完成写真 → 次の回
   文字UIなし。画像・音はすべて手続き生成。外部通信なし。
   =================================================================== */
const cv=document.getElementById('c');
const ctx=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>{t=clamp(t,0,1);return 1-(1-t)*(1-t)*(1-t);};
const easeIn=t=>{t=clamp(t,0,1);return t*t;};
const easeBack=t=>{t=clamp(t,0,1);const s=1.6,u=t-1;return 1+(s+1)*u*u*u+s*u*u;};
const QS=new URLSearchParams(location.search);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry(1);
const rnd=(a,b)=>a+R()*(b-a);
const pick=a=>a[Math.floor(R()*a.length)%a.length];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const FR=Math.random;const frnd=(a,b)=>a+FR()*(b-a);
const TS=clamp(parseFloat(QS.get('ts'))||1,0.25,8);
const GOLD_P=QS.has('gold')?(clamp(parseFloat(QS.get('gold')),0,1)||0):0.12;
let nextSeed=(parseInt(QS.get('seed'),10)>>>0)||((Date.now()%1000000)+11);
const NOW=()=>performance.now()/1000;

/* ---------------- canvas / layout ---------------- */
let W=1,H=1,DPR=1;
const SAFE={l:0,r:0,t:0,b:0};
const L={};
function readSafe(){
  try{const cs=getComputedStyle(document.getElementById('safe'));
    SAFE.t=parseFloat(cs.paddingTop)||0;SAFE.r=parseFloat(cs.paddingRight)||0;
    SAFE.b=parseFloat(cs.paddingBottom)||0;SAFE.l=parseFloat(cs.paddingLeft)||0;}catch(e){}
}
function computeLayout(){
  const land=W>H*1.15;
  const g=land?Math.min(H*0.093,W*0.075):Math.min(W*0.165,H*0.085);
  L.g=g;L.cx=W/2;L.land=land;
  L.side=Math.max(8,SAFE.l,SAFE.r);
  L.bd=Math.max(2,g*0.055);                 // white cut-out border
  L.feetY=H-SAFE.b-Math.max(H*0.035,g*0.32);
  L.headCY=L.feetY-3.9*g;
  L.lB=L.headCY-1.25*g;
  L.rowH=1.35*g;
  L.lT=L.lB-L.rowH;
  L.hB=L.lT-0.5*g;
  L.hT=L.hB-L.rowH;
  L.ft=Math.max(5,g*0.13);
  const bkW=Math.min(W-2*L.side,10.5*g);
  L.bkX0=L.cx-bkW/2;L.bkX1=L.cx+bkW/2;
  L.gapW=Math.max(0.85*g,bkW*0.1);
  const i0=L.bkX0+L.ft,i1=L.bkX1-L.ft;
  const lw=(i1-i0-L.gapW)/4,hw=(i1-i0)/4;
  L.cubs=[];
  for(let i=0;i<4;i++){const x0=i<2?i0+i*lw:L.cx+L.gapW/2+(i-2)*lw;L.cubs.push({x0,x1:x0+lw,cx:x0+lw/2,w:lw,yT:L.lT,yB:L.lB,row:0});}
  for(let i=0;i<4;i++){const x0=i0+i*hw;L.cubs.push({x0,x1:x0+hw,cx:x0+hw/2,w:hw,yT:L.hT,yB:L.hB,row:1});}
  L.secL=[i0,L.cx-L.gapW/2];L.secR=[L.cx+L.gapW/2,i1];L.in0=i0;L.in1=i1;
  L.itemH=L.rowH*0.74;
  L.itemW=Math.min(lw*0.84,1.55*g);
  L.hitemW=Math.min(hw*0.8,1.55*g);
  L.bw=Math.max(0.5*g,Math.min(0.82*g,(L.cx-1.3*g-L.side)/2.1));
  L.bh=0.8*g;
  L.zx={};
  for(const s of [-1,1]){const inner=L.cx+s*(1.3*g+L.bw*0.5);L.zx[s]=[inner,inner+s*L.bw*1.04];}
  L.ballR=0.3*g;
  {const oL=L.zx[-1][1]-L.bw*0.52,oR=L.zx[1][1]+L.bw*0.52;
   let wl=Math.max(L.side+2,Math.min(L.bkX0-0.3*g,oL-1.5*g));if(oL-wl<2.6*L.ballR)wl=oL;L.wallL=wl;
   let wr=Math.min(W-L.side-2,Math.max(L.bkX1+0.3*g,oR+1.5*g));if(wr-oR<2.6*L.ballR)wr=oR;L.wallR=wr;}
  L.ballR=0.3*g;
  L.carW=Math.min(L.itemW*1.02,1.5*g);L.carH=L.carW*0.56;
  L.gal={x0:L.side+4,x1:W-L.side-4,y0:SAFE.t+0.15*g,y1:L.hT-L.ft-0.25*g};
  L.trk={cx:L.cx,cy:L.lB-1.4*g,rx:Math.min(W*0.4,5.4*g),ry:0.74*g};
  L.grav=17*g;
}

/* ---------------- audio (Web Audio synth) ---------------- */
const AU={c:null,m:null,send:null,nb:null,motor:null};
function audioStart(){
  try{
    if(AU.c){if(AU.c.state!=='running'&&!document.hidden)AU.c.resume().catch(()=>{});return;}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    const c=new AC();AU.c=c;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-15;comp.ratio.value=4;comp.connect(c.destination);
    const m=c.createGain();m.gain.value=0.7;m.connect(comp);AU.m=m;
    const dl=c.createDelay(1);dl.delayTime.value=0.17;const fb=c.createGain();fb.gain.value=0.3;
    const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2800;
    const sg=c.createGain();sg.gain.value=0.45;
    sg.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(m);AU.send=sg;
    const len=Math.floor(c.sampleRate*1.0),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.nb=b;
    const sb=c.createBuffer(1,1,22050),ss=c.createBufferSource();ss.buffer=sb;ss.connect(c.destination);ss.start(0);
    if(c.state!=='running')c.resume().catch(()=>{});
  }catch(e){AU.c=null;}
}
function tone(f,dur,o){
  if(!AU.c||AU.c.state!=='running')return;o=o||{};
  try{
    const c=AU.c,t=c.currentTime+(o.at||0);
    const os=c.createOscillator(),g=c.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(Math.max(20,f),t);
    if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.glide||dur));
    const pk=(o.g==null?0.2:o.g),at=o.att||0.004;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk),t+at);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    os.connect(g);g.connect(AU.m);if(o.send)g.connect(AU.send);
    if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib;lg.gain.value=f*0.05;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+0.05);}
    os.start(t);os.stop(t+dur+0.05);
  }catch(e){}
}
function noise(dur,o){
  if(!AU.c||!AU.nb||AU.c.state!=='running')return;o=o||{};
  try{
    const c=AU.c,t=c.currentTime+(o.at||0);
    const s=c.createBufferSource();s.buffer=AU.nb;s.loop=true;
    const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);
    if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    f.Q.value=o.q||1;
    const g=c.createGain(),pk=(o.g==null?0.15:o.g),at=o.att||0.003;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,pk),t+at);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(AU.m);if(o.send)g.connect(AU.send);
    s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
  }catch(e){}
}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
const PENT=[0,2,4,7,9];
const pent=(i,base)=>{const o=Math.floor(i/5),k=((i%5)+5)%5;return NOTE((base||72)+o*12+PENT[k]);};
const BOXF=[NOTE(60),NOTE(64),NOTE(67)];
const SFX={
  snip(p,k){k=clamp(k||1,0.3,1.4);const f=2300+p*1600;
    noise(0.03,{type:'highpass',f:4200,g:0.15*k});tone(f,0.045,{type:'square',g:0.03*k,to:f*0.82});
    noise(0.028,{type:'bandpass',f:f*1.25,q:7,g:0.07*k,at:0.04});},
  rustle(k){noise(0.22,{type:'bandpass',f:3400,to:1900,q:0.8,g:0.03*(k||1)});},
  tick(){tone(560,0.05,{type:'triangle',g:0.045});noise(0.025,{f:1900,q:2,g:0.025});},
  nope(){tone(330,0.08,{type:'triangle',g:0.05,to:300});tone(300,0.1,{type:'triangle',g:0.04,at:0.09,to:262});},
  swish(d){noise(0.2,{type:'bandpass',f:d>0?800:1500,to:d>0?2600:650,q:1.1,g:0.085});},
  kotton(p){p=p||1;tone(250*p,0.09,{type:'triangle',g:0.15});noise(0.05,{type:'lowpass',f:900,g:0.11});tone(375*p,0.07,{g:0.06,at:0.05});},
  success(){[0,4,7,12].forEach((n,i)=>tone(NOTE(79+n),0.5,{type:'triangle',g:0.085,at:i*0.07,send:true}));
    tone(NOTE(96),0.55,{g:0.03,at:0.3,send:true});noise(0.3,{type:'highpass',f:6500,g:0.022,at:0.22});},
  eye(){[0,7,12,16].forEach((n,i)=>tone(NOTE(76+n),0.45,{g:0.08,at:i*0.06,send:true}));noise(0.35,{type:'highpass',f:7000,g:0.03,at:0.12});},
  box(ci,lv){const f=BOXF[ci%3]*(1+(lv||0)*0.26);noise(0.06,{type:'lowpass',f:700,g:0.16});tone(f,0.18,{type:'triangle',g:0.13});tone(f*2,0.08,{g:0.04});},
  boxTap(ci,lv){const f=BOXF[ci%3]*2*(1+(lv||0)*0.26);tone(f,0.12,{type:'triangle',g:0.08});noise(0.03,{f:1500,q:3,g:0.04});},
  boing(v){v=clamp(v,0.1,1);tone(210+v*170,0.22,{to:105+v*60,g:0.14*v});tone(420+v*200,0.07,{type:'triangle',g:0.035*v});},
  drum(k){k=k||1;tone(118,0.38,{to:60,g:0.3*k});noise(0.12,{type:'lowpass',f:520,g:0.15*k});tone(236,0.06,{type:'triangle',g:0.05*k});},
  xylo(i,at){const f=pent(i,72);tone(f,0.55,{g:0.11,send:true,at:at||0});tone(f*4.01,0.1,{g:0.025,at:at||0});},
  gliss(d,n){n=n||6;for(let i=0;i<n;i++)SFX.xylo(d>0?i:n-1-i,i*0.055);},
  ratchet(n){for(let i=0;i<n;i++){noise(0.014,{type:'highpass',f:3200,g:0.08,at:i*0.05});tone(1600+i*60,0.02,{type:'square',g:0.012,at:i*0.05});}},
  clap(){noise(0.05,{type:'bandpass',f:1500,q:0.8,g:0.11});noise(0.05,{type:'bandpass',f:1300,q:0.8,g:0.1,at:0.17});},
  giggle(){for(let i=0;i<3;i++)tone(600+i*45,0.09,{to:690+i*45,g:0.03,at:i*0.1,vib:14});},
  oops(){tone(480,0.16,{to:700,g:0.045,type:'triangle'});},
  plank(i){tone(330+(i%4)*40,0.06,{type:'triangle',g:0.06});noise(0.03,{f:1200,q:3,g:0.035});},
  creak(){tone(150,0.28,{type:'sawtooth',g:0.018,to:200});},
  rumble(){noise(1.6,{type:'lowpass',f:180,to:520,g:0.24,att:0.35});},
  open(){SFX.rumble();[0,4,7,11,14].forEach((n,i)=>tone(NOTE(60+n),2.2,{type:'triangle',g:0.05,at:0.6+i*0.12,att:0.2,send:true}));
    noise(1.2,{type:'highpass',f:5000,to:9000,g:0.03,at:1.0});},
  shutter(){noise(0.04,{type:'highpass',f:3000,g:0.2});tone(1200,0.03,{type:'square',g:0.04,at:0.05});noise(0.08,{type:'bandpass',f:2400,q:2,g:0.1,at:0.07});tone(NOTE(96),0.6,{g:0.04,at:0.15,send:true});},
  regrow(){tone(380,0.6,{to:1300,g:0.05,type:'triangle'});noise(0.6,{type:'bandpass',f:1800,to:5200,g:0.03});},
  honk(hi){tone(hi?440:349,0.14,{type:'square',g:0.035});tone(hi?554:440,0.16,{type:'square',g:0.03,at:0.16});},
  whoosh(){noise(0.45,{type:'bandpass',f:500,to:3000,q:0.7,g:0.07});},
  pop(){tone(700,0.08,{to:1300,g:0.06});noise(0.04,{type:'highpass',f:3000,g:0.04});},
  bonk(){tone(300,0.12,{to:180,g:0.12,type:'triangle'});noise(0.05,{type:'lowpass',f:800,g:0.1});}
};
function motorOn(){
  if(!AU.c||AU.motor||AU.c.state!=='running')return;
  try{const c=AU.c,t=c.currentTime;const o=c.createOscillator();o.type='sawtooth';o.frequency.value=70;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=520;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);
    g.gain.setTargetAtTime(0.028,t,0.05);const l=c.createOscillator(),lg=c.createGain();l.frequency.value=13;lg.gain.value=9;l.connect(lg);lg.connect(o.frequency);
    o.connect(f);f.connect(g);g.connect(AU.m);o.start(t);l.start(t);AU.motor={o,g,l};}catch(e){AU.motor=null;}
}
function motorSet(v){if(!AU.motor||!AU.c)return;try{AU.motor.o.frequency.setTargetAtTime(55+v*70,AU.c.currentTime,0.08);AU.motor.g.gain.setTargetAtTime(v>0.05?0.028:0.0001,AU.c.currentTime,0.08);}catch(e){}}
function motorOff(){if(!AU.motor||!AU.c)return;try{const t=AU.c.currentTime;AU.motor.g.gain.setTargetAtTime(0.0001,t,0.05);AU.motor.o.stop(t+0.4);AU.motor.l.stop(t+0.4);}catch(e){}AU.motor=null;}

/* ---------------- textures & photo-cutout sprites ---------------- */
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c;}
let GRAIN=null;
function makeGrain(){
  const s=128,c=mk(s,s),x=c.getContext('2d'),im=x.createImageData(s,s),d=im.data;const tr=mulberry(777);
  for(let i=0;i<s*s;i++){const v=tr();const k=v<0.5?0:255;d[i*4]=k;d[i*4+1]=k;d[i*4+2]=k;d[i*4+3]=Math.floor(Math.abs(v-0.5)*2*38);}
  x.putImageData(im,0,0);GRAIN=c;
}
function grainOver(x,w,h,a){if(!GRAIN)return;x.save();x.globalCompositeOperation='source-atop';x.globalAlpha=a;const p=x.createPattern(GRAIN,'repeat');x.fillStyle=p;x.fillRect(0,0,w,h);x.restore();}
function rr(x,a,b,w,h,r){r=Math.min(r,w/2,h/2);x.beginPath();x.moveTo(a+r,b);x.lineTo(a+w-r,b);x.quadraticCurveTo(a+w,b,a+w,b+r);x.lineTo(a+w,b+h-r);x.quadraticCurveTo(a+w,b+h,a+w-r,b+h);x.lineTo(a+r,b+h);x.quadraticCurveTo(a,b+h,a,b+h-r);x.lineTo(a,b+r);x.quadraticCurveTo(a,b,a+r,b);x.closePath();}
function lg(x,x0,y0,x1,y1,stops){const g=x.createLinearGradient(x0,y0,x1,y1);for(const s of stops)g.addColorStop(s[0],s[1]);return g;}
function rg(x,cx,cy,r0,r,stops){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r);for(const s of stops)g.addColorStop(s[0],s[1]);return g;}
/* white cut-out border + soft offset shadow, works for any silhouette */
function cutout(src,bd,shadow){
  const pad=Math.ceil(bd*2.6+3);const cw=src.width+pad*2,ch=src.height+pad*2;
  const wht=mk(cw,ch),t=wht.getContext('2d');
  const N=14;for(let i=0;i<N;i++){const a=i/N*TAU;t.drawImage(src,pad+Math.cos(a)*bd,pad+Math.sin(a)*bd);}
  t.drawImage(src,pad,pad);t.globalCompositeOperation='source-in';t.fillStyle='#fffcf3';t.fillRect(0,0,cw,ch);
  const out=mk(cw,ch),o=out.getContext('2d');
  if(shadow!==false){const sh=mk(cw,ch),s=sh.getContext('2d');s.drawImage(wht,0,0);s.globalCompositeOperation='source-in';s.fillStyle='rgba(70,45,20,0.28)';s.fillRect(0,0,cw,ch);
    o.drawImage(sh,bd*0.9,bd*1.5);o.globalAlpha=0.5;o.drawImage(sh,bd*1.6,bd*2.4);o.globalAlpha=1;}
  o.drawImage(wht,0,0);o.drawImage(src,pad,pad);
  return {c:out,pad};
}
const SPR={};
function sprite(name,w,h,paint,opt){
  opt=opt||{};const s=DPR;const src=mk(w*s,h*s),x=src.getContext('2d');x.scale(s,s);
  paint(x,w,h);if(opt.grain!==false)grainOver(x,w,h,opt.grain||0.35);
  const co=cutout(src,(opt.bd==null?L.bd:opt.bd)*s,opt.shadow);
  SPR[name]={c:co.c,w,h,p:co.pad/s};
}
function dspr(name,x,y,rot,sx,sy,alpha){
  const S=SPR[name];if(!S)return;
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(sx!=null)ctx.scale(sx,sy==null?sx:sy);
  if(alpha!=null)ctx.globalAlpha*=alpha;
  ctx.drawImage(S.c,-S.w/2-S.p,-S.h/2-S.p,S.w+2*S.p,S.h+2*S.p);ctx.restore();
}
/* draw sprite bent like paper toward dir (bend 0..1) */
function dsprBend(name,x,y,rot,bend,dir,sc){
  const S=SPR[name];if(!S)return;sc=sc||1;
  if(Math.abs(bend)<0.02){dspr(name,x,y,rot,sc);return;}
  const n=9,cw=S.c.width,ch=S.c.height,tw=(S.w+2*S.p)*sc,th=(S.h+2*S.p)*sc;
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  for(let i=0;i<n;i++){
    const u0=i/n,u1=(i+1)/n,um=(u0+u1)/2;const k=dir>0?um:1-um;

const HAIR_N=22,HAIR_MIN=0.2;
function makeStrands(){
  const a=[];
  for(let i=0;i<HAIR_N;i++){
    const u=i/(HAIR_N-1),rx=lerp(-0.9,0.9,u),ry=-4.62+0.55*rx*rx;
    let tip=-3.70+Math.sin(i*1.7)*0.035;const ax=Math.abs(rx);if(ax>0.72)tip-=(ax-0.72)*1.3;
    const len0=tip-ry;
    a.push({rx,ry,len0,len:len0,cut:false,bounce:0,ph:(i*2.399)%TAU,jag:(i*0.618)%1,grow:0});
  }
  return a;
}

function newRound(seed){
  R=mulberry(seed);

    eye:[false,false],eyeT:[0,0],hair:makeStrands(),

    flyBoxes:[],ball:null,car:null,carObj:null,keyIn:false,gold:false,flights:[],

    hint:null,hintHop:0,lastAct:NOW(),fixT:0,openReady:0,settleT:0,boxDirs:[],carRuns:0,ballRolls:0,
    tasksDone:{}};
  G.gold=R()<GOLD_P;

function allObjs(){const a=[];for(const c of G.cub){if(c.main)a.push(c.main);if(c.lean)a.push(c.lean);}return a;}

/* ---------------- girl geometry helpers ---------------- */

/* ---------------- shelf actions ---------------- */

  const i=o.cub,row=i<4?[0,1,2,3]:[4,5,6,7],pos=row.indexOf(i);let best=0,bd=9;
  for(let k=0;k<4;k++){if(k!==pos&&!G.cub[row[k]].main){const d=Math.abs(k-pos);if(d<bd){bd=d;best=Math.sign(k-pos);}}}
  return best||(L.cubs[i].cx<L.cx?-1:1);

function act(o,dir,tap){

  if(FROZEN!=null){render();return;}
  const n=Math.max(1,Math.ceil(dt/(1/60)));for(let i=0;i<n;i++)update(dt/n);
  render();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;last=0;motorOff();if(AU.c)AU.c.suspend().catch(()=>{});}
  else{last=0;if(!raf)raf=requestAnimationFrame(frame);if(AU.c&&AU.c.state!=='running')AU.c.resume().catch(()=>{});if(G&&G.car&&AU.c)setTimeout(()=>{if(G.car)motorOn();},100);}
});
window.addEventListener('resize',resize);
if(window.visualViewport)window.visualViewport.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,120));
resize();computeLayout();buildSprites();
newRound(nextSeed);rebuild();
raf=requestAnimationFrame(frame);
/* ---- test hooks (no visible UI) ---- */
window.__gf={
  G:()=>G,L:()=>L,store:()=>STORE,
  state:()=>({phase:G.phase,eye:G.eye.slice(),found:G.found.slice(),pile:G.pileSheets,zones:{L:zoneH(-1),R:zoneH(1)},stairs:stairsSide(),
    girl:{x:G.girl.x,lvl:G.girl.lvl,task:G.girl.task&&G.girl.task.type},keyIn:G.keyIn,gold:G.gold,bridge:G.bridge.placed,rail:G.rail.placed,
    ball:G.ball?G.ball.mode:null,car:G.car?G.car.mode:null,empties:emptyCount(),lean:anyLean(),photos:G.photos.length,
    hair:G.hair.map(s=>+s.len.toFixed(3)),cub:G.cub.map(c=>(c.main?c.main.kind+(c.main.hidden?'*':''):'-')+(c.lean?'+'+c.lean.kind:'')),
    hint:G.hint?(G.hint.k+(G.hint.o?':'+G.hint.o.kind:'')+(G.hint.m?':'+G.hint.m.stage:'')):null,room:G.room?{run:G.room.leadRun,stuck:G.room.stuck,joined:G.room.members.filter(m=>m.joined).map(m=>m.stage)}:null,
    parts:G.parts.length,seed:G.seed,layout:G.layoutInfo,ballLog:(G.ballLog||[]).slice(-20),carLog:(G.carLog||[]).slice(-30),demo:{t:DEMO.t,done:DEMO.done}}),
  objPos:(i,lean)=>{const c=G.cub[i];const o=lean?c.lean:c.main;return o?objPos(o):null;},
  head:(ux,uy)=>headToScreen(ux,uy),
  memPos:st=>{const R0=G.room;if(!R0)return null;const m=st==='lead'?R0.lead:R0.members.find(q=>q.stage===st);return m?memberPos(m):null;},
  gal:i=>galSlot(i),zone:(s,k)=>({x:L.zx[s][k],y:L.feetY-(G.zones[s].cols[k].length-0.5)*L.bh}),
  ballXY:()=>G.ball?{x:G.ball.x,y:G.ball.y}:null,carXY:()=>G.car?{x:G.car.x,y:G.car.y}:null,
  hit:(x,y)=>{const t=hitTest(x,y);return t.t+(t.o?':'+t.o.kind:'')+(t.m?':'+t.m.stage:'');},
  freeze:t=>{FROZEN=t;if(t!=null)G.t=t;},
  audio:()=>AU.c?AU.c.state:'none',
  testPhoto:()=>{G.photos.unshift(makeRecipe());savePhotos();return G.photos.length;},
  timeFrames:n=>{const t0=performance.now();for(let i=0;i<n;i++){update(1/60);render();}return (performance.now()-t0)/n;},
  frame:()=>{update(1/60);render();}
};
})();
</script>
